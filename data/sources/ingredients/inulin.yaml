locales:
  de:
    summary: >-
      Inulin ist ein präbiotischer Ballaststoff mit solider Plausibilität für Darmgesundheit. Praktisch relevant, aber kein glamouröser gesundes Altern-Shortcut.
    evidenceSummary: >-
      Inulin ist als präbiotischer Ballaststoff gut untersucht und kann Darmmikrobiom, Stuhlgang und Sättigung beeinflussen. Die Effekte sind real, aber eher ernährungsnah und moderat als spektakulär.
    body: |
      ## Was ist Inulin?
      
      Inulin ist ein **präbiotischer Ballaststoff**, der vor allem Darmbakterien als Futter dient.
      
      ## Was ist vergleichsweise gut untersucht?
      
      - präbiotische Wirkung
      - Einfluss auf Stuhlgang und Darmfunktion
      - potenziell etwas mehr Sättigung
      
      ## Fazit
      
      Inulin ist eher ein **solider Ernährungsstoff** als ein aufregender Biohacker-Wirkstoff.

