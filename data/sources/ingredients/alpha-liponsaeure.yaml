locales:
  de:
    summary: >-
      Mitochondriales Antioxidans mit wasser- und fettlöslichen Eigenschaften. R-Form vs. Racemat wird diskutiert. Evidenz vor allem aus medizinischen Kontexten (Neuropathie).
    evidenceSummary: >-
      Vergleichsweise gut untersuchte Anwendung bei diabetischer Neuropathie (mehrere RCTs). Antioxidative und insulinsensibilisierende Effekte in RCTs nachweisbar. gesundes Altern-Effekte beim gesunden Menschen nicht direkt untersucht.
    body: |
      ## Was ist Alpha-Liponsäure?
      
      Alpha-Liponsäure (ALA) ist eine schwefelhaltige Fettsäure, die der Körper in kleinen Mengen selbst herstellt und die als **Cofaktor mitochondrialer Enzyme** dient. Einzigartig ist ihre **Doppellöslichkeit**: ALA ist sowohl wasser- als auch fettlöslich – das erlaubt ihr, sowohl im Zellinneren als auch in Zellmembranen als Antioxidans zu wirken.
      
      Im Gegensatz zu Vitaminen wie C oder E wird diskutiert ALA nicht nur direkt antioxidativ, sondern recycelt auch andere Antioxidantien (Glutathion, Vitamin C, Vitamin E, CoQ10) – weshalb es manchmal als **"universelles Antioxidans"** bezeichnet wird.
      
      ## R-Form vs. S-Form: Ein wichtiger Unterschied
      
      Handelsübliche ALA-Produkte enthalten oft ein **Racemat** – ein 50:50-Gemisch aus R-ALA und S-ALA. Nur die **R-Form** kommt natürlich im Körper vor und zeigt in Studien deutlich höhere Bioverfügbarkeit und Wirksamkeit. R-ALA ist teurer, aber die biologisch relevante Form.
      
      **Fazit für den Kauf:** Produkte, die nur „Alpha-Liponsäure" ohne Angabe der Form deklarieren, enthalten meistens billiges Racemat.
      
      ## Was sagen die Studien wirklich?
      
      ### Klar belegt
      - **Diabetische Neuropathie**: Mehrere RCTs zeigen Verbesserung von Schmerz und Empfindungsstörungen (i.v. und oral)
      - **Insulinsensitivität**: Meta-Analysen zeigen Senkung von Nüchternblutzucker und Insulin
      - **Entzündungsmarker**: CRP-Senkung in RCTs bei metabolischen Erkrankungen
      
      ### Vielversprechend, aber früh
      - Neuroprotektive Effekte (Alzheimer-Tiermodelle, sehr früh human)
      - Gewichtsreduktion (geringe Effekte in einigen RCTs)
      - Mitochondriale Biogenese
      
      ### Nicht belegt beim Menschen
      - Direkte Alterungsforschung-Wirkung
      - Endpunkte zu gesundem Altern
      
      ## Ist ALA sicher?
      
      Bei 300–600 mg/Tag gilt es als **wahrscheinlich sicher**. Nebenwirkungen bei hohen Dosen: Übelkeit, Ausschlag, Hypoglykämie (Vorsicht bei Menschen mit Diabetesn unter Medikation). Bei Thiamin-Mangel kann ALA kontraproduktiv sein. Nicht gleichzeitig mit Mahlzeiten einnehmen (reduziert Resorption).
      
      ## Für wen ist ALA besonders relevant?
      
      Vor allem bei metabolischen Konstellationen wie Insulinresistenz oder erhöhtem Diabetesrisiko ist die Datenlage am dichtesten. Für gesunde Personen im Kontext gesunden Alterns ist sie schwächer – hier werden oft eher CoQ10 oder GlyNAC (NAC+Glycin) diskutiert.

