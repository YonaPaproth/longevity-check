    body: |
      ## Was ist Rhodiola Rosea?
      
      Rhodiola Rosea (Rosenwurz) ist eine Heilpflanze aus den Hochgebirgen Skandinaviens, Sibiriens und Zentralasiens, wo sie seit Jahrhunderten als **Adaptogen** eingesetzt wird – zur Steigerung von Stressresistenz, Ausdauer und mentaler Leistung unter widrigen Bedingungen.
      
      Die aktiven Inhaltsstoffe sind **Rosavine** (spezifisch für Rhodiola rosea) und **Salidrosid** (Tyrosol-Glykosid). Qualitätsprodukte werden auf beide standardisiert, typischerweise auf mindestens 3 % Rosavine und 1 % Salidrosid.
      
      ## Der HMPC-Vorteil
      
      Rhodiola hat in der EU einen besonderen Status: Das **HMPC** (Committee on Herbal Medicinal Products der EMA) hat eine Monographie verabschiedet, die Rhodiola als **traditionelles pflanzliches Arzneimittel** für Erschöpfungs- und Stresssymptome anerkennt. Das ist regulatorisch wertvoller als ein bloßes Nahrungsergänzungsmittel und zeigt, dass die EU-Behörden die Evidenzlage als ausreichend für einen medizinischen Anspruch betrachten.
      
      ## Was sagen die Studien wirklich?
      
      ### Vergleichsweise gut untersucht
      - **Mentale Erschöpfung**: Mehrere RCTs (Studenten, Ärzte, Büroarbeiter) zeigen konsistente Reduktion von Erschöpfungssymptomen
      - **Kognitive Leistung unter Stress**: Reaktionszeit, Konzentration und Arbeitsgedächtnis verbessern sich
      - **Burnout-Symptome**: Klinisch relevante Verbesserungen in offenen Studien

      ### Weniger klar belegt
      - Körperliche Ausdauerleistung (gemischte Ergebnisse in Sportstudien)
      - Angst und depressive Symptome (kleinere Studien, vielversprechend aber nicht robust)

      ### Nicht belegt
      - Longevity-Endpunkte beim Menschen
      - Überlegenheit gegenüber anderen Adaptogens (keine direkten Vergleichsstudien)
      
      ## Rhodiola vs. Ashwagandha
      
      Beide sind Adaptogens – aber mit unterschiedlichem Profil:
      
      | | Rhodiola | Ashwagandha |
      |---|---|---|
      | Stärke | Akute mentale Erschöpfung | Chronischer Stress, Cortisol |
      | Wirkbeginn | Schneller (Stunden) | Langsamer (Wochen) |
      | Einsatz | Prüfungen, Nachtdienst, akuter Stress | Burnout-Prävention, Schlaf, Testosteron |
      | HMPC-Monographie | Ja | Nein |
      
      ## Ist Rhodiola sicher?
      
      Bei 200–600 mg/Tag gilt es als **wahrscheinlich sicher**. Häufigste Nebenwirkungen: Schwindel, Mundtrockenheit bei höheren Dosen. Nicht empfohlen in der Schwangerschaft. Mögliche Wechselwirkungen mit MAO-Hemmern und Antikoagulantien. **Morgens oder mittags einnehmen** – kann bei Abendeinnahme schlafstörend wirken (stimulierender Effekt).

  en:
    summary: >-
      Rhodiola rosea is an adaptogen with RCT evidence for mental fatigue and stress relief. Data are promising but show some heterogeneity across studies.
    evidenceSummary: >-
      Multiple RCTs show significant reductions in fatigue, burnout symptoms, and cognitive impairment under stress. The standardized extract SHR-5 is best studied. Safety profile is good. Longevity endpoints have not been directly studied in humans.
    body: |
      ## What Is Rhodiola Rosea?

      Rhodiola rosea (golden root, arctic root) is a medicinal plant native to the high-altitude regions of Scandinavia, Siberia, and Central Asia, where it has been used for centuries as an **adaptogen** — a plant that helps the body resist physical and mental stress without producing excessive stimulation.

      The key active constituents are **rosavins** (specific to Rhodiola rosea among related species) and **salidroside** (a tyrosol glycoside). Quality products are standardized to both, typically to at least 3% rosavins and 1% salidroside. The most thoroughly studied extract, **SHR-5**, meets this profile and is the reference standard in most of the clinical literature.

      ## The HMPC Advantage

      Rhodiola holds a distinctive regulatory status in the EU. The **HMPC** (Committee on Herbal Medicinal Products of the EMA) has adopted a monograph recognizing Rhodiola as a **traditional herbal medicinal product (THMP)** for temporary relief of stress symptoms and fatigue. This is meaningfully higher than ordinary dietary supplement status: EU authorities have determined the evidence is sufficient to permit a medicinal claim — something that cannot be said for most adaptogens.

      Note that **EFSA has not granted any health claims** for Rhodiola as a food supplement. The HMPC classification rests on traditional use combined with plausible mechanistic evidence, not the level of proof required for conventional medicines. Still, it signals that the regulatory bar has been crossed for at least a limited therapeutic indication.

      ## What Do the Studies Actually Show?

      ### Well-Supported: Mental Fatigue Under Stress

      This is Rhodiola's strongest and most consistent evidence base. Multiple RCTs across distinct populations show significant reductions in fatigue and improvements in cognitive performance:

      - **Olsson et al. 2009 (PMID: 19016404)**: RCT, n=60 stressed adults, 576 mg/day SHR-5 for 28 days. Significant improvement vs. placebo on the Pines' Burnout Scale, Mental Fatigue Questionnaire, and Conners' Continuous Performance Test. Effect sizes were moderate. Well tolerated, no serious adverse events.

      - **Shevtsov et al. 2003 (PMID: 12725561)**: RCT, n=161 physicians working overnight shifts. A **single dose** of Rhodiola significantly improved cognitive performance, reaction time, and accuracy under sleep-deprivation stress compared to placebo. This is notable — it suggests an acute effect operating within hours, not just cumulative supplementation benefit.

      - **Darbinyan et al. 2007 (PMID: 17990197)**: RCT, n=56 nursing students during exam periods. Rhodiola significantly reduced both physical and mental fatigue. Mood and general wellbeing improved. Sample size is small, but results are directionally consistent with other trials.

      ### Burnout Syndrome

      Kasper & Dienel 2017 (PMID: 28219059) conducted a large open-label study in n=118 patients diagnosed with burnout syndrome. 400 mg/day for 12 weeks produced clinically relevant improvements across all measured burnout dimensions. Without a placebo arm, the effect size cannot be cleanly isolated from natural recovery — but the breadth and magnitude of improvement are notable and align with controlled trial findings.

      ### Mixed or Unclear

      **Physical endurance**: Several sports science studies have tested Rhodiola for VO₂max, time-to-exhaustion, or lactate threshold effects. Results are inconsistent. Any ergogenic effect on athletic performance, if real, appears at best modest and population-dependent.

      **Anxiety and depressive symptoms**: A few smaller trials report benefit, including one comparison against sertraline (with Rhodiola showing fewer side effects if also fewer benefits). The evidence base is thin, methodology varies, and it is not sufficient to recommend Rhodiola for these indications specifically.

      ### Not Demonstrated in Humans

      - Longevity or healthy aging endpoints
      - Neurogenesis or neuroprotection in clinical populations
      - Superiority over other adaptogens (no direct head-to-head comparison trials exist)

      Preclinical data show interesting mechanisms — AMPK activation, ROS reduction, SIRT1 upregulation — but none of these have translated to human aging outcome studies.

      ## Rhodiola vs. Ashwagandha

      Both are adaptogens, but with meaningfully different profiles:

      | | Rhodiola | Ashwagandha |
      |---|---|---|
      | **Primary strength** | Acute mental fatigue | Chronic stress, cortisol regulation |
      | **Onset** | Faster (hours to days) | Slower (several weeks) |
      | **Best use case** | Exams, night shifts, acute stress | Burnout prevention, sleep, testosterone |
      | **HMPC monograph** | Yes | No |

      If choosing one: Rhodiola fits better for short-term high-demand situations; ashwagandha for chronic systemic stress recovery. Some users combine both, though no rigorous combination RCTs exist.

      ## Dosing and Timing

      Standard dosing: **200–600 mg/day** of a standardized extract (3% rosavins / 1% salidroside). Most RCTs used 400–576 mg/day. The single-dose study above used a lower acute dose.

      **Timing matters**: Rhodiola has a mild stimulating effect. Evening dosing can interfere with sleep. Morning or early afternoon is recommended. If you're sensitive to stimulants, start at the lower end of the dose range.

      Cycling (e.g., 6–8 weeks on, brief break) is sometimes suggested, but no clinical data clearly establishes that this is necessary or beneficial.

      ## Is Rhodiola Safe?

      At typical doses, Rhodiola is classified as **likely safe**. The most commonly reported side effects at higher doses are dizziness and dry mouth. Serious adverse events are rare in the trial literature.

      **Contraindications and cautions:**
      - **Pregnancy**: Not recommended — insufficient safety data
      - **MAO inhibitors**: Potential interaction; do not combine
      - **Anticoagulants**: Possible interaction; use with caution and inform your prescriber
      - **Bipolar disorder**: Theoretical concern about stimulating effects; no clinical data available

      ## Bottom Line

      Rhodiola rosea is one of the better-evidenced adaptogens for **acute mental fatigue under stress** — a specific but practically important use case. The RCT evidence is more consistent than for most botanical adaptogens, the HMPC monograph provides regulatory credibility that few herbals achieve, and the safety profile is favorable.

      What it is not: a longevity compound in the sense of rapamycin or NAD precursors. For stress management and fatigue resilience, the evidence justifies use. For longevity endpoints specifically, the case remains speculative and the gap between preclinical mechanism and human outcome data is large.

