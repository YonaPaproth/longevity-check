      en: >-
        Editorial in Annals of Internal Medicine: Based on 3 large studies, evidence is sufficient to advise against multivitamin supplementation in well-nourished individuals.
  - ref: pmid-42031092
    targets: [fertilitat]
    finding:
      de: >-
        Sekundäranalyse der FAZST+IDEAL Kohorten (n=2.370 Paare): Weibliche Multivitamin-Einnahme war mit 22% höherer Lebendgeburtenrate assoziiert (aRR=1.22, 95% CI 1.05–1.41). Männliche Einnahme zeigte keinen Effekt. Folsäure und Fischöl ebenfalls ohne signifikanten Effekt.
      en: >-
        Secondary analysis of FAZST+IDEAL cohorts (n=2,370 couples): Female multivitamin use was associated with 22% higher live birth rate (aRR=1.22, 95% CI 1.05–1.41). Male use showed no effect. Folic acid and fish oil also showed no significant effect.

locales:
  de:
    summary: >-
      Multivitamine sind die meistverkauften Nahrungsergänzungsmittel weltweit. Die Evidenz für gesundheitliche Vorteile bei gut ernährten Personen ist überraschend schwach.
    evidenceSummary: >-
      Große RCTs (PHS II, COSMOS) zeigen keinen klaren Nutzen für Herzerkrankungen oder Gesamtmortalität. Moderate Evidenz für Krebsrisiko-Reduktion (PHS II: -8 %). Multivitamine können Nährstofflücken schließen, ersetzen aber keine vollwertige Ernährung.
    body: |
      ## Wirkweise
      
      Multivitamine enthalten typischerweise 15–30 Vitamine und Mineralstoffe in Dosierungen nahe den empfohlenen Tagesmengen (NRV). Sie sollen Nährstofflücken schließen, die durch unvollständige Ernährung entstehen. Der Nutzen hängt stark vom individuellen Ernährungsstatus ab.
      
      ## Evidenzlage
      
      Die Ergebnisse großer RCTs sind gemischt. PHS II (n=14.641) zeigte eine bescheidene Krebsrisiko-Reduktion von 8 %, aber keinen Effekt auf Herz-Kreislauf. COSMOS (n=21.442) fand unerwartet positive Effekte auf Kognition bei Älteren. Für Gesamtmortalität zeigt die Meta-Analyse keinen Effekt. Das Fazit: Multivitamine schaden nicht, aber der Nutzen bei gut ernährten Personen ist marginal.
      
      **Wer profitiert am meisten:**
      - Veganer/Vegetarier (B12, Eisen, Zink)
      - Ältere Menschen (D3, B12, Calcium)
      - Schwangere (Folsäure, Eisen, Jod)
      - Personen mit eingeschränkter Ernährung
      
      ## Sicherheit
      
      Multivitamine gelten als sehr sicher in empfohlener Dosierung. Risiken bei Überdosierung: Vitamin A (Lebertoxizität), Eisen (bei Hämochromatose), Vitamin E (Blutungsrisiko). Wechselwirkungen mit Medikamenten möglich (Vitamin K + Antikoagulanzien).
      
      ## Dosierung
      
      1 Kapsel/Tablette pro Tag gemäß Herstellerangabe. Nicht mit Einzelpräparaten kombinieren ohne UL-Prüfung.

  en:
    summary: >-
      Multivitamins are the world's best-selling supplements. Evidence for health benefits in well-nourished individuals is surprisingly weak.
    evidenceSummary: >-
      Large RCTs (PHS II, COSMOS) show no clear benefit for heart disease or overall mortality. Moderate evidence for cancer risk reduction (PHS II: -8%). Multivitamins can fill nutrient gaps but don't replace a balanced diet.
    body: |
      ## Mechanism of Action
      
      Multivitamins typically contain 15–30 vitamins and minerals at doses near the recommended daily values (NRV). They are designed to fill nutrient gaps from incomplete diets. Benefits depend heavily on individual nutritional status.
      
      ## Evidence
      
      Results from large RCTs are mixed. PHS II (n=14,641) showed a modest 8% cancer risk reduction but no cardiovascular effect. COSMOS (n=21,442) found unexpectedly positive effects on cognition in older adults. For overall mortality, meta-analyses show no effect. The bottom line: multivitamins don't harm, but benefits in well-nourished individuals are marginal.
      
      **Who benefits most:**
      - Vegans/vegetarians (B12, iron, zinc)
      - Older adults (D3, B12, calcium)
      - Pregnant women (folate, iron, iodine)
      - Those with restricted diets
      
      ## Safety
      
      Multivitamins are considered very safe at recommended doses. Risks from overdose: Vitamin A (liver toxicity), iron (in hemochromatosis), Vitamin E (bleeding risk). Drug interactions possible (Vitamin K + anticoagulants).
      
      ## Dosage
      
      1 capsule/tablet per day as directed. Don't combine with single-nutrient supplements without checking upper limits (UL).

