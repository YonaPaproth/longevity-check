locales:
  de:
    summary: >-
      Beta-Glucane sind je nach Quelle unterschiedlich spannend. Für Cholesterin aus Hafer solide, für Immun-Claims aus Pilzen deutlich weicher.
    evidenceSummary: >-
      Beta-Glucane aus Hafer und Gerste sind gut für LDL-Senkung untersucht. Für immunologische Effekte, etwa aus Pilzen oder Hefe, gibt es biologische Plausibilität und einige Daten, aber deutlich weniger robuste klinische Belege.
    body: |
      ## Was ist Beta-Glucan?
      
      Beta-Glucane sind Ballaststoffe oder Polysaccharide aus unterschiedlichen Quellen – zum Beispiel Hafer, Gerste, Hefe oder Pilzen.
      
      ## Der wichtige Punkt
      
      **Nicht jedes Beta-Glucan ist dasselbe.**
      
      - aus Hafer: stark bei Cholesterin
      - aus Pilzen/Hefe: eher Immun-Story, aber schwächere Human-Daten
      
      ## Fazit
      
      Beta-Glucan ist **ein guter Stoff, wenn man die Quelle sauber unterscheidet**.

