    body: |
      ## Was ist Beta-Glucan?
      
      Beta-Glucane sind Ballaststoffe oder Polysaccharide aus unterschiedlichen Quellen – zum Beispiel Hafer, Gerste, Hefe oder Pilzen.
      
      ## Der wichtige Punkt
      
      **Nicht jedes Beta-Glucan ist dasselbe.**
      
      - aus Hafer: stark bei Cholesterin
      - aus Pilzen/Hefe: eher Immun-Story, aber schwächere Human-Daten
      
      ## Fazit
      
      Beta-Glucan ist **ein guter Stoff, wenn man die Quelle sauber unterscheidet**.

  en:
    summary: >-
      Beta-glucans vary by source: oat forms are solid for cholesterol; fungal forms for immunity have weaker human evidence.
    evidenceSummary: >-
      Oat and barley beta-glucans are well-studied for LDL-lowering. Fungal and yeast-derived beta-glucans have immune plausibility and some data but notably fewer robust clinical trials.
    body: |
      ## What are beta-glucans?

      Beta-glucans are polysaccharides (long-chain carbohydrates) found in many foods and organisms. They differ structurally depending on source: oats and barley contain β-1,3/1,4-linked glucans; fungi, yeast, and certain mushrooms contain β-1,3/1,6-linked glucans. This **structural difference matters fundamentally**—different sources have different biological effects.

      ## Source matters: Three main types

      ### 1. Oat and Barley Beta-Glucans (Soluble Fiber)
      - **Structure:** Predominantly β-1,3- and β-1,4-glycosidic linkages.
      - **Primary effect:** Cholesterol reduction via binding of cholesterol and bile acids in the GI tract, increasing fecal loss.
      - **EFSA status:** Approved health claim—oat/barley beta-glucan at ≥3 g/day is recognized for LDL-cholesterol lowering.

      ### 2. Fungal/Mushroom Beta-Glucans (β-1,3/1,6-linked)
      - **Structure:** Branched β-1,3 backbone with β-1,6 branches.
      - **Proposed mechanisms:** Immune cell (macrophage, NK cell) activation; TLR-2/TLR-6 signaling.
      - **EFSA status:** No approved health claims; immune effects remain unproven in humans.

      ### 3. Yeast Beta-Glucans
      - **Similar to fungal forms; marketed for immunity.**
      - **Clinical evidence:** Minimal; a few small studies in cold/infection rates show inconsistent results.

      ## The evidence by source

      ### Oat beta-glucan: Strong evidence for cholesterol
      - **Meta-analyses and RCTs consistently show LDL reductions of 5–10%** at doses of 3–5 g/day of high-molecular-weight oat beta-glucan.
      - This is **EFSA-approved** and forms the basis of authorized health claims on oat products.
      - Mechanism: Viscous fiber inhibits cholesterol absorption and increases bile acid excretion.
      - Effects are dose-dependent; less evidence below 3 g/day.

      ### Fungal/mushroom beta-glucans: Weak human evidence for immunity
      - **Immune markers:** A handful of small studies (n &lt; 50 each) report improvements in NK cell activity, phagocytosis, or inflammatory markers.
      - **Clinical outcomes:** Rare RCTs examining infection rates, illness duration, or symptom severity. Those that exist show mixed results.
      - **Publication bias:** Positive studies may be overrepresented; industry funding is common.
      - **Bottom line:** Plausible mechanism, but minimal clinical proof in humans.

      ### Yeast beta-glucans: Similar gap
      - A few small studies suggest reductions in upper respiratory infection incidence or severity in athletes or immunocompromised populations.
      - Sample sizes are small (n &lt; 100); blinding and methodological rigor vary.
      - No large-scale replication; clinical significance unclear.

      ## Mechanisms (preclinical and plausible)

      **For oat/barley:** Soluble fiber, viscosity, bile acid sequestration.

      **For fungal/yeast:** TLR-mediated immune activation, macrophage and NK cell stimulation, anti-inflammatory cytokine shifts (IL-10 increase). These are real in cells and animals but uncertain in humans.

      ## Regulatory and health claim status

      - **Oat/barley:** EFSA-approved claim for cholesterol reduction at ≥3 g/day of high-molecular-weight beta-glucan.
      - **Fungal/mushroom/yeast:** No approved EFSA claims for immunity or general health. Marketing claims like "immune boost" or "infection prevention" are not evidence-based per EU standards.

      ## Dosage in studies

      - **Oat beta-glucan:** 3–5 g/day for cholesterol effect; 4–12 weeks for maximal response.
      - **Fungal beta-glucans:** 250–1500 mg/day in immune studies; no consensus dose.

      ## Safety

      All forms are **well-tolerated**:
      - Mild GI effects (bloating, gas) common with high-dose soluble fiber, especially when introduced suddenly.
      - No toxicity reported.
      - Absorption and bioavailability of fungal/yeast forms are poorly characterized.

      ## Bottom line

      **For cholesterol reduction:** Oat or barley beta-glucan at ≥3 g/day is solid, evidence-backed, and EFSA-approved. If you want to lower LDL naturally, oat beta-glucan is a legitimate first step.

      **For immunity:** Fungal and yeast beta-glucans are mechanistically plausible but clinically unproven. Marketing claims far outpace evidence. If you're interested in immune support, prioritize proven interventions: sleep, stress management, exercise, vitamin D (if deficient), and vaccination. Fungal beta-glucans may be an experiment, but not a foundation.

      **Practical advice:** If choosing a beta-glucan product, check the source. Oat-derived offers better evidence for a specific health outcome (cholesterol). Fungal forms are interesting but speculative for immunity.



