locales:
  de:
    summary: >-
      Vitamin B6 ist wichtig für Aminosäurestoffwechsel, Nerven und Blutbildung. Bei Mangel nützlich – chronisch hohe Dosen können aber Nervenschäden auslösen.
    evidenceSummary: >-
      Vitamin B6 ist ein essenzieller Nährstoff mit vergleichsweise gut untersuchter Rolle in Aminosäurestoffwechsel, Nervensystem und Homocystein-Stoffwechsel. Supplementierung ist vor allem bei Mangel oder speziellen Indikationen sinnvoll. Für gesunde Erwachsene ohne Defizit fehlt belastbare Evidenz für großen Zusatznutzen.
    body: |
      ## Was ist Vitamin B6?
      
      Vitamin B6 ist ein Sammelbegriff für mehrere verwandte Verbindungen. Die biologisch aktive Form ist meist **Pyridoxal-5-Phosphat (PLP)**.
      
      B6 ist wichtig für:
      
      - Aminosäurestoffwechsel
      - Neurotransmitterbildung
      - Hämoglobinsynthese
      - Homocystein-Stoffwechsel
      
      ## Was ist vergleichsweise gut untersucht?
      
      - Essenzieller Nährstoff
      - Korrektur von Mangelsituationen
      - Rolle in Nervenfunktion und Blutbildung
      - Teilweise klinische Relevanz bei spezifischen Situationen wie Schwangerschaftsübelkeit
      
      ## Was ist nicht vergleichsweise gut untersucht?
      
      - Mehr Fokus, Stimmung oder Energie bei ausreichend versorgten Erwachsenen
      - gesundes-Alten-Effekte durch Extra-Supplementierung
      
      ## Sicherheitsprofil
      
      B6 ist **nicht harmlos in beliebig hoher Dosis**. Gerade das wird oft unterschätzt.
      
      Möglich bei chronisch zu hoher Einnahme:
      - Kribbeln
      - Taubheitsgefühl
      - sensorische Neuropathie
      
      Das ist einer der Gründe, warum man B6 nicht als Dauer-Supplement im hohen mg-Bereich leichtfertig nehmen sollte.
      
      ## Fazit
      
      Vitamin B6 ist wichtig, aber kein Spielzeug. Bei Mangel oder klarer Indikation sinnvoll – **hochdosiert auf Verdacht eher keine gute Idee**.

  en:
    summary: >-
      Vitamin B6 is essential for amino acid metabolism, nerve function, and blood cell formation. Useful for deficiency—chronic high doses can cause nerve damage.
    evidenceSummary: >-
      Vitamin B6 is an essential nutrient with a relatively well-researched role in amino acid metabolism, nervous system function, and homocysteine metabolism. Supplementation is primarily beneficial in cases of deficiency or specific clinical indications. For healthy adults without deficiency, there is limited evidence for significant additional benefits.
    body: |
      ## What is Vitamin B6?

      Vitamin B6 is a collective term for several related organic compounds. The biologically active form is typically **pyridoxal-5-phosphate (PLP)**, though other forms like pyridoxamine and pyridoxal are also biochemically active.

      B6 is essential for multiple critical biological processes:

      - **Amino acid metabolism**: B6 is a coenzyme in over 100 enzymatic reactions involved in amino acid synthesis, metabolism, and transport
      - **Neurotransmitter synthesis**: Required for production of serotonin, dopamine, GABA, and other central nervous system signaling molecules
      - **Hemoglobin synthesis**: Essential for red blood cell formation and oxygen transport
      - **Homocysteine metabolism**: Helps convert homocysteine to methionine, supporting cardiovascular and nervous system health
      - **Immune function**: B6 is critical for lymphocyte development and antibody production
      - **Vitamin B metabolism**: Involved in the conversion and activation of other B vitamins

      The typical dietary requirement for adults is 1.3–1.7 mg/day. B6 is water-soluble and not stored in significant amounts, so regular intake is necessary.

      ## What is Comparatively Well-Researched?

      The following aspects of vitamin B6 have robust evidence:

      **Deficiency correction**: The clinical manifestations of B6 deficiency are well-documented—dermatitis, glossitis, anemia, neurological symptoms, and immune dysfunction. Supplementation effectively corrects these conditions, which is why B6 is considered a fundamental nutrient in clinical and public health contexts.

      **Biochemical role**: The enzymatic pathways involving B6 are extensively characterized across decades of biochemical research. Its role in amino acid metabolism, neurotransmitter synthesis, and homocysteine metabolism is firmly established.

      **Pregnancy-related nausea**: Several clinical trials suggest that vitamin B6 (typically 25–50 mg/day) may reduce nausea and vomiting in early pregnancy. This is one of the most specific, evidence-supported applications beyond general deficiency correction.

      **Nervous system function**: B6 is critical for myelin formation, neurotransmitter synthesis, and immune regulation in the nervous system. Deficiency causes clear neurological damage.

      **Homocysteine metabolism**: B6, along with folate and B12, helps metabolize homocysteine, which is relevant to cardiovascular risk assessment.

      **Regulatory approval**: The EU's EFSA has approved health claims for B6 related to immune system function, nervous system function, homocysteine metabolism, energy metabolism, and fatigue reduction.

      ## What is Not Comparatively Well-Researched?

      Caution: The following claims lack strong supporting evidence in healthy, adequately-nourished adults:

      **General cognitive enhancement**: Claims that B6 improves focus, memory, or mental clarity in people without deficiency lack robust clinical trial support. While B6 is necessary for cognition, supplementation beyond adequate intake has not shown consistent performance benefits in controlled trials.

      **Energy and fatigue reduction in non-deficient individuals**: B6 participates in energy metabolism, but supplementing healthy adults has not demonstrated significant energy improvements in rigorous trials. EFSA-approved claims exist, but evidence is indirect.

      **Mood and depression**: While B6 is involved in neurotransmitter synthesis and some observational data suggests associations between B6 status and mood, intervention studies in non-deficient populations are limited. B6 supplementation is not a first-line depression treatment.

      **Aging-related decline**: There is insufficient evidence that supplementing B6 significantly slows age-related functional decline in healthy older adults without underlying deficiency.

      **Immunosenescence reversal**: While B6 is important for immune function, evidence that supplementation reverses age-related immune decline is weak.

      ## Safety Profile: Not Harmless at High Doses

      **This is critical**: Vitamin B6 is often perceived as "safe because it's water-soluble." This is a dangerous misconception.

      Chronic supplementation with high doses (>200 mg/day) carries documented risks:

      **Sensory peripheral neuropathy**: The most well-characterized adverse effect. Doses of 500 mg/day to several grams/day, taken chronically for months to years, can cause progressive numbness, tingling, and pain in the hands and feet. This is reproducible and has been documented in hundreds of cases in the medical literature. The 2021 Vrolijk review noted that the mechanism involves direct toxicity to sensory neurons. Peripheral neuropathy is not merely an uncomfortable side effect—it can be debilitating and may not fully resolve after stopping supplementation.

      **Dose and duration dependency**: There is no fixed "safe" upper limit, but evidence suggests that doses >200 mg/day for prolonged periods significantly increase neuropathy risk. Individual susceptibility varies based on factors like nutritional status, age, concurrent medications, and genetic predisposition.

      **Reversibility varies**: Some cases of B6-induced neuropathy resolve within weeks to months after stopping supplementation; others persist for months or years after discontinuation, with some cases showing incomplete recovery.

      **Regulatory guidance**: The NIH Office of Dietary Supplements and international health authorities recommend caution with high-dose supplementation. The established tolerable upper intake level (UL) is typically 100 mg/day to prevent chronic toxicity risk, though acute effects are rare at this level.

      **Why does high-dose supplementation sometimes occur?** Several factors contribute: (1) B6 is inexpensive and minimally regulated; (2) unscrupulous marketing sometimes promotes "mega-doses" for vague health claims; (3) practitioners unfamiliar with the toxicity risk may recommend high doses without clear clinical justification; (4) some supplement stacks bundle high-dose B6 without transparent labeling.

      ## When is Supplementation Reasonable?

      - **Documented deficiency**: If serum pyridoxal-5-phosphate or plasma homocysteine indicates deficiency, B6 supplementation is standard treatment at controlled doses.
      - **Pregnancy-related nausea**: 25–50 mg/day appears efficacious and safe in pregnancy, supported by clinical evidence.
      - **Specific metabolic disorders**: Certain genetic conditions (e.g., homocystinuria, primary hyperoxaluria, homocysteinemia) require B6 supplementation under medical supervision.
      - **Medication interactions**: Some drugs impair B6 metabolism (e.g., certain antituberculosis medications, immunosuppressants); supplementation may be clinically indicated.
      - **Vegans and certain restrictive diets**: Plant-based sources of B6 (legumes, whole grains, seeds, nuts) can provide adequate intake, but supplementation may help ensure sufficiency if dietary intake is low.

      For healthy adults eating a typical diet with adequate protein and plant-based foods, B6 deficiency is uncommon. Routine supplementation is not necessary.

      ## Conclusion

      Vitamin B6 is essential, but it is not a harmless nutrient to supplement at arbitrary doses. The biochemical importance and regulatory approval for specific health claims can create a false sense of safety.

      **The principle**: Use B6 at adequate but not excessive doses. If supplementing, stick to doses <100 mg/day. If taking higher doses, do so only under clinical supervision and with clear, specific indication (documented deficiency, specific medical condition, or pregnancy-related nausea).

      The fact that B6 has proven clinical utility in real deficiency situations does not mean that indiscriminate supplementation is beneficial for everyone. This distinction—between correcting a deficiency and optimizing beyond sufficiency—is one of the most misunderstood aspects of B vitamin supplementation and deserves careful consideration.

