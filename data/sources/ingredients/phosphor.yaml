locales:
  de:
    summary: >-
      Phosphor ist essenziell für Knochen, ATP und Zellmembranen. Mangel ist selten, und Supplemente sind für die meisten Menschen unnötig.
    evidenceSummary: >-
      Phosphor ist ein essenzieller Mineralstoff für Knochen, Zellmembranen und ATP. Bei normaler Ernährung ist die Versorgung meist ausreichend. Für zusätzliche Supplemente gibt es außerhalb spezieller medizinischer Kontexte kaum überzeugende Gründe.
    body: |
      ## Was ist Phosphor?
      
      Phosphor ist Bestandteil von **ATP**, Zellmembranen und Knochen. Ohne Phosphat läuft praktisch kein Energiestoffwechsel.
      
      ## Praxis
      
      Das Problem ist im Alltag fast nie zu wenig Phosphor, sondern eher: Man braucht in der Regel **kein extra Phosphor-Supplement**.
      
      ## Fazit
      
      Wichtig? Ja. Als separates Supplement spannend? Für die meisten eher nein.

