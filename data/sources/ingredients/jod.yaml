locales:
  de:
    summary: >-
      Jod ist essenziell für Schilddrüsenhormone und kognitive Entwicklung. In Deutschland strukturell mangelversorgt trotz Jodsalz-Programm. EFSA-Claims zugelassen.
    evidenceSummary: >-
      Vergleichsweise gute Datenlage für essenzielle Funktion: Schilddrüsenhormonsynthese, kognitive Entwicklung, Energiestoffwechsel. EFSA-Claims zugelassen. Deutschland gilt weiterhin als Jodmangelgebiet. Enge therapeutische Breite: zu viel Jod ebenfalls schädlich.
    body: |
      ## Was ist Jod?
      
      Jod ist ein **essenzielles Spurenelement**, das ausschließlich zur Synthese der **Schilddrüsenhormone** T3 (Trijodthyronin) und T4 (Thyroxin) benötigt wird. Diese Hormone regulieren den Grundumsatz, Wärmeproduktion, Herzfrequenz, Hirnentwicklung und Wachstum.
      
      Etwa 70–80 % des Körper-Jods sind in der Schilddrüse gespeichert. Der Rest ist in Brustgewebe, Eierstöcken und Magenschleimhaut konzentriert.
      
      ## Deutschland: strukturelles Jodmangelgebiet
      
      Obwohl Deutschland ein Jodsalz-Programm betreibt, gilt es weiterhin als **Jodmangelgebiet**:
      
      - Mittlere Jodausscheidung im Urin: ~108 µg/L (Zielwert WHO: >150 µg/L)
      - Ursache: Böden arm an Jod, Meerwasserfische wenig gegessen, vegane/vegetarische Ernährung ohne Meeresfrüchte
      - Besonders betroffen: Schwangere (war mit höheren Werten verbundener Bedarf), Veganer, Menschen die kein jodiertes Salz verwenden
      
      Jodmangel in der Schwangerschaft ist der häufigste **vermeidbare Grund für geistige Entwicklungsstörungen** weltweit – auch milde Unterfunktionen können Kognition und IQ beeinflussen.
      
      ## Jod und gesundes Altern
      
      Die Verbindung zu gesundem Altern ist indirekt, aber diskutierbar:
      - Schilddrüsenhormone regulieren **mitochondriale Biogenese** und Energiestoffwechsel
      - Subklinische Hypothyreose (häufig bei Jodmangel) ist mit war mit höheren Werten verbundenem kardiovaskulärem Risiko assoziiert
      - Kognitive Funktion im Alter hängt von optimaler Schilddrüsenfunktion ab
      
      ## Was sagen die Studien wirklich?
      
      ### Klar belegt (EFSA-Claims)
      - Schilddrüsenfunktion: direkt essenziell
      - Kognitive Entwicklung und -funktion
      - Normaler Energiestoffwechsel
      
      ### Vergleichsweise gut untersucht
      - Jodmangel als Ursache für Struma (Schilddrüsenvergrößerung)
      - Kognitive Verbesserungen bei Jodmangel-Kindern durch Supplementierung
      
      ### Nicht belegt
      - Alterungsforschung-Wirkung über Normalbedarf hinaus
      - Zusatznutzen für Personen mit optimaler Versorgung
      
      ## Das Doppelrisiko: Mangel UND Überdosierung
      
      Jod ist ein klassisches **U-förmiges Dosis-Risiko-Verhältnis**:
      
      | Jodstatus | Effekt |
      |---|---|
      | Mangel | Struma, Hypothyreose, kognitive Störungen |
      | Optimal (150–250 µg/Tag) | Normale Schilddrüsenfunktion |
      | Exzess (>500 µg/Tag dauerhaft) | Kann Hashimoto triggern, Hyperthyreose |
      
      **Hochdosierte Jod-Supplements** (>500 µg/Tag) sind für die meisten Menschen kontraproduktiv und werden häufig in unseriösen „Detox"-Supplements vermarktet.
      
      ## Praktische Empfehlung
      
      - **Jodsalz** konsequent verwenden: einfachste Maßnahme
      - **Meeresfrüchte** 1–2× pro Woche
      - **Milch und Milchprodukte**: gute Jodquellen (jodiertes Futter bei Nutztieren)
      - **Supplementierung**: nur wenn Nahrung nicht ausreicht, dann 100–150 µg/Tag – nicht mehr
      
      Schilddrüsenwerte (TSH) beim Hausarzt checken lassen – ein einfacher Bluttest gibt Aufschluss über die Funktion.
      
      ## Ist Jod sicher?
      
      Bei 150–300 µg/Tag: **wahrscheinlich sicher** für gesunde Erwachsene. Bei Schilddrüsenerkrankungen (Hashimoto, Hyperthyreose, Knotenstruma): nur unter ärztlicher Kontrolle supplementieren. Die therapeutische Breite ist eng – daher **Vorsicht** bei hochdosierten Präparaten.

  en:
    summary: >-
      Iodine is essential for thyroid hormones and cognitive development. Germany faces structural deficiency despite salt iodization. EFSA-approved claims.
    evidenceSummary: >-
      Strong evidence for essential functions: thyroid hormone synthesis, cognitive development, energy metabolism. EFSA claims approved. Germany remains iodine-deficient. Narrow therapeutic window: excess is also harmful.
    body: |
      ## What is iodine?

      Iodine is an **essential trace element** required exclusively for synthesizing **thyroid hormones** T3 (triiodothyronine) and T4 (thyroxine). These hormones regulate basal metabolic rate, heat production, heart rate, brain development, and growth.

      Approximately 70–80% of total body iodine is stored in the thyroid gland, with the remainder concentrated in breast tissue, ovaries, and gastric mucosa.

      ## Germany: a structural iodine-deficiency region

      Despite operating an iodine salt program, Germany remains classified as an **iodine-deficient region**:

      - Median urinary iodine excretion: ~108 µg/L (WHO target: >150 µg/L)
      - Root causes: iodine-poor soils, low consumption of seafish, vegan/vegetarian diets without seafood
      - High-risk groups: pregnant women (elevated requirements), vegans, people avoiding iodized salt

      Iodine deficiency during pregnancy is the most common **preventable cause of intellectual disability** worldwide—even mild hypothyroid states can impair cognition and IQ.

      ## Iodine and healthy aging

      The connection to healthy aging is indirect but biologically plausible:
      - Thyroid hormones regulate **mitochondrial biogenesis** and energy metabolism
      - Subclinical hypothyroidism (common in iodine deficiency) is associated with elevated cardiovascular risk
      - Cognitive function in aging depends on optimal thyroid status

      ## What does the evidence show?

      ### Clearly established (EFSA-approved claims)
      - Thyroid function: directly essential
      - Cognitive development and function
      - Normal energy metabolism

      ### Well-researched
      - Iodine deficiency as a cause of goiter (thyroid enlargement)
      - Cognitive improvements in iodine-deficient children following supplementation

      ### Not established
      - Anti-aging effects beyond normal requirements
      - Additional benefit for adequately nourished individuals

      ## The dual risk: deficiency AND excess

      Iodine demonstrates a classic **U-shaped dose–risk relationship**:

      | Iodine Status | Effect |
      |---|---|
      | Deficiency | Goiter, hypothyroidism, cognitive impairment |
      | Optimal (150–250 µg/day) | Normal thyroid function |
      | Excess (>500 µg/day chronically) | Can trigger Hashimoto's, hyperthyroidism |

      **High-dose iodine supplements** (>500 µg/day) are often counterproductive and frequently marketed in dubious "detox" products.

      ## Practical guidance

      - **Iodized salt**: consistent use is the simplest approach
      - **Seafood**: 1–2 times weekly
      - **Dairy and dairy products**: good iodine sources (from iodized animal feed)
      - **Supplementation**: only if diet is inadequate, then 100–150 µg/day – not more

      Have your thyroid function checked with your physician—a simple blood test (TSH) reveals functional status.

      ## Is iodine safe?

      At 150–300 µg/day: **likely safe** for healthy adults. In those with thyroid disease (Hashimoto's, hyperthyroidism, thyroid nodules): supplement only under medical supervision. The therapeutic window is narrow—**caution** with high-dose formulations.

