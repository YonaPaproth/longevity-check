locales:
  de:
    summary: >-
      Zink ist an vielen Enzymen beteiligt und essenziell für Immunfunktion, DNA-Reparatur und Hormonsynthese. Niedrige Zufuhr oder niedrige Spiegel sind bei älteren Menschen nicht selten und lassen…
    evidenceSummary: >-
      Vergleichsweise gute Datenlage für Immunfunktion, Wundheilung und Hormonregulation. EFSA hat zahlreiche Health Claims zugelassen. Mangel bei Älteren, Veganern und PPI-Nutzern häufig. Überdosierung kann Kupfermangel verursachen.
    body: |
      ## Was ist Zink?
      
      Zink ist ein **essenzielles Spurenelement**, das für mehr als 300 enzymatische Reaktionen benötigt wird. Es ist an DNA-Reparatur, Proteinsynthese, Zellteilung, Immunabwehr und der Aktivität von Antioxidantien-Enzymen (Superoxiddismutase) beteiligt.
      
      Im Kontext gesunden Alterns ist Zink besonders relevant, weil es mit zunehmendem Alter systematisch abnimmt – ein Phänomen, das als **„Immunseneszenz"** (Alterung des Immunsystems) beiträgt.
      
      ## Wer hat Risiko für Mangel?
      
      | Risikogruppe | Ursache |
      |---|---|
      | Ältere Erwachsene (&gt;65 Jahre) | Schlechtere Resorption, weniger Fleischkonsum |
      | Veganer/Vegetarier | Phytate in Hülsenfrüchten hemmen Zinkresorption |
      | PPI-Nutzer | Magensäure nötig für Zinkresorption |
      | Alkohol-Konsumenten | Erhöhte renale Ausscheidung |
      | Sportler (Ausdauer) | Erhöhter Verlust über Schweiß |
      
      ## Was sagen die Studien wirklich?
      
      ### Klar belegt (EFSA-zugelassen)
      - **Immunfunktion**: T-Zell-Proliferation, NK-Zell-Aktivität, Antikörperproduktion
      - **DNA-Synthese und Zellschutz**: Cofaktor für DNA-Polymerasen und Reparaturenzyme
      - **Wundheilung**: Kollagensynthese und Epithelregeneration
      - **Testosteron**: Bei Mangel normalisiert Supplementierung den Spiegel
      
      ### Vergleichsweise gut untersucht
      - Reduktion der Erkältungsdauer (~33 % kürzer bei Zink-Lutschtabletten innerhalb 24h nach Symptombeginn)
      - Untersuchung im Kontext altersabhängiger Augenmarker (AREDS2-Studie: Zink + Antioxidantien)
      
      ### Wichtig: Kein Effekt bei ausreichender Versorgung
      Testosteron-Effekte, Immunboosts und Hormonverbesserungen treten **nur bei echtem Mangel** auf. Für gut versorgte Menschen bringt Mehrkonsum keinen Zusatznutzen und birgt Risiken.
      
      ## Überdosierung: das Kupfer-Problem
      
      Zink verdrängt Kupfer bei der Resorption im Darm. Chronisch hohe Zinkdosen (&gt;40 mg/Tag) können zu **Kupfermangel** führen – mit Folgen für Nervengesundheit, Immunfunktion und Anämie. Dies ist der häufigste Fehler bei Zink-Selbstmedikation.
      
      Empfehlung: Nie mehr als **25–40 mg/Tag** supplementieren und bei Langzeiteinnahme &gt;15 mg: 1–2 mg Kupfer dazugeben.
      
      ## Welche Form?
      
      | Form | Bioverfügbarkeit |
      |---|---|
      | Zinkpicolinat | Sehr gut (gut chelatiert) |
      | Zinkgluconat | Gut (häufig in Lutschtabletten) |
      | Zinkzitrat | Gut, magenfreundlich |
      | Zinkoxid | Schlecht – in vielen günstigen Produkten |
      
      Zinkoxid ist günstig, aber kaum bioverfügbar. Fingerzeig beim Kauf: auf die Verbindungsform achten.
      
      ## Ist Zink sicher?
      
      Bei 8–25 mg/Tag aus Nahrung und Supplement: **wahrscheinlich sicher**. Der tolerable Obergrenzwert (UL) der EFSA liegt bei 25 mg/Tag für Erwachsene.

  en:
    summary: >-
      Zinc is involved in hundreds of enzymes and is essential for immune function, DNA repair, and hormone synthesis. Low intake is not uncommon in older adults and vegans.
    evidenceSummary: >-
      Comparatively solid evidence for immune function, wound healing, and hormone regulation. EFSA has approved numerous health claims. Deficiency common in older adults, vegans, and PPI users. Overdose can cause copper deficiency.
    body: |
      ## What Is Zinc?
      
      Zinc is an **essential trace element** required for more than 300 enzymatic reactions. It is involved in DNA repair, protein synthesis, cell division, immune defence, and the activity of antioxidant enzymes (superoxide dismutase).
      
      In the context of healthy ageing, zinc is particularly relevant because it systematically declines with age — a phenomenon that contributes to **immunosenescence** (ageing of the immune system).
      
      ## Who Is at Risk for Deficiency?
      
      | At-risk group | Cause |
      |---|---|
      | Older adults (&gt;65 years) | Reduced absorption, less meat consumption |
      | Vegans / vegetarians | Phytates in legumes inhibit zinc absorption |
      | PPI users | Gastric acid required for zinc absorption |
      | Regular alcohol consumers | Increased renal excretion |
      | Endurance athletes | Increased loss through sweat |
      
      ## What Do the Studies Actually Show?
      
      ### Clearly established (EFSA-approved)
      - **Immune function**: T-cell proliferation, NK cell activity, antibody production
      - **DNA synthesis and cell protection**: cofactor for DNA polymerases and repair enzymes
      - **Wound healing**: collagen synthesis and epithelial regeneration
      - **Testosterone**: in deficiency, supplementation normalises levels
      
      ### Comparatively well studied
      - Reduction in cold duration (~33% shorter with zinc lozenges within 24 hours of symptom onset)
      - Investigated in the context of age-related macular changes (AREDS2 study: zinc + antioxidants)
      
      ### Important: No effect in adequately nourished individuals
      Testosterone effects, immune boosts, and hormone improvements occur **only in genuine deficiency**. For adequately nourished people, additional intake provides no benefit and carries risks.
      
      ## Overdose: The Copper Problem
      
      Zinc displaces copper during intestinal absorption. Chronically high zinc doses (&gt;40 mg/day) can cause **copper deficiency** — with consequences for nerve health, immune function, and anaemia. This is the most common mistake in self-supplementation with zinc.
      
      Recommendation: Never supplement more than **25–40 mg/day** and with long-term intake above 15 mg: add 1–2 mg copper.
      
      ## Which Form?
      
      | Form | Bioavailability |
      |---|---|
      | Zinc picolinate | Very good (well chelated) |
      | Zinc gluconate | Good (common in lozenges) |
      | Zinc citrate | Good, stomach-friendly |
      | Zinc oxide | Poor — common in cheap products |
      
      Zinc oxide is inexpensive but barely bioavailable. When buying: check the compound form.
      
      ## Is Zinc Safe?
      
      At 8–25 mg/day from food and supplements combined: **likely safe**. EFSA's tolerable upper level (UL) is 25 mg/day for adults.

