locales:
  de:
    summary: >-
      ALCAR ist die gehirngängigere Carnitin-Form und deshalb in Brain- und gesundes Altern-Stacks beliebt. Die Evidenz ist interessant, aber nicht spektakulär.
    evidenceSummary: >-
      Acetyl-L-Carnitin ist biologisch plausibel für Energiestoffwechsel und Nervensystem. Es gibt moderate Hinweise auf Nutzen in bestimmten neurologischen oder altersbezogenen Kontexten, aber keine robuste Basis für breite Alterungsforschung-Claims bei Gesunden.
    body: |
      ## Was ist ALCAR?
      
      ALCAR ist die acetylierte Form von Carnitin und gilt als **gehirnnäher** als normales L-Carnitin.
      
      ## Warum ist es beliebt?
      
      Weil es:
      - metabolisch sinnvoll klingt
      - fürs Gehirn plausibel ist
      - in Aging- und Nootropic-Bubbles gut in die Story passt
      
      ## Fazit
      
      ALCAR ist ein **interessanter Mid-Tier-Kandidat**: besser als reiner Hype, aber weit weg von einem klar belegten Must-have.

