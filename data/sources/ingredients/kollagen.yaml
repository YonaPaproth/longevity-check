locales:
  de:
    summary: >-
      Kollagen ist eines der bekanntesten Supplements. Für Haut und Gelenkmarker gibt es Humanstudien; weitergehende Verjüngungsversprechen sind nicht belegt.
    evidenceSummary: >-
      Mehrere kleine bis mittelgroße RCTs zeigen Verbesserungen bei Hautelastizität und Gelenkschmerzen. Die Effekte sind real, aber moderat. Ob aufgenommene Kollagenpeptide tatsächlich im Zielgewebe ankommen, ist biochemisch noch diskutiert. Lebensverlängernde Effekte: nicht untersucht.
    body: |
      ## Warum Kollagen so populär ist
      
      Kollagen ist das häufigste Strukturprotein im menschlichen Körper — Haut, Knochen, Sehnen und Knorpel bestehen hauptsächlich daraus. Die körpereigene Produktion sinkt ab dem 25. Lebensjahr um ca. 1% pro Jahr. Dieser gut dokumentierte Rückgang macht Kollagen zum intuitiv plausiblen Supplement.
      
      ## Die Grundfrage: Kommt es an?
      
      Ob oral eingenommene Kollagenpeptide tatsächlich in Haut oder Gelenken ankommen, ist biochemisch nicht trivial. Verdauungsenzyme zerteilen Proteine normalerweise in Aminosäuren — nicht in spezifische Peptide. Die aktuelle Forschung deutet darauf hin, dass spezifische di- und tripeptide aus hydrolysiertem Kollagen tatsächlich im Blutkreislauf nachweisbar sind und gezielt Fibroblasten (kollagenproduzierende Zellen) aktivieren können.
      
      ## Was ist belegt?
      
      ### Haut
      Die stärkste Evidenz liegt für Hautelastizität vor. Mehrere RCTs zeigen moderate, aber konsistente Verbesserungen mit 2,5–10 g hydrolysiertem Kollagen täglich.
      
      ### Gelenke
      Bei Gelenkschmerzen (besonders Knie) zeigen Studien moderate Schmerzreduktion. Die Evidenz ist weniger stark als für Haut, aber vorhanden.
      
      ### Was nicht belegt ist
      - Lebensverlängerung
      - Muskelaufbau (dafür ist Kollagen als Protein minderwertig — kein vollständiges Aminosäureprofil)
      - Knochenbruchprävention in der Gesamtbevölkerung
      
      ## Kollagentypen und -quellen
      
      | Typ | Hauptvorkommen | Quellen |
      |---|---|---|
      | Typ I | Haut, Sehnen, Knochen | Rind, Fisch, Schwein |
      | Typ II | Knorpel | Hühnchen, Rind |
      | Typ III | Haut, Blutgefäße | Rind, Fisch |
      
      **Marine Kollagen** (aus Fischhaut) hat bessere Bioverfügbarkeit als Rinderkollagen und ist für Menschen geeignet, die kein Schweine- oder Rindfleisch essen.
      
      ## Wichtiger Kaufhinweis
      
      Qualitätsunterschiede sind enorm. Auf folgende Punkte achten:
      - **Hydrolysiert/Peptide**: nur diese Form wird aufgenommen
      - **Molekulargewicht**: 2.000–5.000 Da gilt als optimal
      - **Zertifizierung**: Rückverfolgbarkeit der Quelle (Rind: BSE-frei, Fisch: nachhaltige Quelle)
      - **Kein Zucker**: viele Collagen-Drinks sind hochgezuckert

  en:
    summary: >-
      Collagen is one of the most popular supplements. Human trials support benefits for skin elasticity and joint markers; broader anti-aging claims remain unproven.
    evidenceSummary: >-
      Several small-to-medium RCTs demonstrate improvements in skin elasticity and joint pain. Effects are real but modest. Whether ingested collagen peptides actually reach target tissues remains biochemically debated. Life-extension effects have not been studied.
    body: |
      ## Why Collagen Has Become So Popular

      Collagen is the most abundant structural protein in the human body — skin, bones, tendons, and cartilage consist primarily of it. The body's own collagen production declines by roughly 1% per year starting around age 25. This well-documented decline makes collagen an intuitively plausible supplement target, and the supplement industry has built a multi-billion-dollar market around that intuition.

      The question worth asking is not whether collagen declines with age — it does — but whether swallowing collagen peptides actually reverses or slows that decline in meaningful ways.

      ## The Fundamental Question: Does It Reach Its Target?

      Whether orally ingested collagen peptides actually reach skin or joints is biochemically non-trivial. Digestive enzymes normally break proteins down into individual amino acids — not into specific bioactive peptides. For years this was the main objection to collagen supplementation.

      Current research suggests a more nuanced picture. Specific di- and tripeptides derived from hydrolyzed collagen — particularly Pro-Hyp and Hyp-Gly — are detectable in the bloodstream after oral ingestion. These small peptides appear to resist complete digestion and can selectively activate fibroblasts, the cells responsible for collagen synthesis in skin and connective tissue. This provides a plausible mechanism, though the degree to which circulating peptide levels translate into measurable tissue changes remains under investigation.

      ## What the Evidence Actually Shows

      ### Skin

      The strongest evidence concerns skin elasticity. Proksch et al. (2014, PMID 24401291) conducted a double-blind RCT in 69 women aged 35–55. Participants received 2.5 g or 5 g of hydrolyzed collagen (Verisol) daily for 8 weeks. Both doses significantly improved skin elasticity compared to placebo; the 2.5 g dose performed comparably to 5 g. Skin moisture also improved significantly.

      A 2020 systematic review by Barati et al. (PMID 32436266) pooled 11 RCTs and found consistent positive effects on skin elasticity and hydration across studies. The authors rated overall study quality as moderate — most trials were industry-funded and used proprietary hydrolysate formulations, making it difficult to generalize results to all collagen products.

      ### Joints

      Shaw et al. (2017, PMID 27852613) ran a 24-week RCT in athletes with knee pain. Participants received 10 g/day collagen hydrolysate or placebo. The collagen group reported significantly reduced pain at rest and during activity. This is one of the better-designed joint trials, with an active population and a clinically relevant endpoint.

      Several other trials in osteoarthritis populations show modest but consistent pain reductions. The effect sizes are meaningful enough to matter to patients, but not dramatic enough to replace pharmaceutical pain management in moderate-to-severe cases.

      ### What the Evidence Does Not Support

      - **Lifespan extension**: No human trials have examined longevity endpoints. This is marketing territory, not science.
      - **Muscle building**: Collagen is a poor source of branched-chain amino acids and lacks adequate leucine. It does not trigger muscle protein synthesis comparably to whey or casein. Collagen supplementation does not replace protein from complete sources.
      - **Fracture prevention in the general population**: Some studies in postmenopausal women suggest modest bone density benefits, but evidence is not sufficient to recommend collagen for fracture prevention.
      - **Hair and nail growth**: Anecdotal claims are widespread; controlled trial evidence is thin.

      ## Collagen Types and Sources

      | Type | Main Location | Common Sources |
      |---|---|---|
      | Type I | Skin, tendons, bone | Bovine, fish, porcine |
      | Type II | Cartilage | Chicken, bovine |
      | Type III | Skin, blood vessels | Bovine, fish |

      Most skin-focused products use Type I hydrolysate from bovine hides or fish skin. Joint-focused products often feature undenatured Type II collagen (UC-II) at lower doses (40 mg/day), which works via a different immunological mechanism — oral tolerance — rather than providing substrate for collagen synthesis.

      **Marine collagen** (from fish skin or scales) has a smaller average molecular weight than bovine collagen, which may improve absorption. It is also suitable for people who avoid pork or beef for dietary or religious reasons. Sustainability of the fish source matters — look for MSC-certified or traceable supply chains.

      ## How to Choose a Quality Product

      Quality differences between collagen supplements are substantial. Key criteria:

      - **Hydrolyzed form only**: Whole collagen protein or gelatin is not well absorbed. Only hydrolysates (peptides) show bioavailability in the bloodstream.
      - **Molecular weight**: 2,000–5,000 Da is considered optimal for intestinal absorption. Some products specify average molecular weight; most do not.
      - **Dose**: Most RCT evidence uses 2.5–10 g/day. Products providing under 1 g are unlikely to replicate trial effects.
      - **Traceability**: Bovine collagen should come from BSE-free certified sources; marine collagen from sustainable fisheries.
      - **No added sugar**: Many collagen drinks and powders contain substantial added sugars, which counteract any potential skin benefit by promoting glycation — a process that stiffens collagen fibers.
      - **Vitamin C co-supplementation**: Collagen synthesis depends on vitamin C as a cofactor. Ensuring adequate vitamin C intake (75–90 mg/day from food is sufficient for most people) maximizes the theoretical benefit.

      ## Regulatory Status

      EFSA has rejected health claims for collagen relating to skin and joint health on the grounds that the causal evidence was insufficient at the time of evaluation. This does not mean the evidence is non-existent — it means it did not meet EFSA's demanding standard for a claim that can be made on a product label. The post-2014 literature has strengthened the case for skin effects in particular, but no new EFSA claim has been approved.

      ## Bottom Line

      Collagen supplementation has a more credible evidence base than most beauty supplements. The skin elasticity data is consistent across multiple independent trials; the joint pain data is promising but less robust. The mechanism is plausible but not fully elucidated. For people specifically seeking skin or joint benefits, hydrolyzed collagen at 2.5–10 g/day is a reasonable choice — provided they select a quality product and maintain realistic expectations. It is not a longevity drug and should not be marketed as one.

