locales:
  de:
    summary: >-
      PQQ wird gern mit Mitochondrien und Zellenergie verknüpft. Das klingt elegant, aber die Human-Evidenz ist bisher dünn.
    evidenceSummary: >-
      PQQ ist mechanistisch interessant, vor allem im Zusammenhang mit Mitochondrien und oxidativem Stress. Die Human-Evidenz bleibt jedoch klein und vorläufig. Viele starke Claims in der Supplement-Welt sind durch robuste klinische Daten nicht gedeckt.
    body: |
      ## Was ist PQQ?
      
      PQQ ist ein Stoff, der in der Biohacker- und Szene für gesundes Altern wegen möglicher Effekte auf **Mitochondrien** und **oxidativen Stress** diskutiert wird.
      
      ## Reality Check
      
      - gute Story
      - interessante Mechanismen
      - aber noch wenig robuste Human-Daten
      
      ## Fazit
      
      PQQ ist aktuell eher ein **„scientifically sexy, clinically early“**-Kandidat.

