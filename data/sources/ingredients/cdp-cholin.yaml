  en:
    summary: >-
      CDP-choline is an interesting choline form for brain and membrane metabolism. Evidence is solid but not strong enough for major claims.
    evidenceSummary: >-
      Citicoline is biologically plausible as a choline source and membrane phospholipid precursor. Clinical data on attention, cognitive performance, and neurological applications exist but are mixed and overall moderate rather than definitive.
    body: |
      ## What Is CDP-Choline?

      CDP-choline, commonly known as **citicoline**, is a choline compound that bridges the gap between brain cell membrane synthesis and neurotransmitter production. It is an intermediate in the Kennedy pathway—the biochemical route through which the body produces phosphatidylcholine, a major component of neuronal membranes.

      In supplement form, citicoline is often marketed as a cognitive enhancer and neuroprotective agent. Unlike pure choline or alpha-GPC, citicoline contains both the choline moiety and cytidine, which independently contribute to cellular energy and membrane health.

      ## How Does CDP-Choline Work?

      The mechanism of action is multi-faceted:

      **Membrane Support**: Citicoline is a phospholipid precursor. The body can convert it into phosphatidylcholine (PC), a phospholipid essential for neuronal membrane integrity, signal transduction, and cell repair. This is particularly relevant in the aging brain, where membrane fluidity naturally declines.

      **Neurotransmitter Synthesis**: As a choline source, citicoline contributes to acetylcholine (ACh) production. Acetylcholine is central to attention, memory encoding, and executive function. Individuals with naturally low dietary choline or older adults with declining choline metabolism may benefit from this pathway.

      **Mitochondrial Function**: The cytidine component can be metabolized into uridine, which supports ATP synthesis and mitochondrial energy production. This may help explain citicoline's potential cognitive benefits independent of its choline content alone.

      **Neuroprotection**: Some in vitro and animal studies suggest citicoline can stabilize neuronal lipid membranes under oxidative stress and support endothelial function, though clinical translation remains limited.

      ## What Does the Evidence Show?

      ### Attention and Cognitive Performance

      The evidence for citicoline and attention is mixed. A 1996 study by Spiers et al. (PMID 8898684) found positive signals for memory in a small human cohort, with verbal learning and free recall showing improvements. However, the sample size was limited and the study was not placebo-controlled by modern standards.

      McGlade et al. (2012, PMID 22819395) investigated citicoline's effects on attention using EEG measures in a small group. They reported attention-related improvements on some measures, but the clinical significance is unclear and the sample size was modest. Larger, well-controlled trials have not consistently replicated these findings.

      ### Neurological and Clinical Applications

      Citicoline has been studied in stroke recovery, cognitive aging, and attention-deficit conditions, primarily in European and Asian research centers. A 2016 pharmacological review by Secades (PMID 28054935) concluded that citicoline is neurobiologically plausible and well-tolerated with a good safety profile. However, the review also noted that clinical efficacy is not uniformly established across all proposed indications.

      Most robust data come from stroke and traumatic brain injury populations, where citicoline may support neuronal repair. For healthy cognitive enhancement, the evidence remains preliminary.

      ### Safety and Tolerability

      Citicoline is generally well-tolerated. At typical supplement doses (250–500 mg/day), adverse events are rare and mild. Gastrointestinal upset and headache have been reported in a small percentage of users, but the incidence is comparable to placebo in clinical trials. There are no known serious drug interactions at standard doses.

      ## Regulatory Status

      In the European Union, citicoline does not have approved health claims under EFSA (European Food Safety Authority) regulation for attention, memory, or cognitive function. Any marketing claim implying such benefits would violate EU advertising standards for food supplements. This reflects the modest and inconsistent nature of the clinical evidence to date.

      ## Who Might Benefit?

      Citicoline may be of interest to individuals:

      - With documented choline insufficiency (rare but possible with certain diets)
      - Seeking membrane support during aging or cognitive stress
      - Interested in neuroprotection as a longer-term strategy (though evidence remains preliminary)

      It is **not** a proven cognitive enhancer for healthy adults and should not be positioned as such.

      ## Practical Considerations

      **Dose**: Typical supplement doses range from 250–500 mg/day, sometimes split into two doses. Prescription citicoline formulations in some countries use higher doses (1,000+ mg/day), usually for neurological conditions.

      **Timing**: Citicoline is absorbed reasonably well on an empty stomach or with food. No special timing is required.

      **Consistency**: If trying citicoline for cognitive benefits, 8–12 weeks of consistent use is a reasonable trial period, as membrane turnover and neurotransmitter optimization take time.

      **Stacking**: Citicoline is sometimes combined with alpha-GPC or other choline sources for presumed synergistic membrane support, but this combination lacks robust clinical evidence and risks over-supplementation.

      ## Bottom Line

      CDP-choline (citicoline) is a **biologically plausible and well-tolerated compound** with a credible mechanism of action for brain health and membrane support. However, clinical evidence for cognitive enhancement in healthy adults is modest and inconsistent. It is not backed by EU health claims and should not be marketed as a proven nootropic.

      It may have a role in neuroprotection and membrane support strategies, particularly in aging or post-injury recovery contexts, but expectations should be tempered. For cognitive performance, it is far less proven than lifestyle factors like sleep, exercise, and dietary quality.

