locales:
  de:
    summary: >-
      CDP-Cholin ist eine interessante Cholinform für Gehirn und Membranstoffwechsel. Die Evidenz ist ordentlich, aber nicht stark genug für große Versprechen.
    evidenceSummary: >-
      Citicolin ist als Cholinquelle und Membran-Vorstufe biologisch plausibel. Klinische Daten zu Aufmerksamkeit, kognitiver Leistung und neurologischen Anwendungen sind vorhanden, aber gemischt und insgesamt eher moderat als eindeutig.
    body: |
      ## Was ist CDP-Cholin?
      
      CDP-Cholin, meist als **Citicolin** bekannt, ist eine Cholinform, die für Acetylcholin und Zellmembranen relevant ist.
      
      ## Warum ist es interessant?
      
      Weil es zwei Welten verbindet:
      - Cholin / Neurotransmitter
      - Membran- und Phospholipidstoffwechsel
      
      ## Fazit
      
      CDP-Cholin ist ein **seriöser Nootropic-Kandidat**, aber nicht so stark belegt, dass man daraus große universelle Leistungsversprechen ableiten sollte.

