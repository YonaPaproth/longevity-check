locales:
  de:
    summary: >-
      Vitamin B12 ist essenziell für Nervenfunktion, DNA-Synthese und Homocystein-Stoffwechsel. Mangel ist bei Veganern, Älteren und Metformin-Nutzern häufig und führt zu irreversiblen Nervenschäden.
    evidenceSummary: >-
      Klare Evidenz: B12-Mangel verursacht schwere neurologische Schäden und megaloblastäre Anämie; betrifft bis zu 20% der über 60-Jährigen. Orale Supplementierung mit 1.000 µg/Tag so effektiv wie Injektionen. Für ausreichend Versorgte kein Zusatznutzen belegt. EFSA Health Claims zugelassen.
    body: |
      ## Was ist Vitamin B12?
      
      Vitamin B12 (Cobalamin) ist ein wasserlösliches Vitamin, das ausschließlich von Mikroorganismen synthetisiert wird und in der menschlichen Ernährung **nur in tierischen Produkten** vorkommt (Fleisch, Fisch, Eier, Milchprodukte). Es ist essenzieller Cofaktor für zwei Schlüsselenzyme:
      
      1. **Methioninsynthase:** wandelt Homocystein zu Methionin um – kritisch für Methylierungsreaktionen, DNA-Synthese und Nervenmyelinisierung
      2. **Methylmalonyl-CoA-Mutase:** wichtig für den Fettsäurestoffwechsel und Myelinsynthese (Schutzschicht der Nerven)
      
      Besonderheit: Der Körper hat **B12-Depots für 3–5 Jahre** (hauptsächlich in der Leber). Mangel entwickelt sich daher schleichend – wenn neurologische Symptome auftreten, können die Schäden bereits fortgeschritten sein.
      
      ## Wer hat Risiko für Mangel?
      
      B12-Mangel ist eine der häufigsten, aber auch am häufigsten übersehenen Mangelernährungen in Deutschland:
      
      | Risikogruppe | Ursache | Kommentar |
      |---|---|---|
      | Veganer / Veganerinnen | Kein B12 in pflanzlicher Kost | Supplementierung essenziell |
      | Vegetarier | Nur wenig über Milch/Eier | Risiko je nach Verzehrsmenge |
      | Personen ab 60 Jahren | Atrophische Gastritis → weniger Intrinsic Factor | Bis zu 20% betroffen (Green 2017) |
      | Metformin-Nutzer | Metformin hemmt B12-Resorption im Darm | 4,3-fach erhöhtes Mangelrisiko bei &gt;3 J. |
      | Protonenpumpenhemmer (PPI) | Hemmt Magensäure → schlechtere B12-Spaltung aus Nahrung | Langzeitrisiko |
      | Magenbypass-Patienten | Kein Intrinsic Factor mehr | Lebenslange Supplementierung nötig |
      
      ## Symptome und Diagnostik
      
      **Frühe Symptome** sind unspezifisch: Müdigkeit, Konzentrationsprobleme, Kribbeln in Händen und Füßen (Parästhesien), Zungenbrennen. Diese Symptome werden oft monatelang ignoriert.
      
      **Schwere Mängel** führen zu:
      - **Polyneuropathie** (Nervenschaden, teils irreversibel wenn nicht früh behandelt)
      - **Megaloblastäre Anämie** (große, unreife rote Blutkörperchen)
      - Kognitive Störungen, Demenz-ähnliche Symptome
      
      **Diagnostik:** Serum-B12 allein ist unzuverlässig (falsch-normale Werte möglich). Sensitivere Marker: **Holotranscobalamin (aktives B12)** und **Methylmalonsäure (MMA)** – erhöhtes MMA ist der zuverlässigste Mangel-Marker laut Herrmann & Obeid (2008).
      
      ## Was sagen die Studien?
      
      ### Klar belegt
      
      - B12-Mangel verursacht schwere, bei früher Behandlung reversible Erkrankungen (klare kausale Evidenz)
      - Supplementierung hebt Blutspiegel zuverlässig an
      - **Orale Hochdosis-B12 (1.000–2.000 µg/Tag) ist ebenso effektiv wie Injektionen** bei den meisten Patienten – auch ohne Intrinsic Factor ist passive Diffusion bei 1% der Dosis als Absorption ausreichend
      - EFSA-zugelassene Claims für Energie, Nervensystem, rote Blutkörperchen und Verringerung von Müdigkeit
      
      ### Interessant, aber eingeschränkt
      
      **Kognition und Hirnatrophie:** Die VITACOG-Studie (Smith 2010, n=168) zeigte, dass B-Vitamine (inkl. B12) die Rate der Hirnatrophie bei milder kognitiver Beeinträchtigung mit erhöhtem Homocystein um **53%** verlangsamten. Wichtig: Dieser Effekt trat nur bei hohem Homocystein-Ausgangswert auf – nicht bei Personen mit normalen Werten.
      
      ### Umstritten
      
      **Homocystein und Herzerkrankungen:** B-Vitamine senken Homocystein signifikant, aber eine Metaanalyse (Clarke 2010) zeigt, dass die Homocysteinreduktion nicht konsistent zu weniger Herzinfarkten führt. Der angenommene Mechanismus (Homocystein → Herzrisiko) ist schwächer als lange vermutet.
      
      ### Nicht belegt
      
      - Energie-Boost bei Personen mit normalen B12-Spiegeln (trotz weit verbreitetem Glauben)
      - Longevity-Effekte bei ausreichend versorgten Personen
      - Kognitionsverbesserung ohne tatsächlichen Mangel oder erhöhtes Homocystein
      
      ## Welche Form?
      
      | Form | Besonderheit | Empfehlung |
      |---|---|---|
      | **Cyanocobalamin** | Günstigste Standardform; muss im Körper umgewandelt werden | Für die meisten Menschen ausreichend |
      | **Methylcobalamin** | Aktive Form, direkt nutzbar; bevorzugt bei Nervenproblemen | Sinnvoll bei neurologischen Beschwerden |
      | **Adenosylcobalamin** | Mitochondriale aktive Form | Ergänzend zu Methylcobalamin |
      | **Hydroxocobalamin** | Depot-Form für Injektionen | Nur für klinische Anwendung |
      
      Für die meisten Menschen ist **Cyanocobalamin** in Standarddosierungen ausreichend – günstig, stabil, gut untersucht. Personen mit MTHFR-Polymorphismus (Methylierungsstörung) profitieren möglicherweise von Methylcobalamin, obwohl die klinische Evidenz dafür begrenzt ist.
      
      ## Dosierung
      
      - **Veganer / Veganerinnen:** Mind. 250 µg/Tag oral oder 2.000 µg zweimal wöchentlich (passiv diffundierend)
      - **Mangelkorrektur:** 1.000–2.000 µg/Tag oral über mehrere Wochen bis Normalisierung
      - **Prävention bei Risikogruppen:** 500–1.000 µg/Tag
      - **Erhaltsdosis nach Mangel:** 100–500 µg/Tag
      
      Vitamin B12 ist **sicher** – keine bekannte Toxizität bei hohen oralen Dosen. Überschuss wird renal ausgeschieden. Keine relevanten Wechselwirkungen.
      
      ## Limitierungen
      
      - Diagnostisch wird B12-Mangel häufig übersehen, weil Serum-B12 ein schlechter Marker ist und Symptome unspezifisch sind
      - Kognitive Studien (VITACOG) sind klein und auf Subgruppen mit erhöhtem Homocystein begrenzt – keine Übertragbarkeit auf die gesunde Allgemeinbevölkerung
      - Die Metformin-Assoziation ist gut belegt, aber ob B12-Supplementierung bei diesen Patienten klinisch relevante Outcomes verbessert (nicht nur Spiegel), ist weniger gut untersucht
      
      ## EFSA-Status
      
      EFSA hat für Vitamin B12 mehrere Health Claims nach VO (EG) 1924/2006 zugelassen, einsehbar im [EFSA-Register für Nährwert- und gesundheitsbezogene Angaben](https://www.efsa.europa.eu/en/topics/topic/nutrition):
      
      - Beitrag zur normalen Funktion des Nervensystems
      - Beitrag zur Bildung roter Blutkörperchen (zusammen mit Folsäure)
      - Normaler Energiestoffwechsel
      - Verringerung von Müdigkeit und Ermüdung
      - Normale psychische Funktion
      
      ## Empfehlung: Wer sollte testen und supplementieren?
      
      **Jährlicher B12-Check** (Holotranscobalamin + MMA) sinnvoll für:
      - Veganer/innen und strenge Vegetarier/innen
      - Personen ab 65 Jahren
      - Langzeit-Metformin- oder PPI-Nutzer
      - Personen mit unklarer Müdigkeit oder Kribbeln in Extremitäten
      
      Bei nachgewiesenem Mangel: **1.000 µg/Tag oral** – das reicht auch ohne Intrinsic Factor durch passive Diffusion (ca. 1% der Dosis wird passiv absorbiert, d. h. 10 µg von 1.000 µg).

  en:
    summary: >-
      Vitamin B12 is essential for nerve function, DNA synthesis, and homocysteine metabolism. Deficiency is common in vegans, older adults, and metformin users and causes irreversible nerve damage.
    evidenceSummary: >-
      Clear evidence: B12 deficiency causes severe neurological damage and megaloblastic anaemia; affects up to 20% of adults over 60. Oral supplementation with 1,000 µg/day is as effective as injections. No additional benefit in adequately nourished individuals. EFSA health claims approved.
    body: |
      ## What Is Vitamin B12?
      
      Vitamin B12 (cobalamin) is a water-soluble vitamin synthesised exclusively by micro-organisms. In the human diet it is found **only in animal products** (meat, fish, eggs, dairy). It is an essential cofactor for two key enzymes:
      
      1. **Methionine synthase:** converts homocysteine to methionine — critical for methylation reactions, DNA synthesis, and nerve myelination
      2. **Methylmalonyl-CoA mutase:** important for fatty acid metabolism and myelin synthesis (the nerve's protective sheath)
      
      Notably: the body maintains **B12 stores for 3–5 years** (mainly in the liver). Deficiency therefore develops gradually — by the time neurological symptoms appear, damage may already be advanced.
      
      ## Who Is at Risk?
      
      B12 deficiency is one of the most common yet most frequently overlooked nutritional deficiencies:
      
      | At-risk group | Cause | Comment |
      |---|---|---|
      | Vegans | No B12 in plant foods | Supplementation essential |
      | Vegetarians | Limited amounts via dairy/eggs | Risk depends on intake |
      | Adults aged 60+ | Atrophic gastritis → less intrinsic factor | Up to 20% affected (Green 2017) |
      | Metformin users | Metformin impairs intestinal B12 absorption | 4.3× higher deficiency risk after &gt;3 years |
      | PPI users | Reduces gastric acid → worse B12 release from food | Long-term risk |
      | Gastric bypass patients | No intrinsic factor | Lifelong supplementation required |
      
      ## Symptoms and Diagnosis
      
      **Early symptoms** are non-specific: fatigue, difficulty concentrating, tingling in hands and feet (paraesthesia), burning tongue. These are often ignored for months.
      
      **Severe deficiency** leads to:
      - **Polyneuropathy** (nerve damage, potentially irreversible if not treated early)
      - **Megaloblastic anaemia** (large, immature red blood cells)
      - Cognitive impairment, dementia-like symptoms
      
      **Diagnosis:** Serum B12 alone is unreliable (false-normal results possible). More sensitive markers: **holotranscobalamin (active B12)** and **methylmalonic acid (MMA)** — elevated MMA is the most reliable deficiency marker per Herrmann & Obeid (2008).
      
      ## What Do the Studies Show?
      
      ### Clearly established
      
      - B12 deficiency causes severe, potentially reversible conditions if treated early (clear causal evidence)
      - Supplementation reliably raises blood levels
      - **High-dose oral B12 (1,000–2,000 µg/day) is as effective as injections** in most patients — even without intrinsic factor, passive diffusion absorbs ~1% of the dose, meaning 10 µg from 1,000 µg
      - EFSA-approved claims for energy, nervous system, red blood cells, and fatigue reduction
      
      ### Interesting but limited
      
      **Cognition and brain atrophy:** The VITACOG study (Smith 2010, n=168) showed that B vitamins (including B12) slowed brain atrophy in mild cognitive impairment with elevated homocysteine by **53%**. Important: this effect occurred only in those with high baseline homocysteine — not in people with normal values.
      
      ### Contested
      
      **Homocysteine and heart disease:** B vitamins significantly lower homocysteine, but a meta-analysis (Clarke 2010) shows that homocysteine reduction does not consistently translate into fewer heart attacks. The assumed mechanism (homocysteine → cardiac risk) is weaker than long believed.
      
      ### Not established
      
      - Energy boost in people with normal B12 levels (despite widespread belief)
      - Longevity effects in adequately nourished individuals
      - Cognitive improvement without actual deficiency or elevated homocysteine
      
      ## Which Form?
      
      | Form | Properties | Recommendation |
      |---|---|---|
      | **Cyanocobalamin** | Cheapest standard form; must be converted in the body | Sufficient for most people |
      | **Methylcobalamin** | Active form, directly usable; preferred for nerve issues | Useful for neurological complaints |
      | **Adenosylcobalamin** | Mitochondrial active form | Complementary to methylcobalamin |
      | **Hydroxocobalamin** | Depot form for injections | Clinical use only |
      
      For most people, **cyanocobalamin** at standard doses is sufficient — inexpensive, stable, well studied. People with MTHFR polymorphism (methylation impairment) may benefit from methylcobalamin, though clinical evidence for this is limited.
      
      ## Dosage
      
      - **Vegans:** At least 250 µg/day orally, or 2,000 µg twice weekly (passive diffusion)
      - **Deficiency correction:** 1,000–2,000 µg/day orally over several weeks until normalisation
      - **Prevention in at-risk groups:** 500–1,000 µg/day
      - **Maintenance dose after deficiency:** 100–500 µg/day
      
      Vitamin B12 is **safe** — no known toxicity at high oral doses. Excess is renally excreted. No relevant drug interactions.
      
      ## Limitations
      
      - B12 deficiency is frequently missed because serum B12 is a poor marker and symptoms are non-specific
      - Cognitive studies (VITACOG) are small and limited to subgroups with elevated homocysteine — not generalisable to the healthy general population
      - The metformin association is well established, but whether B12 supplementation in these patients improves clinical outcomes (beyond just levels) is less well studied
      
      ## EFSA Status
      
      EFSA has approved multiple health claims for vitamin B12, including:
      
      - Contributes to normal nervous system function
      - Contributes to formation of red blood cells (together with folate)
      - Normal energy metabolism
      - Reduction of tiredness and fatigue
      - Normal psychological function
      
      ## Recommendation: Who Should Test and Supplement?
      
      **Annual B12 check** (holotranscobalamin + MMA) is sensible for:
      - Vegans and strict vegetarians
      - Adults aged 65+
      - Long-term metformin or PPI users
      - People with unexplained fatigue or tingling in the extremities
      
      In confirmed deficiency: **1,000 µg/day orally** — sufficient even without intrinsic factor via passive diffusion (~1% absorbed, i.e. 10 µg from 1,000 µg).

