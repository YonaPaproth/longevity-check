    summary: >-
      Tongkat Ali ist in Männer- und Testosteron-Stacks populär. Die Daten sind interessant, aber klein, extraktabhängig und nicht frei von Hype.
    evidenceSummary: >-
      Für Tongkat Ali gibt es einige Humanstudien mit Signalen bei Stress, Libido und teils Testosteron-bezogenen Parametern. Die Evidenz ist aber überschaubar, stark extraktabhängig und nicht robust genug für große Versprechen.
    body: |
      ## Was ist Tongkat Ali?
      
      Tongkat Ali ist ein Pflanzenextrakt, der vor allem in **Männergesundheit-, Performance- und Testosteron-Stacks** auftaucht.
      
      ## Was ist das Problem?
      
      Die Story ist stark, die Human-Evidenz aber noch eher mittel.
      
      ## Fazit
      
      Tongkat Ali ist **interessant, aber deutlich weniger settled als seine Fans behaupten**.

