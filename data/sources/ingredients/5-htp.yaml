locales:
  de:
    summary: >-
      5-HTP ist ein Serotonin-Vorläufer, der die Blut-Hirn-Schranke überquert. Es wird vor allem für Schlaf und Stimmung untersucht. Wichtige Sicherheitswarnung: nicht mit SSRIs oder MAO-Hemmern…
    evidenceSummary: >-
      Mehrere RCTs zeigen Verbesserungen bei depressive Symptome, Schlaf und Appetitregulation. Mechanismus (Serotoninsynthese) vergleichsweise gut untersucht. Sicherheitsbedenken bei Kombination mit serotonergen Medikamenten (Serotonin-Syndrom). Langzeitstudien fehlen.
    body: |
      ## Was ist 5-HTP?
      
      5-Hydroxytryptophan (5-HTP) ist eine Aminosäure, die als **direkter Vorläufer von Serotonin** fungiert. Es wird aus L-Tryptophan (aus der Nahrung) synthetisiert und ist der letzte Schritt vor der Serotoninbildung.
      
      Im Gegensatz zu L-Tryptophan überquert 5-HTP die **Blut-Hirn-Schranke** effizient ohne Konkurrenz durch andere Aminosäuren. Das macht es zum untersuchteren Supplement für die Serotoninerhöhung im Gehirn.
      
      Serotonin selbst kann die Blut-Hirn-Schranke nicht überqueren – weshalb Serotonin aus Nahrung oder Peripherie keine zentrale Wirkung hat.
      
      ## Wirkmechanismus
      
      ```
      L-Tryptophan (Nahrung)
          ↓ Tryptophan-Hydroxylase
      5-HTP (Supplement setzt hier an)
          ↓ aromatische L-Aminosäure-Decarboxylase
      Serotonin (5-HT)
          ↓ N-Acetyltransferase
      Melatonin
      ```
      
      5-HTP kann potenziell sowohl Serotonin als auch Melatonin erhöhen – was die Wirkungen auf Stimmung und Schlaf erklärt.
      
      ## Was sagen die Studien wirklich?
      
      ### Belegt (ältere, methodisch begrenzte RCTs)
      - **depressive Symptome**: Ein direkter RCT-Vergleich mit Fluvoxamin zeigte vergleichbare Effektivität (kleine Studie)
      - **Schlaf**: REM-Schlaf war in einzelnen Studien länger, und die Einschlafzeit wurde teils verkürzt beschrieben
      - **Fibromyalgie**: Schmerzreduktion in mehreren kleinen RCTs
      - **Appetit/Gewicht**: Reduziertes Sättigungsgefühl, weniger Kalorienaufnahme in RCTs
      
      ### Einschränkungen
      - Die meisten Studien stammen aus den 1980er–2000er Jahren mit kleinen Fallzahlen
      - Keine modernen, groß angelegten RCTs
      - Industriefinanzierung in einigen Studien
      
      ### Nicht belegt
      - Endpunkte zu gesundem Altern
      - Wirksamkeit als Ersatz für klinische medizinischen Kontext bei depressiven Symptomen
      
      ## Die kritische Sicherheitswarnung
      
      5-HTP hat ein reales Interaktionsrisiko, das viele Nutzer unterschätzen:
      
      **Serotonin-Syndrom** bei Kombination mit:
      - SSRIs (Fluoxetin, Sertralin, Escitalopram etc.)
      - SNRIs (Venlafaxin, Duloxetin)
      - MAO-Hemmern (Tranylcypromin, Moclobemid)
      - Tramadol, Triptanen (Migränemittel)
      - Lithium, Linezolid
      
      Das Serotonin-Syndrom ist ein potenziell lebensbedrohlicher Zustand mit Hyperthermie, Agitation, Tremor und Krampfanfällen.
      
      > **Wenn du eines dieser Medikamente nimmst: 5-HTP nicht ohne Rücksprache mit deinem Arzt einsetzen.**
      
      ## Ist 5-HTP sicher?
      
      Bei 50–200 mg/Tag kurzfristig: Bei gesunden Personen ohne Medikamente **möglicherweise sicher**, aber mit Vorsicht einzustufen. Häufigste Nebenwirkungen: Übelkeit, Durchfall, besonders zu Beginn. Nicht dauerhaft ohne Pausen einnehmen. Absolut kontraindiziert in Kombination mit serotonergen Medikamenten.

  en:
    summary: >-
      5-HTP is a serotonin precursor crossing the blood-brain barrier. Used for sleep and mood. Critical: avoid with SSRIs or MAO inhibitors due to serotonin syndrome risk.
    evidenceSummary: >-
      Several RCTs show improvements in depression, sleep, and appetite regulation. The mechanism (serotonin synthesis) is relatively well-understood. Safety concerns exist when combined with serotonergic medications (serotonin syndrome risk). Long-term studies are lacking.
    body: |
      ## What is 5-HTP?

      5-Hydroxytryptophan (5-HTP) is an amino acid that serves as a **direct precursor to serotonin**. It is synthesized from L-tryptophan (obtained from food) and represents the final step before serotonin is produced in the body.

      Unlike L-tryptophan, 5-HTP **crosses the blood-brain barrier** efficiently, without competition from other amino acids. This makes it a more researched supplement for raising serotonin levels in the brain.

      Serotonin itself cannot cross the blood-brain barrier—which is why dietary serotonin or peripheral serotonin has no central nervous system effects. This is the biochemical basis for 5-HTP supplementation: by providing the immediate precursor directly, we can potentially increase central nervous system serotonin synthesis.

      ## Mechanism of Action

      ```
      L-Tryptophan (from food)
          ↓ Tryptophan hydroxylase
      5-HTP (this is where the supplement acts)
          ↓ Aromatic L-amino acid decarboxylase
      Serotonin (5-HT)
          ↓ N-acetyltransferase
      Melatonin
      ```

      5-HTP can increase both serotonin and melatonin levels—which explains potential effects on mood and sleep. The same enzyme that converts 5-HTP to serotonin is active throughout the brain and periphery, including in the pineal gland, where melatonin synthesis occurs.

      ## What Does the Research Actually Say?

      ### Established Evidence (Older, Methodologically Limited RCTs)

      - **Depression symptoms**: A direct RCT comparison with fluoxamine showed comparable efficacy, though the sample size was small. This is one of the few direct head-to-head comparisons with an SSRI in the literature.
      - **Sleep**: REM sleep duration increased in several studies, and sleep latency (time to fall asleep) was shortened in some trials. The data suggest mild sleep-promoting effects.
      - **Fibromyalgia**: Pain reduction was observed in multiple small RCTs, though these studies are now 20–30 years old.
      - **Appetite and weight**: Studies reported reduced satiety signals and lower caloric intake in RCTs, though most used very small sample sizes (n=20–30).

      ### Important Limitations

      - Most studies date from the 1980s–2000s with small sample sizes
      - No modern, large-scale RCTs exist
      - Many studies were industry-funded
      - Publication bias likely favors positive results
      - Few studies controlled for placebo effects rigorously

      ### Not Established

      - Anti-aging or longevity endpoints
      - Efficacy as a replacement for clinical treatment of depression
      - Long-term safety beyond 12–16 weeks of continuous use
      - Comparative efficacy vs. L-tryptophan (direct comparison studies are lacking)

      ## The Critical Safety Warning

      5-HTP carries a real interaction risk that many users underestimate:

      **Serotonin Syndrome** can occur when combined with:
      - SSRIs (fluoxetine, sertraline, escitalopram, paroxetine, citalopram, etc.)
      - SNRIs (venlafaxine, duloxetine, desvenlafaxine)
      - MAO inhibitors (tranylcypromine, phenelzine, moclobemid)
      - Tramadol (opioid analgesic with serotonergic activity)
      - Triptans (migraine medications like sumatriptan, rizatriptan)
      - Lithium (mood stabilizer—enhances serotonergic transmission)
      - Linezolid (antibiotic with MAOI activity)

      **Serotonin syndrome is a potentially life-threatening condition** characterized by:
      - Hyperthermia (dangerous elevation in body temperature)
      - Agitation and confusion
      - Tremor and muscle rigidity
      - Seizures
      - Cardiovascular instability

      > **If you take any of these medications, do not use 5-HTP without first consulting your physician.**

      ### Mechanism of the Interaction

      5-HTP bypasses the first enzymatic step and directly elevates serotonin. When combined with drugs that block serotonin reuptake (SSRIs) or block its degradation (MAOIs), serotonin can accumulate to toxic levels in the synapse. This is not a theoretical risk—case reports in the medical literature document serotonin syndrome from 5-HTP combinations.

      ## Is 5-HTP Safe?

      At doses of 50–200 mg/day for short-term use (≤12 weeks), **and in people not taking serotonergic medications**, 5-HTP is **possibly safe**, but should be approached with caution.

      ### Common Side Effects

      - Nausea (especially at doses >150 mg or when first starting)
      - Diarrhea and loose stools
      - Decreased appetite (paradoxically, despite its use for appetite control)
      - Mild stomach upset
      - Headaches in some users

      Most side effects diminish after 1–2 weeks of use.

      ### Long-Term Safety

      This is poorly studied. There are no long-term safety trials in humans beyond 16 weeks. Concerns about chronic serotonin elevation:
      - Potential for tachyphylaxis (tolerance development)
      - Possible effects on heart valve function (serotonin can affect cardiac tissue—though 5-HTP appears lower risk than fenfluramine)
      - Endocrine effects: high serotonin might suppress cortisol or affect sex hormone pathways (speculative, not well-studied)

      **Recommendation**: Do not take 5-HTP continuously for months without medical supervision. Use intermittently or in cycles (e.g., 4–6 weeks on, 1–2 weeks off).

      ### Who Should Avoid 5-HTP

      - Anyone taking SSRIs, SNRIs, MAOIs, tramadol, or triptans
      - Pregnant or breastfeeding women (limited safety data)
      - Individuals with history of cardiac valve disease
      - People with uncontrolled hypertension
      - Carcinoid syndrome patients (5-HTP use can trigger carcinoid crisis)

      ## Comparison to L-Tryptophan

      Both are serotonin precursors, but operate at different steps:
      - **L-Tryptophan**: First step (converted to 5-HTP by tryptophan hydroxylase). Shares transport across the blood-brain barrier with other large neutral amino acids—less reliable CNS entry.
      - **5-HTP**: Directly converted to serotonin. Better blood-brain barrier penetration but lacks direct head-to-head comparison in modern RCTs.

      The choice between them depends on individual tolerance and the strength of desired effect.

      ## Summary and Evidence Grade

      **Evidence Level: 2** (Moderate evidence from older RCTs, limited modern data)

      5-HTP has biochemical plausibility and shows modest efficacy in older clinical trials for depression, sleep, and appetite regulation. However, the evidence base is aging, studies are small, and no modern large-scale RCTs exist. Most importantly, the **serotonin syndrome risk is real and non-theoretical**, making 5-HTP unsuitable for anyone already taking serotonergic medications.

      If you are not on serotonergic drugs and wish to trial 5-HTP for sleep or mood support, doses of 100–200 mg/day for up to 12 weeks can be considered, with close attention to side effects. Do not combine with any serotonergic medication without explicit medical clearance.

