locales:
  de:
    summary: >-
      L-Carnitin transportiert Fettsäuren in die Mitochondrien. Klingt nach Fatburner, liefert bei Gesunden aber meist weniger als die Werbung verspricht.
    evidenceSummary: >-
      L-Carnitin ist biologisch zentral für den Fettsäuretransport. Klinische Vorteile sind vor allem in speziellen Situationen wie Mangel, bestimmten Erkrankungen oder bei älteren Menschen plausibel. Für gesunde Erwachsene als allgemeiner Fatburner oder gesundes Altern-Supplement ist die Evidenz begrenzt.
    body: |
      ## Was ist L-Carnitin?
      
      L-Carnitin hilft dabei, **langkettige Fettsäuren in die Mitochondrien** zu transportieren. Dadurch klingt es automatisch nach mehr Fettverbrennung und mehr Energie.
      
      ## Das Problem
      
      Biologische Plausibilität heißt nicht automatisch großer Praxisnutzen.
      
      ## Was ist eher realistisch?
      
      - Sinnvoll bei Mangel oder speziellen Konstellationen
      - Möglicherweise moderat hilfreich in einzelnen Gruppen
      - Kein verlässlicher Turbo für Fettverlust bei Gesunden
      
      ## Fazit
      
      L-Carnitin ist **interessant, aber oft overmarketed**.

