    body: |
      ## Was ist Kaempferol?
      
      Kaempferol ist ein pflanzliches Flavonol, das oft zusammen mit anderen Polyphenolen in Kontext gesunden Alterns diskutiert wird.
      
      ## Fazit
      
      Kaempferol ist **interessant für Nerds, aber noch nicht stark für echte Produktaussagen**.

