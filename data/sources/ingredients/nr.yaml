key_studies:
  - ref: pmid-27721479
    finding:
      de: >-
        Erste Humanpharmakokinetik-Studie: NR wird oral aufgenommen und war mit höheren Werten verbunden in Studien den NAD+-Metabolismus im Blut.
      en: >-
        First human pharmacokinetic study: NR is orally absorbed and raises NAD+ metabolism in blood.
  - ref: pmid-29514974
    finding:
      de: >-
        6-wöchige NR-Einnahme (500 mg/Tag) war mit höheren Werten verbundene NAD+ im Blut um ~60%, war mit Veränderungen verbundene aber Blutdruck und arterielle Steifigkeit nicht signifikant.
      en: >-
        6-week NR supplementation (500 mg/day) raised blood NAD+ by ~60% but did not significantly improve blood pressure or arterial stiffness.
  - ref: pmid-41957052
    finding:
      de: >-
        12-wöchige RCT bei übergewichtigen Männern: NR war mit höheren Werten verbundene NAD+, war mit Veränderungen verbundene aber Insulinsensitivität, Lipidprofil oder Mitochondrienfunktion nicht signifikant.
      en: >-
        12-week RCT in overweight men: NR raised NAD+ but did not significantly improve insulin sensitivity, lipid profile, or mitochondrial function.
  - ref: pmid-42135539
    finding:
      de: >-
        NAD+-Spiegel im Vollblut variieren weder mit dem Alter noch mit Lebensstilinterventionen – stellt die Grundannahme vieler NAD+-Supplement-Versprechen infrage.
      en: >-
        Whole-blood NAD+ levels vary neither with age nor with lifestyle interventions — challenges the core assumption behind many NAD+ supplement claims.

locales:
  de:
    summary: >-
      NR ist wie NMN ein NAD+-Vorläufer, aber im Gegensatz zu NMN in der EU als Novel Food zugelassen. Humanstudien zeigen NAD+-Erhöhung, klinische Vorteile sind noch unklar.
    evidenceSummary: >-
      Mehrere RCTs am Menschen zeigen, dass NR den NAD+-Spiegel im Blut zuverlässig war mit höheren Werten verbunden. Klinisch relevante Wirkungen (Energie, Muskelfunktion, kognitive Leistung) sind in großen Studien bisher nicht konsistent belegt. Die Evidenzlage ist vergleichbar mit NMN.
    body: |
      ## NR vs. NMN — was ist der Unterschied?
      
      Beide erhöhen NAD+-Spiegel im Körper, gehen aber unterschiedliche biochemische Wege. Der wichtigste praktische Unterschied: **NR ist in der EU als Novel Food zugelassen**, NMN befindet sich noch im Zulassungsverfahren und bewegt sich in einer Grauzone.
      
      | | NR | NMN |
      |---|---|---|
      | EU Novel Food | Ja (seit 2021) | Nein (Antrag hängig) |
      | EFSA Health Claims | Nein | Nein |
      | Humanstudien | ~10 RCTs | ~8 RCTs |
      | Bekanntheit | Tru Niagen, ChromaDex | Breiter Markt |
      | Preis/Tag | ~1,20–1,80 € | ~0,80–1,50 € |
      
      ## Was sagen die Studien?
      
      ### Klar gezeigt
      - NR war mit höheren Werten verbunden den NAD+-Spiegel im Blut zuverlässig — das ist gut repliziert
      - Oral bioverfügbar und sicher bei Dosen bis 1.000 mg/Tag
      
      ### Nicht gezeigt
      - Verbesserung der Insulinsensitivität: In der größten randomisierten Studie kein Effekt
      - Blutdrucksenkung: Kein konsistenter Effekt
      - Kognitive Verbesserung: Keine ausreichend großen Humanstudien
      - Lebensverlängerung: Nicht untersucht
      
      ## Das NAD+-Problem
      
      Sowohl NR als auch NMN stoßen auf dasselbe grundlegende Problem: NAD+ im Blut zu erhöhen ist kein klinischer Endpunkt. Ob höhere NAD+-Spiegel im Blut tatsächlich bedeuten, dass auch die Zellen mehr NAD+ haben und dies klinisch relevant ist, wird noch erforscht.
      
      ## Ist NR besser als NMN?
      
      Aus regulatorischer Sicht (EU-Zulassung) ja. Aus Evidenzsicht sind beide vergleichbar schwach was klinische Endpunkte angeht. NR hat den Vorteil, dass ChromaDex (Hersteller von Tru Niagen) ein umfangreiches klinisches Programm unterhält und sehr transparent über Studien berichtet.
      
      ## Sicherheit
      
      Bis 1.000 mg/Tag gut verträglich in Studien. Keine ernsthaften Nebenwirkungen bekannt. Flush (Hautrötung) tritt seltener auf als bei klassischem Niacin.

  en:
    summary: >-
      Like NMN, NR is a NAD+ precursor — but unlike NMN, it is approved as a Novel Food in the EU. Human studies confirm NAD+ elevation; clinical benefits remain unclear.
    evidenceSummary: >-
      Multiple human RCTs show that NR reliably raises blood NAD+ levels. Clinically relevant outcomes (energy, muscle function, cognition) have not been consistently demonstrated in large trials. Evidence is comparable to NMN.
    body: |
      ## NR vs. NMN — What Is the Difference?
      
      Both raise NAD+ levels in the body via different biochemical pathways. The most important practical distinction: **NR is approved as a Novel Food in the EU**, while NMN is still awaiting authorisation and occupies a grey zone.
      
      | | NR | NMN |
      |---|---|---|
      | EU Novel Food | Yes (since 2021) | No (application pending) |
      | EFSA Health Claims | No | No |
      | Human studies | ~10 RCTs | ~8 RCTs |
      | Brand recognition | Tru Niagen, ChromaDex | Broad market |
      | Price per day | ~€1.20–1.80 | ~€0.80–1.50 |
      
      ## What Do the Studies Show?
      
      ### Clearly established
      - NR reliably raises blood NAD+ levels — this is well replicated
      - Orally bioavailable and safe at doses up to 1,000 mg/day
      
      ### Not established
      - Improvement in insulin sensitivity: no effect in the largest randomised trial
      - Blood pressure reduction: no consistent effect
      - Cognitive improvement: no adequately powered human studies
      - Life extension: not studied
      
      ## The NAD+ Problem
      
      Both NR and NMN face the same fundamental limitation: raising blood NAD+ is not a clinical endpoint. Whether higher blood NAD+ levels actually mean cells have more NAD+, and whether this is clinically meaningful, is still being investigated.
      
      ## Is NR Better Than NMN?
      
      From a regulatory standpoint (EU approval): yes. From an evidence standpoint, both are comparably weak on clinical endpoints. NR has the advantage that ChromaDex (maker of Tru Niagen) runs an extensive clinical programme and communicates transparently about study results.
      
      ## Safety
      
      Well tolerated up to 1,000 mg/day in studies. No serious adverse effects known. Flushing (skin redness) occurs less often than with classic niacin.

