    body: |
      ## Was ist AKG?
      
      Alpha-Ketoglutarat ist ein Zwischenprodukt des **Citratzyklus** und damit zentral im Energiestoffwechsel.
      
      ## Warum ist es in der Bubble für gesundes Altern so beliebt?
      
      Vor allem wegen:
      - Tierstudien
      - theoretischer Effekte auf Stoffwechsel und Epigenetik
      - Vermarktung von **Ca-AKG** als Alterungsforschung-Tool
      
      ## Was fehlt?
      
      - gute große Humanstudien
      - belastbare Endpunkte
      - klare klinische Relevanz für gesunde Menschen
      
      ## Fazit
      
      AKG ist **wissenschaftlich interessant**, aber aktuell eher ein Zukunftskandidat als ein sauber validierter Wirkstoff im Kontext gesunden Alterns.

  en:
    summary: >-
      AKG is popular in healthy aging circles, especially as Ca-AKG, but human evidence for anti-aging effects remains extremely limited.
    evidenceSummary: >-
      AKG is a central metabolite in energy production and shows promise in animal models. However, for healthy aging claims in humans, evidence is weak. Most longevity promises rest on animal data, mechanistic plausibility, and small or non-robust human studies.
    body: |
      ## What is alpha-ketoglutarate (AKG)?

      Alpha-ketoglutarate (AKG) is an intermediate in the citric acid cycle, a fundamental metabolic pathway that generates energy (ATP) in nearly every cell. It sits at a crossroads: it's involved in mitochondrial energy production, protein synthesis, epigenetic regulation, and immune signaling. In cells, AKG exists as a free anion; in supplements, it is typically bound to calcium (Ca-AKG) for stability and absorption.

      ## Why is it so popular in healthy aging circles?

      AKG has become a darling of longevity advocates for several reasons:

      1. **Animal lifespan data:** Notably, Chin et al. (2014) showed that AKG supplementation extended lifespan in C. elegans and mice by 10–25%, with improvements in multiple aging markers.
      2. **Mechanistic plausibility:** AKG is known to regulate epigenetic processes, DNA methylation, and immune tolerance. These mechanisms are theoretically relevant to aging.
      3. **Commercial momentum:** Companies like Elysium Health have marketed Ca-AKG prominently as a longevity tool, leveraging the lifespan data.

      ## What does the human evidence actually show?

      ### The gap between animals and humans
      - The lifespan extension data come entirely from animals (C. elegans, mice, and insects). There are **no human lifespan studies**.
      - Even the mechanistic markers (immune function, DNA damage, aging hallmarks) have been minimally studied in humans.
      - A single small human pilot study (n~20) looked at frailty markers in older adults; results were mixed and inconclusive.

      ### Metabolic plausibility, not proof
      - AKG is biochemically crucial, but this does not guarantee that *supplemental* AKG provides a benefit over baseline.
      - Endogenous AKG levels are typically tightly controlled; whether oral supplementation meaningfully raises intracellular AKG in tissues beyond the GI tract remains unclear.
      - Bioavailability studies are limited; most oral AKG is likely metabolized by the GI epithelium or used locally, not absorbed intact into systemic circulation.

      > **Critical limitation:** AKG's role as an epigenetic regulator and immune modulator is fascinating in theory, but evidence that supplementation rewrites epigenetics or halts aging in humans does not exist.

      ## Dosage and formulation

      - **Typical supplement dose:** 1–2 g/day of Ca-AKG (equivalent to ~500–1000 mg of AKG anion).
      - Taken with meals for absorption.
      - Most studies use similar doses, but there are no dose-response studies in humans.

      ## Safety profile

      Ca-AKG appears **well-tolerated** in short-term use (weeks to months):
      - Mild GI effects at higher doses.
      - No major safety signals in animal toxicity studies at reasonable multiples of human doses.
      - Long-term human safety data (&gt;6 months) are absent.

      ## Regulatory status

      - AKG has no approved EFSA health claims for aging, longevity, or metabolic health.
      - Marketing claims linking AKG to "cellular rejuvenation," "aging reversal," or "longevity" are not evidence-based and not permitted under EU law.

      ## Bottom line

      AKG is a biochemically fascinating molecule with intriguing animal lifespan data. However, it represents the **classic gap between mechanistic plausibility and clinical reality**. The human evidence for longevity or healthy aging is virtually absent. If you're considering AKG, ask yourself: Am I basing this decision on mouse lifespan studies, or on human health outcomes? The honest answer matters. Until well-designed human trials emerge, AKG remains a speculative longevity tool rather than a validated intervention.



