locales:
  de:
    summary: >-
      Quercetin ist ein Pflanzenstoff mit antioxidativer Wirkung und gilt als potenzielles Senolytikum. Die Senolytik-Evidenz stammt fast ausschließlich aus Tier- und In-vitro-Studien.
    evidenceSummary: >-
      Quercetin hat mäßige Human-Evidenz für einige Biomarker-Effekte (Blutdruck, Entzündungsmarker), aber die Effektgrößen sind gering und Studien oft klein. Als Senolytikum (Entfernung seneszenter Zellen) existiert nur ein winziges Pilot-Set an Humanstudien — ausschließlich mit Quercetin + Dasatinib, nicht mit Quercetin allein. Schlechte Bioverfügbarkeit bleibt das zentrale Problem.
    body: |
      ## Was ist Quercetin?
      
      Quercetin ist ein **Flavonoid** — ein gelber Pflanzenstoff (lat. *quercus* = Eiche), der natürlich in Zwiebeln (~20–50 mg/100 g), Kapern (~180 mg/100 g), Äpfeln, Weintrauben und grünem Tee vorkommt. Die durchschnittliche tägliche Aufnahme über die Ernährung liegt bei etwa **10–25 mg/Tag** bei gemischter westlicher Kost.
      
      Als Supplement wird Quercetin in Dosierungen von 250–1000 mg/Tag vermarktet — also dem 10- bis 40-fachen der Nahrungsmenge. Diese Skalierung ist entscheidend für das Verständnis der Evidenzlage.
      
      ## Das zentrale Problem: Bioverfügbarkeit
      
      **Oral eingenommenes Quercetin wird schlecht und variabel absorbiert.** Die systemische Bioverfügbarkeit variiert in Studien stark — Schätzungen reichen von unter 1 % bis etwa 17 %, abhängig von Formulierung, Lebensmittelmatrix und individuellen Faktoren (Darmbiom, Genetik).
      
      Quercetin wird im Darm und in der Leber intensiv metabolisiert. Was im Blut messbar ist, sind größtenteils **Metaboliten** (Quercetin-Glucuronide, Sulfate), deren biologische Aktivität von der der Ausgangssubstanz abweichen kann.
      
      Neuere Formulierungen versuchen, dieses Problem zu umgehen:
      - **Quercefit / Phytosome (Quercetin-Phospholipid-Komplex):** In einer kleinen Studie ~20-fach bessere Absorption als Standardquercetin.
      - **Quercetin-Dihydrat:** Leicht bessere Löslichkeit als Aglycone-Form.
      - Ob verbesserte Bioverfügbarkeit klinisch relevante Unterschiede macht, ist nicht gut untersucht.
      
      ## Quercetin als Antioxidans — was sagen die Humanstudien?
      
      In Zellkulturen und Tiermodellen zeigt Quercetin robuste antioxidative und entzündungshemmende Effekte. In Humanstudien sind die Befunde deutlich bescheidener:
      
      **Blutdruck:** Die bislang größte Meta-Analyse (7 RCTs, n=587) zeigte eine durchschnittliche Reduktion des systolischen Blutdrucks um **~3,09 mmHg** bei Dosen ≥500 mg/Tag und einer Mindestdauer von 8 Wochen. Dieser Effekt ist statistisch signifikant, aber klinisch klein (zum Vergleich: Lebensstiländerungen können 5–10 mmHg erreichen).
      
      **Entzündungsmarker:** Einige RCTs zeigen leichte Reduktionen bei CRP und Interleukin-6. Die Effekte sind inkonsistent zwischen Studien und meist gering.
      
      **Oxidatives LDL:** Einzelne Studien (z. B. Egert 2009) zeigen Reduktionen bei oxidiertem LDL bei hochrisikoreichen Personen. Replikationen fehlen weitgehend.
      
      ## Quercetin als Senolytikum — Hype vs. Realität
      
      ### Was ist Senolytik?
      
      Seneszente ("Zombie") Zellen teilen sich nicht mehr, sterben aber auch nicht ab. Sie senden entzündliche SASP-Signale (Senescence-Associated Secretory Phenotype) aus und akkumulieren mit dem Alter in verschiedenen Geweben. Die Idee: Gezielte Entfernung dieser Zellen könnte Alterserscheinungen verlangsamen.
      
      In Mausmodellen sind die Daten eindrucksvoll: Senolytische Interventionen verlängerten funktionelle Gesundheitsspanne, verbesserten Organfunktion und reduzierten altersassoziierte Pathologien.
      
      ### Das Dasatinib-Problem
      
      Die bekannten Senolytik-Studien am Menschen kommen ausnahmslos vom Mayo-Klinik-Team und verwenden **Dasatinib + Quercetin (D+Q)**. Dasatinib ist ein **Krebsmedikament** (BCR-ABL-Inhibitor, First-Line-Therapie bei CML) und ohne Verschreibung nicht verfügbar.
      
      Die Humanstudien mit D+Q haben ausserdem winzige Stichproben: n=9 in der ersten Pilotstudie (Xu 2018), n=14 in der IPF-Studie (Justice 2019). Eine Kontrollgruppe ohne Dasatinib fehlte in beiden. **Ob Quercetin allein senolytische Wirkung beim Menschen hat, ist durch keine Studie belegt.**
      
      ### Was fehlt
      
      - Keine Phase-2/3-RCTs mit Quercetin allein und senolytischen Endpunkten
      - Keine Langzeitstudien (>3 Monate) zu seneszenten Zellmarkern unter Quercetin-Supplementierung
      - Kein Wirkungsnachweis bei gesunden, nicht-kranken Menschen
      
      ## Dosierung und verfügbare Formulierungen
      
      - **Antioxidativer/kardiovaskulärer Kontext (in Studien):** 150–1000 mg/Tag, meist als Quercetin-Dihydrat oder -Aglycone
      - **Senolytik-Protokoll (D+Q, nur in Studien und unter ärztlicher Aufsicht):** 3 Tage, dann 3 Wochen Pause — kein etabliertes OTC-Protokoll
      - **Quercefit-Phytosome:** 250 mg werden als äquivalent zu höheren Standard-Quercetin-Dosen angegeben (noch wenig klinische Bestätigung)
      
      Einnahme mit einer fetthaltigen Mahlzeit verbessert die Absorption geringfügig.
      
      ## Sicherheit und Wechselwirkungen
      
      Quercetin als Nahrungsbestandteil ist unbedenklich. Als hochdosiertes Supplement (500–1000 mg/Tag) gibt es keine alarmierten Sicherheitssignale, aber die Langzeitsicherheitsdaten sind dünn.
      
      Mögliche Wechselwirkungen:
      - **CYP3A4-Hemmung:** Quercetin hemmt in vitro Cytochrom-P450-Enzyme, was die Spiegel anderer Medikamente beeinflussen könnte. Klinische Relevanz bei üblichen Dosen unklar.
      - **Antikoagulanzien (Warfarin):** Theoretisch additive Effekte möglich; Vorsicht geboten.
      - **Immunsuppressiva:** Interaktionen mit Cyclosporin und ähnlichen Substanzen nicht ausgeschlossen.
      
      ## EFSA- und regulatorischer Status
      
      Die EFSA hat in einem wissenschaftlichen Gutachten (EFSA Journal 2011) **keine Health Claims für Quercetin zugelassen**. Das offizielle EFSA-Gutachten zu Quercetin-Wirkungsansprüchen ist unter [efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2011.2067](https://efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2011.2067) einsehbar. Marketingaussagen zu Senolytik, Longevity oder Zellschutz sind ohne Zulassungsbasis in der EU nicht erlaubt.
      
      Als Lebensmittelbestandteil gilt Quercetin als unbedenklich; als hochdosiertes Supplement ist die regulatorische Einordnung in der EU uneinheitlich (kein Novel Food, aber EFSA hat keine Wirkungsansprüche positiv bewertet).
      
      ## Ehrliche Limitierungen
      
      - Senolytische Wirkung in Humanstudien ausschließlich für D+Q-Kombination gezeigt, nicht für Quercetin allein.
      - Alle D+Q-Humanstudien sind klein (n &lt; 15), ohne Kontrollgruppe und mit sehr kurzer Laufzeit.
      - Antioxidative Effekte in Humanstudien sind real, aber klein und klinisch wenig spektakulär.
      - Schlechte Bioverfügbarkeit macht Dosierungsaussagen unsicher; verbesserte Formulierungen fehlt klinische Validierung.
      - Langzeitsicherheit bei 500–1000 mg/Tag ist nicht gut dokumentiert.
      
      ## Fazit
      
      Als **Lebensmittelbestandteil** ist Quercetin unbedenklich und wahrscheinlich nützlich im Kontext einer Ernährung mit viel Obst und Gemüse. Als **hochdosiertes Longevity-Supplement** rechtfertigt die vorhandene Evidenz den Hype nicht. Wer an Senolytika interessiert ist, sollte die laufenden klinischen Studien (ClinicalTrials.gov) abwarten — das Feld entwickelt sich, aber die Extrapolation von Mäusen auf gesunde Menschen über freiverkäufliche Kapseln ist derzeit nicht wissenschaftlich fundiert.

  en:
    summary: >-
      Quercetin is a plant flavonoid with antioxidant and senolytic potential. Human senolytic evidence is limited to tiny pilot studies using Dasatinib+Quercetin combined — not quercetin alone.
    evidenceSummary: >-
      Quercetin has moderate human evidence for modest biomarker effects (blood pressure ~3 mmHg, inflammatory markers), but effect sizes are small and studies often underpowered. As a senolytic, only a handful of tiny pilot studies exist — all using Quercetin + Dasatinib, never quercetin alone. Poor bioavailability remains the central limitation.
    body: |
      ## What Is Quercetin?

      Quercetin is a **flavonoid** — a yellow plant pigment (from Latin *quercus*, oak) found naturally in onions (~20–50 mg/100 g), capers (~180 mg/100 g), apples, grapes, and green tea. Average daily dietary intake is approximately **10–25 mg/day** on a typical Western diet.

      As a supplement, quercetin is marketed at doses of 250–1000 mg/day — ten to forty times the amount obtained from food. This scaling is critical to understanding the evidence.

      ## The Central Problem: Bioavailability

      **Orally administered quercetin is poorly and variably absorbed.** Systemic bioavailability varies widely across studies — estimates range from under 1% to approximately 17%, depending on formulation, food matrix, and individual factors (gut microbiome, genetics).

      Quercetin undergoes extensive first-pass metabolism in the intestine and liver. What is detectable in the bloodstream consists largely of **metabolites** (quercetin glucuronides, sulfates), whose biological activity may differ substantially from the parent compound.

      Newer formulations attempt to address this:
      - **Quercefit / Phytosome (quercetin-phospholipid complex):** One small study reported ~20-fold higher absorption compared to standard quercetin.
      - **Quercetin dihydrate:** Slightly better solubility than the aglycone form.
      - Whether improved bioavailability translates into clinically meaningful differences remains inadequately studied.

      ## Quercetin as an Antioxidant — What Do Human Studies Show?

      In cell cultures and animal models, quercetin demonstrates robust antioxidant and anti-inflammatory effects. In human studies, findings are considerably more modest.

      **Blood pressure:** The largest meta-analysis to date (Serban et al., 2016 — 7 RCTs, n=587) found an average systolic blood pressure reduction of **~3.09 mmHg** at doses ≥500 mg/day and treatment durations of at least 8 weeks. This effect is statistically significant but clinically small — for reference, regular aerobic exercise can reduce systolic BP by 5–10 mmHg.

      **Inflammatory markers:** Several RCTs report modest reductions in CRP and interleukin-6. Effects are inconsistent across studies and generally small in magnitude.

      **Oxidized LDL:** Egert et al. (2009), a double-blind crossover RCT (n=93, overweight high-risk participants), showed reductions in oxidized LDL at 150 mg/day over 6 weeks. Independent replications are sparse.

      **Allergy / antihistamine effects:** Quercetin inhibits mast cell degranulation in vitro and is frequently marketed for allergy relief. Human RCT evidence for this indication is essentially absent. Current data do not support its use as an antihistamine substitute.

      ## Quercetin as a Senolytic — Hype vs. Reality

      ### What Is a Senolytic?

      Senescent ("zombie") cells stop dividing but fail to die. They secrete pro-inflammatory signals — the Senescence-Associated Secretory Phenotype (SASP) — and accumulate in tissues with age. The hypothesis: selectively eliminating these cells could slow age-related deterioration.

      In mouse models, the results are striking. Senolytic interventions extended functional healthspan, improved organ function, and reduced age-related pathologies. These findings drove intense interest in translating senolytics to humans.

      ### The Dasatinib Problem

      All published human senolytic studies come from the Mayo Clinic group and use **Dasatinib + Quercetin (D+Q)**. Dasatinib is a **prescription cancer drug** (BCR-ABL inhibitor, first-line therapy for chronic myeloid leukemia) — not available over the counter.

      The human D+Q studies are tiny: n=9 in the first pilot (Xu et al., 2018), targeting individuals with diabetic kidney disease; n=14 in an idiopathic pulmonary fibrosis (IPF) pilot (Justice et al., 2019), where improvements in physical performance and gait speed were observed after 3 weeks of intermittent dosing. Neither study included a quercetin-only arm or a placebo control. A 2020 narrative review by Kirkland &amp; Tchkonia summarized this nascent field honestly: animal model evidence is compelling, human data are at an earliest exploratory stage, and all positive signals involve the D+Q combination.

      **No published human study has demonstrated senolytic activity for quercetin alone.**

      ### What Is Missing

      - No Phase 2/3 RCTs using quercetin alone with senescent cell endpoints
      - No long-term studies (&gt;3 months) tracking senescent cell markers under quercetin supplementation
      - No evidence of efficacy in healthy, non-diseased populations

      ## Dosing and Available Formulations

      - **Antioxidant / cardiovascular context (as studied):** 150–1000 mg/day, typically as quercetin dihydrate or aglycone. Significant blood pressure effects required ≥500 mg/day for ≥8 weeks.
      - **Senolytic protocol (D+Q, only in supervised clinical studies):** Intermittent dosing — 3 consecutive days on, then 3 weeks off. No established OTC protocol exists, and Dasatinib requires a prescription.
      - **Quercefit phytosome:** 250 mg claimed equivalent to higher standard quercetin doses; clinical validation rests on a single small pharmacokinetic study.

      Taking quercetin with a fatty meal modestly improves absorption.

      ## Safety and Drug Interactions

      Quercetin from food is safe. As a high-dose supplement (500–1000 mg/day), no serious safety signals have emerged from short-term trials, but long-term safety data are limited.

      Key interactions to consider:
      - **CYP3A4 inhibition:** Quercetin inhibits cytochrome P450 enzymes in vitro, potentially raising plasma levels of co-administered medications. Clinical relevance at typical supplement doses is unclear but warrants caution with narrow-therapeutic-index drugs.
      - **Anticoagulants (warfarin):** Additive effects are theoretically possible; caution is warranted.
      - **Immunosuppressants:** Interactions with cyclosporin and similar agents cannot be excluded.

      ## EFSA and Regulatory Status

      The EFSA evaluated health claims for quercetin in 2011 (EFSA Journal 2011, doi:10.2903/j.efsa.2011.2067) and **rejected all submitted claims**. No health claims for quercetin are authorized in the EU. Marketing statements referencing senolytics, longevity, or cellular protection are without regulatory basis.

      As a food constituent, quercetin is not classified as a Novel Food in the EU. However, no EFSA-authorized health claim exists, and high-dose quercetin supplements occupy a regulatory grey zone across EU member states.

      ## Honest Limitations

      - Senolytic activity in humans has been shown only for the D+Q combination, never for quercetin alone.
      - All D+Q human studies are tiny (n &lt; 15), lack control groups, and have very short follow-up periods.
      - Antioxidant and blood pressure effects in humans are real but small; clinical significance is modest at best.
      - Poor bioavailability makes dose-response relationships uncertain; improved formulations such as Quercefit lack robust clinical validation.
      - Long-term safety data at 500–1000 mg/day are limited.

      ## Bottom Line

      As a **dietary component**, quercetin is safe and likely beneficial within a diet rich in fruits and vegetables. As a **high-dose longevity supplement**, the available evidence does not justify the hype. Those interested in senolytics should follow ongoing clinical trials (ClinicalTrials.gov) — the field is advancing, but extrapolating from mouse data to healthy humans via over-the-counter capsules is not scientifically defensible at this time.

