locales:
  de:
    summary: >-
      Alpha-GPC ist eine cholinerge Verbindung mit guter Gehirn-Plausibilität. Die Daten für Fokus und Kognition sind interessant, aber nicht überragend robust.
    evidenceSummary: >-
      Alpha-GPC ist eine Cholinform mit guter Bioverfügbarkeit und plausibler Wirkung auf Acetylcholin. Es gibt einige klinische Daten zu Kognition und einzelne Daten zu Leistungsfähigkeit, aber die Evidenz ist insgesamt moderat und nicht frei von Fragezeichen.
    body: |
      ## Was ist Alpha-GPC?
      
      Alpha-GPC ist eine **hoch bioverfügbare Cholinform**, die oft als Nootropic vermarktet wird.
      
      ## Warum ist es beliebt?
      
      Weil es:
      - Acetylcholin unterstützen kann
      - fürs Gehirn plausibel ist
      - oft besser „brainy“ klingt als normales Cholin
      
      ## Reality Check
      
      Die Daten sind **interessant, aber nicht bombensicher**. Das ist eher ein Stoff mit Substanz als reiner Quatsch – aber auch kein garantierter Fokus-Button.
      
      ## Fazit
      
      Alpha-GPC ist ein **brauchbarer Kandidat im Nootropics-Bereich**, aber definitiv kein Selbstläufer.

