      ## Was ist TMG?
      
      TMG, also **Trimethylglycin**, auch Betain genannt, ist ein Stoff, der im Körper **Methylgruppen** bereitstellt. Dadurch ist er besonders im Zusammenhang mit **Homocystein**, **Leberstoffwechsel** und **Methylierung** interessant.
      
      ## Was ist vergleichsweise gut untersucht?
      
      - Kann Homocystein senken
      - Biochemisch relevanter Methylgruppendonor
      - Interessant in bestimmten Stoffwechsel-Kontexten
      
      ## Was ist nicht vergleichsweise gut untersucht?
      
      - Klare gesundes-Alten-Effekte
      - Allgemeiner Zusatznutzen für alle gesunden Erwachsenen
      - Breiter Pflichtstoff im Supplement-Stack
      
      ## Fazit
      
      TMG ist **biochemisch sinnvoll, aber nicht automatisch klinisch spektakulär**. Eher ein gezielter Stoff als ein universeller Must-have-Wirkstoff.

  en:
    summary: >-
      TMG provides methyl groups and correlates with lower homocysteine. Biochemically plausible but as a healthy aging supplement, it's more niche than essential.
    evidenceSummary: >-
      TMG as a methyl-group donor is biochemically well understood and correlates with lower homocysteine. Whether this translates into meaningful health or healthy aging benefits in healthy adults remains much less clear. Human evidence is limited and context-dependent.
    body: |
      ## What is TMG?

      TMG, or **trimethylglycin** (also known as betaine), is an organic compound that exists naturally in many plants and animals, including beets, spinach, and cereals. It functions primarily as a **methyl-group donor** in metabolic pathways and as an **osmolyte**—a molecule that helps regulate cellular water balance and stress responses. In supplement form, TMG is typically derived from sugar beets and used to modulate homocysteine metabolism, support cellular methylation, and potentially enhance athletic performance.

      ## Mechanisms: How Does TMG Work?

      TMG operates through two main metabolic roles:

      **1. Methylation pathway**

      TMG donates methyl groups (CH₃) to homocysteine, converting it to methionine via the enzyme betaine:homocysteine methyltransferase (BHMT). This is a well-established biochemical pathway confirmed in vitro and in animal models. Methylation is central to DNA synthesis, gene expression, neurotransmitter production, and immune function, which is why researchers hypothesize TMG could support these processes.

      **2. Osmolytic function**

      As an osmolyte, TMG accumulates in cells under stress (heat, dehydration, hyperosmolarity) and helps maintain cell volume and protein stability. This mechanism is robust in cellular and animal models, which is why some sports supplement formulators include TMG to support muscle endurance and hydration status.

      ## What the Evidence Actually Shows

      **Homocysteine reduction (moderate evidence)**

      The most consistent finding is that TMG supplementation lowers plasma homocysteine in healthy adults. Key studies:

      - **Olthof et al. (2003)**: In a double-blind, crossover trial with 60 healthy participants, 6 g/day TMG for 12 weeks reduced fasting homocysteine by approximately 10–13% compared to placebo. Effect size was modest but reproducible across multiple dose arms.

      - **Craig (2004) review**: Concluded TMG reliably reduces homocysteine in vitro and in animal models, with human data showing 10–20% reductions depending on baseline homocysteine and dose.

      Importantly, **lower homocysteine does not automatically mean better health outcomes**. Homocysteine is an independent cardiovascular risk marker in observational studies, but clinical trials of homocysteine-lowering interventions (including B-vitamins and folate) have largely *failed* to reduce cardiovascular events (VISP trial, HOPE-2 substudy, NORVIT). This is a critical gap: TMG lowers the biomarker, but we lack evidence that this translates to disease prevention.

      **Athletic performance (weak-to-mixed evidence)**

      TMG is sometimes marketed to athletes as an ergogenic aid. The proposed mechanism: osmolytic effect → better muscle hydration → improved endurance and recovery. However:

      - Most studies are small, short-term, and use low doses (2–3 g/day for 7–14 days).
      - Results are inconsistent: some show marginal improvements in time-to-fatigue or power output; others show no effect.
      - No large, well-powered RCTs exist comparing TMG to placebo in trained athletes over ≥8 weeks.
      - Practical significance of any effects (if real) is unclear—typically in the 2–5% range, if detected at all.

      **Liver function (limited evidence)**

      TMG is claimed to support liver health and methylation-dependent detoxification. However:

      - Evidence is primarily mechanistic (TMG is a methyl donor, the liver uses methylation).
      - Human trials specifically testing TMG on liver function, fatty liver, or transaminase levels are sparse.
      - One small study in animals with induced liver damage showed some protective effect, but clinical relevance is unclear.

      **Cardiovascular outcomes (no evidence)**

      Despite reducing homocysteine, no RCTs have shown that TMG prevents cardiovascular disease, stroke, or mortality in humans. This is the crucial missing piece: biochemical plausibility ≠ clinical benefit.

      ## Regulatory Status (EU/EFSA)

      In the European Union, betaine/TMG has **no approved health claims** for general population use. EFSA has only permitted narrow, conditional claims for homocysteine reduction under specific, limited conditions. Broad claims about "healthy aging," cardiovascular protection, or general wellness are not permitted. This reflects the gap between biochemical mechanism and proven clinical outcomes.

      ## Safety Profile

      TMG is generally well-tolerated:

      - No serious adverse events reported in published trials at doses up to 15 g/day.
      - Mild GI upset (nausea, bloating) occasionally reported at high doses.
      - No significant drug interactions documented.
      - Classified as **"likely safe"** by natural product safety databases.

      However, long-term safety data (beyond 12 weeks) is limited, and effects in populations with kidney disease or specific genetic polymorphisms in folate/B₁₂ metabolism remain understudied.

      ## The Bottom Line

      TMG is a biochemically rational compound with clear mechanistic support for reducing homocysteine and modulating methylation. However, the evidence-to-benefit pipeline breaks down at clinical outcomes:

      - **Evidence for mechanism:** Strong
      - **Evidence for biomarker reduction:** Moderate
      - **Evidence for disease prevention or health improvements in healthy adults:** Weak-to-absent

      For most people, optimizing homocysteine through diet (folate, B₆, B₁₂) and lifestyle is better supported than supplemental TMG. TMG might be considered in specific contexts—e.g., for athletes exploring osmolytic strategies, or in patients with genetic homocysteine metabolism disorders—but it is not a cornerstone longevity supplement and should not be prioritized over proven interventions like exercise, sleep, and metabolic health.

