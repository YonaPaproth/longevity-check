locales:
  de:
    summary: >-
      Piperin ist vor allem ein Bioverfügbarkeits-Booster. Praktisch nützlich, aber nicht harmlos, weil genau diese Wirkung auch Interaktionen verstärken kann.
    evidenceSummary: >-
      Piperin ist gut bekannt dafür, die Aufnahme bestimmter Stoffe zu mit höheren Werten in Verbindung bringen, etwa Curcumin. Genau daraus ergeben sich aber auch Interaktionsfragen mit Medikamenten und anderen Wirkstoffen. Als eigenständiger gesundes Altern-Wirkstoff ist Piperin wenig überzeugend.
    body: |
      ## Was ist Piperin?
      
      Piperin ist der scharfe Hauptstoff aus schwarzem Pfeffer und in Supplements vor allem als **Absorptions-Booster** bekannt.
      
      ## Der wichtige Punkt
      
      Genau das, was nützlich ist, kann auch problematisch sein:
      - bessere Aufnahme erwünschter Stoffe
      - aber potenziell auch mehr Interaktionen
      
      ## Fazit
      
      Piperin ist **praktisch, aber nicht banal**.

