    evidenceSummary: >-
      Pantothensäure ist ein essenzieller Nährstoff und Bestandteil von Coenzym A. Ihre physiologische Rolle ist vergleichsweise gut untersucht, klinische Relevanz als Supplement besteht aber vor allem bei Mangel oder sehr speziellen Situationen. Für allgemeine Gesundheits- oder gesundes Altern-Vorteile fehlen belastbare Daten.
    body: |
      ## Was ist Vitamin B5?
      
      Vitamin B5, also **Pantothensäure**, wird für die Bildung von **Coenzym A** gebraucht. Coenzym A ist wiederum zentral für den Stoffwechsel von Fettsäuren, Kohlenhydraten und Aminosäuren.
      
      Das Vitamin ist also zweifellos wichtig – aber gerade deshalb auch sehr breit in Lebensmitteln enthalten.
      
      ## Was ist vergleichsweise gut untersucht?
      
      - Essenzieller Beitrag zum Energiestoffwechsel
      - Notwendig für Synthese und Abbau vieler Biomoleküle
      - Relevanz bei echter Unterversorgung
      
      ## Was ist nicht vergleichsweise gut untersucht?
      
      - Mehr Energie durch hohe B5-Dosen bei normaler Versorgung
      - Anti-Stress- oder gesundes-Alten-Effekte
      - Relevante Zusatznutzen für die meisten gesunden Erwachsenen
      
      ## Sicherheitsprofil
      
      Pantothensäure gilt in üblichen Dosierungen als **sehr sicher**. Sehr hohe Dosen können Magen-Darm-Beschwerden verursachen.
      
      ## Fazit
      
      Vitamin B5 ist ein **klassischer Basisnährstoff**: biologisch wichtig, aber als Einzel-Supplement oft nicht besonders spannend – außer es gibt einen konkreten Grund dafür.

  en:
    summary: >-
      Vitamin B5 is essential for CoA and energy metabolism. Deficiency is rare—extra supplements bring little with adequate intake.
    evidenceSummary: >-
      Pantothenic acid is an essential nutrient and component of CoA. Its physiological role is comparatively well established, though clinical relevance as a supplement exists mainly in cases of deficiency or special circumstances. For general health or healthy aging benefits, robust evidence is lacking.
    body: |
      ## What is Vitamin B5?

      Vitamin B5, also known as **pantothenic acid**, is a water-soluble B-complex vitamin that plays a fundamental role in cellular metabolism. Its primary function is serving as a precursor for **Coenzyme A (CoA)**, one of the most important molecules in human biochemistry. CoA is essential for the metabolism of fatty acids, carbohydrates, amino acids, and the synthesis of cholesterol, steroid hormones, and other vital compounds. Without adequate pantothenic acid, your cells simply cannot produce sufficient CoA, and metabolic processes grind to a halt.

      The vitamin is also involved in the synthesis of acetylcholine, a neurotransmitter critical for nerve function and cognitive performance, and it plays a role in the regulation of the stress response through its involvement in steroid hormone synthesis. Pantothenic acid is found widely in food sources—the name itself derives from the Greek word "pantothen," meaning "from everywhere." Egg yolks, mushrooms, avocados, chicken, beef, and whole grains are particularly rich sources, which is why genuine pantothenic acid deficiency is extraordinarily rare in populations with adequate access to diverse foods.

      ## What Is Comparatively Well Established?

      The biochemical mechanisms of pantothenic acid are well understood:

      - **Essential CoA precursor**: Pantothenic acid is indispensable for the synthesis of CoA, and deficiency would impair virtually every major metabolic pathway. This is settled biochemistry.
      - **Energy metabolism**: Its role in fatty acid oxidation and the citric acid cycle is fundamental and uncontroversial. Without adequate B5, ATP production is compromised.
      - **Hormone and neurotransmitter synthesis**: The vitamin is necessary for the synthesis of steroid hormones (including cortisol), vitamin D metabolism, and acetylcholine production.
      - **Deficiency signs**: While rare, true pantothenic acid deficiency causes neurological and metabolic symptoms, which demonstrates its physiological importance.
      - **Typical requirements**: The recommended dietary allowance (RDA) in most countries is 5 mg/day for adults, a threshold easily met through ordinary food intake.

      These points are not subjects of debate—they are established biochemistry confirmed across decades of research.

      ## What Is Not Comparatively Well Studied?

      Despite its biochemical importance, several claims about pantothenic acid supplementation lack solid evidence:

      - **Supraphysiological energy**: There is no robust evidence that doses above the RDA boost energy production in people with normal B5 status. The biochemical argument sounds plausible—if CoA is important, more B5 should help—but this reasoning confuses physiological necessity with supplementation efficacy.
      - **Stress resilience**: While pantothenic acid is involved in cortisol synthesis, studies on B5 supplementation and stress management in healthy individuals are sparse and of modest quality. A few small trials have examined this in athletes or students, but results are inconsistent and effect sizes are small.
      - **Skin health and cosmetic benefits**: Claims about pantothenic acid improving acne or skin healing rest mainly on case reports and mechanistic reasoning rather than well-designed clinical trials.
      - **Athletic performance**: Despite its role in energy metabolism, direct evidence that B5 supplementation improves exercise performance in adequately nourished athletes is limited.
      - **Cognitive enhancement**: Although acetylcholine is important for cognition, there is no evidence that B5 supplementation improves memory, focus, or processing speed in people with normal B5 intake.
      - **Longevity and healthy aging**: No human studies support the use of pantothenic acid supplementation for extending lifespan or improving age-related outcomes in the general population.

      In essence, pantothenic acid is unquestionably important for normal function, but evidence that supplementation provides additional benefit beyond achieving adequate intake is thin.

      ## Safety and Tolerability

      Pantothenic acid has an excellent safety record. The vitamin is water-soluble, meaning excess amounts are not stored in body tissues and are excreted through urine. No upper limit (UL) has been established by regulatory agencies, because toxicity from pantothenic acid is essentially unknown.

      In clinical practice, doses range from 5 mg (the RDA) to several grams per day with no serious adverse effects reported. High doses—typically above 2–3 grams daily—may occasionally cause mild gastrointestinal symptoms such as nausea, diarrhea, or abdominal discomfort, but these are uncommon and reversible upon dose reduction. People with kidney disease should consult with their healthcare provider, though pantothenic acid is not considered a primary concern in renal management.

      The EFSA has approved health claims for pantothenic acid's role in normal energy metabolism and mental performance, reinforcing its safety profile. The vitamin has been used safely in research settings at doses far exceeding typical supplemental amounts.

      ## Who Might Actually Need Supplementation?

      True pantothenic acid supplementation might be relevant in narrow circumstances:

      - **Malabsorption disorders**: Conditions like celiac disease, Crohn's disease, or pancreatic insufficiency can impair nutrient absorption.
      - **Severe malnutrition**: Individuals recovering from acute malnutrition or total parenteral nutrition (TPN).
      - **Certain medications**: Anticonvulsant drugs may increase pantothenic acid requirements.
      - **Documented deficiency**: Rare cases confirmed through clinical presentation and biochemical assessment.

      For the vast majority of people eating a reasonably varied diet, supplementation is unnecessary.

      ## The Bottom Line

      Vitamin B5 exemplifies a nutrient that is biochemically crucial but supplementally underwhelming. Pantothenic acid is genuinely essential—you cannot survive without it—but this biochemical importance does not translate into a reason to supplement beyond achieving adequate intake. The RDA of 5 mg is easily met through ordinary foods; many people unknowingly consume well above this amount daily.

      The approved EFSA claims speak to pantothenic acid's legitimate role in energy and cognitive function, but these claims describe what the nutrient does as part of normal metabolism, not what excess supplementation does beyond that baseline. For most healthy people, B5 supplementation is unlikely to deliver noticeable benefits and should not be a priority when resources could be directed toward nutrients or interventions with stronger evidence for additional benefit.

