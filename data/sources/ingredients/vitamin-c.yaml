    body: |
      ## Was ist Vitamin C?
      
      Vitamin C (Ascorbinsäure) ist ein wasserlösliches Vitamin, das Menschen – im Gegensatz zu den meisten Tieren – nicht selbst synthetisieren können. Es muss zwingend über die Nahrung aufgenommen werden.
      
      Es ist an einer Vielzahl physiologischer Prozesse beteiligt:
      - **Kollagensynthese**: Cofaktor für Hydroxylasen, die Kollagen quervernetzen – essenziell für Haut, Knochen, Gefäße und Wundheilung
      - **Immunfunktion**: Akkumuliert in weißen Blutkörperchen (bis 50× höhere Konzentration als im Plasma)
      - **Antioxidans**: Reagiert direkt mit freien Radikalen und trägt zur Regeneration von Vitamin E bei
      - **Eisenresorption**: Kann die Aufnahme von Non-Häm-Eisen aus pflanzlichen Quellen erhöhen
      
      ## Mangel in Deutschland: selten, aber existent
      
      Ein echter Vitamin-C-Mangel (Skorbut) ist in Deutschland extrem selten. Aber suboptimale Versorgung ist häufiger als gedacht – besonders bei Rauchern (erhöhter Verbrauch), älteren Menschen mit einseitiger Ernährung und bei sehr niedrigem Obst- und Gemüsekonsum.
      
      **Raucher** brauchen ~35 mg/Tag mehr als Nichtraucher – der Empfehlungswert liegt deshalb bei 135 mg/Tag für Raucher.
      
      ## Der Megadosen-Mythos
      
      Linus Pauling propagierte in den 1970ern Vitamin C in Gramm-Dosen gegen Erkältungen und Krebs. Die Forschung hat das nicht bestätigt:
      
      - Plasmasättigung tritt bereits bei ~200 mg/Tag auf
      - Dosen über 500 mg/Tag werden renal ausgeschieden ohne proportionalen Plasmaspiegelanstieg
      - Meta-Analysen zeigen keine Reduktion von Herzerkrankungen oder Krebsmortalität durch Hochdosierung
      - Erkältungsprophylaxe nur bei extremer körperlicher Belastung belegt
      
      > **Fazit:** 200–500 mg/Tag aus Supplements oder Nahrung ist optimal. Mehr ist nicht besser – und ab ~2 g/Tag mit Risiken verbunden.
      
      ## Was sagen die Studien wirklich?
      
      ### Klar belegt (EFSA-zugelassen)
      - Kollagenbildung für normale Funktion von Haut, Zähnen, Zahnfleisch, Knochen und Knorpel
      - Normale Immunfunktion
      - Schutz vor oxidativem Stress
      - Verbesserung der Eisenresorption aus pflanzlichen Quellen
      
      ### Vergleichsweise gut untersucht
      - Erkältungsdauer-Verkürzung bei regelmäßiger Einnahme (~8 %)
      - Verringerung von Erschöpfung (bei Mangel)
      
      ### Nicht belegt
      - Orale Hochdosis-Konzepte im Krebs-Kontext
      - Herzinfarktverhütung
      - Alterungsforschung-Wirkung über normalen Bedarf hinaus
      
      ## Ist Vitamin C sicher?
      
      Bei 200–1.000 mg/Tag: **wahrscheinlich sicher**. Ab 2 g/Tag: Osmotische Diarrhö möglich. Ab 6 g/Tag dauerhaft: erhöhtes Nierensteinrisiko (Oxalat-Steine) bei prädisponierten Personen. Nicht zusammen mit hohen Eisenpräparaten und Chemo- oder Strahlentherapie ohne Arzt.
      
      ## Nahrungsquellen
      
      Vitamin C ist in frischen Lebensmitteln reichlich vorhanden: Paprika (200 mg/100 g), Hagebutten (400–1.300 mg/100 g), Sanddorn, Brokkoli, Kiwi, Zitrusfrüchte. Wer täglich frisches Obst und Gemüse isst, ist gut versorgt und braucht kein Supplement.

  en:
    summary: >-
      Vitamin C is essential for collagen synthesis and other normal body functions, with approved EFSA claims. Megadoses show no clear benefit beyond adequate intake.
    evidenceSummary: >-
      Strong evidence base for essential functions: collagen synthesis, immune function, iron absorption, antioxidant defence. EFSA health claims approved. High-dose supplementation (>1 g/day) has no proven additional benefit in well-nourished individuals and carries risks.
    body: |
      ## What is vitamin C?

      Vitamin C (ascorbic acid) is a water-soluble vitamin that humans — unlike most animals — cannot synthesize. It must be obtained through diet.

      It is involved in numerous physiological processes:
      - **Collagen synthesis**: cofactor for hydroxylases that cross-link collagen — essential for skin, bones, blood vessels, and wound healing
      - **Immune function**: accumulates in white blood cells (up to 50× higher concentration than in plasma)
      - **Antioxidant**: directly scavenges free radicals and helps regenerate vitamin E
      - **Iron absorption**: enhances uptake of non-haem iron from plant sources

      ## Deficiency: rare but real

      True vitamin C deficiency (scurvy) is extremely rare in developed countries. But suboptimal status is more common than assumed — especially in smokers (increased turnover), older adults with limited diets, and people with very low fruit and vegetable intake.

      **Smokers** need ~35 mg/day more than non-smokers — the recommendation rises to 135 mg/day for smokers.

      ## The megadose myth

      Linus Pauling popularized gram-dose vitamin C against colds and cancer in the 1970s. Research has not confirmed this:

      - Plasma saturation occurs at ~200 mg/day
      - Doses above 500 mg/day are renally excreted without proportional increase in plasma levels
      - Meta-analyses show no reduction in cardiovascular disease or cancer mortality from high-dose supplementation
      - Cold prevention only demonstrated under extreme physical stress

      > **Bottom line:** 200–500 mg/day from supplements or food is optimal. More is not better — and above ~2 g/day comes with risks.

      ## What does the evidence actually show?

      ### Clearly established (EFSA-approved)
      - Collagen formation for normal function of skin, teeth, gums, bones, and cartilage
      - Normal immune function
      - Protection against oxidative stress
      - Improved iron absorption from plant sources

      ### Well studied
      - Cold duration reduction with regular intake (~8%)
      - Reduction of tiredness and fatigue (in deficiency states)

      ### Not established
      - Oral high-dose concepts in cancer contexts
      - Heart attack prevention
      - Anti-aging effects beyond normal requirements

      ## Is vitamin C safe?

      At 200–1,000 mg/day: **likely safe**. Above 2 g/day: osmotic diarrhoea possible. Above 6 g/day chronically: increased kidney stone risk (oxalate stones) in predisposed individuals. Do not combine with high-dose iron supplements and chemo- or radiotherapy without medical advice.

      ## Food sources

      Vitamin C is abundant in fresh foods: bell peppers (200 mg/100 g), rosehips (400–1,300 mg/100 g), sea buckthorn, broccoli, kiwi, citrus fruits. Anyone eating fresh fruit and vegetables daily is well supplied and does not need a supplement.

