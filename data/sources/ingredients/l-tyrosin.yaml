locales:
  de:
    summary: >-
      L-Tyrosin ist eine Aminosäure-Vorstufe von Dopamin, Noradrenalin und Adrenalin. In Studien zeigte sie kognitive Vorteile unter akutem Stress und Schlafentzug.
    evidenceSummary: >-
      Mehrere RCTs belegen unter akutem Stress (Schlafentzug, Kälte, kognitive Belastung) kognitive Vorteile von L-Tyrosin. Im Ruhezustand ohne Stressoren sind die Effekte in Studien kaum nachweisbar. Sportliche Leistungseffekte sind inkonsistent.
    body: |
      ## Was ist L-Tyrosin?
      
      L-Tyrosin ist eine bedingt essentielle Aminosäure, die im Körper aus **L-Phenylalanin** gebildet wird. Der Körper kann L-Tyrosin selbst herstellen – jedoch unter bestimmten Stressbedingungen oder bei hoher Nachfrage kann die körpereigene Produktion unter Umständen nicht ausreichen.
      
      L-Tyrosin ist der Ausgangsstoff für mehrere wichtige Verbindungen:
      
      - **Katecholamine:** Dopamin → Noradrenalin → Adrenalin (Stresshormon-Kaskade)
      - **Melanin** (Hautpigment)
      - **Schilddrüsenhormone** T3 und T4 (über Thyroxin-Zwischenstufen)
      
      Als Supplement hat L-Tyrosin Interesse geweckt, weil Dopamin und Noradrenalin für **Konzentration, Arbeitsgedächtnis, Stressreaktion und kognitive Flexibilität** wichtig sind. Die Hypothese: Mehr Tyrosin → mehr Neurotransmitter-Substrat → bessere kognitive Funktion unter Belastung.
      
      ## Was sagen die Studien wirklich?
      
      ### Positive Befunde (unter akutem Stress)
      - Mehrere kontrollierte Studien – viele mit Militärpersonal oder in simulierten Extrembedingungen – zeigen, dass **L-Tyrosin kognitive Leistungsabfälle unter akutem Stress abmildern** kann. Dazu gehören Schlafentzug, Kälte, Lärm und mentale Erschöpfung.
      - **Arbeitsgedächtnis, Reaktionszeit und Vigilanz** profitierten in einigen RCTs von Supplementierung gegenüber Placebo.
      - Die stärksten Effekte traten auf, wenn das **Katecholamin-System bereits belastet** war (d. h. unter Stress, wenig Schlaf, hoher kognitiver Last).
      
      ### Limitierungen
      - **Im Ruhezustand** ohne Stressoren zeigen die meisten Studien keinen messbaren kognitiven Vorteil von L-Tyrosin – die neuronale Synthese ist offenbar nicht substratbegrenzt, wenn das System nicht unter Druck steht.
      - Studien sind oft alt (1980er–2000er Jahre) mit kleinen Stichproben und militärischen Populationen; Übertragbarkeit auf Alltagsmenschen ist eingeschränkt.
      - **Sportliche Leistungseffekte** (Kraft, Ausdauer) sind in der Literatur inkonsistent und insgesamt schwach.
      - Keine robusten Langzeitdaten zu kognitiver Funktion oder Stimmung bei dauerhafter Einnahme.
      
      > **Bottom Line:** L-Tyrosin kann unter akutem Stress kognitive Leistungsabfälle in Studien abmildern – unter normalen Bedingungen ist der Effekt gering bis nicht nachweisbar.
      
      ## Mechanismus: Neurotransmitter-Vorstufe
      
      Der Weg von L-Tyrosin zum Neurotransmitter:
      
      1. L-Tyrosin wird durch **Tyrosin-Hydroxylase** zu **L-DOPA** (3,4-Dihydroxyphenylalanin) umgewandelt – dieser Schritt ist der geschwindigkeitsbegrenzende.
      2. L-DOPA wird durch **DOPA-Decarboxylase** zu **Dopamin** umgewandelt.
      3. Dopamin wird durch **Dopamin-β-Hydroxylase** zu **Noradrenalin** umgewandelt.
      4. Noradrenalin kann zu **Adrenalin** methyliert werden.
      
      **Unter Stress** steigt der Noradrenalin-Verbrauch stark an (Sympathikus-Aktivierung). Wenn die Tyrosin-Verfügbarkeit dabei begrenzend wird, kann zusätzliches L-Tyrosin die Neurosynthese in Studien unterstützen. Dieses „bedarfsabhängige" Wirkprinzip erklärt, warum Tyrosin bei gestressten Personen wirksamer zu sein scheint als bei ausgeruhten.
      
      ## Dosierung
      
      - **In Studien (kognitiv, akuter Stress):** 100–150 mg/kg Körpergewicht – bei 70 kg also ~7–10 g, was sehr hohe Dosen wären.
      - **Praxisübliche Dosierung in Supplements:** 500–2.000 mg (0,5–2 g) vor einer kognitiv anspruchsvollen Tätigkeit oder in Stresssituationen. Diese niedrigeren Dosen sind weniger gut durch kontrollierte Studien belegt als die höheren Militärdosen.
      - **N-Acetyl-L-Tyrosin (NALT):** Eine gängige Supplementform mit verbesserter Löslichkeit. Jedoch ist die Bioverfügbarkeit von NALT für die Neurotransmittersynthese nicht klar besser als die von L-Tyrosin; manche Daten deuten auf schlechtere Konversion hin.
      
      ## Wechselwirkungen
      
      - **MAO-Hemmer (MAOIs):** L-Tyrosin sollte nicht zusammen mit MAO-Inhibitoren eingenommen werden. MAOIs hemmen den Abbau von Katecholaminen; zusätzliches Tyrosin kann unter Umständen zu gefährlichem Blutdruckanstieg führen. Diese Kombination ist kontraindiziert.
      - **L-DOPA-Medikamente (Parkinson-Therapie):** Mögliche Wechselwirkung auf Transportebene; Rücksprache mit Arzt erforderlich.
      - **Schilddrüsenhormone:** Da Tyrosin auch Schilddrüsenhormone beeinflusst, sollten Personen mit Schilddrüsenerkrankungen oder -medikation (Thyroxin) vor der Einnahme Rücksprache halten.
      - **Andere Aminosäuren:** L-Tyrosin und L-Phenylalanin konkurrieren um denselben Transporter. Einnahme auf leeren Magen kann unter Umständen die Aufnahme verbessern.
      
      ## Ist L-Tyrosin sicher?
      
      L-Tyrosin gilt in üblichen Nahrungsmengen und Supplement-Dosierungen (bis ~3 g/Tag) als **wahrscheinlich sicher** für gesunde Erwachsene. Als natürliche Aminosäure ist es Teil der normalen Ernährung.
      
      Bei höheren Dosen sind möglich:
      - Übelkeit, Kopfschmerzen, Müdigkeit bei empfindlichen Personen
      - Theoretisch Beeinflussung des Katecholamin-Gleichgewichts bei Personen mit psychiatrischen Vorerkrankungen
      
      Nicht empfohlen oder Arzt-Rücksprache erforderlich bei:
      - Phenylketonurie (PKU): Phenylalanin-Stoffwechselstörung (hier ist Tyrosin-Zufuhr essentiell, aber medizinisch begleitet)
      - Einnahme von MAO-Hemmern (Kontraindikation)
      - Schilddrüsenerkrankungen
      - Psychiatrischen Erkrankungen wie bipolare Störung (dopaminerg)
      
      ## Regulatorischer Status in Deutschland und der EU
      
      - L-Tyrosin ist in der EU **kein Novel Food** und darf als Nahrungsergänzung vertrieben werden.
      - **Health Claims:** Die EFSA hat für L-Tyrosin **keine** Gesundheitsaussagen zu kognitiver Funktion, mentaler Leistung oder Stressresistenz zugelassen. Dementsprechende Werbeaussagen sind regulatorisch nicht zulässig.
      - NALT (N-Acetyl-L-Tyrosin) ist ebenfalls verkehrsfähig; eigene Health Claims existieren dafür nicht.
      
      ## Fazit
      
      L-Tyrosin ist ein interessantes Supplement für Menschen, die unter akutem, kurzfristigem Stress kognitiv leistungsfähig bleiben möchten – etwa bei Schlafentzug, einer intensiven Prüfungsphase oder körperlich anspruchsvollen Situationen. Im Alltag ohne klaren Stresskontext ist der Nutzen in der Forschung nicht gut belegt. Für Sportler oder als Longevity-Supplement fehlt eine belastbare Datengrundlage. Wer auf der Suche nach einem kognitiven Supplement für normale Bedingungen ist, findet in der Literatur aktuell keine überzeugenden Argumente für L-Tyrosin – der Wirkstoff entfaltet sein Potenzial offenbar eher dann, wenn das Neurotransmitter-System tatsächlich unter Druck steht.

  en:
    summary: >-
      L-Tyrosin is an amino acid precursor of dopamine, noradrenaline, and adrenaline. Studies show cognitive benefits under acute stress and sleep deprivation.
    evidenceSummary: >-
      Multiple RCTs document cognitive benefits of L-Tyrosin under acute stress (sleep deprivation, cold, cognitive load). At rest without stressors, effects are barely detectable in studies. Athletic performance effects are inconsistent.
    body: |
      ## What is L-Tyrosin?

      L-Tyrosin is a conditionally essential amino acid synthesized in the body from **L-Phenylalanine**. Although your body can produce L-Tyrosin endogenously, under certain stress conditions or periods of high demand, this internal production may become insufficient to meet neurochemical needs.

      L-Tyrosin serves as the precursor for several critical compounds:

      - **Catecholamines:** Dopamine → Noradrenaline → Adrenaline (the stress hormone cascade)
      - **Melanin** (skin pigment)
      - **Thyroid hormones** T3 and T4 (via thyroxine intermediate steps)

      L-Tyrosin has attracted supplement interest because dopamine and noradrenaline are essential for **concentration, working memory, stress response, and cognitive flexibility**. The hypothesis: more Tyrosin substrate → more neurotransmitter production → better cognitive function under load.

      ## What Does the Research Actually Show?

      ### Positive Findings (under acute stress)

      Multiple controlled studies—many involving military personnel or simulated extreme conditions—demonstrate that **L-Tyrosin can attenuate cognitive performance decline under acute stress**. These stressors include sleep deprivation, cold exposure, noise, and mental exhaustion.

      In several RCTs, **working memory, reaction time, and vigilance** improved with supplementation compared to placebo. The strongest effects emerged when the **catecholamine system was already under pressure**—that is, during stress, sleep loss, or high cognitive demand.

      The Deijen & Orlebeke (1994) military RCT found that cadets receiving L-Tyrosin maintained better cognitive performance and lower blood pressure after one week of combat training compared to controls. Similarly, the Neri study (1995) reported that 150 mg/kg doses attenuated performance decline from sleep deprivation by approximately 4 hours—a substantial real-world effect.

      ### Key Limitations

      **At rest** without stressors, most studies show no detectable cognitive advantage from L-Tyrosin supplementation. This suggests that neurotransmitter synthesis is not substrate-limited when the system is not under pressure—the body's endogenous production appears adequate for baseline function.

      Several methodological caveats apply:
      - Studies are often dated (1980s–2000s) with small sample sizes and military-only populations; generalizability to everyday users is limited
      - **Athletic performance effects** (strength, endurance) are inconsistent and overall weak
      - No robust long-term data exist on cognitive function or mood with sustained supplementation
      - Higher-dose protocols used in military research (7–10 g) are rarely matched in commercial supplements (0.5–2 g)

      > **Bottom line:** L-Tyrosin may help attenuate cognitive decline during acute stress in studies; under normal conditions, effects are minimal to undetectable.

      ## Mechanism: Neurotransmitter Precursor

      The biochemical pathway from L-Tyrosin to neurotransmitters is straightforward:

      1. L-Tyrosin is converted by **Tyrosine Hydroxylase** to **L-DOPA**—this step is rate-limiting
      2. L-DOPA is converted by **DOPA Decarboxylase** to **Dopamine**
      3. Dopamine is converted by **Dopamine-β-Hydroxylase** to **Noradrenaline**
      4. Noradrenaline can be methylated to **Adrenaline**

      Under stress, noradrenaline consumption increases sharply (sympathetic activation). If Tyrosin availability becomes limiting during high catecholamine turnover, additional L-Tyrosin may support neurosynthesis in studies. This "demand-dependent" mechanism explains why Tyrosin appears more effective in stressed individuals than in those at rest.

      ## Dosing

      - **In cognitive stress studies:** 100–150 mg/kg body weight—at 70 kg this translates to ~7–10 g, which is very high and impractical for most users
      - **Practical supplement dosing:** 500–2,000 mg (0.5–2 g) taken before cognitively demanding tasks or stressful situations. These lower doses are less well-supported by controlled research than the higher military protocols
      - **N-Acetyl-L-Tyrosin (NALT):** A common supplement form with improved solubility. However, NALT's bioavailability for neurotransmitter synthesis is not clearly superior to L-Tyrosin; some evidence suggests inferior conversion

      ## Drug Interactions

      - **MAO Inhibitors (MAOIs):** L-Tyrosin should not be combined with MAOIs. These drugs block catecholamine breakdown; additional Tyrosin may trigger dangerous blood pressure elevation. This combination is contraindicated.
      - **L-DOPA medications (Parkinson's therapy):** Potential transporter-level interaction; medical consultation required
      - **Thyroid hormones:** Since Tyrosin influences thyroid hormone synthesis, individuals with thyroid disease or taking levothyroxine should consult their doctor before supplementing
      - **Other amino acids:** L-Tyrosin and L-Phenylalanine compete for the same transporter. Taking on an empty stomach may improve absorption

      ## Safety Profile

      L-Tyrosin is considered **likely safe** for healthy adults at typical dietary and supplement doses (up to ~3 g/day). As a natural amino acid, it is part of normal nutrition.

      At higher doses, possible effects include:
      - Nausea, headache, fatigue in sensitive individuals
      - Theoretical catecholamine imbalance in persons with psychiatric histories

      Medical consultation or avoidance recommended for:
      - **Phenylketonuria (PKU):** Although Tyrosin is essential in PKU, supplementation requires medical supervision
      - **MAO inhibitor use:** Contraindicated due to hypertension risk
      - **Thyroid disorders:** Risk of altering thyroid function
      - **Psychiatric conditions** like bipolar disorder (dopamine-sensitive)

      ## Regulatory Status in Germany and the EU

      - L-Tyrosin is **not a Novel Food** in the EU and is permitted as a dietary supplement
      - **Health claims:** EFSA has **not approved** any health claims for L-Tyrosin regarding cognitive function, mental performance, or stress resilience. Corresponding marketing claims are not permitted
      - NALT (N-Acetyl-L-Tyrosin) is also commercially available, with no specific approved health claims

      ## Final Assessment

      L-Tyrosin is an interesting option for people facing acute, short-term stress who need to maintain cognitive performance—such as during sleep-deprived periods, intensive exam phases, or physically demanding situations. For daily use without clear stress context, research does not support reliable efficacy. For athletes or as a longevity supplement, there is insufficient evidence. If you are seeking a cognitive supplement for everyday conditions, the scientific literature currently does not provide compelling support for L-Tyrosin; the ingredient appears to show benefit primarily when the neurotransmitter system is genuinely under pressure.

