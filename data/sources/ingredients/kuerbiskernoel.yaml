locales:
  de:
    summary: >-
      Kürbiskernöl enthält Phytosterole und Delta-7-Sterine, die in Zusammenhang mit Prostata- und Blasengesundheit stehen. Moderate Evidenz aus kleinen RCTs.
    evidenceSummary: >-
      Einige kleine RCTs zeigen Verbesserungen bei BPH-Symptomen (IPSS-Score). Mechanismen über 5-Alpha-Reduktase-Hemmung und Phytosterole. Insgesamt moderate Evidenz, größere Studien fehlen.
    body: |
      ## Wirkweise
      
      Kürbiskernöl aus *Cucurbita pepo* enthält Phytosterole (insbesondere Beta-Sitosterol und Delta-7-Sterine), ungesättigte Fettsäuren und Carotinoide. Die postulierten Wirkmechanismen bei BPH umfassen eine milde Hemmung der 5-Alpha-Reduktase (ähnlich wie Finasterid, aber deutlich schwächer) und entzündungshemmende Effekte über Phytosterole.
      
      ## Evidenzlage
      
      Die größte Studie (Vahlensieck 2015, n=1431) zeigte signifikante IPSS-Verbesserungen bei milder BPH. Allerdings war die Effektgröße moderat, und die Studie wurde teilweise von der Industrie finanziert. Für Blasengesundheit bei Frauen gibt es erste positive Daten (Nishimura 2014), aber nur mit kleiner Stichprobe.
      
      ## Sicherheit
      
      Kürbiskernöl gilt als sehr sicher. Keine nennenswerten Nebenwirkungen in Studien berichtet. Kann in seltenen Fällen leichte Magen-Darm-Beschwerden verursachen.
      
      ## Dosierung
      
      1000–3000 mg Kürbiskernöl pro Tag, typischerweise aufgeteilt auf 2-3 Dosen zu den Mahlzeiten.

  en:
    summary: >-
      Pumpkin seed oil contains phytosterols and delta-7 sterols linked to prostate and bladder health. Moderate evidence from small RCTs.
    evidenceSummary: >-
      Several small RCTs show improvements in BPH symptoms (IPSS score). Mechanisms via 5-alpha-reductase inhibition and phytosterols. Overall moderate evidence, larger studies needed.
    body: |
      ## Mechanism of Action
      
      Pumpkin seed oil from *Cucurbita pepo* contains phytosterols (particularly beta-sitosterol and delta-7 sterols), unsaturated fatty acids, and carotenoids. The proposed mechanisms in BPH include mild inhibition of 5-alpha-reductase (similar to finasteride but significantly weaker) and anti-inflammatory effects via phytosterols.
      
      ## Evidence
      
      The largest study (Vahlensieck 2015, n=1431) showed significant IPSS improvements in mild BPH. However, the effect size was moderate and the study was partially industry-funded. For bladder health in women, initial positive data exists (Nishimura 2014) but with a small sample size only.
      
      ## Safety
      
      Pumpkin seed oil is considered very safe. No notable side effects reported in studies. May cause mild gastrointestinal discomfort in rare cases.
      
      ## Dosage
      
      1000–3000 mg pumpkin seed oil per day, typically divided into 2-3 doses with meals.

