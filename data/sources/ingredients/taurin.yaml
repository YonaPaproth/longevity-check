    summary: >-
      Taurin ist eine Aminosäure mit zentraler Rolle im Energiestoffwechsel. Tier- und Beobachtungsdaten haben die Alterungsforschung befeuert; belastbare Humanbelege sind deutlich begrenzter.
    evidenceSummary: >-
