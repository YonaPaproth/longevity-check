    body: |
      ## Was ist Sulforaphan?
      
      Sulforaphan ist ein **Isothiocyanat** – ein schwefelreicher Pflanzenstoff, der in Kreuzblütlern (Brassica-Familie) vorkommt: Brokkoli, Rosenkohl, Kohl, Kohlrabi. Es entsteht nicht direkt in der Pflanze, sondern wenn das Vorläufermolekül **Glucoraphanin** beim Kauen oder Schneiden mit dem Enzym **Myrosinase** in Kontakt kommt.
      
      Der Mechanismus macht Sulforaphan besonders interessant: Es aktiviert **Nrf2** (Nuclear factor erythroid 2-related factor 2) – einen Transkriptionsfaktor, der hunderte Gene für zelluläre Schutz- und Entgiftungssysteme hochreguliert. Nrf2 gilt als einer der wichtigsten endogenen Schutzmechanismen gegen oxidativen Stress, Entzündung und chemische Toxine.
      
      ## Nrf2: der Masterregulator
      
      Wenn Sulforaphan Nrf2 aktiviert, produziert die Zelle mehr:
      - **Glutathion** (zentrales Antioxidans)
      - **Häm-Oxygenase-1** (entzündungshemmend)
      - **Phase-2-Detoxifikationsenzyme** (Entgiftung von Karzinogenen)
      - **Thioredoxin** (reduziert oxidativen Stress)
      
      Dieser Mechanismus unterscheidet Sulforaphan von direkten Antioxidantien wie Vitamin C: Es induziert die **körpereigene** Antioxidationskapazität, statt selbst Radikale abzufangen.
      
      ## Was sagen die Studien wirklich?
      
      ### Vergleichsweise gut untersucht
      - **Entgiftung**: RCTs zeigen messbar erhöhte Ausscheidung von Aflatoxin und Benzol-Metaboliten
      - **Entzündungsmarker**: CRP, NF-κB-Aktivität sinken in mehreren Studien
      - **Nrf2-Aktivierung**: Biomarker-Studien konsistent positiv
      
      ### Vielversprechend
      - Kognitive Funktion (Schizophrenie, ASD-Studien)
      - Blutdruckreduktion
      - Glukosemetabolismus
      
      ### Nicht (noch nicht) belegt
      - Krebsprävention beim Menschen in RCTs (nur epidemiologisch und präklinisch)
      - Direkte Lebensverlängerung
      
      ## Das Zubereitungsproblem
      
      Normales Kochen zerstört die Myrosinase – und damit die Sulforaphan-Bildung. **Kurzes Dämpfen (3–4 Minuten)** erhält die Enzymaktivität besser. Alternativ: Sulforaphan-Supplements aus stabilisierten Brokkoli-Keimlingen.
      
      Tipp: Senf oder Meerrettich zum gedämpften Brokkoli hinzufügen – sie enthalten Myrosinase und können die Sulforaphan-Bildung auch aus gekochtem Brokkoli initiieren.
      
      ## Ist Sulforaphan sicher?
      
      Bei üblichen Supplement-Dosen (10–50 mg/Tag) gilt es als **wahrscheinlich sicher**. Bei sehr hohen Dosen mögliche Schilddrüsenprobleme (Isothiocyanate hemmen Jodaufnahme) – bei normaler Jodversorgung kein Risiko. Nicht in der Schwangerschaft in hohen Dosen einsetzen.

  en:
    summary: >-
      Sulforaphan activates Nrf2-dependent defence mechanisms and is typically sourced from broccoli sprouts. Strong preclinical evidence; clinical data still building.
    evidenceSummary: >-
      Strong preclinical evidence and several RCTs for antioxidant, anti-inflammatory, and potentially cancer-preventive effects. Nrf2 activation comparatively well studied. Clinical endpoints (cancer prevention) in humans not yet proven in large RCTs.
    body: |
      ## What is sulforaphan?

      Sulforaphan is an **isothiocyanate** — a sulfur-rich plant compound found in cruciferous vegetables (Brassica family): broccoli, Brussels sprouts, cabbage, kohlrabi. It does not exist directly in the plant but is formed when the precursor molecule **glucoraphanin** comes into contact with the enzyme **myrosinase** during chewing or cutting.

      What makes sulforaphan particularly interesting is its mechanism: it activates **Nrf2** (Nuclear factor erythroid 2-related factor 2) — a transcription factor that upregulates hundreds of genes for cellular defence and detoxification systems. Nrf2 is considered one of the most important endogenous protection mechanisms against oxidative stress, inflammation, and chemical toxins.

      ## Nrf2: the master regulator

      When sulforaphan activates Nrf2, the cell produces more:
      - **Glutathione** (central antioxidant)
      - **Heme oxygenase-1** (anti-inflammatory)
      - **Phase 2 detoxification enzymes** (detoxification of carcinogens)
      - **Thioredoxin** (reduces oxidative stress)

      This mechanism distinguishes sulforaphan from direct antioxidants like vitamin C: it induces the body's **own** antioxidant capacity rather than scavenging radicals directly.

      ## What does the evidence actually show?

      ### Comparatively well studied
      - **Detoxification**: RCTs show measurably increased excretion of aflatoxin and benzene metabolites
      - **Inflammatory markers**: CRP and NF-κB activity decline in multiple studies
      - **Nrf2 activation**: biomarker studies consistently positive

      ### Promising
      - Cognitive function (schizophrenia, ASD studies)
      - Blood pressure reduction
      - Glucose metabolism

      ### Not (yet) established
      - Cancer prevention in humans via RCTs (only epidemiological and preclinical data)
      - Direct lifespan extension

      ## The preparation problem

      Normal cooking destroys myrosinase — and with it, sulforaphan formation. **Brief steaming (3–4 minutes)** preserves enzyme activity better. Alternatively: sulforaphan supplements from stabilized broccoli sprouts.

      Tip: add mustard or horseradish to steamed broccoli — they contain myrosinase and can initiate sulforaphan formation even from cooked broccoli.

      ## Is sulforaphan safe?

      At typical supplement doses (10–50 mg/day), it is considered **likely safe**. At very high doses, possible thyroid issues (isothiocyanates inhibit iodine uptake) — no risk with normal iodine intake. Do not use high doses during pregnancy.

