locales:
  de:
    summary: >-
      Sulforaphan aktiviert Nrf2-abhängige Schutzmechanismen und wird oft aus Brokkoli-Keimlingen gewonnen. Die Datenlage ist präklinisch stark und klinisch noch im Aufbau; zugelassene EU-Health-Claims…
