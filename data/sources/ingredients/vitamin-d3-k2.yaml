locales:
  de:
    summary: >-
      Niedrige Vitamin-D-Spiegel sind in Deutschland verbreitet. Die Supplementierung ist vor allem in Mangelkontexten vergleichsweise gut untersucht; K2 wird oft kombiniert, ist aber als eigenständiges…
    evidenceSummary: >-
      Für Vitamin D3 liegen hunderte RCTs und EFSA-zugelassene Claims vor (Knochen, Immunfunktion, Muskeln). Die VITAL-Studie (n=25.871) und D-HEALTH-Studie liefern solide Humanergebnisse. Vitamin K2 hat geringere, aber wachsende Evidenz für Knochen- und Gefäßgesundheit.
    body: |
      ## Warum D3 + K2 zusammen?
      
      Vitamin D3 fördert die Aufnahme von Kalzium im Darm — eine seiner am besten belegten Wirkungen. Vitamin K2 (als MK-7) soll dafür sorgen, dass das resorbierte Kalzium in die Knochen gelenkt und nicht in den Gefäßwänden abgelagert wird. Der Mechanismus: K2 aktiviert das Protein Osteocalcin (für Knocheneinlagerung) und Matrix-Gla-Protein (hemmt Gefäßverkalkung), beide abhängig von Carboxylierung durch Vitamin K.
      
      Die Kombination ist biologisch plausibel und in der Supplementbranche weit verbreitet. Wichtig zu wissen: Die Evidenzlage für D3 ist erheblich stärker und breiter als für K2. Wer K2 supplement, sollte sich im Klaren sein, dass die Effekte gut belegt, aber nicht mit D3-Daten gleichzusetzen sind.
      
      ## Vitamin D3: Warum so wichtig?
      
      ### Mangel ist die Regel, nicht die Ausnahme
      
      In Deutschland erreichen schätzungsweise 40–60% der Bevölkerung im Winter keine ausreichenden 25(OH)D-Spiegel (&lt;50 nmol/l). Risikofaktoren: dunkle Haut, hohes Alter, wenig Aufenthalt im Freien, Adipositas. Das RKI schätzt, dass 30% der Bevölkerung ganzjährig unter der Grenze liegen. Dies macht Vitamin D zu einem der wenigen Supplements, bei denen eine gezielte Supplementierung bei Nachgewiesenem Mangel klar indiziert ist.
      
      ### Was Vitamin D3 im Körper tut
      
      Vitamin D3 (Cholecalciferol) ist biochemisch gesehen kein Vitamin, sondern ein Prohormon. Über die Leber wird es zu 25(OH)D (Calcidiol), in der Niere zum aktiven 1,25(OH)₂D (Calcitriol) umgewandelt. Calcitriol bindet an den Vitamin-D-Rezeptor (VDR), der in fast allen Körperzellen vorkommt — daher die breite physiologische Wirkung:
      
      - **Kalzium- und Phosphataufnahme** im Darm (EFSA-zugelassen)
      - **Knochen- und Zahnmineralisation** (EFSA-zugelassen)
      - **Normale Immunfunktion** (EFSA-zugelassen): VDR wird auf Immunzellen exprimiert; aktives Vitamin D moduliert angeborene und adaptive Immunantwort
      - **Muskelkraft** (EFSA-zugelassen): Besonders bei älteren Menschen mit Mangel sind Verbesserungen der Muskelkraft in RCTs belegt
      
      ### Studienlagen zu weitergehenden Effekten
      
      Die VITAL-Studie (n=25.871, 5,3 Jahre Laufzeit) ist die bislang größte RCT. Ergebnis: 2.000 IE/Tag reduzierten Krebssterblichkeit um 25% in Subgruppenanalyse (nicht Gesamtpopulation), hatten aber keinen klaren Einfluss auf Herzinfarkthäufigkeit. Die D-HEALTH-Studie (n=421, 60.000 IE/Monat) zeigte positive Effekte auf Glukosestoffwechsel und Blutdruck.
      
      **Wichtig:** Diese Vorteile wurden vor allem bei Personen mit Mangel oder niedrigen Ausgangsspiegeln beobachtet. Bei Menschen mit bereits ausreichenden Spiegeln (25(OH)D &gt;75 nmol/l) sind die Zusatznutzen sehr viel unsicherer.
      
      ## Vitamin K2: Die Fakten
      
      K2 kommt in zwei relevanten Unterformen vor:
      - **MK-4** (kurze Halbwertszeit &lt;4 h): Braucht 3x täglich Dosierung; findet sich vor allem in tierischen Produkten
      - **MK-7** (Halbwertszeit ~70 h): Einmal täglich ausreichend; kommt vor allem in Natto (fermentiertes Soja) vor; bioverfügbarste Form für Supplementierung
      
      ### Was die Studien sagen
      
      Die Rotterdam-Kohorte (n=4.807) zeigte eine 41% Reduktion des Herzinfarktrisikos mit der höchsten K2-Aufnahme — ein beeindruckendes Ergebnis, aber eine Beobachtungsstudie. RCTs zu Gefäßverkalkung sind vorhanden, aber kleiner und kürzer (oft 3 Jahre). Eine Meta-Analyse zeigt konsistente Reduktion der Verkalkungsprogression mit K2, die absolute Effektgröße bleibt aber unklar.
      
      Für Knochendichte und Frakturrisiko: EFSA hat Vitamin K Claims zugelassen, basierend auf Knochenproteinabhängigkeit von K. RCTs mit MK-7 zeigen Effekte auf Knochenabbau-Marker (Osteocalcin-Carboxylierung), die klinische Bedeutung für Frakturrisiko ist noch in Erforschung.
      
      ## Dosierung und praktische Empfehlungen
      
      **Vitamin D3:**
      - Unter Mangel: 1.000–2.000 IE/Tag sind in der Regel ausreichend zur Normalisierung
      - Zur Supplementierung ohne nachgewiesenen Mangel: 800–1.000 IE/Tag (DGE-Empfehlung wenn kein Sonnenlicht)
      - Keine Selbstdosierung über 4.000 IE/Tag ohne Blutkontrolle — Vitamin D ist fettlöslich und akkumuliert
      - Einnahme mit einer fetthaltigen Mahlzeit verbessert Resorption um ~30–50%
      
      **Vitamin K2:**
      - Typische RCT-Dosen: 90–360 µg MK-7/Tag
      - Bei gesunder Ernährung mit viel Gemüse und fermentierten Produkten ist Supplementierung nicht automatisch nötig
      
      ## EFSA-Status und regulatorische Einordnung
      
      Vitamin D hat eine der breitesten EFSA-Zulassungen aller Supplements. Details findet sich im EFSA Scientific Opinion zu Vitamin D (2016): [efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2016.4547](https://efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2016.4547). Zugelassene Claims umfassen: normale Funktion des Immunsystems, normale Knochen- und Zahntextur, normale Muskelfunktion, normale Kalziumabsorption und normale Kalziumspiegel im Blut.
      
      Vitamin K2: EFSA hat Claims für normale Blutgerinnung und Knochenerhalt zugelassen — ebenfalls starke regulatorische Basis.
      
      ## Sicherheit und wichtige Warnhinweise
      
      Vitamin D3 ist bei normalen Dosen (≤2.000 IE/Tag) sehr gut verträglich. Toxizität tritt in der Praxis fast ausschließlich bei sehr hohen dauerhaften Einnahmen (&gt;10.000 IE/Tag über Monate) auf, mit Hypercalcämie als Hauptrisiko.
      
      **Vitamin K2 und Blutverdünner:** Wer Vitamin-K-Antagonisten (Warfarin/Marcumar/Phenprocoumon) einnimmt, darf Vitamin K2 **nicht** ohne ärztliche Absprache supplementieren. K2 beeinflusst direkt die Gerinnungskaskade und kann die Wirksamkeit dieser Medikamente erheblich verändern.
      
      ## Ehrliche Einschränkungen
      
      - **Normalwert-Supplementierung:** Bei 25(OH)D-Spiegeln &gt;75 nmol/l ist der Zusatznutzen von D3-Supplementierung sehr ungewiss. Viele positive Studien schlossen Personen mit niedrigen Ausgangsspiegeln ein.
      - **K2-Langzeitdaten:** Die meisten K2-RCTs laufen &lt;3 Jahre. Frakturrisiko-Endpunkte wurden in wenigen Studien direkt gemessen.
      - **Kombinationspräparate:** Ob D3+K2 kombiniert besser wirkt als D3 allein, ist nicht in großen RCTs direkt verglichen worden.
      - **Produktqualität:** Bei Vitamin D-Softgels variiert die tatsächliche Dosierung stark je nach Formulierung und Lagerung. Auf Qualitätszertifizierung achten.

  en:
    summary: >-
      Low vitamin D levels are common in northern climates. Supplementation is comparatively well studied in deficiency; K2 is often combined but has weaker standalone evidence.
    evidenceSummary: >-
      For vitamin D3, hundreds of RCTs and EFSA-approved claims exist (bone, immune function, muscles). The VITAL trial (n=25,871) and D-HEALTH study provide solid human data. Vitamin K2 has smaller but growing evidence for bone and vascular health.
    body: |
      ## Why D3 + K2 Together?
      
      Vitamin D3 promotes intestinal calcium absorption — one of its most established effects. Vitamin K2 (as MK-7) is proposed to direct absorbed calcium into bone rather than vessel walls. The mechanism: K2 activates osteocalcin (for bone mineralisation) and matrix Gla protein (inhibits vascular calcification), both dependent on carboxylation by vitamin K.
      
      The combination is biologically plausible and widely marketed. Important context: the evidence base for D3 is substantially stronger and broader than for K2. Those supplementing K2 should understand that its effects are well argued but not equivalent in robustness to D3 data.
      
      ## Vitamin D3: Why It Matters
      
      ### Deficiency is the rule, not the exception
      
      In northern and central Europe, estimates suggest 40–60% of the population have insufficient 25(OH)D levels (&lt;50 nmol/L) in winter. Risk factors include darker skin, older age, limited outdoor activity, and obesity. This makes vitamin D one of the few supplements where targeted supplementation in **confirmed deficiency** is clearly indicated.
      
      ### What vitamin D3 does in the body
      
      Vitamin D3 (cholecalciferol) is biochemically not a vitamin but a prohormone. Via the liver it is converted to 25(OH)D (calcidiol), and in the kidneys to active 1,25(OH)₂D (calcitriol). Calcitriol binds to the vitamin D receptor (VDR), expressed in nearly all cells — hence the broad physiological effects:
      
      - **Calcium and phosphate absorption** (EFSA-approved)
      - **Bone and tooth mineralisation** (EFSA-approved)
      - **Normal immune function** (EFSA-approved): VDR is expressed on immune cells; active vitamin D modulates innate and adaptive immune responses
      - **Muscle strength** (EFSA-approved): improvements in muscle strength in older individuals with deficiency have been shown in RCTs
      
      ### Evidence on broader effects
      
      The VITAL trial (n=25,871, 5.3-year follow-up) is the largest RCT to date. Result: 2,000 IU/day reduced cancer mortality by 25% in a subgroup analysis (not the total population), but had no clear effect on heart attack frequency overall. The D-HEALTH study (n=421, 60,000 IU/month) showed positive effects on glucose metabolism and blood pressure.
      
      **Important:** These benefits were observed primarily in people with deficiency or low baseline levels. In those with already adequate levels (25(OH)D &gt;75 nmol/L), the additional benefit is much more uncertain.
      
      ## Vitamin K2: The Evidence
      
      K2 exists in two relevant sub-forms:
      - **MK-4** (short half-life &lt;4 h): requires 3× daily dosing; found mainly in animal products
      - **MK-7** (half-life ~70 h): once daily is sufficient; found mainly in natto (fermented soy); most bioavailable form for supplementation
      
      ### What the studies show
      
      The Rotterdam cohort (n=4,807) showed a 41% reduction in heart attack risk with the highest K2 intake — a striking result, but an observational study. RCTs on vascular calcification exist but are smaller and shorter (often 3 years). A meta-analysis shows consistent reduction in calcification progression with K2, but the absolute effect size remains unclear.
      
      For bone density and fracture risk: EFSA has approved K2 claims based on bone protein dependence on K. RCTs with MK-7 show effects on bone turnover markers (osteocalcin carboxylation), but clinical significance for fracture risk is still being investigated.
      
      ## Dosage and Practical Recommendations
      
      **Vitamin D3:**
      - Deficiency correction: 1,000–2,000 IU/day is generally sufficient for normalisation
      - Supplementation without confirmed deficiency: 800–1,000 IU/day (when sun exposure is limited)
      - Do not self-dose above 4,000 IU/day without blood monitoring — vitamin D is fat-soluble and accumulates
      - Taking with a fat-containing meal improves absorption by ~30–50%
      
      **Vitamin K2:**
      - Typical RCT doses: 90–360 µg MK-7/day
      - With a diet rich in vegetables and fermented products, supplementation is not automatically necessary
      
      ## EFSA Status
      
      Vitamin D has one of the broadest EFSA authorisations of any supplement. Approved claims include: normal immune function, normal bone and teeth, normal muscle function, normal calcium absorption.
      
      Vitamin K2: EFSA has approved claims for normal blood clotting and bone maintenance.
      
      ## Safety and Important Warnings
      
      Vitamin D3 is very well tolerated at normal doses (≤2,000 IU/day). Toxicity occurs almost exclusively with very high sustained intake (&gt;10,000 IU/day over months), with hypercalcaemia as the main risk.
      
      **Vitamin K2 and anticoagulants:** Anyone taking vitamin K antagonists (warfarin, acenocoumarol, phenprocoumon) **must not** supplement vitamin K2 without medical supervision. K2 directly influences the coagulation cascade and can substantially alter the efficacy of these medications.
      
      ## Honest Limitations
      
      - **Supplementation at normal levels:** At 25(OH)D levels &gt;75 nmol/L, the additional benefit of D3 supplementation is very uncertain. Many positive studies enrolled individuals with low baseline levels.
      - **K2 long-term data:** Most K2 RCTs run &lt;3 years. Fracture risk endpoints have been directly measured in few studies.
      - **Combination products:** Whether D3+K2 combined works better than D3 alone has not been directly compared in large RCTs.
      - **Product quality:** In vitamin D softgels, actual dosing can vary substantially by formulation and storage conditions.

