        Klassische Pharmakokinetik-Studie: Orales Glutathion (3 g Einmaldosis) erhöhte Plasma-GSH nicht messbar. Schlussfolgerung: Standard-GSH wird im Darm gespalten, bevor es systemisch verfügbar wird.
      en: >-
        Classic pharmacokinetic study: a single 3 g oral dose of glutathione did not detectably raise plasma GSH levels. Conclusion: standard GSH is cleaved in the gut before reaching systemic circulation.
