locales:
  de:
    summary: >-
      Glutathion ist das berühmte körpereigene Antioxidans. Als Supplement bleibt die Datenlage deutlich weniger beeindruckend als der Ruf.
    evidenceSummary: >-
      Glutathion ist biologisch zentral im antioxidativen und Entgiftungssystem. Als orales Supplement ist die Evidenz für klare klinische Vorteile begrenzt und stark von Formulierung und Kontext abhängig. Liposomales GSH und S-Acetyl-GSH zeigen bessere Absorption als Standardform. Die Story ist stärker als die Human-Daten.
    body: |
      ## Was ist Glutathion?
      
      Glutathion (GSH) ist ein **Tripeptid** aus den Aminosäuren Glutaminsäure, Cystein und Glycin. Es ist das mengenmäßig bedeutendste intrazelluläre Antioxidans — mit intrazellulären Konzentrationen von **2–10 mmol/L** in den meisten Geweben. Der Körper synthetisiert GSH selbst; eine externe Zufuhr ist unter normalen Bedingungen nicht notwendig.
      
      Glutathion existiert in zwei Formen: reduziert (**GSH**, aktive Form) und oxidiert (**GSSG**). Das Verhältnis GSH/GSSG ist ein wichtiger Marker für den oxidativen Stress im Gewebe. Mit dem Alter sinkt GSH-Spiegel messbar: im Vergleich zu jungen Erwachsenen liegen die Gewebsspiegel bei älteren Personen schätzungsweise **20–40 % niedriger**.
      
      ## Das zentrale Problem: Orale Bioverfügbarkeit
      
      Der Ruf von Glutathion übertrifft in der Praxis seine orale Supplementierbarkeit erheblich.
      
      **Das Problem:** Orales Glutathion (Standardform) wird im Magen-Darm-Trakt durch Peptidasen — vor allem die Gamma-Glutamyltranspeptidase (GGT) im Darmepithel — in seine Aminosäuren zerlegt, bevor es systemisch resorbiert werden kann. Das bahnbrechende Ergebnis der Witschi-Studie (1992): **Eine Einmaldosis von 3 g Glutathion erhöhte die Plasma-GSH-Spiegel nicht** — das Tripeptid kam nicht intakt an.
      
      Das bedeutet: Standardergebnis bei oralem GSH ist, dass der Körper Glutamat, Cystein und Glycin als Bausteine erhält — nicht die fertige Antioxidations-Maschine. Da **Cystein** die rate-limitierende Aminosäure für die GSH-Eigensynthese ist, kann dies indirekt hilfreich sein. Aber das ist eine andere Aussage als "Glutathion wird direkt supplementiert."
      
      ## Formulierungsalternativen
      
      Neuere Ansätze versuchen, die Bioverfügbarkeit zu verbessern:
      
      **Liposomales Glutathion:** GSH eingebettet in Liposomen (Fettkügelchen) umgeht teilweise den gastrointestinalen Abbau. Richie (2015) und Sinha (2018) zeigen konsistent erhöhte GSH-Blutspiegel bei 500 mg/Tag über 4–6 Wochen (Anstieg ~30–52 % in Erythrozyten und Vollblut). Klinische Endpunkte (Krankheitsprävention, Leistung, Alterungsmarker) wurden nicht untersucht.
      
      **S-Acetyl-Glutathion (SAG):** Acetylierung schützt die Thiol-Gruppe vor Oxidation und verbessert die Membrangängigkeit. In vitro vielversprechend; Humanstudien sind spärlich.
      
      **Intravenöses Glutathion (IV-GSH):** Umgeht die orale Bioverfügbarkeitsproblematik vollständig. Wird medizinisch bei bestimmten Erkrankungen (Parkinson-Symptomlinderung in kleinen Studien, Hautaufhellung in asiatischen Studien) eingesetzt. Nicht als OTC-Supplementierung zugänglich.
      
      ## GSH-Vorläufer als Strategie
      
      Statt Glutathion direkt zu supplementieren, kann man die körpereigene GSH-Synthese steigern:
      
      **N-Acetylcystein (NAC):** Der wohl am besten untersuchte GSH-Booster. NAC stellt die rate-limitierende Aminosäure Cystein bereit und ist medizinisch etabliert (Paracetamol-Überdosierung, Bronchitis). NAC hebt Glutathionspiegel in Studien zuverlässig.
      
      **Glycin:** Ebenfalls Glutathion-Vorläufer; eine Glycin + NAC-Kombination zeigte in einer kleinen RCT bei älteren Erwachsenen signifikante GSH-Anstiege und metabolische Verbesserungen.
      
      **Schwefelhaltige Lebensmittel:** Kreuzblütler (Brokkoli, Rosenkohl) enthalten Glutathion-Vorläufer und steigern GSH-Spiegel im Tiermodell.
      
      ## Was sagen die Studien wirklich?
      
      ### Positiv und einigermaßen belegt
      
      - Liposomales GSH erhöht zuverlässig die Blutspiegel gegenüber Ausgangswert (Richie 2015, Sinha 2018).
      - NAC als GSH-Vorläufer ist bei GSH-Mangel-Zuständen und medizinischen Indikationen gut belegt.
      - IV-Glutathion hat in kleinen Studien klinisch messbare Effekte (Parkinson-Symptome, neurologische Erholung).
      
      ### Schwach belegt oder unklar
      
      - Ob erhöhte GSH-Blutspiegel durch orale Supplementierung klinische Endpunkte verbessern, ist nicht nachgewiesen.
      - Keine RCTs zu Langzeitwirkungen von oralem GSH auf Alterungsmarker, Immunfunktion oder Krankheitsprävalenz bei gesunden Erwachsenen.
      - "Detox"-Versprechen für Glutathion haben keine spezifische klinische Evidenzbasis.
      
      ### Was nicht belegt ist
      
      - Orale GSH-Supplementierung als zuverlässige Methode, den zellulären Redoxstatus bei Gesunden zu verändern.
      - Anti-Aging-Effekte durch GSH-Supplements beim Menschen.
      - Immun-Boosting durch GSH bei gesunden Personen.
      
      ## Dosierung
      
      - **Standarddosis (in Studien):** 500 mg/Tag orales oder liposomales GSH
      - **Wirksamere Alternative:** 600 mg/Tag NAC (für GSH-Boost bei nachgewiesenem Mangel)
      - **Einnahme:** Nüchtern oder morgens empfohlen; Kombination mit Vitamin C verlängert theoretisch die Halbwertszeit (Recycling von GSSG zu GSH)
      
      ## Sicherheit
      
      Glutathion gilt bei üblichen Supplement-Dosierungen als **wahrscheinlich sicher**. In Kurzzeitstudien bis 6 Monate wurden keine ernsthaften unerwünschten Wirkungen berichtet. Langzeitsicherheit bei dauerhafter oraler Einnahme ist nicht ausreichend untersucht.
      
      Hinweis: Glutathion hemmt Tyrosinase und wird in einigen asiatischen Märkten für Hautaufhellung vermarktet. Diese Anwendung ist medizinisch nicht zugelassen und ethisch umstritten; in der EU wäre entsprechendes Marketing unzulässig.
      
      ## EFSA- und regulatorischer Status
      
      Für Glutathion gibt es in der EU **keine zugelassenen Health Claims** — weder für Antioxidanz-Schutz, Entgiftung noch Immunfunktion. Das EFSA-Bewertungssystem unter [efsa.europa.eu](https://efsa.europa.eu/en/topics/topic/health-claims) hat entsprechende Ansprüche nicht positiv bewertet. Marketingaussagen zu "Detox", "Anti-Aging" oder "Immun-Boost" für Glutathion-Supplements sind ohne Zulassungsbasis und in der EU nicht als Health Claims zulässig.
      
      Glutathion ist kein Novel Food und darf als Nahrungsergänzungsmittel vertrieben werden, solange keine unzulässigen Claims gemacht werden.
      
      ## Ehrliche Limitierungen
      
      - Standardform orales GSH ist pharmakologisch problematisch: wird vor der Resorption gespalten.
      - Liposomale Formen zeigen zwar bessere Blutspiegel, aber keine klinischen Endpunktstudien.
      - Die meisten Studien zu oralem GSH sind klein (n &lt; 60), kurz (&lt; 6 Monate) und messen Surrogatmarker (Blutspiegel), keine klinisch relevanten Endpunkte.
      - Individuelle Variation in GSH-Baseline und Bedarf ist groß und wird selten berücksichtigt.
      - In vitro und Tierstudien (viele davon beeindruckend) sind nicht direkt auf die Wirksamkeit von oralem Supplement beim Menschen übertragbar.
      
      ## Fazit
      
      Glutathion hat einen **sehr guten biologischen Ruf, der als Supplement bisher nicht gut eingelöst wurde**. Die biologische Zentralität ist unbestreitbar. Aber orale Bioverfügbarkeit bleibt das ungeklärte Kernproblem. Wer die körpereigene GSH-Synthese steigern möchte, ist mit NAC (600–1200 mg/Tag) wahrscheinlich besser beraten — besser untersucht, günstigere und direkt wirksam als Cystein-Lieferant. Liposomales Glutathion ist eine verbesserte Alternative zur Standardform, aber die klinische Evidenz für echte Gesundheitseffekte steht noch aus.

  en:
    summary: >-
      Glutathione is the body's most celebrated antioxidant. As a supplement, the evidence is far less impressive than its reputation.
    evidenceSummary: >-
      Glutathione is biologically central to the antioxidant and detoxification system. As an oral supplement, evidence for clear clinical benefits is limited and highly dependent on formulation and context. Liposomal GSH and S-acetyl-GSH show better absorption than the standard form. The story is stronger than the human data.
    body: |
      ## What Is Glutathione?

      Glutathione (GSH) is a **tripeptide** composed of glutamic acid, cysteine, and glycine. It is the most abundant intracellular antioxidant, with intracellular concentrations of **2–10 mmol/L** in most tissues. The body synthesizes GSH endogenously; under normal conditions, external supply is not required.

      Glutathione exists in two forms: reduced (**GSH**, the active form) and oxidized (**GSSG**). The GSH/GSSG ratio is a key marker of oxidative stress in tissue. GSH levels measurably decline with age: compared to young adults, tissue levels in older individuals are estimated to be **20–40% lower**.

      ## The Core Problem: Oral Bioavailability

      Glutathione's reputation far exceeds its practical supplementability via the oral route.

      **The problem:** Oral glutathione (standard form) is broken down in the gastrointestinal tract by peptidases — primarily gamma-glutamyltranspeptidase (GGT) in the intestinal epithelium — into its constituent amino acids before systemic absorption can occur. The landmark Witschi study (1992, PMID 1618779) established this clearly: **a single 3 g oral dose of glutathione did not raise plasma GSH levels** — the tripeptide failed to arrive intact.

      This means the standard outcome with oral GSH is that the body receives glutamate, cysteine, and glycine as building blocks — not the finished antioxidant machinery. Since **cysteine** is the rate-limiting amino acid for endogenous GSH synthesis, this may provide indirect benefit. But that is a fundamentally different claim from "glutathione is directly supplemented."

      ## Formulation Alternatives

      Newer approaches attempt to improve bioavailability:

      **Liposomal Glutathione:** GSH encapsulated in liposomes (lipid vesicles) partially bypasses gastrointestinal degradation. Richie et al. (2015, PMID 25602346) and Sinha et al. (2018, PMID 29062122) consistently show elevated blood GSH levels at 500 mg/day over 4–6 weeks (increases of ~30–52% in erythrocytes and whole blood). Clinical endpoints — disease prevention, physical performance, aging biomarkers — were not investigated in either trial.

      **S-Acetyl Glutathione (SAG):** Acetylation protects the thiol group from oxidation and improves membrane permeability. Promising in vitro; human studies are sparse.

      **Intravenous Glutathione (IV-GSH):** Bypasses the oral bioavailability problem entirely. Used medically in specific conditions — symptom relief in Parkinson's disease (small trials), skin lightening in some Asian markets. Not accessible as an over-the-counter supplement.

      ## GSH Precursors as a Strategy

      Rather than supplementing glutathione directly, one can support endogenous GSH synthesis through precursors:

      **N-Acetylcysteine (NAC):** The most extensively studied GSH booster. NAC supplies the rate-limiting amino acid cysteine and is medically established (acetaminophen overdose, acute bronchitis). NAC reliably raises glutathione levels across diverse study populations.

      **Glycine:** Also a glutathione precursor; a glycine + NAC combination demonstrated significant GSH increases and metabolic improvements in a small RCT in older adults.

      **Sulfur-containing foods:** Cruciferous vegetables (broccoli, Brussels sprouts) contain glutathione precursors and raise GSH levels in animal models; human data are less robust.

      ## What Do the Studies Actually Show?

      ### Positive and reasonably supported

      - Liposomal GSH consistently raises blood levels above baseline (Richie 2015, Sinha 2018).
      - NAC as a GSH precursor is well-supported for GSH-deficiency states and established medical indications.
      - IV glutathione has shown clinically measurable effects in small studies (Parkinson's symptoms, neurological recovery).

      ### Weakly supported or unclear

      - Whether elevated blood GSH from oral supplementation improves clinical endpoints has not been demonstrated in controlled trials.
      - No RCTs exist on the long-term effects of oral GSH on aging biomarkers, immune function, or disease incidence in healthy adults.
      - "Detox" claims for glutathione have no specific clinical evidence base.

      ### Not supported

      - Oral GSH supplementation as a reliable method to alter cellular redox status in healthy individuals.
      - Anti-aging effects from GSH supplements in humans.
      - Immune boosting by oral GSH in healthy people.

      ## Dosing

      - **Standard dose (in studies):** 500 mg/day oral or liposomal GSH
      - **More effective alternative:** 600 mg/day NAC (for GSH support in documented deficiency)
      - **Timing:** Fasted or morning intake is commonly recommended; combining with Vitamin C theoretically extends half-life by recycling GSSG back to GSH

      ## Safety

      Glutathione is considered **likely safe** at typical supplement doses. No serious adverse effects were reported in short-term studies lasting up to 6 months. Long-term safety with continuous oral intake has not been adequately studied.

      Note: Glutathione inhibits tyrosinase and is marketed for skin lightening in some Asian markets. This application is not medically approved and is ethically contested; corresponding marketing claims would not be permissible under EU regulations.

      ## EFSA and Regulatory Status

      In the EU, there are **no approved health claims** for glutathione — neither for antioxidant protection, detoxification, nor immune function. The EFSA health claims evaluation system has not positively assessed any such claims for glutathione. Marketing assertions about "detox," "anti-aging," or "immune boosting" for glutathione supplements lack regulatory approval and are not permissible as health claims in the EU.

      Glutathione is not classified as a Novel Food and may be sold as a dietary supplement, provided no unauthorized claims are made.

      ## Honest Limitations

      - Standard oral GSH is pharmacologically problematic: it is cleaved before absorption.
      - Liposomal forms show improved blood levels, but no clinical endpoint studies exist.
      - Most studies on oral GSH are small (n &lt; 60), short (&lt; 6 months), and measure surrogate markers (blood levels), not clinically relevant endpoints.
      - Individual variation in GSH baseline and actual need is large and rarely accounted for in trials.
      - In vitro and animal studies — many of them impressive — do not translate directly to the efficacy of oral supplements in humans.

      ## Bottom Line

      Glutathione carries **a strong biological reputation that has not yet been matched by its performance as an oral supplement**. Its biological centrality is beyond dispute. But oral bioavailability remains the unresolved core problem. Those looking to support endogenous GSH synthesis are likely better served by NAC (600–1200 mg/day) — better studied, cheaper, and directly effective as a cysteine donor. Liposomal glutathione is a meaningful improvement over the standard form, but clinical evidence for real health outcomes in healthy adults is still outstanding.

