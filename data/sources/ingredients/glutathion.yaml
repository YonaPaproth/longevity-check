        Review: Glutathion ist zentral für Redox-Homöostase, Entgiftung und Immunfunktion. Aus der biologischen Zentralität folgt jedoch nicht automatisch ein Nutzen von oralem GSH.
      en: >-
        Review: glutathione is central to redox homeostasis, detoxification, and immune function. However, its biological centrality does not automatically imply a benefit from oral GSH supplementation.
