    body: |
      ## Was ist Fisetin?
      
      Fisetin ist ein **Flavonoid** (Polyphenol), das natürlich in Erdbeeren, Äpfeln, Zwiebeln und Gurken vorkommt – jedoch in so geringen Mengen, dass therapeutische Konzentrationen nur durch Supplementierung erreichbar sind.
      
      Das Besondere an Fisetin: Es gehört zur aufkommenden Klasse der **Senolytics** – Substanzen, die darauf abzielen, **seneszente Zellen** selektiv zu eliminieren. Seneszente Zellen sind Zellen, die aufgehört haben sich zu teilen, aber nicht absterben. Sie schütten entzündliche Signalmoleküle aus (SASP – Senescence-Associated Secretory Phenotype) und gelten als einer der zentralen Treiber des Alterns.
      
      ## Was sind seneszente Zellen?
      
      Im Laufe des Lebens akkumulieren seneszente Zellen im Körper. Sie entstehen durch DNA-Schäden, Telomerverkürzung oder oxidativen Stress. Normalerweise räumt das Immunsystem sie weg – mit zunehmendem Alter gelingt das immer schlechter.
      
      Senolytics versprechen, diese Zellen selektiv zu beseitigen. Das Konzept hat sich in Tierversuchen eindrucksvoll bestätigt: Mäuse, denen regelmäßig seneszente Zellen entnommen wurden, lebten 25–35 % länger bei besserer Gesundheit.
      
      ## Was sagen die Studien wirklich?
      
      ### Tierversuche (eindrucksvoll)
      - Fisetin verlängerte Lebensspanne bei Mäusen um ~10 %
      - Beseitigte seneszente Zellen effizienter als 10 andere getestete Flavonoide
      - Verbesserte kognitive Funktion in Alzheimer-Mausmodellen
      
      ### Humanstudien (sehr früh)
      - Phase-1-Pilot-Studien der Mayo Clinic laufen (NCT03555435)
      - Keine publizierten, belastbaren RCTs bei gesunden Menschen zum Zeitpunkt dieser Bewertung
      - Biomarker-Verbesserungen in frühen Pilotdaten, aber noch keine klinischen Endpunkte
      
      > **Fazit:** Fisetin ist das am besten belegte natürliche Senolytikum im Tierversuch. Als gesundes-Alten-Supplement beim Menschen ist es noch spekulativ. Wer es einsetzt, macht ein informiertes Experiment.
      
      ## Ist Fisetin sicher?
      
      Langzeitdaten beim Menschen fehlen – daher **unzureichende Datenlage** zur Sicherheit einzustufen. In Tierstudien keine Toxizität bei hohen Dosen. Gelegentliche Einnahme (gepulst, nicht täglich) ist das Protokoll in laufenden Studien. Wechselwirkungen mit Antikoagulantien möglich.
      
      ## Einnahmeprotokoll in Studien
      
      Aktuelle Forschungsprotokolle nutzen **gepulste Gaben** (z.B. 20 mg/kg über 2 aufeinanderfolgende Tage, alle 4 Wochen) statt täglicher Einnahme – passend zur Senolytik-Idee, bei der man Zellen beseitigt und dann pausiert. Tägliche Einnahme hat keine belegte zusätzliche Wirkung.

  en:
    summary: >-
      Fisetin is a flavonoid senolytic that clears senescent ('zombie') cells in animal studies. Human trials are ongoing; robust clinical evidence is still lacking.
    evidenceSummary: >-
      Animal studies show lifespan extension and clearance of senescent cells. Small pilot studies in humans suggest reductions in senescent cell biomarkers. Benefits for healthy aging in humans remain unproven; Phase 2 RCTs are ongoing.
    body: |
      ## What Is Fisetin?

      Fisetin is a **flavonoid** (polyphenol) found naturally in strawberries, apples, onions, and cucumbers — but in concentrations so low that therapeutic doses are achievable only through supplementation. A 100 g serving of strawberries, the richest common dietary source, contains roughly 160 µg of fisetin; a 100 mg supplement capsule therefore delivers around 600× the typical dietary amount.

      What sets fisetin apart from most antioxidant flavonoids is its membership in an emerging class of compounds called **senolytics** — agents designed to selectively eliminate **senescent cells**. Senescent cells are cells that have permanently stopped dividing but refuse to undergo programmed death. Instead, they persist in tissues and release a destructive cocktail of pro-inflammatory cytokines, matrix metalloproteinases, and growth factors known as the **Senescence-Associated Secretory Phenotype (SASP)**. Accumulating evidence places SASP-driven chronic low-grade inflammation — sometimes called "inflammaging" — at the center of numerous age-related conditions, from osteoarthritis and cardiovascular disease to neurodegeneration and frailty.

      ## The Biology of Cellular Senescence

      Cells enter senescence in response to DNA damage, telomere shortening, oxidative stress, or aberrant oncogene activation. In youth, the immune system — particularly natural killer (NK) cells — efficiently clears senescent cells before they can accumulate. With age, this immunosurveillance declines, and the senescent cell burden grows.

      Animal experiments have made this concept concrete: in a landmark 2016 study, periodic genetic elimination of p16INK4a-positive senescent cells extended healthy lifespan in mice by 25–35% and delayed multiple age-related pathologies. This set the stage for the pharmaceutical search for small-molecule senolytics.

      ## What the Evidence Actually Shows

      ### Animal Studies (Compelling)

      The pivotal study for fisetin was published by Yousefzadeh et al. (2018, PMID 30279143), which systematically screened 10 flavonoids for senolytic potency in cultured human cells and in aged mice. Fisetin emerged as the **most potent senolytic of the group**. In old mice, fisetin treatment:
      - Reduced levels of p16INK4a and p21 — canonical senescence markers — in multiple tissues
      - Extended **remaining lifespan by approximately 10%** when treatment was initiated late in life
      - Improved physical function scores and reduced frailty indices
      - Reduced the SASP in circulating blood

      A 2017 review by Kirkland & Tchkonia (PMID 28575845) placed fisetin among the most promising natural senolytic candidates, highlighting its favorable safety profile relative to dasatinib, a tyrosine kinase inhibitor used in oncology that also shows senolytic activity but carries substantially more toxicity.

      In neurodegeneration models, Maher (2020, PMID 32131541) reviewed evidence that fisetin protects neurons from oxidative stress and inflammation, activates Sirtuin-1 and AMPK (canonical longevity pathways), and improves spatial memory and reduces amyloid burden in Alzheimer mouse models. AMPK and Sirtuin-1 are the same pathways targeted by metformin and caloric restriction — lending the mechanism biological plausibility.

      ### Human Studies (Very Early Stage)

      Here the picture changes substantially. As of this review, there are **no published, adequately powered RCTs in healthy adults** demonstrating clinical longevity or anti-aging endpoints for fisetin.

      The most prominent ongoing investigation is the Mayo Clinic **AFFIRM-LITE trial (NCT03555435)**: a Phase 2 RCT testing fisetin at 20 mg/kg body weight over 2 consecutive days per month in older adults with elevated frailty markers. Primary endpoints include physical function measures and biomarkers of senescent cell burden (p16INK4a, p21 in skin and adipose biopsies). Results are not yet published.

      A related proof-of-concept study by Justice et al. (2019, PMID 30616726) tested the senolytic combination **dasatinib + quercetin** (D+Q) — not fisetin — in patients with idiopathic pulmonary fibrosis. The trial demonstrated measurable reductions in senescent cell markers in adipose tissue biopsies and improvements in physical function over 3 weeks, providing the first human evidence that pharmacological senolysis is achievable. This makes the fisetin hypothesis more plausible but does not confirm it directly.

      The gap between preclinical and human evidence is worth being explicit about: mice used in fisetin studies receive doses of ~100 mg/kg — far higher than typical human supplement doses — and have a fundamentally different lifespan trajectory and senescence kinetics compared to long-lived humans.

      ## Safety Profile

      Fisetin has a long history as a dietary constituent and appears tolerated in short-term human use. Key considerations:

      - **Long-term human safety data are absent.** The safety rating here is *insufficient data*, not "unsafe."
      - Fisetin inhibits certain cytochrome P450 enzymes (CYP3A4, CYP2C9) and may potentiate anticoagulant medications including warfarin and direct oral anticoagulants. Caution is warranted in patients on blood thinners.
      - Animal studies at very high doses showed no overt toxicity.
      - Ongoing clinical trials use **pulsed dosing protocols** rather than daily supplementation — consistent with the biology of senolytic action, where the goal is to periodically eliminate an accumulated cohort of senescent cells, then pause.

      ## Dosing and Bioavailability

      Typical supplement capsules contain 100–500 mg, often marketed for daily use — a protocol not supported by clinical trial evidence. Ongoing research uses pulsed, weight-based dosing (approximately 20 mg/kg for 2 consecutive days per month, translating to roughly 1,400 mg/day for a 70 kg adult). Daily fisetin supplementation has no demonstrated advantage over pulsed protocols.

      Bioavailability is modest. Fisetin is lipophilic and absorption improves when taken with dietary fat. Some commercial formulations use phospholipid complexes (e.g., phytosomal fisetin) to improve absorption, though clinical evidence for enhanced efficacy of these formulations is limited.

      ## EFSA and Regulatory Status

      Fisetin has **no EFSA-approved health claims**. It is sold as a dietary supplement in the EU without Novel Food classification, as it occurs naturally in common foods. Regulatory approval of any senolytic or anti-aging claim would require robust clinical evidence that does not yet exist.

      ## Bottom Line

      Fisetin is the **best-characterized natural senolytic in preclinical research**, with a mechanistically coherent rationale and impressive animal data. In humans, the evidence base consists of Phase 1/2 safety and biomarker studies — promising in direction but far from conclusive on clinical outcomes.

      Taking fisetin today — particularly using pulsed protocols that mirror clinical trial designs — is an **informed experiment** in the truest sense. The downside risk appears low given the dietary safety history; the potential upside, if the senolytic mechanism translates to humans, could be meaningful. But the uncertainty is real, and anyone supplementing fisetin should understand the substantial gap between mouse lifespan data and human clinical outcomes.

