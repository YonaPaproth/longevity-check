locales:
  de:
    summary: >-
      Apigenin ist ein Flavonoid aus Kamille und Petersilie, das CD38 hemmt – ein Enzym, das NAD+ abbaut. Damit ergänzt es NMN/NR aus einem anderen Winkel. Noch frühe Humanstudien.
    evidenceSummary: >-
      CD38-Hemmung präklinisch vergleichsweise gut untersucht – war mit höheren Werten verbunden NAD+-Spiegel in Mäusen. Erste kleine Humanstudien zeigen Verbesserungen bei Angst und kognitiver Funktion. Direkte gesundes Altern-Effekte beim Menschen nicht untersucht.
    body: |
      ## Was ist Apigenin?
      
      Apigenin ist ein **Flavon** – ein Polyphenol, das natürlich in Kamille (Matricaria chamomilla), Petersilie, Sellerie, Thymian und bestimmten Früchten vorkommt. Historisch ist es vor allem als aktiver Wirkstoff im Kamillentee bekannt, dessen leicht beruhigende Wirkung auf GABA-Rezeptorbindung zurückgeführt wird.
      
      Im Kontext gesunden Alterns hat Apigenin eine zweite, viel spannendere Identität: Es ist ein **CD38-Inhibitor** – und das macht es zu einem interessanten Baustein der NAD+-Strategie.
      
      ## Die CD38/NAD+-Verbindung
      
      **CD38** ist ein Enzym, das NAD+ abbaut – und seine Aktivität steigt mit zunehmendem Alter drastisch an. Forschung von David Sinclair und anderen zeigt: Ein erheblicher Teil des altersbedingten NAD+-Rückgangs wird nicht durch weniger Produktion verursacht, sondern durch **mehr Abbau durch CD38**.
      
      Hier greift Apigenin an: Indem es CD38 hemmt, verlangsamt es den NAD+-Abbau – ohne NAD+ direkt zuzuführen. Das ist ein komplementärer Ansatz zu **NMN oder NR** (die NAD+ von der Synthese-Seite erhöhen).
      
      In der Praxis kombinieren manche gesundes-Alten-Enthusiasten deshalb NMN + Apigenin – Synthese erhöhen und Abbau hemmen gleichzeitig.
      
      ## Was sagen die Studien wirklich?
      
      ### Präklinisch vergleichsweise gut untersucht
      - CD38-Hemmung war mit höheren Werten verbunden NAD+-Spiegel bei alten Mäusen messbar (~50 %)
      - Verbesserte mitochondriale Funktion in Leber und Skelettmuskel
      - Anxiolytische Wirkung über GABA-Rezeptoren (ohne Sedierung)
      - Entzündungshemmung via NF-κB, COX-2
      
      ### Humanstudien: sehr früh
      - Keine RCTs zu NAD+-Effekten beim Menschen zum Zeitpunkt dieser Bewertung
      - Kleine Studien zu Angst und Schlaf (Kamille-Extrakt) – aber mit gemischten Formulierungen
      - Epidemiologisch: hohe Flavon-Aufnahme assoziiert mit weniger kognitiven Einbußen
      
      ### Nicht belegt beim Menschen
      - Direkte NAD+-Erhöhung durch orale Apigenin-Supplementierung
      - Endpunkte zu gesundem Altern
      
      > **Fazit:** Apigenin ist biologisch plausibel als CD38-Inhibitor, aber der Schritt von Mausdaten zu humaner Wirkung ist bei NAD+-Strategien besonders unsicher. Wer NMN supplementiert, hat eine rationale Grundlage, Apigenin zu ergänzen – wer aber keine NAD+-Strategie verfolgt, hat wenig direkte Evidenz.
      
      ## Apigenin als Schlaf-/Angst-Supplement
      
      Separat von der gesundes-Alten-Wirkung: Kamillentee (Apigenin-Quelle) hat tatsächlich milde anxiolytische Eigenschaften. RCTs mit standardisierten Kamille-Extrakten zeigen Reduktion von Angst-Scores bei generalisierten Angststörungen. Das ist ein eigenständiger, etwas besser belegter Nutzen.
      
      ## Ist Apigenin sicher?
      
      Bei üblichen Dosen (25–100 mg/Tag) als **wahrscheinlich sicher** einzustufen. In sehr hohen Dosen zeigten Tierversuche Einfluss auf Schilddrüsenhormone und Reproduktionsfunktion – kein Beleg beim Menschen, aber ein Signal für Vorsicht bei sehr hoher Dosierung.

  en:
    summary: >-
      Apigenin is a flavonoid from chamomile and parsley that inhibits CD38, an enzyme that degrades NAD+. Complements NMN/NR approaches. Early human evidence.
    evidenceSummary: >-
      CD38 inhibition is relatively well-studied preclinically—associated with elevated NAD+ levels in mice. Early small human studies show improvements in anxiety and cognitive function. Direct healthy aging effects in humans have not been investigated.
    body: |
      ## What is Apigenin?

      Apigenin is a **flavone**—a polyphenol naturally found in chamomile (Matricaria chamomilla), parsley, celery, thyme, and certain fruits. Historically, it is best known as the active compound in chamomile tea, whose mild calming effects have been attributed to GABA receptor binding.

      In the context of healthy aging, apigenin has a second, far more compelling identity: it is a **CD38 inhibitor**—and this makes it an intriguing piece of the NAD+ strategy puzzle.

      ## The CD38/NAD+ Connection

      **CD38** is an enzyme that degrades NAD+—and its activity increases dramatically with advancing age. Research by David Sinclair and others demonstrates that a substantial portion of age-related NAD+ decline is not caused by reduced production, but rather by **increased degradation via CD38**.

      This is where apigenin steps in: by inhibiting CD38, it slows NAD+ degradation—without directly supplying NAD+. This is a complementary approach to **NMN or NR** (which elevate NAD+ from the synthesis side).

      In practice, many healthy aging enthusiasts therefore combine NMN + apigenin—increasing synthesis and inhibiting degradation simultaneously.

      ## What Do the Studies Really Say?

      ### Relatively well-studied preclinically
      - CD38 inhibition by apigenin was associated with measurable NAD+ elevation in aged mice (~50%)
      - Improved mitochondrial function in liver and skeletal muscle
      - Anxiolytic effects via GABA receptors (without sedation)
      - Anti-inflammatory effects via NF-κB and COX-2 inhibition

      ### Human studies: very early
      - No RCTs on NAD+ effects in humans at the time of this review
      - Small studies on anxiety and sleep (using chamomile extract)—but with mixed formulations
      - Epidemiologically: high flavone intake is associated with less cognitive decline

      ### Not yet proven in humans
      - Direct NAD+ elevation from oral apigenin supplementation
      - Healthy aging endpoints

      > **Bottom line:** Apigenin is biologically plausible as a CD38 inhibitor, but the leap from mouse data to human effects is particularly uncertain with NAD+ strategies. If you're supplementing NMN, there's a rational basis for adding apigenin—but if you're not pursuing a NAD+ strategy, you have little direct evidence for its use.

      ## Apigenin as a Sleep/Anxiety Supplement

      Separately from healthy aging: chamomile tea (an apigenin source) does have mild anxiolytic properties. RCTs using standardized chamomile extracts show reductions in anxiety scores in generalized anxiety disorder. This is a distinct, somewhat better-supported benefit.

      ## Is Apigenin Safe?

      At typical doses (25–100 mg/day), apigenin is considered **likely safe**. At very high doses, animal studies showed effects on thyroid hormones and reproductive function—no evidence in humans, but a signal for caution at very high dosing.

