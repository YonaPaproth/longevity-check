locales:
  de:
    summary: >-
      Maca wird für Libido, Energie und hormonelle Balance beworben. Die Human-Daten sind da, aber eher klein und nicht so robust wie der Hype.
    evidenceSummary: >-
      Maca ist vor allem für Libido, subjektives Wohlbefinden und menopausale Symptome untersucht. Es gibt positive Signale, aber die Daten sind klein und heterogen. Solide Hormoneffekte oder gesundes Altern-Vorteile sind nicht überzeugend belegt.
    body: |
      ## Was ist Maca?
      
      Maca ist eine Wurzel aus den Anden und wird oft als natürlicher Stoff für **Libido, Energie und hormonelle Balance** verkauft.
      
      ## Reality Check
      
      Es gibt ein paar positive Studien – aber wenig, was nach wirklich harter klinischer Evidenz aussieht.
      
      ## Fazit
      
      Maca ist **sympathisch, aber weich belegt**.

