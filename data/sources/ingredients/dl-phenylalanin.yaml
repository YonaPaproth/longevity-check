locales:
  de:
    summary: >-
      D,L-Phenylalanin kombiniert die Neurotransmitter-Vorstufe L-Phenylalanin mit der D-Form, die körpereigene Endorphine verlängern soll. Moderate Evidenz, ältere Studienlage.
    evidenceSummary: >-
      L-Phenylalanin als Tyrosin-/Dopamin-Vorstufe hat indirekte Evidenz über den Tyrosin-Pathway. D-Phenylalanin als Enkephalinase-Inhibitor wurde in den 1980ern bei Schmerz und Depression untersucht, seither kaum neue Studien.
    body: |
      ## Wirkweise
      
      DLPA ist eine 50/50-Mischung beider Isomere. **L-Phenylalanin** wird zu L-Tyrosin hydroxyliert, dann weiter zu Dopamin → Noradrenalin → Adrenalin. **D-Phenylalanin** soll die Enkephalinase hemmen — ein Enzym, das körpereigene Endorphine abbaut — und so die natürliche Schmerzlinderung verlängern.
      
      ## Evidenzlage
      
      Die Evidenz stammt überwiegend aus den 1970er-80er Jahren. Beckmann (1979) zeigte in einer kleinen Doppelblindstudie DLPA als nicht unterlegen zu Imipramin bei Depression. Für Schmerzlinderung über Enkephalinase-Hemmung gibt es mechanistische Plausibilität, aber keine modernen RCTs. Insgesamt: historisch interessant, aber Replikation fehlt.
      
      ## Sicherheit
      
      Kontraindiziert bei Phenylketonurie (PKU). Nicht mit MAO-Hemmern oder Levodopa kombinieren. Kann bei empfindlichen Personen Kopfschmerzen, Übelkeit oder Angst auslösen. In Studien insgesamt gut verträglich.
      
      ## Dosierung
      
      500–1000 mg pro Tag, nüchtern. Nicht abends (stimulierend über Dopamin-Pathway).

  en:
    summary: >-
      DLPA combines the neurotransmitter precursor L-phenylalanine with the D-form, which may prolong endogenous endorphins. Moderate evidence, older study base.
    evidenceSummary: >-
      L-phenylalanine has indirect evidence via the tyrosine/dopamine pathway. D-phenylalanine as an enkephalinase inhibitor was studied for pain and depression in the 1980s, with few new studies since.
    body: |
      ## Mechanism of Action
      
      DLPA is a 50/50 mixture of both isomers. **L-Phenylalanine** is hydroxylated to L-tyrosine, then further to dopamine → norepinephrine → epinephrine. **D-Phenylalanine** is proposed to inhibit enkephalinase — an enzyme that breaks down endogenous endorphins — thereby prolonging natural pain relief.
      
      ## Evidence
      
      Evidence predominantly dates from the 1970s-80s. Beckmann (1979) showed DLPA as non-inferior to imipramine for depression in a small double-blind trial. For pain relief via enkephalinase inhibition, there is mechanistic plausibility but no modern RCTs. Overall: historically interesting but replication is lacking.
      
      ## Safety
      
      Contraindicated in phenylketonuria (PKU). Do not combine with MAO inhibitors or levodopa. May cause headaches, nausea, or anxiety in sensitive individuals. Generally well-tolerated in studies.
      
      ## Dosage
      
      500–1000 mg per day on an empty stomach. Avoid evening doses (stimulating via dopamine pathway).

