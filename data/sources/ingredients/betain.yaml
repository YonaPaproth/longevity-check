locales:
  de:
    summary: >-
      Betain ist ein natürlicher Methylgruppenspender, der Homocystein abbaut und in Studien mit moderaten Kraft- und Ausdauergewinnen in Verbindung gebracht wird.
    evidenceSummary: >-
      Einige RCTs zeigen Effekte auf Kraft, Körperzusammensetzung und Homocystein-Spiegel. Die Datenlage ist jedoch uneinheitlich, und viele positive Studien wurden von Betain-Herstellern kofinanziert. Langzeitdaten fehlen weitgehend.
    body: |
      ## Was ist Betain?
      
      Betain (chemisch: Trimethylglycin, TMG) ist eine natürlich vorkommende Verbindung, die aus der Aminosäure Glycin mit drei zusätzlichen Methylgruppen besteht. Es kommt in nennenswerten Mengen in **Rote Bete, Weizen, Spinat und Quinoa** vor – mit Rote Bete als besonders reicher Nahrungsquelle (daher der Name).
      
      Betain erfüllt im Körper zwei Hauptfunktionen:
      
      1. **Methylgruppenspender (One-Carbon-Metabolismus):** Betain überträgt eine seiner drei Methylgruppen auf Homocystein und wandelt dieses zu Methionin um – ein wichtiger Schritt im Homocystein-Abbau.
      2. **Osmolyt:** In Zellen wirkt Betain als Schutzstoff gegen osmotischen Stress. Es kann Zellen in Studien helfen, ihren Wasserhaushalt unter Belastung aufrechtzuerhalten.
      
      Als Nahrungsergänzungsmittel wird **Betain-Anhydrat** (wasserfreie Form) verwendet, das in Trainingsboostern und spezifischen Supplements erhältlich ist.
      
      ## Was sagen die Studien wirklich?
      
      ### Positive Befunde
      - Mehrere RCTs zeigen moderate Verbesserungen bei **Kraft, Ausdauer und Körperzusammensetzung** – typischerweise bei 2,5 g/Tag über 6–15 Wochen.
      - Betain kann in Studien **Homocystein-Spiegel senken**, was theoretisch kardiovaskulär relevant sein könnte.
      - Als Osmolyt kann Betain in Studien unter Umständen die **Zellhydratation** verbessern – ein Mechanismus, der dem von Kreatin ähnelt.
      
      ### Limitierungen
      - Viele Betain-Studien haben **kleine Stichproben** (n &lt; 30) und wurden mit Herstellerunterstützung durchgeführt.
      - Ergebnisse sind **inkonsistent**: Einige Studien zeigen Effekte bei Kraft, andere nicht; Körperzusammensetzungs-Daten sind widersprüchlich.
      - Die klinische Bedeutung der Homocystein-Senkung durch Betain (vs. B-Vitamine) ist unklar.
      - Langzeitstudien (&gt;3 Monate) mit harten Endpunkten (Muskelmasse, Leistung, Biomarker) fehlen weitgehend.
      
      > **Bottom Line:** Betain ist ein interessanter Wirkstoff mit plausiblem Mechanismus, aber die Evidenz ist weniger konsistent als bei etablierten Supplements wie Kreatin. Für den Einsatz in der allgemeinen Bevölkerung gibt es keine starke Datengrundlage.
      
      ## Mechanismus: Methylgruppenspender und Osmolyt
      
      ### Homocystein-Stoffwechsel
      Homocystein entsteht als Abbauprodukt von Methionin und ist bei dauerhaft erhöhten Spiegeln mit kardiovaskulären Risiken assoziiert. Betain überträgt eine Methylgruppe auf Homocystein (via Betain-Homocystein-Methyltransferase, BHMT) und wandelt es dabei zu **Methionin** um. Dieser Weg ist besonders aktiv in Leber und Niere.
      
      ### Kraft und Ausdauer
      Der genaue Mechanismus für Leistungseffekte ist noch nicht abschließend geklärt. Diskutiert werden:
      - **Erhöhte Kreatinsynthese** (Betain liefert Methylgruppen für Guanidinoacetat-Methylierung)
      - **Osmolytische Zellanpassung** (verbesserte Zellhydratation ähnlich Kreatin)
      - **Veränderungen bei anabolen Signalwegen** (Insulin-like Growth Factor, mTOR) – aber Daten sind vorläufig
      
      ## Dosierung
      
      - **In Studien verwendet:** 2,5 g/Tag, aufgeteilt auf 2 Gaben (morgens und vor dem Training).
      - Einige Studien verwenden 1,25–3 g/Tag; 2,5 g gilt als gut untersuchter Richtwert.
      - Einnahme mit Mahlzeit wird wegen besserer Verträglichkeit empfohlen.
      
      ## Wechselwirkungen
      
      - **Methionin-reiche Diäten:** Bei sehr hoher Methionin-Zufuhr kann Betain den Homocystein-Spiegel paradoxerweise weniger senken oder ihn sogar erhöhen – da Methionin ebenfalls zu Homocystein abgebaut wird.
      - **B-Vitamine (B6, B12, Folat):** Diese haben ähnliche und ergänzende Effekte auf den Homocystein-Abbau; eine Überversorgung beider Systeme ist selten nötig.
      - Keine bekannten schwerwiegenden Arzneimittelinteraktionen bei üblichen Dosierungen.
      
      ## Ist Betain sicher?
      
      Betain gilt in üblichen Dosierungen (bis ~6 g/Tag) als **wahrscheinlich sicher** für gesunde Erwachsene. In Studien werden keine schwerwiegenden Nebenwirkungen berichtet; gelegentlich treten **Übelkeit oder Magen-Darm-Beschwerden** bei hohen Einzelgaben auf.
      
      Hinweis: Bei sehr hohen Dosen (&gt;6 g/Tag) wurde in einzelnen Studien ein Anstieg des **LDL-Cholesterins** beobachtet – dieser Effekt ist reversibel, aber beachtenswert für Personen mit erhöhten Cholesterin-Ausgangswerten.
      
      Personengruppen, die Rücksprache mit einem Arzt halten sollten:
      - Personen mit Fettstoffwechselstörungen oder erhöhtem LDL
      - Menschen mit Homocystinurie (seltene Erbkrankheit) – hier kann Betain therapeutisch eingesetzt werden, aber unter ärztlicher Aufsicht
      - Schwangere und Stillende (mangelnde Sicherheitsdaten)
      
      ## Regulatorischer Status in Deutschland und der EU
      
      - Betain-Anhydrat ist in der EU **kein Novel Food** und darf als Nahrungsergänzung verkauft werden.
      - **Health Claims:** Die EFSA hat für Betain **keine** Gesundheitsaussagen zugelassen. Homocystein-bezogene Claims – die biologisch plausibel wären – sind für Betain nicht genehmigt. Diese Claims sind für Vitamin B6, B12 und Folsäure vorbehalten.
      - Marketingaussagen zu Kraft, Ausdauer oder Herzgesundheit auf Betain-Produkten sind nicht durch EU-Health-Claims gedeckt.
      
      ## Fazit
      
      Betain ist ein funktioneller Methylgruppenspender mit interessantem Mechanismus im Bereich Aminosäurestoffwechsel und Homocystein-Regulation. Für Kraftsportler gibt es erste Hinweise auf moderate Leistungseffekte, jedoch ist die Evidenz inkonsistent und methodisch begrenzt. Als Longevity-Supplement fehlt die Datenbasis. Wer auf gut belegte Kraft-Supplements setzen will, ist mit Kreatin besser bedient; Betain kann unter Umständen ergänzend interessant sein, ersetzt Kreatin jedoch nicht.

  en:
    summary: >-
      Betaine is a natural methyl donor that lowers homocysteine and shows modest strength gains in some studies, but evidence is inconsistent and limited.
    evidenceSummary: >-
      Some RCTs show effects on strength, body composition, and homocysteine levels. However, data are uneven, many positive studies were manufacturer-funded, and long-term human efficacy for healthy aging is absent.
    body: |
      ## What is betaine?

      Betaine (chemical name: trimethylglycin, or TMG) is a naturally occurring amino acid metabolite found in nutrient-rich foods—notably **red beets (hence the name), spinach, wheat, and quinoa**. It consists of the amino acid glycine with three methyl groups attached. In the body, betaine serves two primary functions:

      1. **One-carbon metabolism / methyl donor:** Betaine transfers one of its three methyl groups to homocysteine via the enzyme betaine-homocysteine methyltransferase (BHMT), converting homocysteine back to methionine. This is a critical step in homocysteine detoxification, particularly in the liver and kidneys.
      2. **Osmolyte:** Inside cells, betaine acts as an osmolyte, protecting cells from dehydration and osmotic stress, particularly under intense exercise conditions.

      In supplements, betaine is supplied as **betaine anhydrous** (water-free form), often found in pre-workout formulations and sports nutrition products.

      ## Mechanisms: Homocysteine reduction and osmolytic support

      ### Homocysteine metabolism
      Homocysteine is an amino acid byproduct of methionine metabolism. Chronically elevated homocysteine (hyperhomocysteinemia) is associated with cardiovascular risk, but whether *lowering* homocysteine actually reduces disease remains debated. Betaine reduces homocysteine via BHMT-mediated remethylation, a real biochemical effect. However, B vitamins (B6, B12, folate) also lower homocysteine via the folate cycle and have stronger clinical evidence for cardiovascular benefit.

      ### Osmolytic and training effects
      Betaine maintains cellular hydration during stress. In theory, better cell hydration supports force production and muscle protein synthesis. The mechanism is similar to creatine, though less directly proven. Proposed anabolic pathways involve mTOR and IGF signaling, but human evidence is limited.

      ## What do the studies show?

      ### Positive findings
      - **Strength and power:** A few RCTs (Cholewa 2013, n=23; Trepanowski 2011, n=24) reported modest improvements in bench press strength, squat performance, or total training volume after 2.5 g/day betaine for 2–4 weeks.
      - **Body composition:** One study (Cholewa 2013) reported modest lean mass gains or fat loss with betaine + training.
      - **Homocysteine:** Olthof & Verhoef (2005) showed that 6 g/day betaine significantly lowered plasma homocysteine in healthy adults, with effects proportional to baseline homocysteine and methionine intake.
      - **Mechanism signals:** Apicella et al. (2013) found betaine enhanced phosphorylation of Akt (a key anabolic signaling node) in muscle post-resistance exercise.

      ### Critical limitations
      - **Small sample sizes:** Most betaine studies are n &lt; 30, limiting statistical power.
      - **Inconsistent outcomes:** Not all studies show strength or body composition gains; results are mixed even among positive investigations.
      - **Short duration:** Trials last 2–4 weeks; long-term efficacy (&gt;8 weeks) is unknown.
      - **Manufacturer funding:** Many positive betaine studies were supported by supplement makers, raising publication bias concerns.
      - **Modest effect sizes:** Where improvements are found, they are typically 3–7% gains, smaller than those from established ergogenic aids like creatine.
      - **Homocysteine reduction vs. cardiovascular benefit:** While betaine lowers homocysteine, it is unclear whether this translates to real cardiovascular or aging benefits. B vitamins (which also lower homocysteine) have stronger clinical endorsement for heart health.

      > **Bottom line:** Betaine has a plausible mechanism and shows modest signals in small studies, particularly for strength. However, evidence is much less consistent than for creatine, and long-term efficacy for longevity or general health is absent.

      ## Dosage in trials

      - **Typical dose:** 2.5 g/day, often split into 2 doses (morning and pre-workout).
      - **Range in studies:** 1.25–6 g/day; 2.5 g is the most studied dose.
      - **Timeframe:** Effects typically assessed after 2–4 weeks, though some studies run 6–12 weeks.

      ## Safety profile

      Betaine is **generally well-tolerated** at supplemental doses (up to ~6 g/day):
      - Occasional GI upset, nausea, or loose stools at higher doses.
      - No organ toxicity reported in short- or medium-term studies.
      - **Potential concern:** At very high doses (&gt;6 g/day), some studies observed modest increases in LDL-cholesterol. This is reversible but worth monitoring in individuals with pre-existing dyslipidemia.
      - Long-term safety (&gt;6 months) has not been rigorously studied.

      ### Special populations needing caution
      - **Elevated cholesterol:** Monitor lipid panel if using high-dose betaine (≥6 g/day).
      - **Homocystinuria (rare genetic condition):** Betaine is used therapeutically but under medical supervision.
      - **Pregnant/nursing:** Insufficient safety data; not recommended.

      ## Interactions

      - **High-methionine diets:** Paradoxically, betaine may be less effective at lowering homocysteine in high-methionine contexts (e.g., very high protein intake), since methionine is a precursor to homocysteine.
      - **B vitamins (B6, B12, folate):** These have complementary homocysteine-lowering effects; combining both systems is seldom necessary.
      - No major drug interactions at typical supplemental doses.

      ## Regulatory status in the EU

      - Betaine anhydrous is **not a novel food** in the EU; it is permitted as a supplement ingredient.
      - **EFSA health claims:** None approved for betaine. Homocysteine-related claims—while biologically plausible—are reserved for B vitamins (B6, B12, folate).
      - Marketing claims about "strength support," "muscle growth," or "heart health" are not evidence-based per EU standards.

      ## Comparison to creatine

      Creatine monohydrate is far better studied, more effective for strength and muscle gain, and cheaper. Betaine is sometimes positioned as an alternative or adjunct:
      - **Creatine:** Strong, consistent evidence for 5–15% strength gains; increases body water; cheaper.
      - **Betaine:** Weaker, less consistent evidence; may not increase water weight; more expensive than creatine.

      For pure strength and muscle building, **creatine is the evidence-backed choice.** Betaine might be a supplementary tool, but it does not replace creatine.

      ## Bottom line

      Betaine is a functional methyl donor with plausible anabolic and homocysteine-lowering mechanisms, but evidence is modest and uneven. For **strength athletes**, a 2.5 g/day trial for 4–6 weeks may be worth testing, especially if combined with creatine and resistance training. For **healthy aging and longevity**, there is no data; if homocysteine reduction is a goal, **B vitamins (especially folate and B12) have stronger clinical support** and should be prioritized. Betaine is not harmful but should be viewed as a speculative add-on rather than a foundation supplement.



