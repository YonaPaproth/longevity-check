    targets: [knochen]
    finding:
      de: >-
        Doppelblind-RCT (n=90, 12 Monate): L. reuteri 6475 (10^10 KBE/Tag) reduzierte Knochenverlust um ~50% vs. Placebo bei Frauen 75-80 Jahre mit niedriger BMD. Tibia-vBMD: -0,83% vs. -1,85%.
      en: >-
        Double-blind RCT (n=90, 12 months): L. reuteri 6475 (10^10 CFU/day) reduced bone loss by ~50% vs. placebo in women aged 75–80 with low BMD. Tibial vBMD: -0.83% vs. -1.85%.
