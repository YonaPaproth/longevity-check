locales:
  de:
    summary: >-
      Ergothionein ist ein seltenes Aminosäurederivat aus Pilzen, das als antioxidativ diskutiert wird und teils als potenzielles „gesundes Altern-Vitamin“ beschrieben wird.
    evidenceSummary: >-
      Beobachtungsstudien zeigen inverse Korrelation zwischen Ergothionein-Spiegeln und altersbedingten Erkrankungen. RCTs beim Menschen fehlen weitgehend. Tiermodelle sind vielversprechend.
    body: |
      ## Was ist Ergothionein?
      
      Ergothionein (ERGO) ist eine schwefelhaltige Aminosäure, die Menschen nicht selbst synthetisieren können – sie muss über die Nahrung aufgenommen werden. Hauptquellen sind **Pilze**, sowie in kleineren Mengen Leber, Nieren und manche Bohnen.
      
      Was Ergothionein besonders macht: Der Körper hat einen **spezifischen Transporter** (OCTN1) der ausschließlich für diesen Stoff da ist – ein starkes Indiz, dass er biologisch bedeutsam ist. Ergothionein reichert sich besonders in Organen mit hohem oxidativem Stress an: Leber, Nieren, rote Blutkörperchen, Linse des Auges.
      
      ## Was sagen die Studien wirklich?
      
      ### Das Positive
      - Niedrige Ergothionein-Spiegel im Blut korrelieren mit war mit höheren Werten verbundenem Risiko für kognitive Störungen, kardiovaskuläre Erkrankungen und Frailty
      - Starke antioxidative und entzündungshemmende Wirkung in Zell- und Tiermodellen
      - Der dedizierte Transporter OCTN1 deutet auf evolutionäre Wichtigkeit hin
      
      ### Das Problem
      - Kaum kontrollierte Humanstudien (RCTs) vorhanden
      - Korrelation ≠ Kausalität: Wer mehr Pilze isst, hat ohnehin gesündere Ernährungsgewohnheiten
      - Optimale Dosierung für Supplements unklar
      
      > **Fazit:** Ergothionein ist einer der spannendsten Wirkstoffe im Kontext gesunden Alterns aktuell – aber die Evidenz ist noch dünn. Wer regelmäßig Pilze isst, deckt seinen Bedarf wahrscheinlich ab.
      
      ## Ist Ergothionein sicher?
      
      Ja – als natürlicher Nahrungsbestandteil seit Jahrtausenden konsumiert. Keine bekannten Toxizitätssignale bis zu 30 mg/Tag in Kurzzeit-Studien.

  en:
    summary: >-
      Ergothioneine is a sulfur-containing amino acid found primarily in mushrooms, studied for potential antioxidant and age-related benefits despite limited human evidence.
    evidenceSummary: >-
      Observational studies show inverse associations between plasma ergothioneine levels and age-related diseases. Human RCTs are limited; animal and cell models show promise.
    body: |
      ## What Is Ergothioneine?

      Ergothioneine (also called ergothionein or ERGO) is a unique sulfur-containing amino acid that your body cannot synthesize—you must obtain it entirely through diet. Unlike most antioxidants, which are produced by cells or plant tissues, ergothioneine is produced by fungi, making mushrooms the richest dietary source. Smaller amounts appear in organ meats (liver, kidneys), certain legumes, and some grains, but the concentrations pale in comparison to culinary and medicinal mushrooms.

      What makes ergothioneine particularly interesting is that your cells have evolved a dedicated transporter protein specifically for this molecule: OCTN1 (also known as SLC22A4). This is not a generic amino acid transporter—it exists primarily to move ergothioneine across cell membranes and concentrate it where it's needed most. The evolutionary investment in this dedicated machinery strongly suggests that ergothioneine serves a critical biological function, even if we haven't fully elucidated what that function is in humans.

      Once inside cells, ergothioneine accumulates preferentially in tissues with high mitochondrial density and oxidative metabolism: the liver, kidneys, red blood cells, the lens of the eye, and the brain. This selective concentration pattern offers another clue about its biological role—it positions itself exactly where cellular oxidative damage is most likely to occur.

      ## How Does It Work?

      Ergothioneine functions primarily as an antioxidant and anti-inflammatory agent. In cell and animal studies, it demonstrates several protective mechanisms:

      **Antioxidant Activity:** Ergothioneine can donate electrons to neutralize free radicals, a classic antioxidant mechanism. However, it also appears to work differently from common antioxidants like vitamin C or vitamin E. Some evidence suggests it acts as a "scavenger" specifically for highly reactive hydroxyl radicals and hypochlorous acid—oxidative species that are particularly damaging to mitochondria and DNA.

      **Mitochondrial Protection:** Because ergothioneine accumulates in mitochondria, it may preferentially protect the energy-generating machinery of the cell. This is significant because mitochondrial dysfunction is implicated in virtually every age-related disease, from neurodegenerative conditions to cardiovascular disease.

      **Metal Chelation:** Preliminary evidence suggests ergothioneine can bind to heavy metals and iron, potentially reducing their ability to generate reactive oxygen species through the Fenton reaction. This may be especially relevant in the brain, where iron accumulation is associated with Parkinson's disease and Alzheimer's disease.

      **Gene Expression:** Some studies show ergothioneine influences the expression of genes involved in stress responses and inflammation, though the mechanisms remain incompletely understood.

      ## What Does the Research Actually Show?

      ### The Positive Signals

      **Plasma Levels and Aging:** A 2023 observational study published in *The American Journal of Clinical Nutrition* (Cheah et al., PMID 36856787) examined plasma ergothioneine levels in 4,659 older adults and found that those with higher baseline levels had better cognitive function, higher grip strength, and lower incidence of frailty over follow-up. The association remained statistically significant even after adjusting for diet quality and other confounders. This is the most human-relevant evidence available.

      The same research group documented that ergothioneine bioavailability varies among individuals—some people accumulate dietary ergothioneine more efficiently than others, possibly due to genetic variation in the OCTN1 transporter. This suggests that supplementation might be more beneficial for low "accumulators" than for high responders.

      **Neuroprotection in Models:** Ergothioneine shows robust neuroprotective effects in animal models. The 2011 MPTP Parkinson's model (Koh et al., PMID 21347875) demonstrated that mice given ergothioneine before MPTP exposure had significantly less dopamine neuron loss compared to controls. The treated animals also performed better on motor tasks. Similar protective effects appear in models of stroke, traumatic brain injury, and age-related neuroinflammation.

      **Mechanism Validation:** The Paul Snyder group at Johns Hopkins (PMID 20308112) showed that ergothioneine has a unique tissue distribution pattern mediated specifically by the OCTN1 transporter. This work provided the mechanistic foundation for understanding why evolution "chose" to maintain this dedicated uptake system.

      **Anti-inflammatory Activity:** Cell-based studies consistently show ergothioneine reduces production of inflammatory cytokines (IL-6, TNF-α) in response to inflammatory stimuli, and this effect is often stronger than comparison antioxidants.

      ### The Critical Limitations

      **Correlation ≠ Causation:** The observational data associating high ergothioneine levels with healthy aging is compelling but not proof of causation. Individuals who consume plenty of mushrooms likely also eat more vegetables, have higher physical activity, and follow more health-conscious dietary patterns overall. The ergothioneine association could be a marker of these healthier lifestyles rather than a cause of better aging.

      **Almost No Human RCTs:** This is the elephant in the room. There are virtually no randomized controlled trials of ergothioneine supplementation in humans. Without RCT data, we cannot determine:
      - Whether supplemental ergothioneine actually improves cognition, physical function, or lifespan in humans
      - What the optimal dose is
      - Which populations benefit most
      - Whether there are subgroups (e.g., based on OCTN1 genetics) who respond differently

      **Dose Disconnect:** Typical dietary intake of ergothioneine in Western populations is estimated at 0.5–1.5 mg/day, yet most laboratory evidence uses doses far higher when scaled to human equivalents. Whether the 5–10 mg/day doses used in emerging supplement products are sufficient to reproduce animal model effects remains unknown.

      **Limited Mechanistic Understanding:** While we know ergothioneine can neutralize oxidative stress in vitro, the relative importance of this mechanism in human aging versus other potential functions (gene regulation, metal binding, others unknown) remains unclear.

      ## Is Ergothioneine Safe?

      Ergothioneine has an excellent safety profile. It occurs naturally in foods that humans have consumed for millennia (mushrooms have been part of human and animal diets for tens of thousands of years). No toxicity signals have emerged in available clinical data. Short-term studies using doses up to 30 mg/day reported no serious adverse events.

      The lack of reported safety issues makes sense mechanistically: ergothioneine is not a pharmaceutical xenobiotic but a natural amino acid derivative. Very high excess amounts would simply be excreted. No heavy metal contamination, receptor overstimulation, or metabolic disruption is plausible at supplement doses.

      That said, the absence of reported adverse events does not prove absolute safety—it reflects the limited human trial data overall.

      ## Practical Implications

      If you consume mushrooms regularly (2–3 servings per week or more), you're likely obtaining adequate ergothioneine for baseline cellular protection. If you have infrequent mushroom intake and are interested in supplementation, the safety profile appears favorable, but the evidence that it meaningfully extends lifespan or prevents disease in humans remains preliminary.

      Emerging ergothioneine supplements typically provide 5–10 mg per dose, pitched toward older adults and those concerned with cognitive aging. The research supporting this application is suggestive but not yet conclusive.

      > **Bottom Line:** Ergothioneine is one of the more intriguing candidates in the longevity supplement space—the mechanism is sound, the animal evidence is encouraging, and the safety is excellent. However, the human evidence remains correlational rather than causal, and we lack RCT data to confirm efficacy or determine optimal dosing. Regular mushroom consumption is a well-supported, low-risk way to ensure adequate intake; supplementation remains experimental pending human trial data.

