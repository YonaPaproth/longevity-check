locales:
  de:
    summary: >-
      Cholin ist essenziell für Zellmembranen, Leber und Acetylcholin. Wichtig bei Unterversorgung – aber nicht jede Cholin-Form hat denselben Nutzen fürs Gehirn.
    evidenceSummary: >-
      Cholin ist ein essenzieller Nährstoff mit klar definierter Rolle in Membranaufbau, Leberstoffwechsel, Methylierung und Neurotransmitter-Synthese. Die EFSA hat 2016 Referenzwerte festgelegt; eine unzureichende Aufnahme kommt in der Praxis vor. Supplement-Nutzen hängt stark von Form, Dosis und Ausgangsstatus ab.
    body: |
      ## Was ist Cholin?
      
      Cholin ist ein **essenzieller Nährstoff**, der 1998 vom US-amerikanischen Institute of Medicine offiziell als solcher anerkannt wurde. Es ist kein klassisches Vitamin – der Körper kann geringe Mengen selbst synthetisieren (hauptsächlich über den PEMT-Pathway in der Leber), aber nicht genug, um den Bedarf zu decken. Cholin muss daher über die Ernährung oder Supplements aufgenommen werden.
      
      Chemisch gesehen ist Cholin ein quaternäres Ammoniumsalz mit der Summenformel [(CH₃)₃N⁺CH₂CH₂OH]. Es ist wasserlöslich, hitzestabil und in vielen tierischen Lebensmitteln konzentriert vorhanden.
      
      ## Physiologische Funktionen
      
      Cholin erfüllt mehrere biologisch bedeutsame Funktionen:
      
      **Zellmembran-Aufbau:** Phosphatidylcholin (PC) ist der wichtigste Phospholipid-Bestandteil aller Zellmembranen und macht ~40–50 % der Phospholipide in menschlichen Zellen aus. Ohne ausreichend Cholin leidet die Membranintegrität.
      
      **Neurotransmitter-Synthese:** Im zentralen und peripheren Nervensystem wird Cholin zu **Acetylcholin** synthetisiert – dem wichtigsten Neurotransmitter für Gedächtnis, Lernen, Motorik und das parasympathische Nervensystem. Das cholinerge System verliert mit dem Alter an Effizienz.
      
      **Leberstoffwechsel und Lipidexport:** Ohne ausreichend Cholin kann die Leber Fett nicht über VLDL-Partikel in den Kreislauf abgeben. Ein Cholinmangel ist eine etablierte experimentelle Methode, um bei Menschen nicht-alkoholische Fettlebererkrankung (NAFLD) zu induzieren – messbar innerhalb weniger Wochen bei cholinarmer Diät.
      
      **Methylierung:** Über die Abbaukette Cholin → Betain → Methionin trägt Cholin zur Methylierung von Homocystein bei. Cholinmangel kann den Homocysteinhaushalt stören, was als Risikofaktor für kardiovaskuläre Erkrankungen gilt.
      
      **Fetalentwicklung:** Cholin ist für die neuronale Entwicklung des Fötus essenziell. Die Hippokampus-Entwicklung, Synaptogenese und Myelinisierung hängen von ausreichend Cholin ab.
      
      ## Bedarf und Versorgungslage
      
      Die EFSA hat 2016 in einem umfassenden [Dietary Reference Values-Gutachten](https://efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2016.4484) Adequate Intake (AI)-Werte für Cholin festgelegt:
      
      | Personengruppe | AI/Tag |
      |---|---|
      | Erwachsene | 400 mg |
      | Schwangere | 480 mg |
      | Stillende | 520 mg |
      
      **Natürliche Quellen:** Cholin ist vor allem in tierischen Lebensmitteln konzentriert: Hühnerei (1 Ei ≈ 125 mg), Rinderleber (100 g ≈ 350 mg), Rinderhack (100 g ≈ 70 mg), Lachs (100 g ≈ 90 mg). Pflanzliche Quellen wie Soja (100 g ≈ 115 mg), Kichererbsen und Brokkoli enthalten Cholin, aber deutlich weniger pro Kalorie.
      
      **Versorgungslücke in der Praxis:** Auswertungen aus DACH und anderen EU-Ländern zeigen, dass ein relevanter Teil der Bevölkerung – besonders Frauen in gebärfähigem Alter, Veganer und Personen über 60 – den AI von 400 mg/Tag nicht erreicht. Vollständig pflanzliche Ernährung ohne gezielte Supplementierung ist diesbezüglich besonders risikobehaftet.
      
      ## Was sagen die Studien wirklich?
      
      ### Klar belegt
      
      **Lebergesundheit:** Cholinmangel induziert Leberzellschäden und Fettleber beim Menschen — das ist mechanistisch gut belegt und klinisch reproduzierbar. Supplementierung reversibler Cholinspiegel normalisiert diesen Effekt.
      
      **Fetalentwicklung:** Studien zeigen Zusammenhänge zwischen niedriger mütterlicher Cholinzufuhr und erhöhtem Risiko für Neuralrohrdefekte, auch unabhängig von Folsäure (OR ~1,7 im untersten vs. höchstem Aufnahmequintil). Empfehlung: Schwangere sollten aktiv auf 480 mg/Tag Cholin achten.
      
      **Methylierung und Homocystein:** Die biochemische Verbindung zwischen Cholinzufuhr und Homocysteinmetabolismus ist gut etabliert.
      
      ### Gut untersucht, aber mit Einschränkungen
      
      **Kognition im Alter:** Beobachtungsstudien wie die Framingham-Kohorte (n=1.391) zeigen Assoziationen zwischen höherer Cholinzufuhr und besserem verbalem Gedächtnis sowie weniger weißen Substanzläsionen. Aber: Diese Studien sind observational und von Confoundern (Fleischverzehr, Bildung, Gesamternährungsqualität) schwer trennbar.
      
      **Alpha-GPC und CDP-Cholin für Kognition:** RCTs mit hochbioverfügbaren Cholin-Formen (Alpha-GPC, CDP-Cholin) an Personen mit leichter kognitiver Beeinträchtigung zeigen positive Effekte. Ob diese auf gesunde, gut versorgte Erwachsene übertragbar sind, ist unklar.
      
      ### Was nicht belegt ist
      
      - "Mehr Cholin = mehr Fokus" als generelle Aussage ohne Kontextbezug
      - Kognitive Verbesserungen durch Cholinbitartrat allein (schlechte ZNS-Verfügbarkeit)
      - Alzheimer-Prävention oder -Therapie durch Cholin-Supplementierung
      
      ## Supplement-Formen im Vergleich
      
      Nicht alle Cholin-Supplements sind gleich wirksam:
      
      | Form | Cholingehalt | Besonderheit |
      |---|---|---|
      | Cholinbitartrat | ~40 % Cholin | Günstig, schlechte Blut-Hirn-Schranken-Penetration |
      | Phosphatidylcholin | ~15 % Cholin | Aus Sojalecithin; gut für Leber, kaum ZNS |
      | Alpha-GPC | ~40 % Cholin | Überquert Blut-Hirn-Schranke effektiv; in klinischen Studien zu Kognition bevorzugt |
      | CDP-Cholin (Citicolin) | ~18 % Cholin | Liefert zusätzlich Cytidin (Uridinvorläufer); gut ZNS-verfügbar |
      
      Für rein kognitive Zwecke sind **Alpha-GPC** und **CDP-Cholin** den günstigeren Formen vorzuziehen, wenn ZNS-Effekte das Ziel sind.
      
      ## Dosierung
      
      - **Basisversorgung:** 400 mg/Tag Cholin aus allen Quellen (Nahrung + Supplement)
      - **Supplement bei Leberstoffwechsel-Unterstützung:** 250–500 mg Phosphatidylcholin oder Cholinbitartrat/Tag
      - **Kognitive Studien (Alpha-GPC):** 400–1200 mg/Tag wurden in klinischen Studien verwendet
      - **Schwangerschaft:** Mindestens 480 mg/Tag aus allen Quellen; Rücksprache mit Arzt empfohlen
      
      ## Sicherheit und obere Grenzen
      
      Die EFSA und das IOM haben obere Toleranzgrenzen (UL) für Cholin bei **3.500 mg/Tag** für Erwachsene festgelegt. Typische Supplementierungsdosen von 250–1.000 mg/Tag liegen weit darunter.
      
      Mögliche Nebenwirkungen bei deutlicher Überdosierung:
      - Fischiger Körpergeruch (durch Trimethylamin-Bildung im Darm bei hohen Dosen)
      - Hypotonie (Blutdruckabfall)
      - Magen-Darm-Beschwerden
      
      Bei normaler Dosierung sind diese Effekte nicht zu erwarten.
      
      ## EFSA- und regulatorischer Status
      
      In der EU sind für Cholin **Health Claims zugelassen** (Anhang der Verordnung (EU) Nr. 432/2012):
      - Cholin trägt zum normalen Fettstoffwechsel bei.
      - Cholin trägt zur normalen Leberfunktion bei.
      - Cholin trägt zum normalen Homocystein-Stoffwechsel bei.
      
      Diese Claims beziehen sich auf die Erhaltung normaler Körperfunktionen bei ausreichender Zufuhr – nicht auf therapeutische oder kognitive Effekte.
      
      ## Ehrliche Limitierungen
      
      - Die meisten kognitiven Studien zu Cholin sind observational; gut kontrollierte RCTs mit Cholinbitartrat bei gesunden Erwachsenen sind rar.
      - Studien zu Alpha-GPC und CDP-Cholin sind oft klein (n &lt; 60) und an klinischen Populationen durchgeführt.
      - Die Generalisierbarkeit auf gesunde, ausreichend versorgte Erwachsene ist unklar.
      - Cholingehalte in Lebensmitteln sind in vielen Datenbanken unvollständig erfasst, was eine genaue Zufuhrschätzung erschwert.
      - Individuelle Variation im PEMT-Pathway (genetischer Polymorphismus) beeinflusst den Cholin-Bedarf erheblich — ein Faktor, der in Populationsstudien selten kontrolliert wird.
      
      ## Fazit
      
      Cholin ist ein **echter Basisnährstoff** — ohne Hype, aber mit solider biologischer Substanz. Wer tierische Produkte meidet, schwanger ist oder Leberprobleme hat, sollte die eigene Zufuhr prüfen. Als kognitives Supplement ist die Form entscheidend: Cholinbitartrat überquert die Blut-Hirn-Schranke kaum; Alpha-GPC und CDP-Cholin sind hier überlegen. Wer den Grundbedarf gut aus der Ernährung deckt, profitiert wahrscheinlich wenig von zusätzlicher Supplementierung — es sei denn, eine Unterversorgung ist nachgewiesen.

  en:
    summary: >-
      Choline is essential for cell membranes, liver, and acetylcholine production. Important if underprovisioned—but not all choline forms deliver the same brain benefits.
    evidenceSummary: >-
      Choline is an essential nutrient with clearly defined roles in cell membrane structure, liver metabolism, methylation, and neurotransmitter synthesis. The EFSA established reference values in 2016; inadequate intake occurs in practice. The benefits of supplementation depend strongly on form, dose, and baseline status.
    body: |
      ## What Is Choline?

      Choline is an **essential nutrient** officially recognized as such by the US Institute of Medicine in 1998. It is not a classic vitamin—the body can synthesize small amounts endogenously (primarily via the PEMT pathway in the liver), but not enough to meet physiological demands. Choline must therefore be obtained through diet or supplementation.

      Chemically, choline is a quaternary ammonium compound with the molecular formula [(CH₃)₃N⁺CH₂CH₂OH]. It is water-soluble, heat-stable, and concentrated in many animal-derived foods.

      ## Physiological Functions

      Choline fulfills several biologically significant roles:

      **Cell Membrane Structure:** Phosphatidylcholine (PC) is the predominant phospholipid component of all cell membranes, accounting for ~40–50% of phospholipids in human cells. Without adequate choline, membrane integrity is compromised.

      **Neurotransmitter Synthesis:** In the central and peripheral nervous systems, choline is converted to **acetylcholine**—the primary neurotransmitter for memory, learning, motor control, and parasympathetic function. Cholinergic system efficiency declines with age.

      **Liver Metabolism and Lipid Export:** Without sufficient choline, the liver cannot export fat via VLDL particles into circulation. Choline deficiency is an established experimental method to induce non-alcoholic fatty liver disease (NAFLD) in humans—measurable within weeks on a low-choline diet.

      **Methylation:** Through the metabolic pathway choline → betaine → methionine, choline contributes to homocysteine methylation. Choline deficiency can disrupt homocysteine metabolism, considered a cardiovascular risk factor.

      **Fetal Development:** Choline is essential for fetal neurological development. Hippocampal formation, synaptogenesis, and myelination depend on adequate choline availability.

      ## Requirements and Dietary Status

      The EFSA established Adequate Intake (AI) values for choline in a comprehensive 2016 Dietary Reference Values assessment:

      | Population | AI/Day |
      |---|---|
      | Adults | 400 mg |
      | Pregnant women | 480 mg |
      | Lactating women | 520 mg |

      **Natural Sources:** Choline is concentrated in animal-derived foods: one chicken egg (~125 mg), 100 g beef liver (~350 mg), 100 g ground beef (~70 mg), 100 g salmon (~90 mg). Plant sources such as soy (~115 mg per 100 g), chickpeas, and broccoli contain choline but in lower amounts per calorie.

      **Dietary Deficiency Gap:** Data from DACH and other EU regions show that a meaningful proportion of the population—especially women of childbearing age, vegans, and people over 60—do not reach the 400 mg/day AI. Plant-based diets without targeted supplementation are particularly high-risk.

      ## What the Research Actually Shows

      ### Clearly Established

      **Liver Health:** Choline deficiency induces hepatocyte damage and fatty liver in humans—this is mechanistically well-characterized and clinically reproducible. Supplementation that restores choline status normalizes these effects.

      **Fetal Development:** Studies demonstrate associations between low maternal choline intake and increased neural tube defect risk, independent of folate supplementation (OR ~1.7, lowest vs. highest intake quintile). Recommendation: pregnant women should actively target 480 mg/day choline.

      **Methylation and Homocysteine:** The biochemical relationship between choline intake and homocysteine metabolism is well-established.

      ### Well-Studied, But With Limitations

      **Cognition in Aging:** Observational studies such as the Framingham cohort (n=1,391) show associations between higher choline intake and better verbal memory, plus fewer white matter lesions. However: these are observational studies, and confounders (meat consumption, education, overall diet quality) are difficult to disentangle.

      **Alpha-GPC and CDP-Choline for Cognition:** Randomized controlled trials using highly bioavailable choline forms (alpha-GPC, CDP-choline) in people with mild cognitive impairment show positive effects. Whether these translate to healthy, adequately supplied adults is unclear.

      ### Not Established

      - "More choline = more focus" as a blanket statement without context
      - Cognitive improvement from choline bitartrate alone (poor blood-brain barrier penetration)
      - Alzheimer's prevention or treatment through choline supplementation

      ## Supplement Forms Compared

      Not all choline supplements are equally effective:

      | Form | Choline Content | Notes |
      |---|---|---|
      | Choline bitartrate | ~40% choline | Inexpensive; poor blood-brain barrier penetration |
      | Phosphatidylcholine | ~15% choline | From soy lecithin; good for liver, minimal CNS activity |
      | Alpha-GPC | ~40% choline | Crosses blood-brain barrier effectively; preferred in cognitive studies |
      | CDP-Choline (Citicolin) | ~18% choline | Also supplies cytidine (uridine precursor); good CNS availability |

      For primarily cognitive goals, **alpha-GPC** and **CDP-choline** are preferable to cheaper forms when CNS effects are the objective.

      ## Dosing

      - **Baseline supply:** 400 mg/day choline from all sources (food + supplement)
      - **Supplement for liver metabolism support:** 250–500 mg phosphatidylcholine or choline bitartrate daily
      - **Cognitive trials (alpha-GPC):** 400–1,200 mg/day have been used in clinical studies
      - **Pregnancy:** At least 480 mg/day from all sources; physician consultation recommended

      ## Safety and Upper Limits

      The EFSA and IOM have set a tolerable upper limit (UL) of **3,500 mg/day** for adults. Typical supplementation doses of 250–1,000 mg/day are well below this.

      Possible adverse effects from significant overdose:
      - Fishy body odor (via trimethylamine production at high doses)
      - Hypotension (blood pressure drop)
      - Gastrointestinal distress

      At standard dosing, these effects are not expected.

      ## EFSA and Regulatory Status

      In the EU, **health claims for choline are approved** (Annex to Regulation (EU) No. 432/2012):
      - Choline contributes to normal fat metabolism.
      - Choline contributes to normal liver function.
      - Choline contributes to normal homocysteine metabolism.

      These claims relate to maintenance of normal body functions at adequate intake—not therapeutic or cognitive claims.

      ## Honest Limitations

      - Most cognitive studies on choline are observational; well-controlled RCTs with choline bitartrate in healthy adults are rare.
      - Studies on alpha-GPC and CDP-choline are often small (n &lt; 60) and conducted in clinical populations.
      - Generalizability to healthy, adequately supplied adults is uncertain.
      - Choline content in foods is incompletely recorded in many databases, complicating precise intake estimation.
      - Individual variation in the PEMT pathway (genetic polymorphism) significantly influences choline requirements—a factor rarely controlled in population studies.

      ## Conclusion

      Choline is a **genuine foundational nutrient**—not hype, but with solid biological substance. Those who avoid animal products, are pregnant, or have liver issues should assess their intake. As a cognitive supplement, form matters critically: choline bitartrate barely crosses the blood-brain barrier; alpha-GPC and CDP-choline are superior. Those meeting baseline needs well through diet likely benefit little from additional supplementation—unless deficiency is documented.

