locales:
  de:
    summary: >-
      Bor wird für Knochen, Hormone und Entzündung diskutiert. Mechanistisch interessant, aber die Human-Evidenz bleibt bislang eher dünn.
    evidenceSummary: >-
      Bor ist kein klassischer Star-Nährstoff, wird aber wegen möglicher Effekte auf Knochenstoffwechsel, Entzündungsmarker und Hormonmetabolismus diskutiert. Die Human-Evidenz ist begrenzt und überwiegend explorativ.
    body: |
      ## Was ist Bor?
      
      Bor ist ein Spurenelement, das in der Supplement-Bubble häufig als unterschätzter Stoff für **Knochen, Hormone oder Entzündung** diskutiert wird.
      
      ## Was ist der Stand?
      
      - Mechanistisch interessant
      - Klinisch noch eher dünn belegt
      - Kein Wirkstoff, bei dem man schon von einem soliden Konsens sprechen kann
      
      ## Fazit
      
      Bor ist eher ein **„maybe interesting“** als ein evidenzstarker Basisstoff.

