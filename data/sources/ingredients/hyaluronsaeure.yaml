locales:
  de:
    summary: >-
      Körpereigenes Glycosaminoglykan mit hoher Wasserbindungskapazität. Mehrere RCTs belegen moderate Effekte auf Hautfeuchtigkeit und Faltenreduktion; orale Gelenkdaten schwächer.
    evidenceSummary: >-
      Mehrere RCTs zeigen moderate, aber konsistente Effekte auf Hautfeuchtigkeit, Elastizität und Faltenreduktion bei oraler Einnahme von 120–240 mg/Tag. Eine Meta-Analyse (2025) über 7 RCTs bestätigt statistisch signifikante Verbesserungen für Haut. Gelenkdaten beruhen auf schwächeren Studien und sind weniger überzeugend.
    body: |
      ## Was ist Hyaluronsäure?
      
      Hyaluronsäure (Hyaluronan, HA) ist ein **körpereigenes Glycosaminoglykan** — eine lange Kette aus Zuckermolekülen (Disaccharid-Einheiten aus Glucuronsäure und N-Acetylglucosamin), die im menschlichen Körper natürlich vorkommt. Ihre herausragende Eigenschaft: Sie kann das bis zu 1.000-fache ihres Eigengewichts an Wasser binden und gilt damit als einer der effektivsten biologischen Feuchtigkeitsspeicher.
      
      ### Verteilung im Körper
      
      - **Haut (~50 %** des gesamten HA-Pools): Dermis und Epidermis, zuständig für Gewebehydrierung, Stützstruktur und Wundheilung
      - **Gelenkknorpel und Synovialflüssigkeit**: Puffer und Schmierstoff im Gelenk
      - **Augen**: Der Glaskörper besteht zu einem Großteil aus HA
      - **Bindegewebe**: Trägermedium in der extrazellulären Matrix
      
      ### Altersbedingte Abnahme
      
      Ab dem 25. Lebensjahr nimmt die körpereigene HA-Synthese kontinuierlich ab. Mit 50 Jahren verfügt die Haut über schätzungsweise die Hälfte der HA-Menge eines 20-Jährigen. Dieser Rückgang gilt als einer der biochemischen Treiber von Hautaustrocknung, Elastizitätsverlust und Faltenbildung.
      
      ---
      
      ## Mechanismus: Wie wirkt orale Hyaluronsäure?
      
      Lange war umstritten, ob oral aufgenommene HA überhaupt wirksam werden kann — Magen und Darm bauen hochmolekulare Polymere normalerweise ab. Neuere Forschung hat diesen Mechanismus besser aufgeklärt.
      
      ### Absorption und Verteilung
      
      Oral eingenommene HA wird im Darm durch Hyaluronidasen in kleinere Oligosaccharide und Disaccharide gespalten. Diese Fragmente werden nachweislich absorbiert und gelangen in den Blutkreislauf. Radioisotopenmarkierte Studien zeigen, dass HA-Abbauprodukte anschließend bevorzugt in Haut-Fibroblasten akkumulieren.
      
      ### Stimulation endogener HA-Synthese
      
      Niedermolekulare HA-Oligosaccharide wirken als Signalmoleküle und können die Expression von HA-Synthasen (HAS1, HAS2) in Fibroblasten stimulieren — die körpereigene HA-Produktion wird also angeregt, nicht einfach von außen ersetzt.
      
      ### Molekulargewicht: High-MW vs. Low-MW vs. Hydrolysat
      
      | Typ | Molekulargewicht | Orale Bioverfügbarkeit | Bemerkung |
      |---|---|---|---|
      | High-MW HA | &gt;1.000 kDa | gering | Schlechte Absorption, eher für topische Anwendung |
      | Low-MW HA | &lt;50 kDa | besser | Passiert Darmbarriere leichter |
      | Hydrolysiertes HA | variabel | am besten | Gezielt für orale Supplements optimiert |
      | Full-Spectrum HA | breites Spektrum | gut | Alle MW-Fraktionen; untersucht in Michelotti 2021 |
      
      Für orale Supplements wird daher zu hydrolysierter oder niedermolekularer HA geraten — oder zu Full-Spectrum-Formulierungen, die alle Größenfraktionen abdecken.
      
      ---
      
      ## Studienlage: Haut
      
      ### Überblick
      
      Die Evidenz für orale HA bei Hautalterung hat sich zwischen 2014 und 2025 erheblich verdichtet. Es liegen mindestens 7 randomisierte, kontrollierte Studien (RCTs) vor, die in einer Meta-Analyse zusammengefasst wurden.
      
      ### Meta-Analyse 2025 (Amin et al., PMID 40911749)
      
      Die bislang umfassendste Auswertung poolte Daten aus 7 RCTs und fand **statistisch signifikante Verbesserungen** für:
      - Hautfeuchtigkeit (Hydration)
      - Hautelastizität
      - Faltentiefe (Wrinkle Depth)
      
      Nicht signifikant, aber mit positivem Trend: transepidermaler Wasserverlust (TEWL), Faltenvolumen, Hauthärte. Die Autoren betonen, dass heterogene Studiendesigns (unterschiedliche HA-Typen, Dosierungen, Messmethoden) die Vergleichbarkeit einschränken und größere Folgestudien nötig sind.
      
      ### RCT 2025: Dolečková et al. (PMID 41422283)
      
      Bislang eine der methodisch stärksten Einzel-Studien zur oralen HA:
      
      - **Design**: Randomisiert, doppelblind, Placebo-kontrolliert
      - **N = 150** gesunde kaukasische Erwachsene
      - **Intervention**: Natriumhyaluronat (1,8 MDa), 60 mg oder 120 mg/Tag, **12 Wochen**
      - **Ergebnis bei 120 mg/Tag**:
        - Signifikant verbesserte Hautfeuchtigkeit an mehreren Körperstellen
        - Reduzierte TEWL (Barrierefunktion verbessert)
        - Verringerte periorbitale Faltentiefe
        - Erhöhte Epidermisdicke und Dermisdichte im Ultraschall
        - Erhöhte NMF-Spiegel (Natural Moisturizing Factor)
      
      Die 60-mg-Gruppe zeigte ähnliche, aber schwächere Effekte. Keine Veränderungen in kolorimetrischen Parametern oder Porengröße.
      
      ### RCT 2021: Michelotti et al. (PMID 34933842)
      
      - **Design**: Randomisiert, doppelblind, Placebo-kontrolliert
      - **N = 60** Frauen mit leicht bis moderat gealteter Haut
      - **Intervention**: 200 mg/Tag Full-Spectrum-Hyaluronan, **28 Tage**
      - **Ergebnisse**:
        - Hautfeuchtigkeit: **+10,6 %**
        - Faltentiefe: **−18,8 %**
        - Faltenvolumen: **−17,6 %**
        - Elastizität/Festigkeit: **+5,1 %**
      
      Alle gemessenen Parameter zeigten statistisch signifikante Verbesserungen. Bemerkenswert ist, dass diese Effekte bereits nach 4 Wochen eintraten.
      
      ### RCT 2014: Kawada et al. (PMID 25013132)
      
      - **Design**: Randomisiert, doppelblind, Placebo-kontrolliert
      - **N = 96** Personen
      - **Intervention**: 120 oder 240 mg/Tag orales Hyaluronan, **12 Wochen**
      - **Ergebnisse**: Signifikante Verbesserung der Hautfeuchtigkeit und Unterdrückung der Faltenbildung gegenüber Placebo. Eine der ersten größeren RCTs zur oralen HA-Supplementierung.
      
      ### Einordnung
      
      Die Studienlage für Haut ist für ein Nahrungsergänzungsmittel vergleichsweise solide. Die Effekte sind **konsistent aber moderat** — keine dramatischen Transformationen, aber wiederholbar messbare Verbesserungen. Wichtige Einschränkungen:
      
      - Studien dauern meist 4–12 Wochen; Langzeitdaten fehlen
      - Viele Studien werden von Herstellern finanziert
      - HA-Typ, Molekulargewicht und Dosis variieren stark zwischen Studien
      - Messmethoden (Profilometrie, Korneometrie, Ultraschall) sind nicht immer direkt vergleichbar
      
      ---
      
      ## Studienlage: Gelenke
      
      Die Evidenz für orale HA bei Gelenkbeschwerden ist **deutlich schwächer** als für Haut.
      
      Kalman et al. (2008) untersuchten orale HA bei Knieschmerzen in einer Pilot-Studie und fanden Hinweise auf eine Schmerzlinderung — die Stichprobengröße war jedoch klein und unabhängige Replikationen fehlen. Intraartikuläre HA-Injektionen (direkt in das Gelenk gespritzt) sind klinisch deutlich besser belegt, aber diese Evidenz ist nicht auf orale Supplemente übertragbar.
      
      Der Mechanismus über die Darmbarriere bis hin zur Synovialflüssigkeit ist biologisch plausibel, aber bislang wenig direkt untersucht. Wer gezielt Gelenkunterstützung sucht, hat mit Kollagen-Peptiden eine etwas besser belegte Alternative.
      
      ---
      
      ## Dosierung & Einnahme
      
      | Parameter | Empfehlung |
      |---|---|
      | **Typische Dosis** | 80–240 mg/Tag (gut untersucht: 120–200 mg) |
      | **Bevorzugte Form** | Hydrolysiert oder niedermolekular (&lt;300 kDa) für bessere Absorption |
      | **Einnahmezeitpunkt** | Keine bekannten Präferenzen; mit oder ohne Mahlzeit |
      | **Wirkungseintritt** | Erste Effekte nach ~4 Wochen, vollständiger nach 8–12 Wochen |
      
      Die Studie von Dolečková et al. (2025) zeigt, dass 120 mg/Tag genauso wirksam sein kann wie höhere Dosen. 240 mg bieten nach aktuellem Stand keinen klar stärkeren Effekt.
      
      ---
      
      ## EFSA & Regulierung in der EU
      
      In der EU sind für orale Hyaluronsäure **keine gesundheitsbezogenen Angaben (Health Claims) nach VO (EG) 1924/2006** zugelassen. Das bedeutet konkret:
      
      **Nicht zulässig auf Produktverpackungen oder in der Werbung:**
      - „Verbessert Haut und Gelenke"
      - „Reduziert Falten"
      - „Beugt Gelenkverschleiß vor"
      
      **Was kommuniziert werden darf:**
      - Neutrale Inhaltsstoffdeklaration auf dem Etikett
      - Beschreibung der Substanz (Glycosaminoglykan, körpereigen)
      - Studienzitate, die als solche klar erkennbar sind
      
      Wer in Deutschland Hyaluronsäure-Supplements kauft, sollte wissen, dass sämtliche Hautpflege- und Gelenkversprechen auf den Verpackungen **rechtlich nicht abgedeckt** sind — auch wenn die Forschungslage das grundsätzliche Potenzial bestätigt.
      
      ---
      
      ## Sicherheit
      
      Orale Hyaluronsäure gilt als gut verträglich. In klinischen Studien wurden keine schwerwiegenden Nebenwirkungen berichtet. Gelegentlich wurden leichte gastrointestinale Beschwerden erwähnt, die selten auftreten.
      
      ### Theoretischer Vorbehalt: Tumorbiologie
      
      In der wissenschaftlichen Literatur gibt es Hinweise, dass Hyaluronsäure das Wachstum bestimmter Tumoren begünstigen kann — HA-Rezeptoren wie CD44 werden in manchen Krebszelltypen überexprimiert. Ob dieser Effekt bei oraler Supplementierung in physiologisch relevanten Mengen zum Tragen kommt, ist **nicht belegt** und bleibt theoretisch. Personen mit bestehenden Krebserkrankungen sollten vor der Einnahme Rücksprache mit ihrem Arzt halten.
      
      ### Kontraindikationen und Wechselwirkungen
      
      - Keine bekannten Interaktionen mit Standardmedikamenten
      - Schwangerschaft und Stillzeit: keine Humandaten zur oralen Supplementierung — Vorsicht empfohlen
      - Tumorerkrankungen: theoretisches Vorsichtsgebot (siehe oben)
      
      ---
      
      ## Fazit
      
      Hyaluronsäure ist **kein Hype-Supplement ohne Substanz**, aber auch kein Wundermittel. Die Datenlage für orale Einnahme und Hautparameter ist inzwischen eine der solideren im Bereich kosmetischer Nahrungsergänzungsmittel — mehrere RCTs mit konsistenten Ergebnissen, zusammengefasst in einer Meta-Analyse von 2025.
      
      Die Studienlage für orale Hyaluronsäure bei Hautparametern ist inzwischen eine der solideren im Bereich kosmetischer Nahrungsergänzungsmittel — mehrere RCTs mit konsistenten Ergebnissen, zusammengefasst in einer Meta-Analyse von 2025. Für Gelenke bleibt die Evidenz schwach.

  en:
    summary: >-
      Endogenous glycosaminoglycan with high water-binding capacity. Multiple RCTs demonstrate moderate effects on skin hydration and wrinkle reduction; oral joint data weaker.
    evidenceSummary: >-
      Multiple RCTs demonstrate moderate but consistent effects on skin hydration, elasticity, and wrinkle reduction at oral doses of 120–240 mg/day. A 2025 meta-analysis of 7 RCTs confirms statistically significant improvements for skin. Joint data rely on weaker studies and are less convincing.
    body: |
      ## What is Hyaluronic Acid?

      Hyaluronic acid (hyaluronate, HA) is an **endogenous glycosaminoglycan**—a long chain of sugar molecules (disaccharide units composed of glucuronic acid and N-acetylglucosamine) that naturally occurs in the human body. Its outstanding property: it can bind up to 1,000 times its own weight in water, making it one of the most effective biological hydration reservoirs.

      ### Distribution in the Body

      - **Skin (~50% of the total HA pool)**: dermis and epidermis, responsible for tissue hydration, structural support, and wound healing
      - **Joint cartilage and synovial fluid**: buffer and lubricant in the joint
      - **Eyes**: the vitreous humor is largely composed of HA
      - **Connective tissue**: carrier medium in the extracellular matrix

      ### Age-Related Decline

      Beginning around age 25, endogenous HA synthesis declines continuously. By age 50, skin contains approximately half the HA of a 20-year-old. This decline is considered one of the biochemical drivers of skin dryness, loss of elasticity, and wrinkle formation.

      ---

      ## Mechanism: How Does Oral Hyaluronic Acid Work?

      For a long time it was controversial whether orally ingested HA could be effective at all—the stomach and intestines normally break down high-molecular-weight polymers. Recent research has clarified this mechanism.

      ### Absorption and Distribution

      Orally ingested HA is broken down in the intestines by hyaluronidases into smaller oligosaccharides and disaccharides. These fragments are demonstrably absorbed and enter the bloodstream. Radioisotope-labeled studies show that HA degradation products subsequently accumulate preferentially in skin fibroblasts.

      ### Stimulation of Endogenous HA Synthesis

      Low-molecular-weight HA oligosaccharides act as signaling molecules and can stimulate the expression of HA synthases (HAS1, HAS2) in fibroblasts—endogenous HA production is stimulated, not simply replaced from outside.

      ### Molecular Weight: High-MW vs. Low-MW vs. Hydrolysate

      | Type | Molecular Weight | Oral Bioavailability | Remark |
      |---|---|---|---|
      | High-MW HA | &gt;1,000 kDa | poor | Poor absorption, better for topical application |
      | Low-MW HA | &lt;50 kDa | better | Passes intestinal barrier more easily |
      | Hydrolyzed HA | variable | best | Specifically optimized for oral supplements |
      | Full-spectrum HA | broad spectrum | good | All MW fractions; examined in Michelotti 2021 |

      For oral supplements, hydrolyzed or low-molecular-weight HA is therefore recommended—or full-spectrum formulations that cover all size fractions.

      ---

      ## Evidence Base: Skin

      ### Overview

      The evidence for oral HA in skin aging has substantially increased between 2014 and 2025. There are at least 7 randomized, controlled trials (RCTs) that have been summarized in a meta-analysis.

      ### Meta-Analysis 2025 (Amin et al., PMID 40911749)

      The most comprehensive review to date pooled data from 7 RCTs and found **statistically significant improvements** for:
      - Skin hydration
      - Skin elasticity
      - Wrinkle depth

      Not significant but with positive trend: transepidermal water loss (TEWL), wrinkle volume, skin firmness. The authors emphasize that heterogeneous study designs (different HA types, dosages, measurement methods) limit comparability and larger follow-up studies are needed.

      ### RCT 2025: Dolečková et al. (PMID 41422283)

      Currently one of the methodologically strongest individual studies on oral HA:

      - **Design**: Randomized, double-blind, placebo-controlled
      - **N = 150** healthy Caucasian adults
      - **Intervention**: Sodium hyaluronate (1.8 MDa), 60 mg or 120 mg/day, **12 weeks**
      - **Results at 120 mg/day**:
        - Significantly improved skin hydration at multiple body sites
        - Reduced TEWL (barrier function improved)
        - Decreased periorbital wrinkle depth
        - Increased epidermal thickness and dermal density on ultrasound
        - Elevated NMF levels (Natural Moisturizing Factor)

      The 60-mg group showed similar but weaker effects. No changes in colorimetric parameters or pore size.

      ### RCT 2021: Michelotti et al. (PMID 34933842)

      - **Design**: Randomized, double-blind, placebo-controlled
      - **N = 60** women with mild to moderately aged skin
      - **Intervention**: 200 mg/day full-spectrum hyaluronate, **28 days**
      - **Results**:
        - Skin hydration: **+10.6%**
        - Wrinkle depth: **−18.8%**
        - Wrinkle volume: **−17.6%**
        - Elasticity/firmness: **+5.1%**

      All measured parameters showed statistically significant improvements. Notably, these effects occurred within 4 weeks.

      ### RCT 2014: Kawada et al. (PMID 25013132)

      - **Design**: Randomized, double-blind, placebo-controlled
      - **N = 96** subjects
      - **Intervention**: 120 or 240 mg/day oral hyaluronate, **12 weeks**
      - **Results**: Significant improvement in skin hydration and suppression of wrinkle formation versus placebo. One of the first larger RCTs on oral HA supplementation.

      ### Assessment

      The evidence base for skin is comparatively solid for a dietary supplement. The effects are **consistent but moderate**—no dramatic transformations, but repeatedly measurable improvements. Important limitations:

      - Studies typically last 4–12 weeks; long-term data are lacking
      - Many studies are financed by manufacturers
      - HA type, molecular weight, and dosage vary substantially between studies
      - Measurement methods (profilometry, corneometry, ultrasound) are not always directly comparable

      ---

      ## Evidence Base: Joints

      The evidence for oral HA in joint complaints is **substantially weaker** than for skin.

      Kalman et al. (2008) examined oral HA in knee pain in a pilot study and found evidence of pain relief—however, the sample size was small and independent replications are lacking. Intra-articular HA injections (injected directly into the joint) are clinically much better documented, but this evidence is not transferable to oral supplements.

      The mechanism via the intestinal barrier to synovial fluid is biologically plausible but has been little directly investigated. Those specifically seeking joint support have collagen peptides as a somewhat better-documented alternative.

      ---

      ## Dosage & Administration

      | Parameter | Recommendation |
      |---|---|
      | **Typical dose** | 80–240 mg/day (well-studied: 120–200 mg) |
      | **Preferred form** | Hydrolyzed or low-molecular-weight (&lt;300 kDa) for better absorption |
      | **Time of intake** | No known preferences; with or without food |
      | **Onset of action** | First effects after ~4 weeks, complete after 8–12 weeks |

      The study by Dolečková et al. (2025) shows that 120 mg/day can be just as effective as higher doses. 240 mg offer no clearly stronger effect by current standards.

      ---

      ## EFSA & Regulation in the EU

      In the EU, **no health claims under Regulation (EC) 1924/2006** are approved for oral hyaluronic acid. This means specifically:

      **Not permitted on product packaging or in advertising:**
      - "Improves skin and joints"
      - "Reduces wrinkles"
      - "Prevents joint degeneration"

      **What can be communicated:**
      - Neutral ingredient declaration on the label
      - Description of the substance (glycosaminoglycan, endogenous)
      - Study citations that are clearly identifiable as such

      Anyone buying hyaluronic acid supplements in Germany should know that all skin care and joint promises on the packaging are **not legally covered**—even if the research shows the basic potential.

      ---

      ## Safety

      Oral hyaluronic acid is considered well-tolerated. No serious adverse effects were reported in clinical studies. Mild gastrointestinal complaints were occasionally mentioned, occurring rarely.

      ### Theoretical Caveat: Tumor Biology

      In the scientific literature, there are indications that hyaluronic acid may promote the growth of certain tumors—HA receptors such as CD44 are overexpressed in some cancer cell types. Whether this effect comes into play with oral supplementation at physiologically relevant amounts is **not established** and remains theoretical. People with existing cancer should consult their doctor before taking this supplement.

      ### Contraindications and Interactions

      - No known interactions with standard medications
      - Pregnancy and lactation: no human data on oral supplementation—caution recommended
      - Tumor diseases: theoretical precautionary principle (see above)

      ---

      ## Conclusion

      Hyaluronic acid is **neither a hype supplement without substance nor a miracle cure**. The evidence base for oral intake and skin parameters is now among the more solid in the field of cosmetic dietary supplements—multiple RCTs with consistent results, summarized in a 2025 meta-analysis. For joints, the evidence remains weak.

