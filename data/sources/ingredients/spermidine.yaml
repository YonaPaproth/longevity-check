  en: >-
    No EFSA-approved health claims exist for spermidine. As a substance naturally found in food (wheat germ, soybeans, aged cheese), spermidine is recognised as a food component in the EU. High-concentration supplements (>5 mg/day) occupy a regulatory grey zone depending on dosage — marketable in Germany as a food supplement, but without any permitted health-related claims.

