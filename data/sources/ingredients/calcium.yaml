locales:
  de:
    summary: >-
      Essenzieller Mineralstoff für Knochen, Muskeln und Nerven. Meta-Analysen belegen moderate Knocheneffekte bei Defizit; hochdosierte Supplemente sind kardiovaskulär nicht risikofrei.
    evidenceSummary: >-
      Mehrere Meta-Analysen belegen: Calcium-Supplementation erhöht die Knochenmineraldichte moderat und kann Frakturrisiko bei Defizit senken. Bei veganer oder kalziumarmer Ernährung klar sinnvoll. Hohe Supplementdosen (>1.000 mg/Tag) werden in Meta-Analysen mit leicht erhöhtem kardiovaskulärem Risiko assoziiert. EFSA-Claims für Knochen, Muskeln und Signalübertragung sind zugelassen.
    body: |
      ## Was ist Calcium?
      
      Calcium ist der **mengenmäßig wichtigste Mineralstoff im menschlichen Körper**: Etwa 99 % des Gesamtcalciums sind in Knochen und Zähnen als Hydroxylapatit gespeichert und verleihen diesen ihre Festigkeit. Das restliche 1 % befindet sich im Blut und Weichgewebe — doch genau dieses kleine Reservoir ist für lebenswichtige Funktionen unentbehrlich.
      
      Im deutschsprachigen Raum liefern Milchprodukte den größten Teil der Calcium-Zufuhr. Wer keine Milchprodukte konsumiert — sei es aus Laktoseintoleranz, Veganismus oder Präferenz — muss aktiv auf alternative Quellen achten.
      
      ### Calcium im Körper
      
      | Funktion | Bedeutung |
      |---|---|
      | Knochen- und Zahnstruktur | 99 % des Körper-Calciums; Umbau ~10 % pro Jahr |
      | Muskelkontraktion | Calcium-Ionen lösen Aktin-Myosin-Bindung aus |
      | Nervenleitung | Signalübertragung an Synapsen |
      | Blutgerinnung | Cofaktor mehrerer Gerinnungsfaktoren (Faktor II, VII, IX, X) |
      | Enzymaktivierung | Aktiviert Verdauungsenzyme und Proteasen |
      
      ### Wichtige Nahrungsquellen
      
      - **Kuhmilch / Jogurt**: ~120 mg/100 ml
      - **Hartkäse (Parmesan, Emmentaler)**: 800–1.200 mg/100 g
      - **Grünkohl, Brokkoli**: 150–200 mg/100 g (hohe Bioverfügbarkeit)
      - **Tofu (mit Calciumsulfat gefällt)**: 200–350 mg/100 g
      - **Angereicherte Pflanzenmilch**: 120 mg/100 ml (entspricht Kuhmilch)
      - **Sesam (ungeschält)**: ~780 mg/100 g, aber Bioverfügbarkeit durch Oxalate reduziert
      
      ---
      
      ## Mechanismus: Wie reguliert der Körper Calcium?
      
      Der Calcium-Haushalt ist hormonell eng reguliert — eine Leistung, die zuverlässiger ist als jedes Supplement.
      
      ### Hormonelle Steuerung
      
      **Parathormon (PTH)** wird bei niedrigem Blutcalcium ausgeschüttet und aktiviert drei Achsen:
      1. Knochenresorption (Osteoklasten lösen Calcium aus Knochen)
      2. Nierenrückresorption (weniger Calcium wird im Urin ausgeschieden)
      3. Vitamin-D-Aktivierung (1,25-OH-D3 steigert Darmabsorption)
      
      **Calcitonin** wirkt gegenregulatorisch: Es hemmt die Osteoklasten bei hohem Blutcalcium.
      
      **Vitamin D (Calcitriol)** ist der entscheidende Schrittmacher: Ohne ausreichend Vitamin D wird Calcium im Darm nur zu 10–15 % absorbiert statt der optimalen 30–40 %. Eine Calcium-Supplementierung ohne begleitend ausreichenden Vitamin-D-Status ist daher deutlich weniger effektiv.
      
      ### Absorption und Verluste
      
      Die Absorptionsrate variiert stark:
      - Milchprodukte: ~30–35 %
      - Pflanzliche Quellen ohne viel Oxalat (Grünkohl, Brokkoli): 40–64 %
      - Spinat, Rhabarber: nur ~5 % (hoher Oxalatgehalt blockiert Absorption)
      - Calcium aus Supplements: Citrat besser absorbiert als Carbonat, besonders nüchtern
      
      Täglich verliert der Körper Calcium über Urin (~150–200 mg) und Schweiß (~30 mg). Hohe Proteindosen und Natriumzufuhr erhöhen die renale Calciumausscheidung.
      
      ---
      
      ## Studienlage
      
      ### Knochen und Frakturprävention
      
      Die Evidenz für Calcium bei Knochengesundheit ist umfangreich — aber differenzierter als Marketing-Botschaften vermuten lassen.
      
      **Meta-Analyse Tai et al. 2017 (PMID 28093633):** Auswertung von randomisierten Studien mit über 50.000 Teilnehmern. Calcium-Supplementierung erhöhte die Knochenmineraldichte (BMD) signifikant um **~0,7–1,8 %** über 2 Jahre an verschiedenen Messstellen (Hüfte, Lendenwirbelsäule, Oberschenkelhals). Eine konsistente Reduktion des Frakturrisikos ließ sich dagegen nicht nachweisen. Fazit der Autoren: BMD-Effekt vorhanden, klinische Relevanz für Frakturprävention unklar.
      
      **Bristow et al. 2015 (PMID 27071884):** Bestätigt, dass der Nutzen vor allem bei unzureichender Ausgangszufuhr (&lt;700 mg/Tag) besteht. Wer bereits über die Nahrung gut versorgt ist, zeigt kaum messbaren Zusatznutzen durch Supplemente.
      
      Das bedeutet: Calcium wirkt knochenprotektiv — aber vor allem, wenn ein Defizit besteht. Eine pauschale Hochdosissupplementierung bei gut versorgten Personen ist weder evidenzbasiert noch unbedenklich.
      
      ### Kardiovaskuläres Risiko: ein unterschätztes Problem
      
      **Myung et al. 2018 (PMID 21505219):** Diese Meta-Analyse aus 10 RCTs ist ernüchternd: Calcium-Supplementierung (ohne Vitamin D) war mit einem **Relativen Risiko (RR) von 1,15** für kardiovaskuläre Ereignisse assoziiert — ein statistisch signifikanter, aber moderater Effekt. Besonders auffällig bei Dosen &gt;1.000 mg/Tag aus Supplements. Calcium aus der Nahrung zeigte kein erhöhtes Risiko.
      
      Hypothetischer Mechanismus: Calcium-Supplements führen zu kurzfristigen Spitzen im Serumcalcium (Hypercalcämie-Episoden), was die Blutgerinnung und Gefäßverkalkung begünstigen könnte — ein Effekt, der bei langsamer Aufnahme aus Nahrung nicht auftritt.
      
      ### Vegane und pflanzlich-betonte Ernährung
      
      **Mangels 2014 (PMID 30958565):** Veganer nehmen im Mittel nur **600–800 mg Calcium pro Tag** auf — deutlich unter dem DGE-Referenzwert von 1.000 mg (für Erwachsene) bzw. 1.200 mg (ab 65 Jahre). Geringe Sonneneinstrahlung und oft gleichzeitig niedriger Vitamin-D-Status erhöhen das Knochengesundheitsrisiko in dieser Gruppe weiter. Pflanzliche Quellen mit hoher Bioverfügbarkeit (Grünkohl, Pak Choi, Tofu, angereicherte Pflanzenmilch) können die Lücke schließen — bei konsequenter Umsetzung.
      
      ---
      
      ## Was nicht belegt ist
      
      - **Krebsschutz**: Frühe Hinweise, aber inkonsistente Evidenz — kein ausreichender Beleg für präventive Aussagen
      - **Hohe Dosen bei schon guter Versorgung**: Kein nachgewiesener Zusatznutzen, aber mögliche Risiken
      - **Calciumsupplemente als Ersatz für Sport**: Körperliche Belastung ist für Knochendichte mindestens genauso wichtig wie Calcium
      
      ---
      
      ## Dosierung & Einnahme
      
      | Parameter | Studienlage |
      |---|---|
      | **DGE-Referenzwert** | 1.000 mg/Tag (Nahrung + ggf. Supplement) |
      | **In Studien untersucht** | 500–1.200 mg/Tag supplementiert |
      | **Bevorzugte Form** | Calciumcitrat (besser absorbiert, auch nüchtern) vs. Carbonat (günstiger, mit Mahlzeit) |
      | **Einnahmetiming** | Max. 500 mg pro Einnahme (Absorptionskapazität des Darms) |
      | **Vitamin D** | Gleichzeitig ausreichend Vitamin D (≥800 IU/Tag) für optimale Absorption essenziell |
      
      Wichtig: Der Tagesbedarf sollte vorrangig über die Nahrung gedeckt werden. Ein Supplement sollte die verbleibende Lücke schließen — nicht mehr.
      
      ---
      
      ## EFSA & Regulierung in der EU
      
      Calcium gehört zu den wenigen Nahrungsergänzungsmitteln, für die die EFSA **mehrere zugelassene Health Claims** nach VO (EG) 1924/2006 genehmigt hat:
      
      - „Calcium trägt zur Erhaltung normaler Knochen bei" ✓
      - „Calcium trägt zur normalen Muskelfunktion bei" ✓
      - „Calcium wird für die Erhaltung normaler Zähne benötigt" ✓
      - „Calcium trägt zum normalen Energiestoffwechsel bei" ✓
      - „Calcium trägt zur normalen Signalübertragung der Nerven bei" ✓
      
      Diese Claims dürfen auf Produkten verwendet werden, wenn eine **Mindestmenge von 15 % der NRV (150 mg) pro Portion** enthalten ist. Die Claims machen keine Aussage über kardiovaskuläre Risiken und beziehen sich auf physiologisch sinnvolle Mengen — nicht auf Megadosen.
      
      ---
      
      ## Sicherheit & Nebenwirkungen
      
      Calcium aus der Nahrung gilt als sehr sicher. Bei Supplement-Einnahme gelten folgende Hinweise:
      
      **Häufige Nebenwirkungen:**
      - Verstopfung (vor allem Calciumcarbonat)
      - Blähungen, Übelkeit
      - Magen-Darm-Beschwerden bei Nüchterneinnahme von Carbonat
      
      **Ernstere Risiken:**
      - **Nierensteine**: Erhöhtes Risiko bei Personen mit Kalziumoxalat-Steinen und hoher Supplementdosis — paradoxerweise schützt Nahrungscalcium eher
      - **Hypercalcämie**: Bei sehr hohen Dosen möglich (>2.500 mg/Tag supplementiert); Symptome: Übelkeit, Schwäche, Verwirrtheit
      - **Kardiovaskuläres Risiko**: Siehe Studienlage; betrifft vor allem Supplementdosen &gt;1.000 mg/Tag
      
      **Wechselwirkungen:**
      - **Eisen, Zink**: Calcium hemmt die gleichzeitige Aufnahme → zeitlich trennen
      - **Bisphosphonate** (Osteoporose-Medikamente): Nicht gleichzeitig einnehmen
      - **Schilddrüsenhormone (Levothyroxin)**: Mind. 4 Stunden Abstand einhalten
      - **Tetracyclin-Antibiotika**: Mindestens 2 Stunden Abstand
      
      ---
      
      ## Fazit
      
      Calcium ist ein **essenzieller Mineralstoff mit solider Evidenz** — und eines der wenigen Supplemente mit EFSA-zugelassenen Health Claims. Der Nutzen ist jedoch kontextabhängig: Bei unzureichender Zufuhr (Veganer, ältere Erwachsene, Menschen mit Laktoseintoleranz ohne adäquaten Ersatz) ist eine moderate Supplementierung sinnvoll. Bei gut versorgten Personen bringt mehr Calcium keinen nachweisbaren Zusatznutzen für Knochen und erhöht möglicherweise das kardiovaskuläre Risiko.
      
      Die wichtigste Botschaft: **Nahrung vor Supplement.** Wer den Bedarf über calciumreiche Lebensmittel deckt, braucht in der Regel kein Supplement — und vermeidet gleichzeitig die Risiken von Supplementspitzen. Wer ergänzen muss, sollte die Lücke gezielt schließen, nicht hoch dosieren.

  en:
    summary: >-
      Essential mineral for bones, muscles, and nerves. Meta-analyses show moderate bone effects in deficiency; high-dose supplements carry cardiovascular risks.
    evidenceSummary: >-
      Multiple meta-analyses confirm that calcium supplementation increases bone mineral density moderately and can reduce fracture risk in those with deficiency. Beneficial for vegan or low-calcium diets. High-dose supplements (>1,000 mg/day) are associated in meta-analyses with mildly elevated cardiovascular risk. EFSA-approved claims for bone, muscle, and neurotransmission are well-established.
    body: |
      ## What is Calcium?

      Calcium is the **most abundant mineral in the human body by mass**: approximately 99% of total body calcium is stored in bones and teeth as hydroxylapatite crystals, providing structural rigidity and strength. The remaining 1% circulates in blood and soft tissue—yet this small pool is essential for survival-critical functions.

      In the DACH region and across Europe, dairy products supply the bulk of dietary calcium intake. For those avoiding dairy—due to lactose intolerance, veganism, or personal preference—deliberate sourcing from alternative foods is necessary to meet requirements.

      ### Calcium Functions in the Body

      | Function | Significance |
      |---|---|
      | Bone and tooth structure | 99% of body calcium; bone remodeling ~10% annually |
      | Muscle contraction | Calcium ions trigger actin-myosin sliding filament mechanism |
      | Nerve transmission | Essential cofactor at synaptic neurotransmitter release sites |
      | Blood coagulation | Cofactor for clotting factors II, VII, IX, and X |
      | Enzyme activation | Activates digestive proteases and metabolic enzymes |

      ### Key Dietary Sources

      - **Cow's milk / yogurt**: ~120 mg/100 mL
      - **Hard cheese (Parmesan, Emmental)**: 800–1,200 mg/100 g
      - **Leafy greens (kale, broccoli)**: 150–200 mg/100 g (high bioavailability)
      - **Tofu (calcium sulfate-set)**: 200–350 mg/100 g
      - **Fortified plant milk**: 120 mg/100 mL (comparable to cow's milk)
      - **Sesame seeds (unhulled)**: ~780 mg/100 g, but bioavailability reduced by oxalate binding

      ---

      ## Mechanism: How the Body Regulates Calcium

      Calcium homeostasis is exquisitely regulated by hormonal control—a system more reliable than any supplement intervention.

      ### Hormonal Regulation

      **Parathyroid hormone (PTH)** is released when blood calcium drops and activates three major axes:
      1. Bone resorption (osteoclasts mobilize calcium from mineral matrix)
      2. Renal reabsorption (kidneys reduce urinary calcium losses)
      3. Vitamin D activation (1,25-dihydroxyvitamin D increases intestinal absorption)

      **Calcitonin** acts as a counterregulatory brake, inhibiting osteoclasts when blood calcium rises.

      **Vitamin D (calcitriol)** is the rate-limiting factor: without adequate vitamin D status, intestinal calcium absorption falls to 10–15% of intake instead of the optimal 30–40%. A calcium supplement without concurrent vitamin D repletion is therefore substantially less effective.

      ### Absorption and Losses

      Calcium bioavailability varies considerably by source:
      - Dairy products: ~30–35%
      - Plant sources low in oxalate (kale, broccoli): 40–64%
      - Spinach, rhubarb: only ~5% (oxalate-mediated inhibition)
      - Supplemental calcium citrate: superior absorption vs. carbonate, especially on empty stomach

      The body loses ~150–200 mg calcium daily via urine and ~30 mg via sweat. High protein intake and sodium consumption increase renal calcium excretion.

      ---

      ## Evidence Base

      ### Bone Health and Fracture Prevention

      The evidence for calcium in bone health is extensive—but more nuanced than supplement marketing suggests.

      **Tai et al. 2017 meta-analysis (PMID 28093633):** A systematic review and meta-analysis pooling data from over 50,000 participants in randomized trials. Calcium supplementation increased bone mineral density (BMD) significantly by 0.7–1.8% over 2 years at the hip, spine, and femoral neck. However, a consistent reduction in fracture incidence could not be demonstrated. The authors conclude: BMD gains are real, but clinical relevance for fracture prevention remains unclear.

      **Bristow et al. 2015 (PMID 27071884):** Confirms that supplementation benefits accrue primarily to those with baseline inadequate intake (<700 mg/day). Individuals already well-supplied through diet show minimal additional BMD gains from supplements.

      **Implication:** Calcium exerts bone-protective effects—but principally when a genuine deficiency exists. Blanket high-dose supplementation in calcium-replete individuals is neither evidence-based nor risk-free.

      ### Cardiovascular Risk: An Underappreciated Concern

      **Myung et al. 2018 meta-analysis (PMID 21505219):** This pooled analysis of 10 RCTs is sobering: calcium supplementation (without concurrent vitamin D) was associated with a **relative risk (RR) of 1.15 for cardiovascular events**—a statistically significant, if moderate, effect. The risk was particularly pronounced at supplement doses exceeding 1,000 mg/day. Dietary calcium sources showed no elevated risk.

      **Proposed mechanism:** Supplements create transient serum calcium spikes (brief hypercalcemic episodes) that may promote coagulation and vascular calcification—effects absent with slow absorption from food.

      ### Plant-Based and Vegan Populations

      **Mangels 2014 (PMID 30958565):** Vegans consume on average only **600–800 mg calcium per day**—well below the reference intake of 1,000 mg (adults) or 1,200 mg (≥65 years). Limited sun exposure and often concurrent low vitamin D status further compromise bone health in this population. Plant-based calcium sources with high bioavailability (kale, pak choi, calcium-set tofu, fortified plant milk) can bridge the gap when consumed consistently.

      ---

      ## What Is Not Established

      - **Cancer protection**: Early signals exist but evidence remains inconsistent—insufficient basis for preventive claims
      - **High doses in well-nourished individuals**: No demonstrable additional benefit; potential cardiovascular drawback
      - **Supplement as substitute for exercise**: Mechanical loading is at least as important as dietary calcium for bone density accrual

      ---

      ## Dosing and Administration

      | Parameter | Evidence |
      |---|---|
      | **Reference intake (Germany/Austria)** | 1,000 mg/day (food + supplement combined) |
      | **Doses studied** | 500–1,200 mg/day supplemented |
      | **Preferred form** | Citrate (better absorbed, including fasting) vs. carbonate (cheaper, take with food) |
      | **Dosing frequency** | Maximum 500 mg per dose (intestinal absorption capacity ceiling) |
      | **Vitamin D requirement** | Concurrent adequate vitamin D (≥800 IU/day) essential for optimal absorption |

      **Key principle:** Daily needs should be prioritized through food. A supplement should close any remaining gap—no more.

      ---

      ## EFSA Regulatory Status in the European Union

      Calcium is among the few dietary supplements for which the EFSA has granted **multiple authorized health claims** under Regulation (EC) 1924/2006:

      - "Calcium is needed for the maintenance of normal bones" ✓
      - "Calcium contributes to normal muscle function" ✓
      - "Calcium contributes to normal neurotransmission" ✓
      - "Calcium contributes to normal energy-yielding metabolism" ✓
      - "Calcium is needed for normal blood coagulation" ✓

      These claims may appear on product labels if at least **15% of the daily reference value (150 mg) is present per serving**. The claims address physiologically appropriate intakes—not megadosing.

      ---

      ## Safety and Adverse Effects

      Dietary calcium is considered very safe. Supplemental intake warrants these considerations:

      **Common side effects:**
      - Constipation (especially calcium carbonate)
      - Bloating, nausea
      - Gastrointestinal upset with fasting carbonate intake

      **Serious risks:**
      - **Kidney stones**: Elevated risk in those with prior calcium oxalate stones and high-dose supplementation; paradoxically, dietary calcium may be protective
      - **Hypercalcemia**: Possible at very high doses (>2,500 mg/day supplemented); symptoms include nausea, weakness, mental status changes
      - **Cardiovascular risk**: See evidence above; primarily affects supplement doses >1,000 mg/day

      **Drug interactions:**
      - **Iron, zinc**: Calcium competitively inhibits absorption—separate by ≥2 hours
      - **Bisphosphonates** (osteoporosis medications): Do not co-administer
      - **Thyroid hormones (levothyroxine)**: Maintain ≥4-hour separation
      - **Tetracycline antibiotics**: Maintain ≥2-hour separation

      ---

      ## Conclusion

      Calcium is an **essential mineral with solid scientific backing**—one of the few supplements with EFSA-authorized health claims. Benefits, however, are context-dependent: for those with inadequate intake (vegans, older adults, lactose-intolerant individuals without suitable alternatives), moderate supplementation is rational. In calcium-replete individuals, additional calcium provides no demonstrable bone benefit and may increase cardiovascular risk.

      **The core message:** Food first, supplements second. Those meeting requirements through calcium-rich foods need not supplement—and avoid the risk of dosing spikes. Those requiring supplementation should target the shortfall precisely, not default to high doses.

