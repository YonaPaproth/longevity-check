      en: >-
        Nature study (Aron et al., Harvard 2025): brain lithium was the ONLY metal of 27 studied that was significantly reduced in MCI and Alzheimer's disease. Lithium is sequestered by amyloid plaques, reducing bioavailability. In mouse models, lithium deficiency worsened amyloid deposition, tau pathology, and cognitive decline. Lithium orotate (not carbonate) evaded amyloid binding and restored memory and brain pathology. Strongest evidence to date for lithium as a "brain mineral."

