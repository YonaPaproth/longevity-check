    evidenceSummary: >-
      Riboflavin as an essential nutrient is relatively well-studied. Solid evidence exists for high-dose riboflavin (400 mg/day) in migraine prophylaxis. For general ageing, performance, or metabolic benefits in well-nourished adults, convincing data are lacking.
    body: |
      ## What is Vitamin B2?

      Vitamin B2, also known as **riboflavin**, is a water-soluble B vitamin that serves as a precursor to two essential coenzymes: **FAD** (flavin adenine dinucleotide) and **FMN** (flavin mononucleotide). These coenzymes are required for dozens of metabolic reactions across the body, making riboflavin genuinely central to cellular function.

      Without adequate B2, the electron transport chain—the core machinery of ATP production in mitochondria—cannot function properly. This is not a peripheral biochemical detail; it is fundamental to energy production in every cell.

      ## What is well-established?

      ### Riboflavin as an essential nutrient

      B2 deficiency, though rare in industrialised countries, does occur and causes predictable symptoms:
      - **Dermatitis** (inflamed, cracked skin around the mouth and nose)
      - **Glossitis** (inflamed tongue)
      - **Mouth ulcers and cheilosis** (cracks in lips and mouth)
      - **Anaemia** (due to impaired red blood cell synthesis)
      - **Weakness and fatigue**

      These symptoms are reversible with supplementation. True ariboflavinosis is now rare in developed nations, but deficiency can emerge in:
      - Severe malabsorption (inflammatory bowel disease, coeliac disease)
      - Chronic alcoholism
      - Use of certain medications (antifungals, sulphonamides, tricyclic antidepressants)
      - Genetic mitochondrial disorders requiring higher intake

      ### Migraine prophylaxis

      The most credible non-deficiency application for high-dose riboflavin is **migraine prevention**. A 1998 RCT by Schoenen and colleagues (N=55) found that **400 mg daily reduced migraine attack frequency by approximately 67% versus placebo over a 3-month period**. This effect size is meaningful and ranks among the better-supported supplement interventions in migraine research.

      The mechanism likely involves improved mitochondrial ATP production—migraine sufferers sometimes show mitochondrial dysfunction on specialised testing—though the mechanism is not fully understood.

      Important caveats:
      - Responder rates vary widely; roughly 40–60% of migraine sufferers see meaningful benefit
      - Onset of benefit typically takes 2–4 weeks; a 3-month trial is reasonable before concluding non-response
      - Not all migraine types respond equally (episodic migraine may respond better than chronic daily headache)

      ### Regulatory status

      The European Food Safety Authority has approved health claims for riboflavin relating to:
      - Contribution to normal energy metabolism
      - Support for nervous system function
      - Normal red blood cell formation
      - Contribution to immune system function
      - Maintenance of normal vision
      - Maintenance of normal skin and hair
      - Protection against oxidative stress

      These are all **substantiated claims for normal physiological function**. No treatment or disease claims are permitted.

      ## What is NOT well-established?

      ### Enhanced energy in people with normal B2 status

      There is no credible evidence that supplementing with extra riboflavin increases energy, alertness, or stamina in people with adequate B2 intake. B2 may be necessary for energy production, but more is not better.

      ### Anti-ageing and longevity effects

      Riboflavin appears in various "longevity supplement" lists, typically because it supports mitochondrial function. However, there is **no human evidence** that supplementation extends lifespan or healthspan in normally-nourished populations. Animal model data exist, but translation to human benefit remains speculative.

      ### Athletic performance

      Unlike some B vitamins (e.g., beta-alanine, beetroot nitrate), riboflavin supplementation is not associated with improvements in endurance, strength, or power output in controlled trials.

      ### Cardiovascular or metabolic benefits

      Although riboflavin participates in homocysteine metabolism (an emerging cardiovascular risk factor), supplementation has not been shown in rigorous trials to meaningfully lower CVD risk or improve metabolic markers in people with normal B2 status.

      ## Safety and dosing

      ### Toxicity

      Riboflavin is **exceptionally safe**. As a water-soluble vitamin, excess amounts are simply excreted in urine. No upper intake limit (UL) has been established by regulatory authorities due to the extremely low toxicity risk. Clinical trials using doses of 400 mg daily show no adverse effects beyond cosmetic ones.

      ### Visual effects

      The only consistent effect of high-dose supplementation is **bright yellow discolouration of urine**—harmless but striking. This occurs at doses above ~100–150 mg and is simply excess riboflavin being excreted. It is not a warning sign; it is normal excretion of a water-soluble vitamin.

      ### Standard dosing

      - **RDA (recommended dietary allowance)**: 1.1 mg/day (women), 1.3 mg/day (men)
      - **Upper intake limit (UL)**: Not established
      - **Migraine trial dose**: 400 mg daily, typically divided into 100 mg doses (two or four times daily)
      - **Forms**: Free riboflavin, riboflavin-5-phosphate (activated form), FADH₂-based precursors

      The phosphorylated forms may have slightly improved bioavailability in some disease states, but for healthy individuals, the clinical difference is modest.

      ## Bottom line

      Vitamin B2 is a **foundational nutrient**—not exotic, not a longevity hack, but genuinely important for human health. It is most relevant when:

      1. **Deficiency is present or likely** (malabsorption, certain medications, strict vegan diet): supplementation is medically indicated.
      2. **Migraine is a problem**: A 3-month trial of 400 mg daily is a rational, evidence-informed approach with reasonable odds of benefit (~50%) and minimal risk.
      3. **General health**: Including adequate B2 through diet or a standard multivitamin is sensible; extra supplementation beyond meeting RDA is unlikely to provide noticeable benefit.

      Riboflavin is inexpensive, very safe, and integrates easily into supplement stacks. If you are considering it for migraine, the evidence base is solid (Level 2). Realistic expectations: roughly half of users will see a meaningful reduction in attack frequency; onset takes 2–4 weeks.

