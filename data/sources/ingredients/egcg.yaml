locales:
  de:
    summary: >-
      EGCG ist das Hauptcatechin im Grüntee und wird für Stoffwechsel- und Zellschutzmechanismen untersucht. Höher dosierte Supplemente können mit Leberrisiken verbunden sein.
    evidenceSummary: >-
      Mehrere RCTs zeigen antioxidative, antientzündliche und metabolische Effekte (Blutdruck, Insulin, Fettmasse). AMPK-Aktivierung und Autophagie-Induktion präklinisch vergleichsweise gut untersucht. gesundes Altern-Endpunkte fehlen. Lebertoxizität bei hochkonzentrierten Extrakten dokumentiert.
    body: |
      ## Was ist EGCG?
      
      Epigallocatechingallat (EGCG) ist das mengenmäßig bedeutendste und biologisch aktivste **Catechin** im Grünen Tee. Es macht 50–80 % der gesamten Catechin-Menge aus und ist der Hauptgrund, warum Grüntee seit Jahrzehnten intensiv erforscht wird.
      
      Im Kontext gesunden Alterns sind zwei Mechanismen besonders relevant:
      - **AMPK-Aktivierung**: AMPK ist ein zellulärer Energiesensor – bei Aktivierung fördert er Fettverbrennung, hemmt mTOR und stimuliert Autophagie (zelluläre Selbstreinigung)
      - **Autophagie-Induktion**: EGCG fördert direkt die Beseitigung beschädigter Zellbestandteile – ein zentraler Hallmark-of-Aging-Mechanismus
      
      ## Was sagen die Studien wirklich?
      
      ### Belegt
      - LDL-Senkung: Meta-Analysen konsistent positiv (–0,15 bis –0,20 mmol/L)
      - Entzündungsmarker: CRP, IL-6 sinken in RCTs
      - Blutdruck: Kleine, aber konsistente Reduktionen in mehreren RCTs
      - Fettmasse: Geringfügige Reduktion (kombiniert mit Koffein stärker)
      
      ### Epidemiologisch stark, kausal unklar
      - Japanische Studien: Hohes Grünteekonsum korreliert mit weniger Herzerkrankungen und bestimmten Krebsarten
      - Problem: Confounding (Grünteetrinker haben oft gesündere Lebensstile)
      
      ### Nicht belegt beim Menschen
      - Direkte Lebensverlängerung
      - Starke krebspräventive Wirkung in kontrollierten Studien
      
      ## Das Sicherheitsproblem bei Hochdosis-Supplements
      
      Hier ist Vorsicht angebracht: Die EFSA hat 2018 Grüntee-Catechine in hochkonzentrierten Supplements (≥800 mg/Tag) als **potenziell hepatotoxisch** eingestuft. Weltweit gibt es mehrere dokumentierte Fälle von schwerer Leberschädigung durch EGCG-Supplements.
      
      Das betrifft **konzentrierte Extrakte** in Kapseln – nicht das tägliche Trinken von normalem Grüntee, das als sicher gilt.
      
      > Wenn du Grüntee-Extrakt kaufst: Max. 400–500 mg EGCG/Tag, nie auf nüchternem Magen, und bei Lebererkrankungen meiden.
      
      ## Grüntee trinken vs. Supplement
      
      3–5 Tassen Grüntee täglich liefern ~200–400 mg EGCG ohne Toxizitätsrisiko und mit epidemiologisch vergleichsweise gut untersuchtem Benefit. Das ist für die meisten Menschen die bessere Option als hochdosierte Kapseln.
      
      ## Ist EGCG sicher?
      
      Bei bis zu 400 mg/Tag aus Supplements: **mit Vorsicht**. Auf leeren Magen kann es Übelkeit auslösen. Wechselwirkung mit Antikoagulantien möglich. Nicht mit Eisenpräparaten kombinieren (EGCG hemmt Eisenresorption).

  en:
    summary: >-
      EGCG is green tea's most abundant catechin, studied for metabolism and cellular protection. High-dose supplements carry documented liver toxicity risks.
    evidenceSummary: >-
      Multiple RCTs demonstrate antioxidant, anti-inflammatory, and metabolic effects (blood pressure, insulin, fat mass). AMPK activation and autophagy induction are well-characterized mechanistically. Human aging endpoints remain lacking. Hepatotoxicity documented with concentrated extracts.
    body: |
      ## What is EGCG?

      Epigallocatechin gallate (EGCG) is the most abundant and biologically active **catechin** in green tea. It comprises 50–80% of total catechin content and is the primary reason green tea has been intensively researched for decades.

      Two mechanisms are especially relevant for healthy aging:
      - **AMPK activation**: AMPK is a cellular energy sensor. When activated, it promotes fat oxidation, inhibits mTOR, and stimulates autophagy (cellular self-cleaning)
      - **Autophagy induction**: EGCG directly enhances the removal of damaged cellular components—a central hallmark-of-aging mechanism

      ## What do the studies really show?

      ### Proven effects
      - **LDL reduction**: Meta-analyses consistently show decreases of 0.15–0.20 mmol/L
      - **Inflammatory markers**: CRP and IL-6 decline in RCTs
      - **Blood pressure**: Small but consistent reductions in multiple RCTs
      - **Fat mass**: Modest reduction (stronger when combined with caffeine)

      ### Epidemiologically strong, causally unclear
      - **Japanese studies**: High green tea consumption correlates with fewer cardiovascular events and certain cancers
      - **The problem**: Confounding—green tea drinkers typically have healthier overall lifestyles

      ### Not proven in humans
      - **Direct lifespan extension**
      - **Strong cancer prevention** in controlled trials

      ## The safety issue with high-dose supplements

      Here is where caution is warranted: In 2018, EFSA classified green tea catechins in concentrated supplements (≥800 mg/day) as **potentially hepatotoxic**. Multiple documented cases worldwide describe severe liver injury from EGCG supplements.

      This applies to **concentrated extracts** in capsules—not regular green tea drinking, which EFSA rates as safe.

      > If you buy green tea extract: maximum 400–500 mg EGCG/day, never on an empty stomach, and avoid entirely if you have liver disease.

      ## Drinking green tea vs. supplements

      Three to five cups of green tea daily deliver 200–400 mg EGCG without toxicity risk and with epidemiologically well-studied benefits. This is the better option for most people compared to high-dose capsules.

      ## Is EGCG safe?

      At up to 400 mg/day from supplements: **use cautiously**. On an empty stomach it can cause nausea. Possible interactions with anticoagulants. Do not combine with iron supplements—EGCG inhibits iron absorption.

      ## The mechanistic picture

      EGCG's effects center on three pathways:

      **AMPK/mTOR axis**: In cell cultures and animal models, EGCG activates AMPK and suppresses mTOR, both linked to longevity. Whether this translates to humans remains uncertain.

      **Antioxidant and anti-inflammatory**: EGCG is a potent free-radical scavenger. In inflammatory models, it reduces TNF-α and IL-6. Whether systemic inflammation meaningfully decreases in humans is debated.

      **Mitochondrial function**: Preliminary evidence suggests EGCG may enhance mitochondrial biogenesis and reduce reactive oxygen species production, though human data are sparse.

      ## Who benefits? Who should avoid?

      **Potential benefit:**
      - Cardiovascular risk factors (LDL, blood pressure, inflammation)
      - Metabolic support (weight management, insulin sensitivity)
      - Antioxidant supplementation for those not drinking green tea regularly

      **Avoid entirely:**
      - Liver disease or elevated liver enzymes
      - Taking anticoagulants (warfarin, DOACs)
      - Iron deficiency being treated—EGCG impairs absorption

      **Be cautious:**
      - GI sensitivity (take with food)
      - Caffeine sensitivity (some extracts contain residual caffeine)
      - Pregnancy/breastfeeding (safety at high doses not established)

      ## Dosing guidelines

      - **From tea**: 3–5 cups daily (200–400 mg EGCG)—preferred if feasible
      - **From supplements**: 300–400 mg/day maximum, with food, for 3–6 months at a time (rotate off periodically)
      - **Never**: >800 mg/day from concentrated supplements
      - **Timing**: With meals; avoid empty stomach

      ## The bottom line

      EGCG is among the most studied plant compounds, with real but modest effects on cardiovascular and metabolic markers in RCTs. The epidemiological case is stronger but confounded by lifestyle factors. Mechanistic evidence (AMPK, autophagy) is encouraging but not yet translatable to human longevity claims. **The safety profile at high doses is concerning enough to justify the EU's cautious stance.**

      For most people, drinking green tea is lower-risk and evidence-supported. If supplementing, stay ≤400 mg/day, always take with food, and monitor liver enzymes if using long-term. Those with liver disease or on anticoagulants should avoid entirely.

