locales:
  de:
    summary: >-
      Shilajit wird für Energie, Testosteron und Mitochondrien vermarktet. Die Daten sind begrenzt und Qualitätsprobleme bei Produkten sind ein reales Thema.
    evidenceSummary: >-
      Shilajit ist in der Supplement-Welt populär, aber die Human-Evidenz ist begrenzt. Dazu kommen erhebliche Qualitäts- und Reinheitsfragen, etwa bei Schwermetallen oder Verunreinigungen. Viele starke Claims sind deutlich über dem Datenstand.
    body: |
      ## Was ist Shilajit?
      
      Shilajit ist ein harzähnliches Naturprodukt, das vor allem in traditionellen Medizinsystemen vorkommt und heute gern in Energie- und Männlichkeits-Stacks vermarktet wird.
      
      ## Der große praktische Punkt
      
      Selbst wenn ein Stoff interessant ist, bringt das wenig, wenn **Produktqualität** das eigentliche Risiko ist.
      
      ## Fazit
      
      Shilajit ist aktuell eher ein **Qualitäts- und Hype-Risikofall** als ein sauber evidenzbasierter Wirkstoff.

