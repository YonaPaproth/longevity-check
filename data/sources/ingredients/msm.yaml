locales:
  de:
    summary: >-
      MSM wird vor allem für Gelenke und Entzündung beworben. Die Daten sind nicht leer, aber deutlich kleiner als viele Versprechen.
    evidenceSummary: >-
      MSM hat einige Human-Daten im Bereich Gelenkbeschwerden und Entzündungsmarker, meist mit kleinen bis moderaten Effekten. Die Evidenz ist brauchbar, aber nicht stark genug für große universelle Gesundheits-Claims.
    body: |
      ## Was ist MSM?
      
      MSM ist eine schwefelhaltige Verbindung, die oft in Gelenk- und Recovery-Supplements auftaucht.
      
      ## Was ist realistisch?
      
      - möglich bei Gelenkbeschwerden
      - eventuell kleine Effekte auf Erholung
      - kein spektakulärer Universalstoff
      
      ## Fazit
      
      MSM ist eher **solide, aber unspektakulär**.

