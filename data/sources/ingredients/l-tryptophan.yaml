locales:
  de:
    summary: >-
      L-Tryptophan ist die Vorstufe von Serotonin und Melatonin. Für Schlaf- und Stimmungsfragen biologisch plausibel, aber die direkte Wirkung als Supplement bleibt begrenzt.
    evidenceSummary: >-
      L-Tryptophan ist biologisch plausibel für Schlaf und Stimmung, da es Vorstufe von Serotonin und Melatonin ist. Es gibt positive Daten, aber die Effekte sind meist moderat und variabel. Die direkte Wirkung ist oft schwächer als bei gezielteren Stoffen wie 5-HTP oder Melatonin.
    body: |
      ## Was ist L-Tryptophan?
      
      L-Tryptophan ist eine essenzielle Aminosäure und Vorstufe von **Serotonin** und **Melatonin**.
      
      ## Was ist das Problem in der Praxis?
      
      Die Umwandlung ist nicht automatisch effizient, und Tryptophan konkurriert mit anderen Aminosäuren beim Transport.
      
      ## Fazit
      
      L-Tryptophan ist **plausibel, aber nicht maximal effizient**. Eher ein sanfter Kandidat als ein klarer Gamechanger.

