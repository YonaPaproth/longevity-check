    summary: >-
      Ginkgo ist ein berühmter Gehirn- und Durchblutungsstoff. Die Evidenz ist gemischt, und die Blutungs-/Interaktionsfrage sollte man nicht wegwinken.
    evidenceSummary: >-
      Ginkgo ist breit untersucht, vor allem für Kognition und periphere Durchblutung. Die Gesamtdatenlage ist heterogen und liefert keine überzeugende Basis für allgemeine Cognitive-Enhancement-Versprechen bei Gesunden. Wichtig sind potenzielle Interaktionen mit Antikoagulanzien.
    body: |
      ## Was ist Ginkgo?
      
      Ginkgo biloba ist einer der bekanntesten Pflanzenstoffe für Gedächtnis und Durchblutung.
      
      ## Warum ist er schwierig zu bewerten?
      
      Weil:
      - viel untersucht wurde
      - die Ergebnisse aber erstaunlich uneinheitlich sind
      - Sicherheits- und Interaktionsfragen nicht ganz trivial sind
      
      ## Fazit
      
      Ginkgo ist **bekannt, aber nicht klar gewonnen**.

