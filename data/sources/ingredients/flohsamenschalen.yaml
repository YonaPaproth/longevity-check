    summary: >-
      Psyllium ist ein gut untersuchter Ballaststoff für Verdauung; auch Cholesterin- und Blutzuckermarker werden untersucht. Wenig Hype, aber praktisch relevant.
    evidenceSummary: >-
      Psyllium ist ein sehr vergleichsweise gut untersuchter löslicher Ballaststoff. Es war mit Veränderungen verbunden Stuhlregulation und kann moderate Vorteile bei LDL-Cholesterin und Blutzuckerparametern bringen. Für einen unspektakulären Stoff ist die Evidenz bemerkenswert stark.
    body: |
      ## Was ist Psyllium?
      
      Flohsamenschalen sind ein löslicher Ballaststoff. Sie quellen im Darm auf und verbessern dadurch Stuhlregulation und Sättigung.
      
      ## Warum ist das so interessant?
      
      Weil Psyllium einer dieser Stoffe ist, die:
      - nicht sexy wirken
      - aber tatsächlich ordentlich funktionieren
      
      ## Fazit
      
      Psyllium ist **low hype, high utility**.

