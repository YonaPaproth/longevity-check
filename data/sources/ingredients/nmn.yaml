locales:
  de:
    summary: >-
      NMN ist eine Vorstufe von NAD+, einem zellulären Energieträger. Tierstudien sind vielversprechend – belastbare Humanstudien fehlen bisher.
    evidenceSummary: >-
      Mehrere kleine RCTs (randomisierte Studien) am Menschen zeigen, dass NMN den NAD+-Spiegel im Blut war mit höheren Werten verbunden. Ob das jedoch die Gesundheit oder Lebenserwartung war mit Veränderungen verbunden, ist nicht belegt. Die meisten positiven Ergebnisse stammen aus Tierversuchen.
    body: |
      ## Was ist NMN?
      
      NMN (Nicotinamidmononukleotid) ist ein Molekül, das im Körper als direkter Vorläufer von **NAD+** (Nicotinamidadenindinukleotid) dient. NAD+ ist an hunderten enzymatischer Reaktionen beteiligt – vor allem in der Energieproduktion der Mitochondrien und bei der Reparatur von DNA-Schäden.
      
      Das Problem: NAD+-Spiegel sinken mit dem Alter. Die Idee hinter NMN-Supplements ist es, diese Spiegel durch Supplementierung wieder anzuheben und damit Alterungsprozesse zu verlangsamen.
      
      ## Was sagen die Studien wirklich?
      
      ### Das Positive
      - NMN wird vom Körper aufgenommen und war in kleinen Humanstudien mit höheren NAD+-Spiegeln im Blut verbunden
      - Tierstudien (Mäuse) zeigen eindrucksvolle Effekte: bessere Muskelfunktion, mehr Energie, längere Lebensspanne
      - Erste kleine Humanstudien zeigen keine ernsthaften Nebenwirkungen bei 250–1.200 mg/Tag
      
      ### Das Problem
      - Der Sprung von **Mäusen zu Menschen** ist beim Altern besonders schwierig
      - Kein einziger RCT (randomisierte Studie) hat bisher beim Menschen einen Effekt auf die **Lebenserwartung** gezeigt
      - „NAD+-Spiegel erhöhen" ist kein Endpunkt – es ist ein Biomarker. Ob dieser Anstieg klinisch relevant ist, weiß niemand
      - Die FDA stufte NMN 2022 nicht als Supplement ein, da es als Arzneimittel untersucht wird
      
      > **Fazit:** NMN ist wissenschaftlich interessant. Die Vermarktung als Alterungsforschung-Wundermittel geht weit über den Beleg hinaus.
      
      ## Ist NMN sicher?
      
      Nach aktuellem Stand: **wahrscheinlich sicher** bei kurzzeitiger Einnahme bis ~1.200 mg/Tag. Eine Tierstudie (2022) mit NR – einer verwandten Substanz – zeigte Hinweise auf war mit höheren Werten verbundenes Brustkrebsrisiko bei hohen Dosen. Für NMN gibt es keinen vergleichbaren Befund, aber Langzeitdaten beim Menschen fehlen komplett.
      
      ## Regulatorischer Status in Deutschland
      
      NMN ist in der EU als **Novel Food** eingestuft (Verordnung EU 2015/2283). Das bedeutet: Produkte dürfen nur verkauft werden, wenn eine Novel-Food-Zulassung beantragt und erteilt wurde. Viele im Handel erhältliche NMN-Produkte bewegen sich in einer **rechtlichen Grauzone**. Käufer sollten das wissen.
      
      ## Für wen könnte NMN dennoch interessant sein?
      
      Wenn du trotz der Unsicherheiten experimentieren möchtest: Wähle Produkte mit **Third-Party-Zertifizierung** (Labdoor, Informed-Sport), achte auf Reinheit und Lagerhinweise (NMN ist instabil bei Wärme) und kalkuliere den **Preis pro Tagesdosis** – Preisunterschiede von Faktor 5 bei gleicher Dosis sind keine Seltenheit.

  en:
    summary: >-
      NMN is a direct precursor to NAD+. Animal studies are promising — robust human trials are still lacking, and the EU regulatory status is unclear.
    evidenceSummary: >-
      Several small human RCTs show that NMN raises blood NAD+ levels. Whether that translates into health or longevity benefits remains unproven. Most striking results come from animal studies.
    body: |
      ## What is NMN?
      
      NMN (Nicotinamide Mononucleotide) is a molecule that serves as a direct precursor to **NAD+** (Nicotinamide Adenine Dinucleotide) in the body. NAD+ is involved in hundreds of enzymatic reactions — primarily in mitochondrial energy production and DNA damage repair.
      
      The problem: NAD+ levels decline with age. The premise behind NMN supplements is that raising these levels through supplementation can slow ageing processes.
      
      ## What Do the Studies Actually Show?
      
      ### What's supported
      - NMN is absorbed by the body and in small human studies has been associated with higher blood NAD+ levels
      - Animal studies (mice) show striking effects: better muscle function, more energy, longer lifespan
      - Early small human studies show no serious side effects at 250–1,200 mg/day
      
      ### The problem
      - The leap from **mice to humans** is especially difficult in ageing research
      - Not a single RCT has shown any effect on **lifespan** in humans
      - "Raising NAD+ levels" is not a clinical endpoint — it is a biomarker. Whether that rise is clinically meaningful remains unknown
      - The FDA excluded NMN from the supplement category in 2022 because it was being investigated as a pharmaceutical
      
      > **Bottom line:** NMN is scientifically interesting. Marketing it as an anti-ageing miracle goes far beyond what the evidence supports.
      
      ## Is NMN Safe?
      
      Based on current data: **probably safe** at short-term doses up to ~1,200 mg/day. A 2022 animal study with NR — a related compound — raised concerns about increased breast cancer risk at high doses. No comparable finding exists for NMN, but long-term human data are completely absent.
      
      ## Regulatory Status in the EU
      
      NMN is classified as a **Novel Food** in the EU (Regulation EU 2015/2283). This means products may only be sold if a Novel Food authorisation has been applied for and granted. Many commercially available NMN products operate in a **legal grey zone**. Buyers should be aware of this.
      
      ## Who Might Still Consider NMN?
      
      If you want to experiment despite the uncertainties: choose products with **third-party certification** (Labdoor, Informed Sport), prioritise purity and storage guidance (NMN is unstable at high temperatures), and calculate **cost per daily dose** — price differences of 5× for identical doses are not unusual.

