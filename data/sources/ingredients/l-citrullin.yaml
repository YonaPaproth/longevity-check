locales:
  de:
    summary: >-
      L-Citrullin kann die Stickstoffmonoxid-Produktion steigern und wird in Studien mit verbesserter Durchblutung sowie Ausdauerleistung bei körperlicher Belastung in Verbindung gebracht.
    evidenceSummary: >-
      Mehrere RCTs zeigen bei 6–8 g/Tag Verbesserungen bei Ausdauerleistung, Muskelermüdung und Blutdruckreduktion. Die Evidenzlage ist vielversprechend, aber weniger konsistent und umfangreich als bei Kreatin oder Koffein. Langzeitstudien über Wochen und Monate fehlen weitgehend.
    body: |
      ## Was ist L-Citrullin?
      
      L-Citrullin ist eine nicht-proteinogene Aminosäure, die natürlicherweise in Wassermelonen und anderen Kürbisgewächsen vorkommt. Im Körper wird L-Citrullin in der Niere zu **L-Arginin** umgewandelt – und L-Arginin ist wiederum der wichtigste Baustein für die Synthese von **Stickstoffmonoxid (NO)** in den Blutgefäßen.
      
      Dieser Umweg über Citrullin ist entscheidend: Direkt eingenommenes L-Arginin wird im Darm und in der Leber stark abgebaut (First-Pass-Effekt), sodass wenig davon im Blut ankommt. L-Citrullin hingegen umgeht diesen Abbau weitgehend und steigert die Arginin-Spiegel im Blut in Studien effektiver als äquivalente Dosen L-Arginin selbst.
      
      **NO** bewirkt eine Erschlaffung der Gefäßmuskulatur (Vasodilatation) und kann dadurch die Durchblutung verbessern – ein Mechanismus, der sowohl für Muskelversorgung bei Belastung als auch für den Blutdruck relevant ist.
      
      ## Was sagen die Studien wirklich?
      
      ### Positive Befunde
      - Mehrere RCTs zeigen, dass **6–8 g Citrullinmalat** vor dem Training in Studien Leistungsgewinne bei Kraft- und Ausdauerbelastungen bewirken können – etwa mehr Wiederholungen, geringere Ermüdungswahrnehmung.
      - Einige Studien deuten auf moderate **Blutdruckeffekte** bei Personen mit leicht erhöhtem Ausgangswert hin.
      - L-Citrullin steigert die L-Arginin-Plasmaspiegel zuverlässiger als L-Arginin selbst.
      
      ### Limitierungen
      - Viele Studien verwenden **Citrullinmalat** (Citrullin gebunden an Äpfelsäure), nicht reines L-Citrullin. Der separate Beitrag der Äpfelsäure ist nicht vollständig geklärt.
      - Effektgrößen sind moderat; Reproduzierbarkeit zwischen verschiedenen Labors ist uneinheitlich.
      - Studien sind oft **kurz** (akuter Einmaldosis-Test) mit kleinen Stichproben. Wochen- oder Monatsstudien zur Langzeitwirkung sind selten.
      - Belastbare Langzeitdaten zu Blutdruck oder kardiovaskulärer Gesundheit fehlen.
      
      > **Bottom Line:** Die Datenlage ist vielversprechend, insbesondere für hochintensive Trainingsformen. Die Evidenz ist jedoch weniger robust und konsistent als bei Kreatin oder Koffein.
      
      ## Mechanismus: Citrullin → Arginin → NO
      
      Das Stickstoffmonoxid-System läuft über folgende Schritte:
      
      1. **L-Citrullin** wird oral eingenommen und gelangt in die Niere.
      2. In der Niere wird Citrullin durch das Enzym **Argininosuccinate Synthetase** und weitere Schritte des Harnstoffzyklus zu **L-Arginin** umgewandelt.
      3. L-Arginin ist das Substrat für **eNOS (endotheliale Stickstoffmonoxid-Synthase)** in den Gefäßwänden.
      4. eNOS produziert NO, welches die glatte Gefäßmuskulatur entspannt → **Vasodilatation**.
      5. Bessere Durchblutung kann Muskeln in Studien unter Umständen schneller mit Sauerstoff und Nährstoffen versorgen.
      
      ## Dosierung und Einnahme
      
      - **Trainingszweck (in Studien verwendet):** 6–8 g Citrullinmalat oder 3–6 g reines L-Citrullin, 30–60 Minuten vor dem Training.
      - **Blutdruckstudien:** 3–5 g/Tag L-Citrullin, dauerhaft.
      - Die Äquivalenz zwischen **Citrullinmalat und reinem L-Citrullin** ist nicht linear. Übliche Handelsware enthält Citrullinmalat im Verhältnis 2:1 (Citrullin:Äpfelsäure nach Gewicht).
      
      ## Wechselwirkungen
      
      - **PDE-5-Hemmer** (Sildenafil, Tadalafil): L-Citrullin verstärkt theoretisch den NO-Signalweg – eine gleichzeitige Einnahme mit diesen Medikamenten ist nicht empfehlenswert, da unter Umständen starke Blutdruckabfälle möglich sind.
      - **Antihypertensiva**: Additive blutdrucksenkende Effekte sind möglich. Rücksprache mit Arzt empfohlen.
      - Keine bekannten Interaktionen mit den meisten gängigen Nahrungsergänzungsmitteln.
      
      ## Ist L-Citrullin sicher?
      
      L-Citrullin gilt in üblichen Dosierungen als **wahrscheinlich sicher**. In Studien werden Mengen bis 15 g/Tag ohne schwerwiegende Nebenwirkungen berichtet. Magen-Darm-Beschwerden (Übelkeit, Weichstühle) sind bei höheren Dosen möglich. Für gesunde Erwachsene ohne Kreislaufprobleme oder Medikamenteneinnahme gibt es keine Hinweise auf Organschäden.
      
      Bestimmte Personengruppen sollten Rücksprache mit einem Arzt halten:
      - Personen mit bekannten Nieren- oder Lebererkrankungen (Harnstoffzyklus-Beteiligung)
      - Menschen unter Blutdrucksenkern oder anderen Gefäßmedikamenten
      - Personen mit seltenen Stoffwechselstörungen (z. B. Harnstoffzyklusdefekte)
      
      ## Regulatorischer Status in Deutschland und der EU
      
      - L-Citrullin gilt in der EU **nicht als Novel Food** und darf als Nahrungsergänzungsmittel vertrieben werden.
      - **Health Claims:** Die EFSA hat für L-Citrullin **keine** Gesundheitsaussagen zu Blutdruck, Durchblutung oder sportlicher Leistung zugelassen. Marketingaussagen müssen neutral bleiben.
      - Citrullinmalat ist ebenfalls verkehrsfähig; die Kombination unterliegt keinen besonderen Zulassungspflichten, solange sie als Lebensmittel deklariert wird.
      
      ## Fazit
      
      L-Citrullin ist ein interessanter Wirkstoff mit plausiblem Mechanismus und soliden Kurzzeitstudiendaten. Für Sportler, die hochintensive Belastungen absolvieren und ihre Ausdauer oder Erholungszeiten optimieren möchten, kann es unter Umständen ein sinnvolles Supplement sein. Klare Langzeitdaten und robuste Dosis-Wirkungs-Kurven fehlen jedoch. Für allgemeine Gesundheits- oder Longevity-Ziele ist die Datenlage dünn.

  en:
    summary: >-
      L-citrulline may boost nitric oxide production and is linked in studies to improved blood flow and endurance performance during physical exertion.
    evidenceSummary: >-
      Multiple RCTs at 6–8 g/day show improvements in endurance performance, muscle fatigue, and blood pressure reduction. The evidence is promising but less consistent and extensive than with creatine or caffeine. Long-term studies spanning weeks to months are largely absent.
    body: |
      ## What is L-Citrulline?

      L-citrulline is a non-proteinogenic amino acid naturally found in watermelon and other cucurbits. In the body, L-citrulline is converted to **L-arginine** in the kidneys—and L-arginine is in turn the critical substrate for the synthesis of **nitric oxide (NO)** in blood vessels.

      This detour through citrulline is decisive: Directly ingested L-arginine is heavily metabolized in the gut and liver (first-pass effect), so little reaches the bloodstream. L-citrulline, by contrast, largely bypasses this degradation and raises arginine blood levels more effectively than equivalent doses of L-arginine itself.

      **NO** causes relaxation of vascular smooth muscle (vasodilation) and can thereby improve blood flow—a mechanism relevant both for muscle perfusion during exertion and for blood pressure regulation.

      ## What Do the Studies Actually Show?

      ### Positive Findings
      - Multiple RCTs demonstrate that **6–8 g citrulline malate** before training can boost performance during high-intensity and endurance efforts—such as more repetitions, lower perceived fatigue.
      - Some studies suggest modest **blood pressure benefits** in people with mildly elevated baseline values.
      - L-citrulline reliably raises L-arginine plasma levels more effectively than L-arginine supplementation alone.

      ### Limitations
      - Many studies use **citrulline malate** (citrulline bound to malic acid), not pure L-citrulline. The separate contribution of malic acid is not fully established.
      - Effect sizes are moderate; reproducibility across different laboratories is inconsistent.
      - Studies are often **brief** (acute single-dose tests) with small sample sizes. Multi-week or multi-month studies of long-term effects are rare.
      - Robust long-term data on blood pressure or cardiovascular health are lacking.

      > **Bottom Line:** The evidence is promising, especially for high-intensity training. However, it is less robust and consistent than with creatine or caffeine.

      ## Mechanism: Citrulline → Arginine → NO

      The nitric oxide system operates through the following steps:

      1. **L-Citrulline** is taken orally and reaches the kidneys.
      2. In the kidney, citrulline is converted to **L-arginine** via the enzyme **argininosuccinate synthetase** and other urea cycle reactions.
      3. L-arginine is the substrate for **eNOS (endothelial nitric oxide synthase)** in blood vessel walls.
      4. eNOS produces NO, which relaxes vascular smooth muscle → **vasodilation**.
      5. Improved blood flow can support muscles in studies by delivering oxygen and nutrients more rapidly.

      ## Dosing and Administration

      - **For training (used in studies):** 6–8 g citrulline malate or 3–6 g pure L-citrulline, 30–60 minutes before exercise.
      - **For blood pressure (in studies):** 3–5 g/day L-citrulline, continuously.
      - The equivalence between **citrulline malate and pure L-citrulline** is not linear. Common commercial citrulline malate comes in a 2:1 ratio (citrulline:malic acid by weight).

      ## Drug and Nutrient Interactions

      - **PDE-5 inhibitors** (sildenafil, tadalafil): L-citrulline theoretically potentiates the NO signaling pathway—simultaneous use with these medications is not recommended, as severe blood pressure drops are possible.
      - **Antihypertensives**: Additive blood pressure-lowering effects are possible. Consult a physician.
      - No known interactions with most common dietary supplements.

      ## Is L-Citrulline Safe?

      L-citrulline is considered **likely safe** at usual doses. Studies report amounts up to 15 g/day without serious adverse effects. Gastrointestinal disturbances (nausea, loose stools) are possible at higher doses. For healthy adults without circulatory problems or concurrent medications, there is no evidence of organ damage.

      Certain populations should consult a physician:
      - People with known kidney or liver disease (urea cycle involvement)
      - Those taking blood pressure medications or other vascular drugs
      - People with rare metabolic disorders (e.g., urea cycle defects)

      ## Regulatory Status in Germany and the EU

      - L-citrulline is **not classified as a novel food** in the EU and may be sold as a dietary supplement.
      - **Health Claims:** The EFSA has **not approved** any health claims for L-citrulline regarding blood pressure, blood flow, or athletic performance. Marketing claims must remain neutral.
      - Citrulline malate is also approved for sale; the combination is subject to no special licensing requirements when declared as a food.

      ## Conclusion

      L-citrulline is an interesting supplement with a plausible mechanism and solid short-term study data. For athletes performing high-intensity efforts who want to optimize endurance or recovery times, it may be a worthwhile supplement. However, clear long-term data and robust dose-response curves are lacking. For general health or longevity goals, the evidence base is limited.

