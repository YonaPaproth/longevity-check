    EFSA-zugelassene Health Claims nach VO (EG) 1924/2006: Eisen trägt zur normalen Kognition, zum normalen Energiestoffwechsel, zur normalen Bildung roter Blutkörperchen, zum normalen Sauerstofftransport, zur normalen Funktion des Immunsystems und zur Verringerung von Müdigkeit bei. Alle Claims beziehen sich auf ausreichende Zufuhr bei Mangel, nicht auf prophylaktische Hochdosierung.
  en: >-
    EFSA-approved health claims under Regulation (EC) 1924/2006: Iron contributes to normal cognitive function, normal energy metabolism, normal formation of red blood cells and haemoglobin, normal oxygen transport, normal immune system function, and the reduction of tiredness and fatigue. All claims refer to adequate intake correcting a deficiency — not to prophylactic high-dose supplementation.

key_studies:
  - ref: pmid-27880062
    finding:
      de: >-
        Systematischer Review: Vegetarier haben im Vergleich zu Omnivoren signifikant niedrigere Ferritin-Spiegel (Mittelwert ~20 vs. ~35 µg/L bei Frauen). Eisenmangel-Prävalenz bei vegetarischen Frauen bis zu 40 %, bei Omnivoren ~20 %. Gleichzeitig erhöhte Eisenabsorption als Kompensation beobachtet.
      en: >-
        Systematic review: vegetarians had significantly lower ferritin levels than omnivores (mean ~20 vs. ~35 µg/L in women). Iron deficiency prevalence in vegetarian women reached up to 40%, vs. ~20% in omnivores. The body partially compensated through upregulated absorption rates.
  - ref: pmid-42163863
    finding:
      de: >-
        Nationale US-Querschnittsstudie: Eisenmangel (Ferritin &lt;12 µg/L) betrifft ~9–11 % der Frauen im gebärfähigen Alter, ~2 % der Männer. In der Gesamtbevölkerung ist Eisenmangel die häufigste Nährstoffdefizit-Ursache für Anämie.
      en: >-
        National US cross-sectional survey: iron deficiency (ferritin &lt;12 µg/L) affected ~9–11% of women of reproductive age and ~2% of men. Iron deficiency anaemia is the most common nutrient-deficiency cause of anaemia worldwide.
  - ref: pmid-2681512
    finding:
      de: >-
        Review: Nicht-Hämeisen (Pflanzen) hat eine Absorption von ~2–20 % vs. Hämeisen (Fleisch) ~25 %. Vitamin C (50–100 mg) erhöht die Nicht-Hämeisen-Absorption um das 3–6-fache. Phytate (Getreide, Hülsenfrüchte), Polyphenole (Kaffee, Tee) und Calcium hemmen die Absorption signifikant.
      en: >-
        Review: non-haem iron (plant sources) has an absorption rate of ~2–20% vs. haem iron (meat) ~25%. Vitamin C (50–100 mg) increases non-haem iron absorption 3–6-fold. Phytates (grains, legumes), polyphenols (coffee, tea), and calcium significantly inhibit absorption.
  - ref: pmid-31174214
    finding:
