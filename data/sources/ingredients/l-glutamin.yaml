    body: |
      ## Was ist L-Glutamin?

      L-Glutamin ist die **häufigste freie Aminosäure** im menschlichen Körper — sie macht etwa 60% der freien Aminosäuren im Blutplasma und Muskelgewebe aus. Obwohl der Körper sie selbst synthetisieren kann, gibt es Situationen, in denen die Eigenproduktion den Bedarf nicht mehr deckt. Man nennt das "konditionelle Essentialität".

      Glutamin erfüllt viele Funktionen gleichzeitig:
      - **Primärer Energieträger für Enterozyten** (Darmepithelzellen) und Immunzellen
      - **Stickstoffdonor** für die Purinsynthese und den Harnstoffzyklus
      - **Vorläufer für Glutathion** (zusammen mit Glycin und Cystein)
      - **Regulator der Darmbarriere** (Tight Junction-Integrität)
      - **Wichtig für Säure-Basen-Regulation** in der Niere

      ## Wo ist die Evidenz wirklich stark?

      ### Klinische Medizin: Intensivpatienten und Trauma

      Die mit Abstand stärkste Evidenz kommt aus der Intensivmedizin. Mehrere Meta-Analysen von RCTs belegen, dass parenterale (intravenöse) L-Glutamin-Supplementierung bei schwerkranken Patienten:

      - Infektionskomplikationen reduziert
      - Krankenhausaufenthaltsdauer verkürzt
      - Bakterielle Translokation durch den Darm verringert

      Das gilt vor allem für Patienten mit schweren Verbrennungen, nach großen Operationen und bei Sepsis-Risiko. Die ESPEN-Leitlinien (Europäische Gesellschaft für klinische Ernährung) empfehlen Glutamin-Supplementierung für bestimmte kritisch kranke Patientengruppen.

      **Wichtige Einschränkung:** Die Effekte beziehen sich auf **parenterale Gabe**. Orale Absorption ist gut, aber die Darmzellen selbst metabolisieren einen Großteil des aufgenommenen Glutamins, bevor es den Rest des Körpers erreicht.

      ### Sport und Muskelregeneration: Enttäuschendes Bild

      Trotz des massiven Marketings im Sportbereich ist die Evidenz für orale L-Glutamin-Supplementierung bei gesunden Sportlern schwach. Gut kontrollierte RCTs finden keine signifikante Wirkung auf:

      - Muskelkraft oder Hypertrophie
      - DOMS (Muskelkater nach Training)
      - Muskelglykogen-Wiederauffüllung
      - Immunfunktion beim Leistungssportler (Übertrainingssyndrom)

      Das liegt wahrscheinlich daran, dass der Darm und die Leber oral zugeführtes Glutamin weitgehend selbst verwerten, bevor es in Muskeln oder das Immunsystem gelangt.

      ## Wann könnte orale Supplementierung dennoch sinnvoll sein?

      - **Erhöhte Darmpermeabilität** ("leaky gut"): Einige kleinere Studien zeigen Effekte auf Tight Junctions und Darmbarrierefunktion
      - **Intensiver Ausdauersport / Übertraining**: Plasma-Glutaminspiegel können bei extremem Training sinken — ob orale Supplementierung das effektiv kompensiert, ist aber nicht eindeutig belegt
      - **Post-chirurgisch / Rekonvaleszenz**: In klinisch begleitetem Setting
      - **Intestinale Erkrankungen (z.B. Morbus Crohn)**: Frühe Daten vorhanden, aber Evidenz noch nicht robust genug für Standardempfehlung

      ## Dosierung

      - **Klinische Studien:** 0,2–0,5 g/kg Körpergewicht/Tag
      - **Typische Supplement-Dosierung:** 5 g/Tag (oraler Bereich)
      - **Einnahme:** Nach dem Training oder zwischen den Mahlzeiten; auf leeren Magen gut resorbiert

      L-Glutamin gilt als sehr gut verträglich und sicher. Mengen bis 40 g/Tag wurden in klinischen Studien ohne relevante Nebenwirkungen eingesetzt.

      ## Fazit

      L-Glutamin ist eine wichtige Aminosäure mit gut belegter klinischer Relevanz in der Intensivmedizin. Für gesunde, gut ernährte Sportler ist der Nutzen oraler Supplementierung jedoch wissenschaftlich wenig überzeugend. Der Wirkstoff ist am ehesten relevant bei erhöhtem physiologischem Stress, Darmbarriere-Problemen oder in klinischen Kontexten.

  en:
    summary: >-
      L-glutamine is the most abundant free amino acid in the body. Clinically well-supported in critical care; evidence for oral supplementation in healthy individuals is more limited.
    evidenceSummary: >-
      Strongly supported in critical illness (parenteral route): reduced infections, shorter hospital stays, improved gut barrier. For athletes and healthy people, oral supplementation studies show little to no meaningful benefit above adequate protein intake. Conditional essentiality makes it most relevant under extreme physiological stress.
    body: |
      ## What Is L-Glutamine?

      L-glutamine is the **most abundant free amino acid** in the human body, accounting for roughly 60% of free amino acids in blood plasma and muscle tissue. Although the body can synthesize it, certain conditions make endogenous production insufficient—making it conditionally essential.

      Glutamine serves several functions simultaneously:
      - **Primary fuel for enterocytes** (intestinal epithelial cells) and immune cells
      - **Nitrogen donor** for purine synthesis and the urea cycle
      - **Precursor for glutathione** (together with glycine and cysteine)
      - **Regulator of gut barrier integrity** (tight junction support)
      - **Important for acid-base regulation** in the kidneys

      ## Where Is the Evidence Actually Strong?

      ### Clinical Medicine: Critical Care and Trauma

      The strongest evidence by far comes from intensive care medicine. Multiple RCT meta-analyses show that parenteral (intravenous) L-glutamine supplementation in critically ill patients:

      - Reduces infectious complications
      - Shortens hospital length of stay
      - Decreases bacterial translocation through the gut

      This applies especially to patients with severe burns, major surgery, and sepsis risk. ESPEN guidelines (European Society for Clinical Nutrition) recommend glutamine supplementation for selected critically ill patient groups.

      **Key caveat:** These effects concern **parenteral administration**. Oral absorption is good, but the gut itself metabolizes a large share of ingested glutamine before it reaches the rest of the body.

      ### Sport and Muscle Recovery: A Disappointing Picture

      Despite heavy marketing in the sports world, evidence for oral L-glutamine supplementation in healthy athletes is weak. Well-controlled RCTs find no significant effect on:

      - Muscle strength or hypertrophy
      - DOMS (delayed-onset muscle soreness)
      - Muscle glycogen restoration
      - Immune function in elite athletes (overtraining syndrome)

      This is likely because the gut and liver largely consume orally ingested glutamine before it reaches muscles or the immune system.

      ## When Might Oral Supplementation Still Make Sense?

      - **Increased gut permeability:** Some smaller studies suggest effects on tight junctions and gut barrier function
      - **Intense endurance sport / overtraining:** Plasma glutamine can decrease during extreme training, but whether oral supplementation effectively compensates this is not clearly established
      - **Post-surgical or recovery contexts:** In clinically supervised settings
      - **Intestinal conditions (e.g. Crohn's disease):** Early data exist, but not yet robust enough for standard recommendation

      ## Dosage

      - **Clinical studies:** 0.2–0.5 g/kg body weight/day
      - **Typical supplement dosage:** 5 g/day (oral range)
      - **Timing:** Post-training or between meals; well absorbed on an empty stomach

      L-glutamine is considered very well tolerated and safe. Amounts up to 40 g/day have been used in clinical studies without relevant adverse effects.

      ## Summary

      L-glutamine is a physiologically important amino acid with well-documented clinical relevance in critical care. For healthy, well-nourished athletes and the general population, the evidence for oral supplementation is scientifically modest. The ingredient is most relevant under elevated physiological stress, compromised gut barrier function, or in supervised clinical contexts.

