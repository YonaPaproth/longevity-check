locales:
  de:
    summary: >-
      Kalium ist essenziell für Blutdruck, Nerven und Muskeln. Über Ernährung oft wichtiger als als Supplement – und bei Überdosierung potenziell riskant.
    evidenceSummary: >-
      Kalium ist essenziell für Blutdruckregulation, Nervenleitung und Muskelkontraktion. Eine kaliumreiche Ernährung ist vergleichsweise gut untersucht mit kardiovaskulären Vorteilen assoziiert. Supplemente sind jedoch nicht für jeden geeignet und können bei Nierenproblemen gefährlich werden.
    body: |
      ## Was ist Kalium?
      
      Kalium ist ein zentraler Elektrolyt für:
      - Blutdruckregulation
      - Nervenleitung
      - Muskel- und Herzfunktion
      
      In der Praxis ist Kalium oft eher ein **Ernährungs-** als ein Supplement-Thema.
      
      ## Was ist vergleichsweise gut untersucht?
      
      - Kaliumreiche Ernährung unterstützt normalen Blutdruck
      - Essenziell für Herz- und Muskelfunktion
      
      ## Wichtige Warnung
      
      Kalium ist nicht harmlos in hoher Dosis, vor allem bei:
      - Nierenerkrankungen
      - ACE-Hemmern/ARBs
      - kaliumsparenden Diuretika
      
      ## Fazit
      
      Kalium ist wichtig, aber eher etwas, das man **über Lebensmittel optimiert** statt blind als Hochdosis-Supplement einzusetzen.

