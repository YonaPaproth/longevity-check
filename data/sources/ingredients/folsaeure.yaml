    body: |
      ## Was ist Folsäure?
      
      Folsäure (Vitamin B9) ist ein wasserlösliches B-Vitamin, das als **Methyl-Donor** im **One-Carbon-Metabolismus** fungiert – einem zentralen biochemischen Netzwerk, das DNA-Synthese, DNA-Reparatur, DNA-Methylierung und Homocysteinabbau koordiniert.
      
      Natürliches Folat kommt in Lebensmitteln vor (Hülsenfrüchte, grünes Blattgemüse, Leber). Synthetische **Folsäure** in Supplements und angereicherten Lebensmitteln wird im Körper zunächst in die aktive Form **5-Methyltetrahydrofolat (5-MTHF)** umgewandelt.
      
      ## Schwangerschaft: klare Pflichtempfehlung
      
      Die Empfehlung für Frauen mit Kinderwunsch und in der Frühschwangerschaft ist eine der stärksten und konsistentesten in der Nutritionsmedizin:
      
      - **400 µg/Tag** mindestens 4 Wochen vor der Empfängnis und bis zum Ende des ersten Trimesters
      - Reduziert Neuralrohrdefekte (Spina bifida, Anenzephalie) um 50–70 %
      - Empfehlung: BfR, WHO, EFSA, RKI – global konsensiert
      
      ## Der One-Carbon-Metabolismus
      
      Folat sitzt im Zentrum des methylierungsrelevantesten Stoffwechselwegs:
      
      1. Folat aktiviert → 5-MTHF
      2. 5-MTHF überträgt Methylgruppe auf Homocystein → Methionin
      3. Methionin → S-Adenosylmethionin (SAM) – der universelle Methylspender
      4. SAM methyliert DNA, RNA, Proteine, Neurotransmitter
      
      Folat-Mangel → Homocystein-Anstieg → war mit höheren Werten verbundenes Risiko für Gefäßschäden, kognitive Störungen und gestörte Epigenetik.
      
      ## Was sagen die Studien wirklich?
      
      ### Klar belegt (EFSA-Claims)
      - Neuralrohrdefekte-Prävention (Schwangerschaft)
      - Normale Blutbildung (mit B12)
      - Homocystein-Senkung: konsistent in RCTs
      
      ### Umstritten
      - Herzschutz durch Homocysteinreduktion: Meta-Analysen inkonsistent – Homocystein scheint eher Marker als Ursache zu sein
      - Krebsprävention: komplexes Bild – normaler Bedarf protektiv, Hochdosen bei bestehendem Krebsrisiko möglicherweise kontraproduktiv
      
      ### Nicht belegt
      - Alterungsforschung-Wirkung über normalen Bedarf hinaus
      
      ## Folsäure vs. L-Methylfolat: wer braucht was?
      
      **Synthetische Folsäure** muss im Körper erst durch das Enzym MTHFR aktiviert werden. Träger des **MTHFR-C677T-Polymorphismus** (ca. 10–15 % der deutschen Bevölkerung homozygot) haben hier eine reduzierte Enzymaktivität von bis zu 70 % und akkumulieren möglicherweise unmetabolisierte Folsäure.
      
      **L-Methylfolat (5-MTHF)** ist die bereits aktive Form – umgeht das MTHFR-Problem vollständig. Teurer, aber für MTHFR-Träger klinisch überlegen.
      
      Test: MTHFR-Genotypisierung ist über Bluttest möglich.
      
      ## Ist Folsäure sicher?
      
      Bei 200–400 µg/Tag: **wahrscheinlich sicher** für alle. Obere tolerierbare Zufuhrmenge (EFSA): 1.000 µg/Tag synthetische Folsäure (keine Obergrenze für natürliches Folat). Hauptrisiko bei Hochdosen: Maskierung eines Vitamin-B12-Mangels (neurologische Schäden können fortschreiten, während Anämie korrigiert wird). Daher: B12-Spiegel immer mitprüfen.

  en:
    summary: >-
      Essential B-vitamin for DNA synthesis, cell division, and homocysteine metabolism. Strong evidence for neural tube defect prevention in pregnancy. L-methylfolate benefits MTHFR carriers.
    evidenceSummary: >-
      Relatively strong evidence base: folic acid deficiency in pregnancy causes neural tube defects (prevention well studied). EFSA health claims approved. Homocysteine-lowering effect consistent, but no established cardiovascular protection from this mechanism. MTHFR polymorphism clinically relevant for responders.
    body: |
      ## What Is Folic Acid?

      Folic acid (Vitamin B9) is a water-soluble B-vitamin that functions as a **methyl donor** in the **one-carbon metabolism**—a central biochemical network coordinating DNA synthesis, DNA repair, DNA methylation, and homocysteine breakdown. It is one of the most extensively studied micronutrients in medicine, with particularly strong evidence in reproductive health and epigenetic regulation.

      Natural folate occurs in whole foods (legumes, leafy greens, liver, asparagus). Synthetic **folic acid** in supplements and fortified foods must first be converted in the body to the active form **5-methyltetrahydrofolate (5-MTHF)**. This conversion step matters: some people carry genetic variants that slow or impair this process, explaining why L-methylfolate supplementation can outperform standard folic acid for certain individuals.

      ## Pregnancy: The Clearest Evidence

      The recommendation for folic acid supplementation in women planning pregnancy and during early pregnancy is one of the strongest and most universally agreed-upon recommendations in nutritional medicine:

      - **400 µg/day** at minimum for four weeks before conception and continuing through the first trimester
      - Reduces neural tube defects (spina bifida, anencephaly) by 50–70%
      - Endorsed globally: BfR, WHO, EFSA, CDC, RKI—absolute consensus across regulatory bodies

      The evidence base is exceptional. The landmark 1991 MRC Vitamin Study showed a 72% reduction in neural tube defect recurrence in high-risk pregnancies receiving 4 mg/day, fundamentally shifting periconception medicine worldwide. This recommendation is non-negotiable: every woman of reproductive age with adequate access should maintain baseline folate status (ideally serum folate &gt;7 ng/mL or RBC folate &gt;300 ng/mL) and supplement 400 µg daily when planning pregnancy.

      ## The One-Carbon Metabolism

      Folate sits at the metabolic crossroads of methylation biology:

      1. Dietary folate (or supplemental folic acid) is activated → 5-MTHF
      2. 5-MTHF transfers a methyl group to homocysteine → methionine
      3. Methionine is converted → S-Adenosylmethionine (SAM), the universal methyl donor
      4. SAM methylates DNA, RNA, proteins, neurotransmitters, and membrane components

      Folate deficiency creates a bottleneck: homocysteine accumulates, methylation capacity decreases, and epigenetic regulation becomes dysregulated. Elevated homocysteine has been associated with vascular endothelial dysfunction, impaired cognitive performance, and aberrant DNA methylation patterns—though whether it is primarily a driver or a marker of disease remains debated.

      What is certain: adequate folate is required for this system to function. Below-threshold folate impairs DNA synthesis in rapidly dividing cells (bone marrow, epithelium, fetus), which is why deficiency manifests as megaloblastic anemia and, in pregnancy, neural tube defects and fetal growth restriction.

      ## What the Studies Actually Show

      ### Clearly Established (EFSA-Approved Claims)
      - **Neural tube defect prevention** (periconception): RCTs and epidemiologic data are robust and consistent
      - **Normal red blood cell formation**: folate works with B12; deficiency causes megaloblastic anemia
      - **Homocysteine reduction**: consistent and dose-dependent in supplementation trials
      - **Normal psychological function**: folate is required for neurotransmitter synthesis and myelin formation

      ### Mixed or Ambiguous Evidence
      - **Cardiovascular protection via homocysteine reduction**: This is the "folate paradox." Meta-analyses show folic acid consistently lowers homocysteine levels, yet cardiovascular event rates (heart attack, stroke) are not consistently reduced. A 2022 meta-analysis of 30 RCTs found no significant benefit for stroke or MI prevention in general populations, except possibly for stroke risk reduction in regions with historically low folate intake or in specific subgroups. This suggests homocysteine is more a biomarker than a causal risk factor—lowering it does not automatically improve outcomes.

      - **Cancer risk**: The picture is complex. Normal folate status is protective; high-dose supplementation in people with existing adenomas or high cancer risk may potentially increase risk (a counterintuitive phenomenon sometimes called "the folate paradox in cancer"), likely because folate accelerates cell division in already-initiated lesions. For general prevention, maintaining adequate status rather than megadosing is prudent.

      ### Not Established
      - **Slowing aging beyond normal nutritional needs**: Folate does not extend lifespan or slow aging in the absence of deficiency. Claims of "anti-aging" properties without a documented folate deficit are marketing.

      ## Folic Acid vs. L-Methylfolate: Who Needs What?

      The enzyme **methylenetetrahydrofolate reductase (MTHFR)** catalyzes the final activation step of folic acid to 5-MTHF. A common genetic variant, **MTHFR C677T**, occurs in approximately 30% of Caucasians (10% homozygous); frequency varies by ancestry. Homozygous carriers have roughly 70% reduced enzyme activity, which can result in:

      - Slower conversion of synthetic folic acid to its active form
      - Accumulation of unmetabolized folic acid (potentially immunoactive)
      - Relative 5-MTHF insufficiency despite adequate intake

      **For most people (MTHFR wild-type or heterozygous):** Standard folic acid supplementation (200–400 µg/day) is effective and sufficient.

      **For MTHFR C677T homozygotes:** L-methylfolate (5-MTHF), available as methylfolate glucosamine salt or other forms, bypasses the enzymatic bottleneck entirely. Clinical studies and observational data suggest MTHFR carriers tolerate and respond better to L-methylfolate than to folic acid, particularly if they report neurological or methylation-sensitive symptoms (mood, cognitive changes).

      Testing: MTHFR genotyping via blood test is available (though not routinely covered by insurance in many countries). Given the low cost of L-methylfolate relative to the potential benefit for carriers, some practitioners recommend empirical trial in people with unclear folate response or a family history of MTHFR-related symptoms.

      ## Safety Profile

      At physiological doses (200–400 µg/day), folic acid is **well-tolerated and safe** across all population groups except in specific contexts:

      - **Upper tolerable intake:** EFSA sets 1,000 µg/day synthetic folic acid; no upper limit for natural folate (excess is poorly absorbed)
      - **Primary concern:** High-dose folic acid can **mask vitamin B12 deficiency**. Folate corrects the anemia associated with B12 deficiency, but neurological damage (subacute combined degeneration, peripheral neuropathy, cognitive decline) continues silently. Therefore, B12 status must always be checked alongside folate.
      - **Drug interactions:** Some anticonvulsants (phenytoin, phenobarbital) impair folate metabolism; supplementation may be warranted with medical oversight
      - **Mild side effects:** Rare at standard doses; high doses can cause insomnia, irritability, or nausea in sensitive individuals

      For pregnancy, lactation, and genetic MTHFR variants, discuss supplementation strategy with a healthcare provider to ensure the appropriate form (folic acid vs. L-methylfolate) and dose.

