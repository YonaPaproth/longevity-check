locales:
  de:
    summary: >-
      Selen ist essenziell für Glutathionperoxidasen und Schilddrüsenhormone. In Deutschland und Österreich ist die Selenversorgung durch selenarme Böden strukturell niedrig.
    evidenceSummary: >-
      Vergleichsweise gute Datenlage für essentielle Funktionen: Antioxidantien-Enzyme, Schilddrüse, normale Immunfunktion. EFSA Claims zugelassen. Deutschen Böden sind selenarm – Unterversorgung häufig. Dosierungsfenster eng: Mangel und Überdosierung haben beide ernste Folgen.
    body: |
      ## Was ist Selen?
      
      Selen ist ein **essenzielles Spurenelement**, das struktureller Bestandteil von **25 Selenoproteinen** ist – darunter die **Glutathionperoxidasen** (GPx1–4), die wichtigste Familie antioxidativer Enzyme im Körper, und die **Jodthyronin-Deiodinasen**, die für die Aktivierung von Schilddrüsenhormonen (T4 → T3) verantwortlich sind.
      
      ## Das Deutschland-Problem
      
      Anders als in vielen anderen Ländern sind die Böden in Deutschland, Österreich und der Schweiz **natürlicherweise selenarm** – eine Folge der Eiszeit und des sauren Regens. Das bedeutet: Wer sich rein mit lokalen pflanzlichen Lebensmitteln ernährt, nimmt strukturell weniger Selen auf.
      
      Aktuelle Daten zeigen, dass der Median-Selenspiegel in Deutschland bei **84 µg/L** liegt – deutlich unter dem optimalen Bereich von 125–150 µg/L. Besonders betroffen: Veganer, Ältere, Schwangere.
      
      ## Was sagen die Studien wirklich?
      
      ### Klar belegt (EFSA-zugelassen)
      - Schutz der Zellen vor oxidativem Stress (via GPx-Enzyme)
      - Normale Schilddrüsenfunktion (Deiodinase-Cofaktor)
      - Normale Immunfunktion
      - Spermienbildung und -motilität
      
      ### Vergleichsweise gut untersucht
      - **Hashimoto-Thyreoiditis**: Mehrere RCTs zeigen Reduktion von Anti-TPO-Antikörpern bei 200 µg/Tag Selenomethionin
      - **KiSel-10-Studie**: Selen+CoQ10 bei Älteren war mit niedrigeren Werten verbundene kardiovaskuläre Mortalität (umstrittene, aber replizierte Studie)
      
      ### Nicht belegt
      - Krebsprävention: SELECT-Studie zeigte keinen Nutzen bei gut versorgten US-Amerikanern (möglicherweise bereits optimal versorgt)
      - Lebensverlängerung beim Menschen
      
      ## Das enge Dosierungsfenster
      
      Selen ist ein gutes Beispiel für eine enge Dosis-Spanne: Zu wenig ist ungünstig, zu viel kann toxisch sein (z. B. Selenose: Haarausfall, Nagelveränderungen, neurologische Störungen).
      
      | Status | Blutspiegel | Wirkung |
      |---|---|---|
      | Mangel | &lt;60 µg/L | Immunschwäche, Schilddrüsendysfunktion |
      | Optimal | 125–150 µg/L | Maximale GPx-Aktivität |
      | Grenzwertig hoch | &gt;200 µg/L | Kein Zusatznutzen |
      | Toxisch | &gt;400 µg/L | Selenose-Symptome |
      
      ## Welche Form?
      
      - **Selenomethionin**: Beste Bioverfügbarkeit, natürliche Form, in Studien am besten belegt
      - **Natriumselenit**: Günstiger, aber geringere Bioverfügbarkeit; geeignet für Infusionen
      - **Selen aus Hefe** (selenisierte Hefe): Enthält hauptsächlich Selenomethionin + andere Selenoproteine
      
      ## Praktische Empfehlung
      
      Lass deinen Selenspiegel einmal messen (Selen im Vollblut oder Serum). Bei Werten unter 100 µg/L: 50–100 µg/Tag Selenomethionin ist sinnvoll. Bei normalen Werten: Supplementierung ist unnötig und potenziell schädlich.
      
      2–3 **Paranüsse täglich** liefern ca. 100–200 µg Selen – eine natürliche und günstige Alternative zum Supplement.

  en:
    summary: >-
      Selenium is essential for glutathione peroxidases and thyroid hormones. In Germany and Austria, selenium supply is structurally low due to selenium-depleted soils.
    evidenceSummary: >-
      Comparatively solid evidence base for essential functions: antioxidant enzymes, thyroid, normal immune function. EFSA claims authorized. German soils are selenium-poor – undernutrition common. Dosing window is narrow: both deficiency and overdosing have serious consequences.
    body: |
      ## What Is Selenium?

      Selenium is an **essential trace element** that forms the structural backbone of **25 selenoproteins** – including the **glutathione peroxidases** (GPx1–4), the body's primary family of antioxidant enzymes, and the **iodothyronine deiodinases**, which are responsible for activating thyroid hormones (T4 → T3). Without adequate selenium, these proteins cannot be synthesized, and their functions fail silently.

      Selenium operates at the intersection of three critical systems: antioxidant defense, immune function, and thyroid metabolism. This makes it simultaneously one of the most important micronutrients and one of the most misunderstood.

      ## The Central European Problem

      Unlike many regions worldwide, the soils of Germany, Austria, and Switzerland are **naturally selenium-poor** – a legacy of glaciation and decades of acid rain. This is not a minor deficit; it is a structural, geographic reality. For someone eating only locally sourced plant foods, selenium intake is systematically compromised.

      The epidemiological evidence is clear: median selenium levels in Germany sit at **84 µg/L**, compared to 125 µg/L in the UK and considerably higher in North America and parts of Scandinavia. This matters because levels below 85 µg/L are associated with reduced glutathione peroxidase activity – the first functional marker of selenium deficiency.

      Risk groups in Central Europe are particularly vulnerable: vegans and vegetarians (no meat or seafood, the richest sources); elderly populations (poorer absorption, dietary variety often decreases with age); and pregnant women (fetal demand for selenium increases dramatically, particularly for brain and immune development).

      ## What the Research Actually Shows

      ### Definitively Established (EFSA-authorized claims)
      - **Antioxidant defense**: Selenium is a prosthetic group in glutathione peroxidases, which neutralize hydrogen peroxide and lipid hydroperoxides before they can damage cells. This is not theoretical – it is measurable via GPx activity assays.
      - **Normal thyroid function**: The three iodothyronine deiodinases (D1, D2, D3) require selenium cofactors to convert T4 (the hormone the thyroid produces) into T3 (the active form tissues use). Without selenium, this conversion stalls, leading to functional hypothyroidism even when TSH and free T4 appear normal.
      - **Normal immune function**: Multiple selenoproteins (selenoprotein P, thioredoxin reductase) are required for T-cell and B-cell maturation. Selenium deficiency depresses both cellular and humoral immunity.
      - **Spermatogenesis and motility**: Glutathione peroxidase 4 (GPx4) is concentrated in testicular tissue and is essential for sperm development and mitochondrial integrity. Severe selenium deficiency impairs male fertility.

      ### Particularly Well-Studied
      - **Hashimoto's thyroiditis**: Multiple RCTs have shown that supplementing with 200 µg/day of selenomethionine significantly reduces serum anti-TPO antibodies and can improve symptoms. This is not a marginal effect; reductions of 40–50% are typical, and benefit often appears within 3 months. The mechanism is thought to involve selenoprotein P and thioredoxin reductase in Th1/Th2 balance.
      - **Cardiovascular outcomes in the elderly**: The KiSel-10 study (n=443, mean age 74) found that a combination of 200 µg selenium + 100 mg CoQ10 over four years reduced cardiovascular mortality by 54% in the intention-to-treat analysis. This is a large effect, but the study has methodological limitations: single-center design, Swedish population (different baseline selenium status), and lack of replication. It remains hypothesis-generating rather than definitive.

      ### NOT Supported by Evidence
      - **Cancer prevention**: The SELECT trial (n=35,533 well-nourished men, average baseline selenium 130 µg/L) found no reduction in prostate, lung, or colorectal cancer with high-dose selenium supplementation. This suggests that in populations already adequately supplied, additional selenium adds no protective benefit. The situation may differ in populations with frank selenium deficiency, but this has not been tested in a definitive RCT.
      - **Life extension in humans**: No human longevity studies exist. Animal work in mice suggests potential pathways, but extrapolation to humans is speculative.

      ## The Narrow Dosing Window

      Selenium exemplifies the principle that "the dose makes the poison." Both too little and too much cause harm.

      | Plasma Level | Clinical Status | Outcome |
      |---|---|---|
      | &lt;60 µg/L | Deficiency | Impaired GPx activity, immune dysfunction, thyroid abnormalities |
      | 60–85 µg/L | Marginal | Reduced antioxidant capacity, risk of functional deficiency with stress |
      | 85–125 µg/L | Low-normal | Suboptimal enzyme saturation |
      | 125–150 µg/L | Optimal | Maximal GPx activity, most studies use this range |
      | 150–200 µg/L | High-normal | No additional benefit documented, approaching upper safe range |
      | 200–400 µg/L | Borderline toxic | Early selenosis: brittle nails, hair loss, tremor, garlic breath odor |
      | &gt;400 µg/L | Toxic | Serious selenosis: neurological damage, hair and nail loss, rashes |

      Acute toxicity occurs above 5 mg in a single dose. Chronic toxicity (selenosis) typically appears above 400 µg/day sustained over weeks to months. This is a much tighter margin than vitamins A or D, for instance.

      ## Which Form?

      - **Selenomethionine**: The naturally occurring form in plant proteins and the form best absorbed and retained by human tissues. In animal studies, this form is incorporated into selenoproteins more efficiently than inorganic selenium. It is the form used in most positive human trials (Hashimoto study, KiSel-10).
      - **Sodium selenite**: An inorganic salt, less efficiently absorbed and incorporated, but appropriate for acute correction and intravenous use in medical settings.
      - **Selenized yeast**: Contains predominantly selenomethionine along with other selenium compounds. Bioavailability is comparable to pure selenomethionine.

      For oral supplementation in deficient individuals, selenomethionine is the preferred form.

      ## Practical Recommendation

      Have your selenium level measured once (whole blood or serum; plasma is also acceptable). Whole-blood selenium better reflects tissue saturation. If your level is below 90 µg/L and you have symptoms suggestive of deficiency (fatigue, poor wound healing, recurrent infections, hair loss, or thyroid autoimmunity), a trial of 50–100 µg/day selenomethionin is reasonable. Retest after 8–12 weeks.

      If your level is already above 125 µg/L, supplementation is unnecessary and carries the risk of moving you toward the toxic range, particularly if you also consume Brazil nuts regularly.

      Two to three **Brazil nuts daily** supply approximately 100–200 µg of selenium naturally – a cost-effective and food-based alternative to supplementation. However, note that Brazil nut selenium content varies dramatically by soil, so the dose is unpredictable.

      If you have Hashimoto's thyroiditis with elevated anti-TPO antibodies, the evidence for a trial of 100–200 µg/day selenomethionine is stronger, and monitoring TPO antibody levels and symptom improvement over 3–6 months is warranted.

