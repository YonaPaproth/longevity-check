locales:
  de:
    summary: >-
      Ginseng ist einer der alten Klassiker für Energie und Stress. Die Evidenz ist nicht leer, aber heterogen und stark abhängig vom Extrakt.
    evidenceSummary: >-
      Panax Ginseng ist in vielen Humanstudien untersucht, doch Qualität und Ergebnisse sind uneinheitlich. Es gibt Signale für Müdigkeit, subjektives Wohlbefinden und teils Glukosestoffwechsel, aber keine saubere Grundlage für breite Leistungs- oder gesundes Altern-Claims.
    body: |
      ## Was ist Ginseng?
      
      Panax Ginseng ist ein klassisches Adaptogen und wird seit langem für **Energie, Belastbarkeit und Vitalität** genutzt.
      
      ## Das Problem
      
      „Ginseng“ ist ein Oberbegriff, und die Qualität von Studien hängt stark vom verwendeten Extrakt ab.
      
      ## Fazit
      
      Ginseng ist **seriöser als viele Trendstoffe**, aber gleichzeitig viel unklarer, als Marketing oft glauben macht.

