locales:
  de:
    summary: >-
      Fucoidan ist ein sulfatiertes Polysaccharid aus Braunalgen mit wachsender Evidenz für präbiotische Darmwirkung, Muskelgesundheit und kardiovaskuläre Marker.
    evidenceSummary: >-
      Mehrere RCTs zeigen positive Effekte auf Darmgesundheit und Mikrobiom (präbiotisch), Griffstärke bei Älteren und Muskelkraft unter Krafttraining. Moderate Evidenz für kardiovaskuläre Marker (LDL, Blutdruck). Anti-Krebs-Claims ausschließlich präklinisch. Phase-2-Trial zu Chemo-Fatigue läuft.
    body: |
      ## Wirkweise

      Fucoidan ist ein sulfatiertes Polysaccharid, das aus **Braunalgen** wie *Undaria pinnatifida* (Wakame), *Fucus vesiculosus* (Blasentang), *Saccharina latissima* und *Cladosiphon okamuranus* (Mozuku) gewonnen wird. Es unterscheidet sich fundamental von Sea Moss (Rotalge): Fucoidan hat eine definierte sulfatierte Polysaccharidstruktur mit spezifischen biologischen Aktivitäten.

      Die postulierten Wirkmechanismen umfassen:
      - **Präbiotische Wirkung:** Förderung von Bifidobacterium und Faecalibacterium, Stärkung der Darmbarriere (Tight Junctions)
      - **Immunmodulation:** Aktivierung von NK-Zellen und Makrophagen, Modulation proinflammatorischer Zytokine
      - **Muskuloskeletal:** Präbiotische und direkte Mechanismen, die Muskelkraft und Lean Body Mass unterstützen können
      - **Kardiovaskulär:** Moderate Effekte auf LDL-Cholesterin und diastolischen Blutdruck
      - **Anti-inflammatorisch:** Hemmung von NF-κB und Reduktion proinflammatorischer Zytokine

      ## Evidenzlage

      Fucoidan hat eine **wachsende klinische Datenbasis** — ungewöhnlich für einen Algen-Wirkstoff.

      ### Darmgesundheit und Mikrobiom (stärkste Evidenz)

      Ein 3-armiger doppelblinder RCT (2025, *Microorganisms*) mit einem fucoidan-reichen Saccharina latissima-Extrakt zeigte signifikante präbiotische Effekte: dosis-abhängige Zunahme von Bifidobacterium und Faecalibacterium, verbesserte mikrobielle Diversität und Stärkung der Darmbarriere. Das ist einer der methodisch robustesten Fucoidan-Belege zu diesem Zeitpunkt.

      ### Muskelfunktion und körperliche Leistungsfähigkeit

      Ein paralleler RCT (Sci Rep 2025) untersuchte Fucoidan-Supplementierung kombiniert mit 6-wöchigem Krafttraining: Die Fucoidan-Gruppe zeigte signifikant erhöhte Peak Power und verbesserte Lean Body Mass gegenüber Training allein. Ein weiterer doppelblinder RCT (Archives of Gerontology and Geriatrics 2025) mit Oligo-Fucoidan (OliFuco RE) zeigte signifikante Verbesserung der Griffstärke bei community-dwelling Älteren über 12 Wochen — klinisch und statistisch bedeutsam.

      ### Verdauungs- und Mentalgesundheit (frühe Daten)

      Ein 28-Tage-RCT mit Thalivra (gereinigter Fucoidan-Extrakt, INNOSea-Studie, Aberystwyth University 2026) zeigte vielversprechende Effekte auf Verdauungsgesundheit und subjektives Wohlbefinden bei jungen Erwachsenen. Formale Publikation ausstehend.

      ### Kardiovaskuläre Marker

      Reviews und kleinere RCTs zeigen moderate, konsistente Effekte auf diastolischen Blutdruck und LDL-Cholesterin. Evidenzstärke: moderat.

      ### Anti-Krebs-Ansprüche

      Anti-Krebs-Claims basieren ausschließlich auf präklinischen In-vitro- und Tierdaten. Für Supplemente beim Menschen nicht belegt. Ein Phase-2-Trial zu Chemo-Fatigue rekrutiert aktuell.

      ## Wichtige Unterschiede zwischen Produkten

      Fucoidan ist nicht gleich Fucoidan: Quelle (Algenart), Extraktionsmethode, Molekulargewicht und Sulfatierungsgrad beeinflussen die biologische Aktivität erheblich. Produkte mit standardisiertem Fucosegehalt oder definierten Molekulargewichtsfraktionen (z.B. Oligo-Fucoidan) sind besser vergleichbar als generische "Brown Seaweed Extract"-Produkte.

      ## Sicherheit

      Fucoidan gilt als gut verträglich. In klinischen Studien wurden keine schwerwiegenden Nebenwirkungen berichtet. Zu beachten:
      - **Antikoagulative Eigenschaften:** Strukturelle Ähnlichkeit mit Heparin — Vorsicht bei Blutverdünnern (Warfarin, Apixaban, Heparin)
      - **Jodgehalt:** Je nach Algenquelle variabel — relevant bei Schilddrüsenerkrankungen
      - **Schwangerschaft:** Keine ausreichenden Sicherheitsdaten

      ## Dosierung

      - **Typisch:** 250–1000 mg Fucoidan-Extrakt pro Tag
      - **In RCTs verwendet:** 250–500 mg pro Tag
      - **Oligo-Fucoidan-RCT (Griffstärke):** Herstellerspezifische Dosis

      Standardisierung auf Fucose-Gehalt oder Sulfatierungsgrad ist wünschenswert, aber nicht immer angegeben.

  en:
    summary: >-
      Fucoidan is a sulfated polysaccharide from brown seaweed with growing evidence for prebiotic gut effects, muscle health, and cardiovascular markers.
    evidenceSummary: >-
      Multiple RCTs show positive effects on gut microbiome (prebiotic), grip strength in older adults, and muscle strength during resistance training. Moderate evidence for cardiovascular markers (LDL, blood pressure). Anti-cancer claims are preclinical only. A Phase 2 trial on chemo-related fatigue is ongoing.
    body: |
      ## How It Works

      Fucoidan is a sulfated polysaccharide derived from **brown seaweeds** including *Undaria pinnatifida* (wakame), *Fucus vesiculosus* (bladderwrack), *Saccharina latissima*, and *Cladosiphon okamuranus* (mozuku). It is fundamentally different from sea moss (a red alga): fucoidan has a defined sulfated polysaccharide structure with specific biological activities.

      Proposed mechanisms include:
      - **Prebiotic effect:** Promoting Bifidobacterium and Faecalibacterium, strengthening gut barrier integrity (tight junctions)
      - **Immunomodulation:** Activation of NK cells and macrophages, modulation of pro-inflammatory cytokines
      - **Musculoskeletal support:** Prebiotic and direct mechanisms that may support muscle strength and lean body mass
      - **Cardiovascular effects:** Modest effects on LDL cholesterol and diastolic blood pressure
      - **Anti-inflammatory:** NF-κB inhibition and reduction of pro-inflammatory cytokines

      ## Evidence Base

      Fucoidan has a **growing clinical evidence base** — unusual for an algae-derived ingredient.

      ### Gut Health and Microbiome (Strongest Evidence)

      A three-arm double-blind RCT (2025, *Microorganisms*) using a fucoidan-rich *Saccharina latissima* extract demonstrated significant prebiotic effects: dose-dependent increases in Bifidobacterium and Faecalibacterium, improved microbial diversity, and gut barrier strengthening. This is among the methodologically strongest fucoidan evidence to date.

      ### Muscle Function and Physical Performance

      A parallel RCT (Sci Rep 2025) examining fucoidan supplementation combined with 6 weeks of resistance training found significantly higher peak power and improved lean body mass in the fucoidan group vs. training alone. A separate 12-week double-blind RCT (Archives of Gerontology and Geriatrics 2025) using oligo-fucoidan (OliFuco RE) showed significant improvements in grip strength in community-dwelling older adults — both statistically and clinically meaningful.

      ### Digestive and Mental Wellbeing (Early Data)

      A 28-day RCT with Thalivra (purified fucoidan extract, INNOSea study, Aberystwyth University 2026) showed promising effects on digestive health and subjective wellbeing in young adults. Formal publication pending.

      ### Cardiovascular Markers

      Reviews and smaller RCTs show moderate, consistent effects on diastolic blood pressure and LDL cholesterol. Evidence strength: moderate.

      ### Anti-Cancer Claims

      Anti-cancer claims are based exclusively on preclinical in vitro and animal data. Not established in humans for supplement use. A Phase 2 trial on chemo-related fatigue is currently recruiting.

      ## Important Product Differences

      Not all fucoidan products are equivalent: the source alga, extraction method, molecular weight, and degree of sulfation significantly affect biological activity. Products with standardised fucose content or defined molecular weight fractions (e.g. oligo-fucoidan) are more comparable than generic "brown seaweed extract" labels.

      ## Safety

      Fucoidan is generally well tolerated. No serious adverse effects have been reported in clinical trials. Key considerations:
      - **Anticoagulant properties:** Structural similarity to heparin — caution with blood thinners (warfarin, apixaban, heparin)
      - **Iodine content:** Varies by seaweed source — relevant with thyroid conditions
      - **Pregnancy:** Insufficient safety data

      ## Dosage

      - **Typical range:** 250–1,000 mg fucoidan extract per day
      - **Used in RCTs:** 250–500 mg per day
      - **Oligo-fucoidan (grip strength RCT):** Manufacturer-specific dose

      Standardisation to fucose content or degree of sulfation is desirable but not always stated on product labels.

