locales:
  de:
    summary: >-
      Molybdän ist ein essenzielles Spurenelement für bestimmte Enzyme. Mangel ist selten, und für Extra-Supplemente gibt es meist keinen guten Grund.
    evidenceSummary: >-
      Molybdän ist essenziell für einige Enzyme, unter anderem im Schwefel- und Purinstoffwechsel. Klinische Mängel sind selten. Für zusätzliche Supplementierung bei gesunden Erwachsenen gibt es kaum Evidenz für relevanten Nutzen.
    body: |
      ## Was ist Molybdän?
      
      Molybdän ist ein Spurenelement, das als Cofaktor für einige Enzyme gebraucht wird, etwa im Abbau schwefelhaltiger Aminosäuren.
      
      ## Praxisrelevanz
      
      Biologisch wichtig? Ja.
      Als Supplement für die meisten Menschen spannend? Eher nein.
      
      ## Fazit
      
      Molybdän ist ein **Basis-Spurenelement ohne großen Hype-Wert**. Für MikroScore eher der Typ „der Vollständigkeit halber relevant“.

