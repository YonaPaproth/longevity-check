locales:
  de:
    summary: >-
      Omega-3-Fettsäuren (EPA + DHA) gehören zu den am besten untersuchten Supplements. Evidenz für Triglyceride und kardiovaskuläre Hochrisikopatienten stark; bei Gesunden geringer.
    evidenceSummary: >-
      Mehrere große RCTs belegen Triglycerid-Senkung (25–30%) und kardiovaskulären Nutzen bei Hochrisikopatienten. REDUCE-IT (n=8.179) zeigte 25% Reduktion schwerer CV-Ereignisse mit hochdosiertem EPA. VITAL und STRENGTH relativieren diesen Nutzen für niedrigeres Risikoprofil.
    body: |
      ## Was sind Omega-3-Fettsäuren?
      
      EPA (Eicosapentaensäure) und DHA (Docosahexaensäure) sind langkettige Omega-3-Fettsäuren, die hauptsächlich in fettem Meeresfisch (Lachs, Makrele, Sardinen) und Algenöl vorkommen. Der Körper kann sie in begrenztem Umfang aus pflanzlichem ALA (z. B. Leinöl) selbst herstellen – die Konversionsrate liegt aber bei nur **ca. 5–8% für EPA und unter 0,5–5% für DHA**. Für Veganer und Personen ohne regelmäßigen Fischkonsum ist direkte Supplementierung daher sinnvoll.
      
      Omega-3 ist eines der seltenen Supplements, bei dem die Evidenzlage wirklich stark ist – für bestimmte Anwendungen.
      
      ## Was sagen die Studien?
      
      ### Klar belegt
      
      **Triglyzeridsenking:** Das ist einer der am besten belegten Effekte überhaupt. Metaanalysen zeigen zuverlässig eine **Triglyzerid-Reduktion von 25–30%** bei Dosen von 2–4 g EPA+DHA täglich. Selbst bei niedrigeren Dosen (1 g/Tag) sind moderate Effekte konsistent nachweisbar.
      
      **Kardiovaskulärer Nutzen bei Hochrisikopatienten:** Die REDUCE-IT-Studie (Bhatt 2019, n=8.179) zeigte bei Patienten mit erhöhten Triglyzeriden und Statin-Therapie: Hochdosiertes EPA (4 g/Tag als Vascepa) reduzierte schwere kardiovaskuläre Ereignisse um **25% gegenüber Placebo** (HR 0,75; 95%-CI 0,68–0,83). Das ist ein dramatisches Ergebnis für ein Supplement.
      
      **Gehirn- und Sehfunktion:** EFSA-zugelassene Claims für DHA belegt durch starke Humandaten (250 mg/Tag ausreichend für diese Claims).
      
      **Primärprävention – differenziertes Bild:** Die VITAL-Studie (Manson 2019, n=25.871) zeigte bei 1 g/Tag in der Primärprävention keinen signifikanten Effekt auf kardiovaskuläre Ereignisse insgesamt, aber eine **Reduktion von Herzinfarkten um 28%** (HR 0,72; 95%-CI 0,59–0,90).
      
      ### Weniger klar
      
      **REDUCE-IT vs. STRENGTH:** Die Diskrepanz zwischen beiden Studien ist wissenschaftlich noch nicht abschließend erklärt. STRENGTH (Nicholls 2020, n=13.078) mit EPA+DHA-Kombination (4 g/Tag) fand keinen signifikanten Vorteil – möglicherweise wegen unterschiedlicher Placebo-Öle oder EPA-vs.-DHA-Unterschieden.
      
      **Vorhofflimmern-Risiko als echter Trade-off:** Eine Meta-Analyse 2026 zu DHA/EPA, kardiovaskulären Outcomes und Vorhofflimmern (PMID 42144851) unterstreicht, warum Omega-3 differenziert gelesen werden muss: Der Wirkstoff bleibt bei Triglyceriden und ausgewählten Herz-Kreislauf-Endpunkten stark, aber die Literatur zwingt zunehmend dazu, möglichen Nutzen gegen ein potenziell erhöhtes Vorhofflimmern-Risiko abzuwägen. Für Hochrisikopatienten kann die Bilanz trotzdem positiv sein — für pauschale "jeder sollte möglichst viel Fischöl nehmen"-Botschaften ist die Lage zu komplex.
      
      **Endothelfunktion — gut, aber nicht die beste Option:** Eine Netzwerk-Meta-Analyse 2026 (Norouzzadeh et al., PMID 42277453) verglich erstmals direkt mehrere Nutraceuticals hinsichtlich ihrer Wirkung auf die Endothelfunktion (FMD) bei Patienten mit CVD oder Hypertonie. Omega-3 verbesserte die FMD signifikant (MD: 1,83) — lag aber deutlich hinter **Magnesium** (MD: 8,17), **Vitamin D3** (MD: 7,84) und **Leinsamen** (MD: 7,39). Die Evidenzqualität für Omega-3 wurde als „very low" eingestuft. Das heißt nicht, dass Omega-3 unwirksam ist — aber wer primär die Gefäßfunktion verbessern will, hat laut dieser Analyse stärkere Optionen.
      
      **Gesunde Personen ohne Risikofaktoren:** Bei normalem Triglyzerid-Spiegel und niedrigem kardiovaskulären Risiko ist der messbare Zusatznutzen durch Supplementierung geringer als bei Risikopatienten.
      
      **Longevity / Lebensverlängerung beim gesunden Menschen:** Nicht direkt belegt. Entzündungshemmende Effekte sind gut dokumentiert, aber ob sie sich in reduzierter Mortalität niederschlagen, ist unklar.
      
      ## Auf welche Qualität achten?
      
      Der Markt ist unübersichtlich. Diese Qualitätsmerkmale sind entscheidend:
      
      | Merkmal | Was bedeutet das? |
      |---|---|
      | **EPA+DHA-Gehalt pro Kapsel** | Viele günstige Produkte enthalten nur 300 mg EPA+DHA pro 1.000-mg-Kapsel – der Rest ist anderes Fett |
      | **TOTOX-Wert** | Maß für Oxidationsgrad; sollte unter 26 liegen – ranziges Öl ist kontraproduktiv |
      | **Fettsäureform** | Triglycerid-Form (TG) wird besser absorbiert als Ethylester-Form (EE) |
      | **IFOS-Zertifizierung** | Unabhängige Qualitätsprüfung für Fischöl-Supplements |
      
      Ein aktuelles RCT (Loukil 2026, n=72) zeigt, dass Krilöl EPA- und DHA-Plasmaspiegel ca. **1,5-fach stärker erhöht** als Fischöl bei gleicher Omega-3-Dosis – bedingt durch die bessere Bioverfügbarkeit der Phospholipid-Form. Relevant für Produktwahl bei erhöhtem Bedarf oder schlechter Resorption.
      
      ## Vegane Alternativen
      
      Algenöl liefert DHA direkt an der Quelle (Fische akkumulieren Omega-3 durch Algenfütterung). EPA-Gehalt in Algenöl ist bei vielen Produkten geringer als in Fischöl – auf die genaue EPA+DHA-Zusammensetzung auf dem Etikett achten.
      
      ## Dosierung
      
      - **Allgemeine Gesundheit / Triglyzeride:** 1–2 g EPA+DHA/Tag
      - **Kardiovaskuläre Risikopatienten (ärztlich begleitet):** 2–4 g EPA/Tag (in klinischen Studien eingesetzt)
      - **Schwangerschaft / Stillzeit:** Mind. 200 mg DHA/Tag laut EFSA
      
      Omega-3 gilt als gut verträglich. Bei höheren Dosen gelegentlich Aufstoßen (fischiger Nachgeschmack) – enterisch beschichtete Kapseln helfen. Blutverdünnende Wirkung bei sehr hohen Dosen (&gt;3 g/Tag) vor Operationen beachten.
      
      ## Limitierungen
      
      - Die **REDUCE-IT-Kontroverse** (Mineralöl-Placebo vs. echter Blindingeffekt) ist noch nicht wissenschaftlich abschließend geklärt
      - Viele Studien haben kurze Laufzeiten von unter 2 Jahren; Langzeiteffekte auf Mortalität schwer messbar
      - Qualitätsunterschiede zwischen Produkten sind erheblich – Ergebnisse aus klinischen Studien mit hochreinen Studienpräparaten übertragen sich nicht unbedingt auf günstige Supermarktprodukte
      
      ## EFSA-Status
      
      EFSA hat für Omega-3-Fettsäuren mehrere Health Claims zugelassen – zu den wenigen Supplements, bei denen EU-weit anerkannte Claims bestehen. Details sind im [EFSA-Register für Health Claims](https://www.efsa.europa.eu/en/topics/topic/nutrition) einsehbar:
      
      - **EPA + DHA** tragen zur normalen Herzfunktion bei (250 mg/Tag)
      - **DHA** trägt zur Aufrechterhaltung normaler Gehirnfunktion bei (250 mg/Tag)
      - **DHA** trägt zur Aufrechterhaltung normaler Sehkraft bei (250 mg/Tag)
      - **DHA-Supplementierung der Mutter** trägt zur normalen Entwicklung des Gehirns und der Augen des Fötus und des gestillten Säuglings bei
      
      ## Fazit
      
      Omega-3 (EPA + DHA) ist eines der vergleichsweise wenigen Supplements, das für spezifische Anwendungen wirklich stark belegt ist. Bei Triglyzeriden und kardiovaskulärem Risiko ist die Evidenz überzeugend. Für Gesunde ohne Risikofaktoren ist der messbare Zusatznutzen durch Supplementierung kleiner – aber das Sicherheitsprofil bei 1–2 g/Tag ist exzellent.

  en:
    summary: >-
      Omega-3 fatty acids (EPA + DHA) are among the most thoroughly studied supplements. Evidence is strong for triglycerides and high-risk cardiovascular patients; smaller for healthy individuals.
    evidenceSummary: >-
      Multiple large RCTs confirm triglyceride reduction (25–30%) and cardiovascular benefit in high-risk patients. REDUCE-IT (n=8,179) showed 25% reduction in major CV events with high-dose EPA. VITAL and STRENGTH moderate this benefit for lower-risk profiles.
    body: |
      ## What Are Omega-3 Fatty Acids?
      
      EPA (eicosapentaenoic acid) and DHA (docosahexaenoic acid) are long-chain omega-3 fatty acids found mainly in fatty marine fish (salmon, mackerel, sardines) and algae oil. The body can produce them in limited amounts from plant-based ALA (e.g., flaxseed oil), but the conversion rate is only **~5–8% for EPA and less than 0.5–5% for DHA**. Direct supplementation therefore makes sense for vegans and those who eat little or no fish.
      
      Omega-3 is one of the rare supplements where the evidence base is genuinely strong — for specific applications.
      
      ## What Do the Studies Show?
      
      ### Clearly established
      
      **Triglyceride reduction:** One of the best-documented effects of any supplement. Meta-analyses consistently show a **25–30% reduction in triglycerides** at doses of 2–4 g EPA+DHA per day. Even at lower doses (1 g/day) moderate effects are reproducible.
      
      **Cardiovascular benefit in high-risk patients:** The REDUCE-IT trial (Bhatt 2019, n=8,179) in patients with elevated triglycerides on statin therapy: high-dose EPA (4 g/day as Vascepa/icosapentaenoic acid ethyl ester) reduced major cardiovascular events by **25% vs. placebo** (HR 0.75; 95% CI 0.68–0.83). A dramatic result for a supplement.
      
      **Brain and visual function:** EFSA-approved claims for DHA, supported by robust human data (250 mg/day sufficient for these claims).
      
      **Primary prevention — nuanced picture:** The VITAL trial (Manson 2019, n=25,871) found no significant overall effect of 1 g/day in primary prevention, but a **28% reduction in myocardial infarctions** (HR 0.72; 95% CI 0.59–0.90).
      
      ### Less certain
      
      **REDUCE-IT vs. STRENGTH:** The discrepancy between these trials has not been fully explained. STRENGTH (Nicholls 2020, n=13,078) with an EPA+DHA combination (4 g/day) found no significant advantage — possibly due to different control oils or EPA-vs.-DHA differences.
      
      **Atrial fibrillation risk is a real trade-off:** A 2026 meta-analysis of DHA/EPA, cardiovascular outcomes, and atrial fibrillation (PMID 42144851) reinforces why omega-3 must be read carefully: the ingredient remains strong for triglycerides and selected cardiovascular endpoints, but the literature increasingly forces a balancing of benefit against possible atrial fibrillation risk. For high-risk patients the overall equation may still be favorable — but the evidence no longer supports simplistic “everyone should take as much fish oil as possible” messaging.
      
      **Healthy individuals without risk factors:** In people with normal triglycerides and low cardiovascular risk, the measurable additional benefit from supplementation is smaller.
      
      **Longevity / lifespan extension in healthy people:** Not directly established. Anti-inflammatory effects are well documented, but whether they translate into reduced mortality is unclear.
      
      ## What to Look for in Quality
      
      The market is noisy. These quality markers matter:
      
      | Feature | What it means |
      |---|---|
      | **EPA+DHA content per capsule** | Many cheap products contain only 300 mg EPA+DHA per 1,000 mg capsule — the rest is other fats |
      | **TOTOX value** | Measure of oxidation; should be below 26 — rancid oil is counterproductive |
      | **Fatty acid form** | Triglyceride form (TG) is better absorbed than ethyl ester form (EE) |
      | **IFOS certification** | Independent quality testing for fish oil supplements |
      
      A 2026 RCT (Loukil, n=72) shows that krill oil raises plasma EPA and DHA approximately **1.5× more** than fish oil at the same omega-3 dose — due to the superior bioavailability of the phospholipid form. Relevant for product choice when bioavailability is a concern.
      
      ## Vegan Alternatives
      
      Algae oil delivers DHA directly at the source (fish accumulate omega-3 through algae consumption). EPA content in algae oil is lower in many products than in fish oil — check the exact EPA+DHA composition on the label.
      
      ## Dosage
      
      - **General health / triglycerides:** 1–2 g EPA+DHA/day
      - **High-risk cardiovascular patients (under medical supervision):** 2–4 g EPA/day (used in clinical trials)
      - **Pregnancy / breastfeeding:** At least 200 mg DHA/day per EFSA
      
      Omega-3 is generally well tolerated. At higher doses, fishy aftertaste can occur — enteric-coated capsules help. Blood-thinning effects at very high doses (&gt;3 g/day) should be discussed with a doctor before surgery.
      
      ## Limitations
      
      - The **REDUCE-IT controversy** (mineral oil placebo vs. genuine blinding) has not been scientifically resolved
      - Many studies have short durations under 2 years; long-term mortality effects are difficult to measure
      - Quality differences between products are substantial — results from clinical trials with highly purified study preparations don't automatically apply to inexpensive supermarket products
      
      ## EFSA Status
      
      EFSA has approved several health claims for omega-3 fatty acids — among the few supplements with EU-recognised claims:
      
      - **EPA + DHA** contribute to normal cardiac function (250 mg/day)
      - **DHA** contributes to maintenance of normal brain function (250 mg/day)
      - **DHA** contributes to maintenance of normal vision (250 mg/day)
      - **DHA maternal supplementation** contributes to normal brain and eye development of the foetus and breast-fed infant
      
      ## Summary
      
      Omega-3 (EPA + DHA) is one of the relatively few supplements with strong evidence for specific applications. For triglycerides and cardiovascular risk, the evidence is compelling. For healthy individuals without risk factors, the additional measurable benefit from supplementation is smaller — but the safety profile at 1–2 g/day is excellent.

