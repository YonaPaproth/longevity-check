locales:
  de:
    summary: >-
      Myo-Inositol ist ein Zuckerverwandter mit vergleichsweise solider RCT-Lage bei PCOS und Insulinresistenz. Weitere Einsatzfelder werden untersucht.
    evidenceSummary: >-
      Mehrere RCTs zeigen signifikante Verbesserungen bei PCOS (Ovulation, Hormonspiegel, Insulinsensitivität). Kleinere RCTs zeigen anxiolytische Wirkung. Gut verträglich. gesundes Altern-Endpunkte nicht direkt untersucht.
    body: |
      ## Was ist Myo-Inositol?
      
      Myo-Inositol ist ein zuckerähnliches Molekül (Cyclohexanhexol), das als **Second Messenger** in zahlreichen Signalwegen fungiert – darunter der Insulinsignalweg, Serotonin-Rezeptoren und FSH-Signaling in Eierstöcken.
      
      Es kommt natürlich in Lebensmitteln vor (Getreide, Hülsenfrüchte, Zitrusfrüchte), aber in therapeutisch untersuchten Mengen nur durch Supplementierung erreichbar. Der Körper kann es auch selbst aus Glucose synthetisieren, aber diese Kapazität kann bei metabolischen Störungen eingeschränkt sein.
      
      ## Hauptindikationen
      
      ### 1. PCOS (Polyzystisches Ovarsyndrom)
      Das ist der am stärksten belegte Einsatzbereich. Bei PCOS liegt häufig ein Myo-Inositol-Mangel in den Eierstöcken vor, der die FSH-Signalübertragung stört. Mehrere RCTs zeigen:
      - Normalisierung des Menstruationszyklus
      - Verbesserte Ovulationsrate
      - Reduktion von Androgenen (Testosteron, DHEA)
      - Verbesserung der Insulinsensitivität
      - Günstige Effekte auf Schwangerschaftsraten
      
      Das **Verhältnis Myo-Inositol zu D-Chiro-Inositol (40:1)** ist physiologisch und in Supplements oft nachgeahmt.
      
      ### 2. Insulinresistenz und metabolisches Syndrom
      Als Cofaktor im Insulinsignalweg war mit Veränderungen verbunden Myo-Inositol die Insulinsensitivität. Kleinere RCTs zeigen Effekte bei Nüchternblutzucker, Triglyzeriden und Blutdruck.
      
      ### 3. Psychische Gesundheit
      Inositol ist ein Vorläufer des Phosphatidylinositol-Signalwegs, der Serotonin- und andere Neurotransmitter-Rezeptoren moduliert. Ältere RCTs zeigen Wirkung bei Panikstörung, OCD und depressive Symptome – aber keine modernen Replikationen.
      
      ## Was sagen die Studien wirklich?
      
      ### Klar belegt
      - PCOS-Symptome: Ovulation, Hormonspiegel, Insulinsensitivität (mehrere Meta-Analysen)
      - Insulinsensitivität: konsistente Verbesserungen in metabolischen Störungen
      
      ### Vergleichsweise gut untersucht
      - Gestationsdiabetes-Prävention (mehrere RCTs)
      
      ### Frühe Evidenz
      - Angststörungen, Panik, OCD (ältere RCTs, nicht repliziert mit modernen Methoden)
      
      ### Nicht belegt
      - Endpunkte zu gesundem Altern
      - Wirksamkeit bei gesunden Personen ohne metabolische Störung
      
      ## Ist Myo-Inositol sicher?
      
      Bei 2–4 g/Tag gilt es als **wahrscheinlich sicher**. Bei höheren Dosen (12–18 g, wie in psychiatrischen Studien) gelegentlich Übelkeit, Schwindel, Kopfschmerzen. Keine bekannten relevanten Wechselwirkungen. In der Schwangerschaft nach ärztlicher Rücksprache.

  en:
    summary: >-
      Myo-inositol has solid RCT evidence for PCOS and insulin resistance. Promising but limited data for anxiety and panic disorder.
    evidenceSummary: >-
      Multiple RCTs demonstrate significant improvements in ovulation rate, menstrual regularity, and insulin sensitivity in PCOS. A 2007 RCT (n=92) showed ovulation rates rising from 25% to 65% with 4 g/day. Older RCTs report anxiolytic effects at high doses (12–18 g/day), but these findings have not been replicated with modern methodology. No evidence for longevity endpoints or effects in metabolically healthy individuals.
    body: |
      ## What Is Myo-Inositol?

      Myo-inositol is a six-carbon sugar alcohol (cyclohexanehexol) that functions as a critical second messenger in multiple cellular signaling pathways — including the insulin signaling cascade, FSH receptor activation in ovarian follicles, and serotonin receptor modulation via the phosphatidylinositol (PI) pathway.

      It is naturally present in whole grains, legumes, and citrus fruits, but achieving therapeutically studied doses requires supplementation. The body can synthesize myo-inositol from glucose endogenously, but this capacity appears impaired in certain metabolic conditions — particularly PCOS and insulin resistance. Of the nine possible inositol isomers, myo-inositol is the most abundant in human tissue and the form with the most substantial clinical evidence base.

      ## Strongest Evidence: PCOS

      Polycystic ovary syndrome is where myo-inositol has its best-documented clinical evidence. Women with PCOS frequently show depleted inositol concentrations in follicular fluid, which disrupts FSH signal transduction and impairs follicular maturation.

      A 2012 meta-analysis by Unfer et al. (PMID 22327358) pooled data from multiple RCTs and found that myo-inositol supplementation significantly improved ovulation rate, menstrual cycle regularity, FSH/LH ratio, and insulin sensitivity compared to placebo — across independent trials. Effect sizes were clinically meaningful, not merely statistically significant.

      The physiological ratio of myo-inositol to D-chiro-inositol in the body is approximately 40:1. Many PCOS supplements combine both forms at this ratio to better replicate physiological conditions. There is some evidence that D-chiro-inositol alone at high doses can paradoxically impair follicular function, making the combined 40:1 formulation preferable.

      ## Insulin Sensitization

      Myo-inositol functions as a cofactor in the insulin signaling cascade, and supplementation improves insulin sensitivity in metabolically compromised individuals. A 2007 RCT by Gerli et al. (PMID 17952759, n=92) found that 4 g/day significantly reduced fasting blood glucose, fasting insulin, and androgen levels in women with PCOS. Ovulation rate improved from 25% at baseline to 65% after 14 weeks of treatment.

      Smaller RCTs have shown similar improvements in triglycerides and blood pressure in women with features of metabolic syndrome. However, evidence in healthy individuals without metabolic dysfunction is essentially absent. The insulin-sensitizing effects appear context-dependent — most relevant where pre-existing impairment in the inositol signaling pathway exists.

      ## Fertility

      Myo-inositol's effects on PCOS extend to fertility outcomes. Several RCTs have demonstrated improvements in oocyte quality, embryo quality, and clinical pregnancy rates in women with PCOS undergoing IVF. The proposed mechanism involves improved follicular fluid inositol composition restoring FSH sensitivity and meiotic competence of oocytes.

      Multiple RCTs have also investigated myo-inositol for gestational diabetes prevention in high-risk women, with some trials showing meaningful reductions in incidence. This remains an active research area with positive but not yet definitive findings.

      ## Mental Health: Anxiety and Panic

      Inositol is a precursor to the phosphatidylinositol signaling pathway, which modulates serotonin, noradrenaline, and other neurotransmitter receptors intracellularly. This biochemistry motivated a distinct line of psychiatric research in the 1990s.

      A 1995 RCT by Benjamin et al. (PMID 7730405) found that 12 g/day of inositol significantly reduced the frequency of panic attacks compared to placebo. A 1996 crossover RCT by Fux et al. (PMID 8874839) demonstrated that 18 g/day significantly reduced OCD symptom scores, with effect sizes comparable to SSRIs.

      Critical caveats: these are small trials conducted over two decades ago that have not been replicated with modern methodology, larger samples, or pre-registered protocols. They establish proof of concept for the neurological mechanism but should not be the basis for recommending inositol as a psychiatric treatment. Current evidence does not support replacing established pharmacotherapy with inositol for anxiety or OCD.

      ## Dosage

      - **PCOS and metabolic indications:** 2–4 g/day (range used across RCTs)
      - **Combined PCOS formula:** 2 g myo-inositol + 50 mg D-chiro-inositol (40:1 ratio)
      - **Psychiatric research doses:** 12–18 g/day (rarely practical; used in older studies only)

      The typical OTC PCOS dose of 2–4 g/day is well within the established safety margin. Higher psychiatric-range doses carry substantially more gastrointestinal burden and are not supported for routine use.

      ## Safety Profile

      At 2–4 g/day, myo-inositol is considered **likely safe**. Adverse effects are primarily gastrointestinal — nausea, bloating, loose stools — and tend to be mild and dose-dependent. At higher doses (12–18 g/day), GI side effects are more common, and some participants in trials reported headache or dizziness.

      No clinically relevant drug interactions have been firmly established. Lithium inhibits inositol recycling (a proposed mechanism in bipolar research), but this interaction is not considered clinically significant at standard supplement doses. Use during pregnancy should be discussed with a physician — not due to known safety concerns, but because monitoring is appropriate given ongoing gestational diabetes research.

      ## EFSA Status

      No EFSA-authorized health claims exist for myo-inositol. It is freely available as a food supplement across the EU and requires no prescription. Its former classification as "Vitamin B8" is a misnomer — it is not a true vitamin because the human body synthesizes it endogenously. Clinical dossiers for metabolic indications are under development but no claim authorization has been granted.

      ## Honest Limitations

      - **Population specificity:** Nearly all positive evidence comes from women with PCOS or metabolic dysfunction. Effects in healthy individuals are not established.
      - **Psychiatric data is dated and small:** The panic disorder and OCD trials from the 1990s have not been replicated at scale with modern trial standards.
      - **Long-term data is limited:** Most trials run 3–6 months; data beyond 12 months is sparse.
      - **Longevity endpoints not studied:** Myo-inositol is not a longevity supplement in the evidence-based sense — no data on aging-related outcomes.
      - **Fertility findings need larger trials:** IVF and gestational diabetes data is promising but not yet definitive.

      Myo-inositol has a legitimate, well-defined evidence base for specific metabolic and hormonal conditions — particularly PCOS. The case for broader use in healthy individuals or as a general anxiolytic is not supported by current evidence.

