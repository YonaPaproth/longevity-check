locales:
  de:
    summary: >-
      Vitamin A ist essenziell für Sehen, Haut und normale Immunfunktion. Bei Mangel klar nützlich – hochdosiert aber relevant toxisch, besonders in der Schwangerschaft.
    evidenceSummary: >-
      Vitamin A ist ein essenzieller Mikronährstoff mit sehr vergleichsweise gut untersuchter physiologischer Funktion. Supplemente helfen vor allem bei Mangel oder war mit höheren Werten verbundenem Bedarf. Für gesundes Altern oder allgemeine Zusatznutzen bei gut versorgten Erwachsenen gibt es keine überzeugende Evidenz.
    body: |
      ## Was ist Vitamin A?
      
      Vitamin A ist ein **fettlöslicher essenzieller Nährstoff**, der für Sehkraft, Immunsystem, Zellwachstum und Hautgesundheit gebraucht wird. Unter „Vitamin A“ fallen verschiedene Verbindungen:
      
      - **Retinol / Retinylester**: vorgeformtes Vitamin A aus tierischen Quellen oder Supplementen
      - **Beta-Carotin**: pflanzliche Vorstufe, die der Körper je nach Bedarf in Vitamin A umwandelt
      
      Das ist wichtig: Nicht jedes Supplement enthält die gleiche Form – und nicht jede Form hat das gleiche Sicherheitsprofil.
      
      ## Was sagen die Daten?
      
      ### Vergleichsweise gut untersucht
      - **Mangelkorrektur**: Bei echtem Mangel ist Vitamin A hochrelevant
      - **Sehkraft**: essenziell für normales Sehen, besonders Dämmerungssehen
      - **Immunsystem und Schleimhäute**: zentrale physiologische Rolle
      
      ### Nicht vergleichsweise gut untersucht
      - Mehr Lebensjahre oder „Alterungsforschung“-Effekte bei gut versorgten Erwachsenen
      - Allgemeiner Zusatznutzen durch hochdosierte Einnahme ohne Mangel
      
      ## Für wen kann Supplementierung sinnvoll sein?
      
      - Nachgewiesener Mangel
      - Sehr einseitige Ernährung oder Malabsorption
      - Bestimmte klinische Situationen nach ärztlicher Einschätzung
      
      Für die meisten gesunden Erwachsenen gilt: **Mehr ist nicht automatisch besser**.
      
      ## Sicherheitsprofil
      
      Vitamin A ist einer der Nährstoffe, bei denen Überdosierungen realistisch problematisch sind:
      
      - Kopfschmerzen, Übelkeit, Schwindel
      - Leberbelastung
      - Bei langfristig hoher Zufuhr: war mit höheren Werten verbundenes Risiko für Knocheneffekte
      - **Schwangerschaft**: hohe Retinolmengen vermeiden
      
      Beta-Carotin ist bei gesunden Nichtrauchern meist unkritischer als Retinol. Für Raucher sind hohe Beta-Carotin-Dosen jedoch ebenfalls nicht unproblematisch.
      
      ## Fazit
      
      Vitamin A ist **wichtig, aber kein gesundes-Alten-Hack**. Bei Mangel ist es medizinisch relevant. Bei normaler Versorgung bringt mehr Vitamin A wahrscheinlich wenig – und kann in zu hohen Dosen schaden.

  en:
    summary: >-
      Essential for vision, skin, and immune function. Clearly useful for deficiency, but high doses are toxic—especially in pregnancy.
    evidenceSummary: >-
      Vitamin A is an essential micronutrient with well-studied physiological functions. Supplements help primarily with deficiency or increased needs. For healthy aging or additional benefits in well-nourished adults, there is no convincing evidence.
    body: |
      ## What is Vitamin A?

      Vitamin A is a **fat-soluble essential nutrient** required for vision, immune function, cell growth, and skin health. The term "vitamin A" encompasses several compounds:

      - **Retinol / Retinyl esters**: preformed vitamin A from animal sources or supplements
      - **Beta-carotene**: plant-based precursor that the body converts to vitamin A based on need
      - **Provitamin A compounds**: other dietary precursors

      This distinction matters. Not all supplements contain the same form—and not all forms have the same safety profile or bioavailability.

      ## Physiological Roles

      Vitamin A functions in the body through specific mechanisms:

      **Vision**: Retinol is converted to retinal, which is essential for the visual cycle—allowing your eye to detect light and form images. This is particularly critical for dim-light (scotopic) vision and color perception.

      **Immune regulation**: Vitamin A regulates both innate and adaptive immunity. It maintains the integrity of mucosal barriers (respiratory, gastrointestinal, urinary), which serve as the first line of defense. It also supports T-cell and B-cell function, making it crucial for appropriate immune responses.

      **Skin and epithelial integrity**: Vitamin A promotes normal differentiation of skin cells and supports the health of all epithelial tissues, from the epidermis to internal mucous membranes.

      **Gene expression**: Vitamin A acts through nuclear receptors (retinoic acid receptors and retinoid X receptors) to regulate gene expression in tissues throughout the body.

      ## What Does the Evidence Say?

      ### Well-Established Benefits

      **Deficiency correction**: When vitamin A deficiency is documented, supplementation is medically important and reduces specific disease risks. In developing regions, vitamin A supplementation programs have demonstrably reduced childhood mortality and infection rates.

      **Vision support**: Vitamin A is non-negotiable for normal sight. Severe deficiency causes night blindness and, if uncorrected, corneal scarring and permanent blindness—a significant public health problem in resource-limited settings.

      **Immune and mucosal health**: The physiological role is well-characterized and biologically plausible. The question for supplemented populations is whether existing intakes are already sufficient.

      ### Gaps in the Evidence

      **Longevity and healthy aging**: There is no robust evidence that extra vitamin A supplementation extends lifespan or improves age-related outcomes in well-nourished adults.

      **Disease prevention in sufficient populations**: For individuals with adequate vitamin A status, the case for supplementation beyond dietary intake is weak. Most large intervention trials in well-nourished populations show minimal or neutral effects.

      **Cancer and eye disease prevention**: Observational studies sometimes suggest associations between higher vitamin A intake and reduced disease risk, but randomized trials—the gold standard—have not consistently confirmed these benefits.

      ## Who Should Consider Supplementation?

      Vitamin A supplementation makes sense for:

      - **Documented deficiency**: Confirmed by serum retinol levels or clinical signs (night blindness, Bitot spots)
      - **Severe dietary restriction**: Strict vegans relying entirely on beta-carotene, or people with very limited access to animal products
      - **Malabsorption conditions**: Celiac disease, cystic fibrosis, Crohn's disease, biliary disorders—conditions that impair fat-soluble nutrient absorption
      - **Specific clinical situations**: Following medical evaluation (measles in certain contexts, for example)

      For most healthy adults eating a reasonably diverse diet: **more is not automatically better**.

      ## Safety Profile &amp; Toxicity Concerns

      Vitamin A is one of the few nutrients where realistic overdosing causes documented harm:

      **Acute toxicity**: Single very high doses (&gt;150,000 IU / 45,000 mcg) can cause headaches, nausea, dizziness, vomiting, and blurred vision.

      **Chronic toxicity from retinol**: Sustained high intakes of preformed vitamin A (retinol, retinyl esters)—particularly 10,000+ IU daily over months—can cause:
      - Liver toxicity and cirrhosis in vulnerable individuals
      - Bone loss and increased fracture risk
      - Headaches and central nervous system effects
      - Skin changes (desquamation, dryness)

      The risk is dose and duration dependent. The tolerable upper intake level (UL) set by the Institute of Medicine is 10,000 IU (3,000 mcg) daily for adults—a ceiling chosen with considerable safety margin.

      **Pregnancy**: High retinol intake during pregnancy is associated with increased birth defect risk, particularly neural tube defects and orofacial clefts. The evidence, drawn from large observational studies and animal studies, is sufficiently concerning that pregnant women should avoid high-dose retinol supplements. Beta-carotene appears safer in this context.

      **Smokers and beta-carotene**: Interestingly, for smokers, high-dose beta-carotene supplementation has been linked to increased lung cancer risk in some trials—a phenomenon not fully explained but consistent enough to warrant caution.

      **Individual variation**: Genetic polymorphisms and metabolic factors mean some people accumulate vitamin A more readily than others. People with liver disease, kidney disease, or certain genetic variations may be at higher risk of accumulation.

      ## Practical Guidance

      For a well-nourished adult:
      - Aim for dietary sources (liver, eggs, dairy, orange/yellow vegetables, leafy greens)
      - If supplementing, use a reasonable maintenance dose (4,000-6,000 IU / 1,200-1,800 mcg daily for men, slightly less for women) rather than megadoses
      - If you're pregnant or planning pregnancy, avoid high-dose retinol supplements
      - If you have liver, kidney, or malabsorption issues, discuss supplementation with your healthcare provider
      - Consider serum retinol testing if you're concerned about deficiency—supplementing without evidence of need increases toxicity risk for negligible benefit

      ## Bottom Line

      Vitamin A is **essential but not a longevity hack**. For deficiency, it's medically important and life-changing. For well-nourished adults, more vitamin A is unlikely to improve aging outcomes and carries real toxicity risks if overdone. The evidence supports adequacy, not excess.

