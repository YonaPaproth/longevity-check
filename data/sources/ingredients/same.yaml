    summary: >-
      SAMe ist interessant für Stimmung, Leber und Methylierung. Es hat klinische Substanz, wird aber deutlich arzneinäher eingeordnet als viele andere Supplements.
    evidenceSummary: >-
      SAMe ist ein zentraler Methylgruppendonor mit brauchbarer Evidenz für bestimmte Anwendungen, vor allem im Bereich depressiver Symptome und teilweise im Gelenk-Kontext. Die Daten sind deutlich besser als bei vielen Bubble-Stoffen, aber das Profil ist eher therapeutisch als lifestyle-orientiert.
    body: |
      ## Was ist SAMe?
      
      SAMe ist ein körpereigenes Molekül und ein zentraler **Methylgruppendonor**. Es ist relevant für Neurotransmitter, Leberstoffwechsel und viele biochemische Prozesse.
      
      ## Warum ist es anders als viele andere Supplements?
      
      Weil SAMe eher **therapeutisch** wird diskutiert als nach klassischem Wellness-Supplement.
      
      ## Fazit
      
      SAMe ist **ernsthafter als viele Hype-Stoffe**, aber auch nichts, was man ganz locker und gedankenlos supplementieren sollte.

